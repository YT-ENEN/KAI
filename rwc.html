<style>
:root{
  --night:#050a24; --night-2:#0a1238; --panel:#0f1a48; --panel-2:#17255f; --line:rgba(180,210,255,.13);
  --red:#ff5fae; --red-2:#ff8cc6; --gold:#6fe3ff; --gold-2:#c2f5ff; --ice:#6fe3ff; --cream:#e3ebff; --holo:#a990ff; --amber:#ffd36b;
  --text:#f2f6ff; --muted:#a8b5de; --dim:#6f7db0; --ok:#4be3a0; --bad:#ff6f8d;
  --display:'Chakra Petch','Noto Sans TC',sans-serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.demo-bar{background:repeating-linear-gradient(-45deg,var(--ice) 0 14px,#3fcdf5 14px 28px);color:#04203a;font-weight:700;font-size:13px;text-align:center;padding:6px 12px}

/* ---------- 登入畫面 ---------- */
.gate{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 500px at 50% 30%,rgba(169,144,255,.3),transparent 60%),radial-gradient(900px 500px at 50% 110%,rgba(255,95,174,.22),transparent 60%),linear-gradient(180deg,#040820,#0a1440)}
.gate-card{width:min(420px,100%);background:var(--panel);border-radius:24px;overflow:hidden;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.gate-card .stripe{height:8px;background:linear-gradient(90deg,var(--ice),var(--holo),var(--red))}
.gate-card img.c{width:150px;height:auto;margin:26px auto 4px;display:block;filter:drop-shadow(0 0 24px rgba(111,227,255,.35))}
.gate-card img.w{height:30px;width:auto;margin:0 auto 14px;display:block}
.gate-card h1{margin:0;font-size:22px;font-weight:900}
.gate-card p{margin:6px 24px 0;color:var(--muted);font-size:14px}
.gate-card .btn{margin:24px auto 30px}
.gate-msg{color:var(--bad);font-weight:700;min-height:1.4em;margin:-14px 24px 20px}

/* ---------- 版面 ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100svh}
.side{background:var(--night-2);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100svh;display:flex;flex-direction:column;gap:4px}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:900;line-height:1.3}
.side-brand img{width:44px;height:46px;object-fit:contain}
.side-wm{height:22px;width:auto;opacity:.9;margin:2px 8px 14px}
.side-brand small{display:block;font-weight:500;color:var(--dim);font-size:12px}
.side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.side a:hover{background:rgba(255,255,255,.05);color:var(--text)}
.side a.on{background:var(--panel-2);color:var(--text);box-shadow:inset 3px 0 0 var(--gold)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center}

const DEMO = !ADMIN_CONFIG.API_URL;
const $ = (s, r = document) => r.querySelector(s);

let tokenClient = null;

async function finishLogin(cred) {
  try {
    const r = await api('auth.google', cred);
    if (!r.isAdmin) { $('#gateMsg').textContent = `${r.user.email} 沒有後台權限，請改用已授權的帳號`; return; }
    S.session = { token: r.token, user: r.user, exp: Date.now() + (r.expiresIn || 21600) * 1000 - 60000 };
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(S.session)); } catch (e) { /* 忽略 */ }
    enterApp();
  } catch (e) { $('#gateMsg').textContent = e.message; }
}
function signOut(msg) {
  S.session = null;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* 忽略 */ }

  $('#gateMsg').textContent = msg || '';
}

async function loadImages(root) {
  for (const el of $$('[data-img]', root)) {
    const id = el.dataset.img;
    if (!id) { el.textContent = '—'; continue; }
    try {
      if (!S.imgCache[id]) S.imgCache[id] = await api('admin.file', { fileId: id });
      const f = S.imgCache[id];
      el.innerHTML = `<a href="${esc(f.url)}" target="_blank" rel="noopener" title="在雲端硬碟開啟原檔"><img src="${f.dataUrl}" alt="${esc(f.name)}"></a>`;
    } catch (e) { el.textContent = '無法載入'; }
  }
}

function bindTeam(t) {
  const body = $('#teamBody');
  const refreshTeam = async msg => {
    S.teams = await api('admin.teams');
    S.overview = await api('admin.overview');
    renderNav(); route(); openTeam(t.teamId);
    if (msg) toast(msg);
  };
  body.onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    try {
      if (b.dataset.op) {
        const op = b.dataset.op;
        const text = { promote: `將「${t.teamName}」遞補為正取？`, waitlist: `將「${t.teamName}」改為候補？`, cancel: `確定取消「${t.teamName}」的報名？`, restore: `將「${t.teamName}」恢復為候補？` }[op];
        const extra = op === 'promote' ? '<label class="check"><input type="checkbox" id="cfNotify" checked>寄出遞補成功通知信</label>'
          : op === 'cancel' ? '<label class="field"><span>取消原因<small>選填，會寫進通知信</small></span><input id="cfReason"></label><label class="check"><input type="checkbox" id="cfNotify">寄出取消通知信</label>' : '';
        if (!await confirmBox('變更報名狀態', text, extra)) return;
        const notify = $('#cfNotify')?.checked, reason = $('#cfReason')?.value;
        let r;
        try { r = await api('admin.updateTeam', { teamId: t.teamId, op, notify, reason }); }
        catch (ex) {
          if (ex.code === 'FULL' && await confirmBox('正取已額滿', ex.message + '\n\n確定仍要遞補？')) r = await api('admin.updateTeam', { teamId: t.teamId, op, notify, reason, force: true });
          else throw ex;
        }
        await refreshTeam(r.mailed === false ? '狀態已更新，但通知信寄送失敗' : '狀態已更新');
      }
      if (b.dataset.act === 'edit') { $('#infoView').hidden = true; $('#infoEdit').hidden = false; }
      if (b.dataset.act === 'edit-cancel') { $('#infoView').hidden = false; $('#infoEdit').hidden = true; }
      if (b.dataset.act === 'pay-reset') {
        const paid = t.payStatus === 'paid';
        if (!await confirmBox(paid ? '撤銷繳費' : '退回匯款資料', paid ? `撤銷後收據 ${t.receiptNo} 會作廢，隊伍狀態回到「未繳費」。` : '隊伍會看到你填寫的說明，並需要重新回報匯款。',
          '<label class="field"><span>說明<small>會顯示給隊伍</small></span><input id="cfReason" placeholder="例如：查無此筆匯款，請確認末五碼"></label><label class="check"><input type="checkbox" id="cfNotify" checked>寄信通知隊伍</label>')) return;
        await api('admin.resetPayment', { teamId: t.teamId, note: $('#cfReason').value, notify: $('#cfNotify').checked });
        await refreshTeam('已更新繳費狀態');
      }
      if (b.dataset.review) {
        const decision = b.dataset.review, note = $('#reviewNote').value.trim();
        if (decision === 'rejected' && !note) { toast('退回時請填寫需要修改的地方', 'warn'); $('#reviewNote').focus(); return; }
        b.disabled = true;
        const r = await api('admin.reviewData', { teamId: t.teamId, decision, note });
        await refreshTeam(decision === 'approved' ? '已審核通過，並寄信通知隊伍' : '已退回，並寄信通知隊伍修改' + (r.mailed === false ? '（寄信失敗）' : ''));
      }
      if (b.dataset.mail || b.dataset.act === 'resend') {
        const tpl = b.dataset.mail || $('#resendTpl').value;
        b.disabled = true;
        const r = await api('admin.resendMail', { teamId: t.teamId, template: tpl });
        toast(r.mailed ? '信件已寄出' : '寄信失敗，請查看寄信紀錄', r.mailed ? 'ok' : 'bad');
        b.disabled = false;
      }
    } catch (ex) { toast(ex.message, 'bad'); b.disabled = false; }
  };
  const pc = $('#payConfirm');
  if (pc) pc.onsubmit = async e => {
    e.preventDefault();
    const amount = Number(pc.amount.value);
    if (!(amount > 0)) { toast('請輸入實收金額', 'warn'); return; }
    if (!await confirmBox('確認收款', `確認收到「${t.teamName}」NT$ ${amount.toLocaleString()}？\n系統會開立電子收據並寄到 ${t.contactEmail}。`)) return;
    try {
      const r = await api('admin.confirmPayment', { teamId: t.teamId, amount, method: pc.method.value });
      await refreshTeam(r.mailed === false ? `已登記收款（${r.team.receiptNo}），但收據寄送失敗` : `已登記收款並寄出收據 ${r.team.receiptNo}`);
    } catch (ex) { toast(ex.message, 'bad'); }
  };
  const ie = $('#infoEdit');
  ie.onsubmit = async e => {
    e.preventDefault();
    try { await api('admin.updateTeam', { teamId: t.teamId, op: 'edit', fields: Object.fromEntries(new FormData(ie).entries()) }); await refreshTeam('報名資料已更新'); }
    catch (ex) { toast(ex.message, 'bad'); }
  };
  const ul = $('#unlock');
  if (ul) ul.onchange = async () => {
    try { await api('admin.unlockData', { teamId: t.teamId, unlocked: ul.checked }); await refreshTeam(ul.checked ? '已允許這支隊伍修改資料' : '已鎖定隊伍資料'); }
    catch (ex) { toast(ex.message, 'bad'); ul.checked = !ul.checked; }
  };
}

    <label class="check"><input type="checkbox" name="notify">同時寄信通知</label>
    <select name="audience" aria-label="寄信對象" style="min-height:34px;border-radius:8px;background:var(--night-2);border:1px solid var(--line);padding:0 8px">${Object.entries(AUDIENCE).map(([k, v]) => `<option value="${k}" ${k === 'all' ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    <div class="actions">${a.id ? '<button class="btn ghost" type="button" data-del>刪除</button>' : ''}<button class="btn red" type="submit">${a.id ? '儲存變更' : '發布公告'}</button></div></form>`;
  const render = cur => {
    $('#view').innerHTML = head('公告管理', '發布後會顯示在賽事網站「最新消息」，可以選擇同步寄信通知隊伍。') + `<div class="two">
      <div>${editor(cur)}</div>
      <div class="card"><h2>全部公告</h2>${list.length ? `<ul class="list">${list.map(a => `<li style="cursor:pointer" data-edit="${esc(a.id)}"><time>${esc(fmt(a.createdAt))}</time><span class="d"><b>${esc(a.title)}</b><br>
        <span class="pill">${esc(a.category)}</span> ${a.published ? '<span class="pill ok">已發布</span>' : '<span class="pill">草稿</span>'} ${a.pinned ? '<span class="pill warn">置頂</span>' : ''}</span></li>`).join('')}</ul>` : '<div class="empty">還沒有公告</div>'}</div></div>`;
    const f = $('#newsForm');
    f.onsubmit = async e => {
      e.preventDefault();
      const v = Object.fromEntries(new FormData(f).entries());
      const payload = { id: v.id, title: v.title, category: v.category, content: v.content, published: f.published.checked, pinned: f.pinned.checked, notify: f.notify.checked, audience: v.audience };
      if (payload.notify && payload.published && !await confirmBox('發布並寄信', `確定發布公告並寄信給「${AUDIENCE[v.audience]}」？`)) return;
      try {
        const r = await api('admin.saveAnnouncement', payload);
        list = await api('admin.announcements');
        render();
        toast(r.mail ? `公告已發布，寄出 ${r.mail.sent} 封${r.mail.failed ? `，失敗 ${r.mail.failed} 封` : ''}` : '公告已儲存');
      } catch (ex) { toast(ex.message, 'bad'); }
    };
    const del = $('[data-del]');
    if (del) del.onclick = async () => {
      if (!await confirmBox('刪除公告', '刪除後無法復原，確定刪除？')) return;
      try { await api('admin.deleteAnnouncement', { id: cur.id }); list = await api('admin.announcements'); render(); toast('公告已刪除'); } catch (ex) { toast(ex.message, 'bad'); }
    };
    const nw = $('[data-new]');
    if (nw) nw.onclick = () => render();
    $$('[data-edit]').forEach(li => li.onclick = () => render(list.find(a => a.id === li.dataset.edit)));
  };
  render();

      <dl class="kv" style="margin-top:14px"><dt>目前狀態</dt><dd>${s.discord_published ? '<span class="pill ok">已發布</span>' : '<span class="pill">未發布</span>'}</dd>

    <form class="card" id="liveForm" style="margin-top:16px"><div class="card-head"><h2>直播</h2>${s.live_on ? '<span class="pill bad">● LIVE 顯示中</span>' : '<span class="pill">未開啟</span>'}</div>
      <div class="row2" style="align-items:end"><label class="field" style="margin:0"><span>直播網址<small>YouTube、Twitch 或 Facebook 直播頁</small></span><input name="live_url" placeholder="https://www.youtube.com/live/..." value="${esc(s.live_url)}"></label>

      <div class="actions"><button class="btn red" type="submit">儲存</button></div></form>`;

      <h2>群發信件</h2>
      <div class="row2"><label class="field"><span>信件類型</span><select name="template">${Object.entries(TEMPLATES).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('')}</select></label>
      <label class="field"><span>寄送對象</span><select name="audience">${Object.entries(AUDIENCE).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label></div>
      <div id="customFields" hidden><label class="field"><span>主旨</span><input name="subject" maxlength="80"></label><label class="field"><span>內容</span><textarea name="message" style="min-height:160px"></textarea></label></div>
      <label class="check" id="unsentWrap"><input type="checkbox" name="onlyUnsent" checked>只寄給還沒收過這封信的隊伍</label>
      <p class="dim" style="font-size:13px;margin:10px 0 0" id="mailCount"></p>
      <div class="actions"><button class="btn red" type="submit">寄出</button></div>
    </form>
    <div class="card"><h2>自動寄信說明</h2><ul class="list" style="font-size:14px">
      <li><span class="d"><b>開放繳交隊伍資料通知</b><br><span class="muted">「開放繳交隊伍資料」日期到了自動寄給所有正取隊伍。</span></span></li>
      <li><span class="d"><b>隊伍資料截止提醒</b><br><span class="muted">截止前 3 天寄給尚未繳交或需修改的隊伍。</span></span></li>
      <li><span class="d"><b>繳費截止提醒</b><br><span class="muted">繳費截止前 2 天寄給尚未完成繳費的正取隊伍。</span></span></li>
      <li><span class="d"><b>即時信件</b><br><span class="muted">報名確認、資料繳交成功、審核結果、電子收據會在操作當下自動寄出。</span></span></li></ul></div></div>
    <div class="card" style="margin-top:16px"><div class="card-head"><h2>寄信紀錄</h2><button class="btn ghost sm" type="button" id="logReload">重新整理</button></div><div class="table-wrap" style="background:none" id="mailLog"><div class="loading"><span class="spin"></span></div></div></div>`;
  const f = $('#mailForm');
  const count = () => {
    const tpl = TEMPLATES[f.template.value];
    $('#customFields').hidden = f.template.value !== 'custom';
    $('#unsentWrap').hidden = !tpl.flag;
    const aud = f.audience.value;
    const n = S.teams.filter(t => t.status !== 'cancelled' && ({ all: true, waitlist: t.status === 'waitlist', paid: t.status === 'confirmed' && t.payStatus === 'paid', unpaid: t.status === 'confirmed' && t.payStatus !== 'paid', dataPending: t.status === 'confirmed' && ['none', 'rejected'].includes(t.dataStatus || 'none') }[aud] ?? t.status === 'confirmed')).length;
    $('#mailCount').textContent = `符合條件：${n} 隊${S.overview.quota != null ? `・今日剩餘額度 ${S.overview.quota} 封` : ''}`;
  };
  f.template.onchange = () => { f.audience.value = TEMPLATES[f.template.value].audience; count(); };
  f.audience.onchange = count;
  count();
  f.onsubmit = async e => {
    e.preventDefault();
    const v = { template: f.template.value, audience: f.audience.value, onlyUnsent: f.onlyUnsent.checked, subject: f.subject.value.trim(), message: f.message.value.trim() };
    if (v.template === 'custom' && (!v.subject || !v.message)) { toast('請填寫主旨與內容', 'warn'); return; }
    if (!await confirmBox('確認寄出', `寄出「${TEMPLATES[v.template].name}」給「${AUDIENCE[v.audience]}」？\n${$('#mailCount').textContent}`)) return;
    const btn = f.querySelector('[type=submit]');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 寄送中';
    try {
      const r = await api('admin.bulkMail', v);
      toast(`寄出 ${r.sent} 封${r.failed ? `，失敗 ${r.failed} 封` : ''}${r.note ? '。' + r.note : ''}`, r.failed ? 'warn' : 'ok');
      loadLog();
    } catch (ex) { toast(ex.message, 'bad'); }
    finally { btn.disabled = false; btn.textContent = '寄出'; }
  };
  $('#logReload').onclick = loadLog;
  loadLog();
}
async function loadLog() {
  try {
    const log = await api('admin.emailLog');
    $('#mailLog').innerHTML = log.length ? `<table class="mail-log"><thead><tr><th>時間</th><th>收件人</th><th>主旨</th><th>結果</th></tr></thead><tbody>
      ${log.map(l => `<tr><td class="dim" style="white-space:nowrap">${esc(fmt(l.time))}</td><td>${esc(l.to)}</td><td>${esc(l.subject)}</td><td>${String(l.result).startsWith('OK') ? '<span class="pill ok">成功</span>' : `<span class="pill bad" title="${esc(l.result)}">失敗</span>`}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">還沒有寄信紀錄</div>';
  } catch (e) { $('#mailLog').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ==========================================================================
   賽程與設定
   ========================================================================== */
function vSettings() {
  const o = S.overview, s = o.settings, b = s.bank || {};
  const stageKeys = ['group', 'breakout', 'finals'];
  const rows = o.schedule.map(it => `<tr data-key="${esc(it.key)}">
    <td><input type="text" data-f="label" value="${esc(it.label)}"></td>
    <td><input type="datetime-local" data-f="start" value="${esc(it.start || '')}"></td>
    <td>${stageKeys.includes(it.key) ? `<input type="datetime-local" data-f="end" value="${esc(it.end || '')}">` : '<span class="dim">—</span>'}</td>
    <td><input type="text" data-f="note" value="${esc(it.note || '')}" placeholder="說明（選填）"></td>
    <td style="text-align:center"><input type="checkbox" data-f="tbd" ${it.tbd ? 'checked' : ''} aria-label="日期確認中" style="width:18px;height:18px;accent-color:var(--red)"></td></tr>`).join('');
  $('#view').innerHTML = head('賽程與設定', '這裡的設定會覆寫 Code.gs 裡的預設值，儲存後網站立即更新。') + `
    <form class="card" id="schedForm">
      <div class="card-head"><h2>賽程日期</h2><span class="dim" style="font-size:13px">勾選「確認中」＝前台顯示「日期確認中」且不會自動寄信</span></div>
      <div class="table-wrap" style="background:none"><table class="sched"><thead><tr><th>項目名稱</th><th>開始（台北時間）</th><th>結束</th><th>說明</th><th>確認中</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="actions"><button class="btn ghost" type="button" id="schedReset">還原為 Code.gs 預設</button><button class="btn red" type="submit">儲存賽程</button></div>
    </form>
    <div class="two" style="margin-top:16px">
      <form class="card" id="modeForm"><h2>開放控制</h2>
        <div class="row2"><label class="field"><span>線上報名</span><select name="reg_mode">${Object.entries(MODE).map(([k, v]) => `<option value="${k}" ${s.reg_mode === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <label class="field"><span>隊伍資料繳交</span><select name="data_mode">${Object.entries(MODE).map(([k, v]) => `<option value="${k}" ${s.data_mode === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>
        <p class="dim" style="font-size:13px;margin:0">「依賽程時間自動」會依上方的開放與截止時間判斷；日期還在確認中時視為尚未開放。</p>
        <div class="actions"><button class="btn ghost" type="button" id="resetAuto">重設自動寄信紀錄</button><button class="btn" type="submit">儲存</button></div>
      </form>
      <form class="card" id="feeForm"><h2>報名費與匯款資訊</h2>
        <label class="field"><span>報名費（新台幣）<small>留空＝尚未公布</small></span><input name="entry_fee" type="number" min="0" value="${s.entry_fee ?? ''}"></label>
        <div class="row2"><label class="field"><span>銀行名稱</span><input name="bankName" value="${esc(b.bankName || '')}"></label><label class="field"><span>銀行代碼</span><input name="bankCode" value="${esc(b.bankCode || '')}"></label>
        <label class="field"><span>帳號</span><input name="account" value="${esc(b.account || '')}"></label><label class="field"><span>戶名</span><input name="holder" value="${esc(b.holder || '')}"></label></div>
        <p class="dim" style="font-size:13px;margin:0">匯款資訊只會顯示給正取隊伍，並出現在報名確認信與繳費提醒信中。</p>
        <div class="actions"><button class="btn" type="submit">儲存</button></div>
      </form>
    </div>`;
  const save = async (payload, msg) => {
    try { S.overview = await api('admin.saveSettings', payload); renderNav(); vSettings(); toast(msg); } catch (ex) { toast(ex.message, 'bad'); }
  };
  $('#schedForm').onsubmit = e => {
    e.preventDefault();
    const ov = {};
    $$('#schedForm tr[data-key]').forEach(tr => {
      const g = f => tr.querySelector(`[data-f="${f}"]`);
      ov[tr.dataset.key] = { label: g('label').value.trim(), start: g('start').value, end: g('end') ? g('end').value : '', note: g('note').value.trim(), tbd: g('tbd').checked };
    });
    const bad = Object.entries(ov).find(([, v]) => !v.tbd && !v.start);
    if (bad) { toast('已確認的項目需要填寫開始時間', 'warn'); return; }
    save({ schedule_override: ov }, '賽程已更新，網站會顯示新的日期');
  };
  $('#schedReset').onclick = async () => { if (await confirmBox('還原賽程', '清除後台設定的賽程，改用 Code.gs 裡的預設日期？')) save({ schedule_override: {} }, '已還原為預設賽程'); };
  $('#modeForm').onsubmit = e => { e.preventDefault(); const f = e.target; save({ reg_mode: f.reg_mode.value, data_mode: f.data_mode.value }, '開放設定已更新'); };
  $('#resetAuto').onclick = async () => { if (await confirmBox('重設自動寄信', '重設後，日期到了系統會再寄一次自動通知（已收過的隊伍不會重複收到）。')) save({ resetAutoMail: true }, '已重設自動寄信紀錄'); };
  $('#feeForm').onsubmit = e => {
    e.preventDefault();
    const f = e.target;
    save({ entry_fee: f.entry_fee.value === '' ? '' : Number(f.entry_fee.value), bank: { bankName: f.bankName.value.trim(), bankCode: f.bankCode.value.trim(), account: f.account.value.trim(), holder: f.holder.value.trim() } }, '報名費與匯款資訊已更新');
  };
}

/* ==========================================================================
   共用
   ========================================================================== */
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4500);
}
function confirmBox(title, text, extra = '') {
  return new Promise(res => {
    const d = $('#dlgConfirm');
    $('#confirmTitle').textContent = title; $('#confirmText').textContent = text; $('#confirmExtra').innerHTML = extra;
    const done = v => { d.close(); res(v); };
    $('#confirmYes').onclick = () => done(true);
    $('#confirmNo').onclick = () => done(false);
    d.oncancel = () => res(false);
    d.showModal();
  });
}
document.addEventListener('click', async e => {
  const c = e.target.closest('[data-close]');
  if (c) c.closest('dialog').close();
  const tr = e.target.closest('tr[data-team]');
  if (tr && !e.target.closest('button')) openTeam(tr.dataset.team);
  const qp = e.target.closest('[data-quickpay]');
  if (qp) openTeam(qp.dataset.quickpay);
  if (e.target.closest('[data-refresh]')) { try { await reload(); route(); toast('已更新'); } catch (ex) { toast(ex.message, 'bad'); } }
});
$('#dlgTeam').addEventListener('click', e => { if (e.target === $('#dlgTeam')) $('#dlgTeam').close(); });

(function init() {
  $('#demoBar').hidden = !DEMO;
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (s && s.exp > Date.now()) { S.session = s; enterApp().catch(e => signOut(e.message)); }
  } catch (e) { /* 忽略 */ }
})();
