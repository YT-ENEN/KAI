<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>REINOU STUDIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast"></div>

  <section id="loginView" class="login-shell">
    <div class="login-card glass">
      <div class="brand-lockup">
        <div class="brand-mark">R</div>
        <div>
          <div class="eyebrow">REINOU ENTERTAINMENT</div>
          <h1>Studio OS</h1>
        </div>
      </div>
      <p class="muted">銳能娛樂工作室營運系統</p>
      <form id="loginForm" class="stack-lg">
        <label>帳號<input id="loginUsername" autocomplete="username" required placeholder="輸入帳號"></label>
        <label>密碼<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="輸入密碼"></label>
        <button class="btn primary" type="submit">登入工作室</button>
      </form>
      <p class="login-note">第一次使用請先在 Apps Script 執行 <code>setupStudio()</code> 建立資料表與管理員帳號。</p>
    </div>
  </section>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand-lockup side-brand">
        <div class="brand-mark small">R</div>
        <div><strong>REINOU</strong><span>STUDIO</span></div>
      </div>
      <nav id="sideNav" class="nav"></nav>
      <div class="sidebar-foot">
        <div id="miniUser" class="mini-user"></div>
        <button id="logoutBtn" class="btn ghost full">登出</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div id="pageEyebrow" class="eyebrow">WORKSPACE</div>
          <h2 id="pageTitle">工作台</h2>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" class="icon-btn" title="重新整理">↻</button>
          <button id="notifyBtn" class="icon-btn" title="通知">●<span id="notifyBadge" class="badge hidden">0</span></button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>

    <nav id="mobileNav" class="mobile-nav"></nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card">
      <button class="modal-close" value="cancel">×</button>
      <div id="modalContent"></div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
