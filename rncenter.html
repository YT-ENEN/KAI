  <style>
:root{

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--cream)}
body{overflow-x:hidden;background:

  radial-gradient(circle at 8% 105%,rgba(237,216,214,.38),transparent 26%),var(--cream)}
button,input,select,textarea{font:inherit}.hidden{display:none!important}.grow{flex:1}.mobile-only{display:none}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px}.stack{display:grid;gap:14px}.stack-lg{display:grid;gap:18px}.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.divider{height:1px;background:var(--line);margin:24px 0}

.global-loader{position:fixed;left:0;right:0;top:0;height:3px;z-index:9999;opacity:0;transition:.2s;pointer-events:none}.global-loader.active{opacity:1}.global-loader i{display:block;height:100%;width:36%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:loader 1.1s infinite ease-in-out}@keyframes loader{from{transform:translateX(-120%)}to{transform:translateX(380%)}}
#toastRoot{position:fixed;right:24px;bottom:24px;display:grid;gap:10px;z-index:120}.toast{min-width:260px;max-width:420px;padding:14px 16px;border-radius:16px;background:rgba(31,29,25,.95);color:#fff;box-shadow:0 24px 60px rgba(0,0,0,.22);font-size:13px;backdrop-filter:blur(12px)}.toast.ok{border-left:3px solid #d7c06c}.toast.err{border-left:3px solid #d57676}

.eyebrow{font-size:10px;letter-spacing:.22em;font-weight:800;color:var(--gold-deep)}
.brand-logo-wrap{width:48px;height:48px;border-radius:16px;background:#181713;display:grid;place-items:center;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15)}.brand-logo-wrap img{width:100%;height:100%;object-fit:contain;padding:7px}.brand-logo-wrap-lg{width:74px;height:74px;border-radius:22px}.brand-logo-wrap-lg img{padding:9px}

.login-shell{min-height:100vh;display:grid;place-items:center;padding:36px;position:relative;overflow:hidden;background:linear-gradient(135deg,#efe6d6 0%,#f8f5ef 48%,#eee4de 100%)}
.login-ambient{position:absolute;inset:0;background:radial-gradient(circle at 72% 22%,rgba(244,223,136,.55),transparent 28%),radial-gradient(circle at 23% 78%,rgba(237,216,214,.58),transparent 30%)}
.login-card{position:relative;width:min(520px,100%);padding:38px;border-radius:34px;background:rgba(255,253,250,.84);border:1px solid rgba(255,255,255,.78);box-shadow:0 34px 90px rgba(65,51,32,.14);backdrop-filter:blur(22px)}
.login-card:after{content:"";position:absolute;inset:12px;border:1px solid rgba(214,178,76,.14);border-radius:25px;pointer-events:none}.login-brand{display:flex;align-items:center;gap:18px}.login-card h1{font-family:"Noto Serif TC",serif;font-size:34px;font-weight:700;letter-spacing:-.04em;margin:5px 0 0}.login-copy{line-height:1.9;color:#777166;margin:22px 0 28px}.login-note{border-top:1px solid var(--line);padding-top:18px;margin-top:24px;color:#9a9489;font-size:11px;line-height:1.8}

.field{display:grid;gap:8px}.field>span{font-size:11px;color:#6f6a60;font-weight:700;letter-spacing:.03em}.field input,.field select,.field textarea,.search{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--ink);padding:13px 15px;border-radius:15px;outline:none;transition:.18s;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}.field textarea{min-height:118px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:#ccb163;box-shadow:0 0 0 4px rgba(214,178,76,.10);background:#fff}.field input[type=file]{padding:9px}.field input[type=file]::file-selector-button{border:0;border-radius:11px;padding:9px 12px;margin-right:12px;background:#24211c;color:#fff}.search{min-width:260px;max-width:390px}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;cursor:pointer}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.btn-primary{background:#1e1d19;color:#fff;box-shadow:0 10px 25px rgba(23,22,18,.12)}.btn-primary:hover{background:#11100e}.btn-ghost{background:#fff;color:#2c2923;border:1px solid var(--line);box-shadow:0 6px 18px rgba(55,45,30,.04)}.btn-danger{background:#fff3f3;color:#a94343;border:1px solid #efd0d0}.btn-sm{padding:8px 11px;font-size:11px;border-radius:11px}.btn-wide{width:100%;padding:14px}.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;display:grid;place-items:center;cursor:pointer}

.app-shell{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);display:flex;flex-direction:column;z-index:40;background:#171612;color:#fff;border-right:1px solid rgba(255,255,255,.06);box-shadow:12px 0 45px rgba(31,25,17,.08)}.sidebar:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 0,rgba(214,178,76,.11),transparent 30%);pointer-events:none}.sidebar-head{height:92px;padding:18px 18px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;position:relative}.brand-row{display:flex;align-items:center;gap:13px}.brand-row strong{font-family:"Noto Serif TC",serif;font-size:15px;letter-spacing:.08em}.brand-row span{display:block;font-size:9px;color:#8b877f;letter-spacing:.16em;margin-top:4px}.nav{padding:15px 11px 18px;overflow:auto;flex:1;position:relative}.nav::-webkit-scrollbar{width:4px}.nav::-webkit-scrollbar-thumb{background:#393630;border-radius:99px}.nav-section{font-size:9px;color:#706c64;font-weight:800;letter-spacing:.17em;padding:17px 13px 8px}.nav-item{position:relative;display:flex;align-items:center;gap:12px;color:#bbb5ab;text-decoration:none;padding:12px 13px;border-radius:14px;margin:3px 0;font-size:12px;font-weight:700;transition:.18s}.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}.nav-item.active{background:#f3ead9;color:#1c1a16;box-shadow:0 8px 24px rgba(0,0,0,.16)}.nav-dot{width:7px;height:7px;border-radius:50%;background:#514d46}.nav-item.active .nav-dot{background:var(--gold-deep);box-shadow:0 0 0 4px rgba(214,178,76,.14)}.sidebar-user{position:relative;border-top:1px solid rgba(255,255,255,.07);padding:15px;display:flex;align-items:center;gap:10px}.sidebar-user .icon-btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08);color:#fff}.avatar{width:40px;height:40px;border-radius:14px;background:#f2e9d7;color:#191814;display:grid;place-items:center;font-weight:900}.sidebar-user strong{font-size:12px;display:block}.sidebar-user span{font-size:9px;color:#8a867f;display:block;margin-top:3px}

.main{margin-left:var(--sidebar);min-height:100vh}.topbar{min-height:92px;padding:18px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:sticky;top:0;z-index:20;background:rgba(246,242,235,.82);border-bottom:1px solid rgba(220,210,194,.72);backdrop-filter:blur(20px)}.page-heading h2{font-family:"Noto Serif TC",serif;font-size:25px;margin:3px 0 0;letter-spacing:-.04em}.top-actions{display:flex;gap:9px}.content{padding:30px;max-width:1560px;margin:auto}

.hero{position:relative;overflow:hidden;border-radius:32px;padding:34px 36px;background:linear-gradient(125deg,#25221c 0%,#151411 62%,#302a1d 100%);color:#fff;display:flex;justify-content:space-between;gap:24px;align-items:flex-end;box-shadow:var(--shadow)}.hero:before{content:"";position:absolute;width:430px;height:430px;border-radius:50%;right:-130px;top:-230px;background:radial-gradient(circle,rgba(244,223,136,.28),transparent 67%)}.hero:after{content:"RN";position:absolute;right:22px;bottom:-64px;font-family:"Noto Serif TC",serif;font-weight:900;font-size:215px;line-height:1;color:rgba(255,255,255,.025)}.hero .eyebrow{color:#e6c96d}.hero h3{font-family:"Noto Serif TC",serif;font-size:34px;margin:8px 0 8px;letter-spacing:-.045em;position:relative;z-index:1}.hero p{margin:0;color:#aaa49a;line-height:1.8;position:relative;z-index:1}.hero .meta{position:relative;z-index:1}.hero .meta span{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#d6d0c7}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:18px 0 24px}.stat{position:relative;background:rgba(255,253,250,.86);border:1px solid rgba(229,221,209,.9);border-radius:22px;padding:21px;overflow:hidden;box-shadow:var(--shadow-sm)}.stat:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-40px;top:-40px;background:rgba(244,223,136,.28)}.stat span{font-size:10px;color:#898379;font-weight:800;letter-spacing:.04em}.stat strong{display:block;font-family:"Noto Serif TC",serif;font-size:30px;margin-top:8px;letter-spacing:-.04em}.stat small{display:block;margin-top:4px;font-size:9px;color:#aaa399}

.panel{background:rgba(255,253,250,.88);border:1px solid rgba(229,221,209,.92);border-radius:25px;overflow:hidden;box-shadow:var(--shadow-sm)}.panel-head{padding:19px 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h3{font-family:"Noto Serif TC",serif;font-size:15px;margin:0}.panel-body{padding:20px}.section-grid{display:grid;grid-template-columns:1.35fr .85fr;gap:18px}.empty{padding:38px;text-align:center;color:#9a948a;border:1px dashed var(--line-strong);border-radius:18px;background:rgba(255,255,255,.4)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{position:relative;background:rgba(255,253,250,.88);border:1px solid rgba(229,221,209,.94);border-radius:24px;padding:20px;box-shadow:var(--shadow-sm);transition:.2s;overflow:hidden}.card:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(55,45,30,.10)}.card h4{font-family:"Noto Serif TC",serif;font-size:18px;margin:13px 0 8px;letter-spacing:-.025em}.card h5,.task-card h5{font-size:13px;margin:10px 0 5px}.card p,.task-card p{font-size:11px;color:#837d73;line-height:1.75}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:17px}.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:10px;color:#918b81}.meta>span:not(.badge){padding:6px 9px;background:#f5efe5;border-radius:999px}
.project-card{min-height:245px}.project-card .project-accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--butter)}.project-card.risk-high .project-accent{background:#d58a7e}.project-card.risk-medium .project-accent{background:#d6b24c}.project-card.risk-low .project-accent{background:#9db59f}.project-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.mini-kpi{background:#f7f2e9;border:1px solid #ede4d6;border-radius:14px;padding:10px}.mini-kpi span{display:block;font-size:9px;color:#969086}.mini-kpi strong{display:block;font-size:12px;margin-top:3px}.health-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:#f2eee6;font-size:10px;font-weight:800}.health-pill:before{content:"";width:7px;height:7px;border-radius:50%;background:#9db59f}.health-pill.watch:before{background:#d5b254}.health-pill.risk:before{background:#d27a70}
.progress{height:7px;border-radius:999px;background:#eee7db;overflow:hidden}.progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#c49d35,#ead274)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:9px;font-weight:800}.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}.badge.green{color:#4d7758;background:#edf4ee}.badge.red{color:#9e5353;background:#f9ecec}.badge.yellow{color:#9b7b22;background:#f7f0d9}.badge.blue{color:#667891;background:#edf0f5}
.priority-low{color:#5f856b}.priority-medium{color:#957b32}.priority-high{color:#ac665c}.priority-urgent{color:#9e3f3f;font-weight:900}

.task-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.timeline{display:grid;gap:0}.timeline-item{display:grid;grid-template-columns:24px 1fr;gap:8px;min-height:64px}.timeline-rail{position:relative}.timeline-rail:after{content:"";position:absolute;width:1px;left:10px;top:18px;bottom:-8px;background:var(--line)}.timeline-item:last-child .timeline-rail:after{display:none}.timeline-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);position:absolute;left:6px;top:6px;box-shadow:0 0 0 4px rgba(214,178,76,.14)}.timeline-content strong{font-size:12px}.timeline-content p{margin:4px 0;color:#8d877d;font-size:10px;line-height:1.65}
.project-detail-head{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}.project-detail-head h3{font-family:"Noto Serif TC",serif;font-size:27px;margin:6px 0 8px}.project-detail-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.project-overview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.project-overview-item{padding:14px;background:#f7f2e9;border:1px solid #ece2d3;border-radius:16px}.project-overview-item span{display:block;font-size:9px;color:#928c82}.project-overview-item strong{display:block;font-size:12px;margin-top:4px}.project-feed{display:grid;gap:11px}.feed-item{padding:14px 15px;border:1px solid var(--line);background:#fff;border-radius:16px}.feed-item strong{font-size:12px}.feed-item p{font-size:11px;color:#817a70;line-height:1.7;margin:5px 0}.risk-row{padding:13px 14px;border:1px solid var(--line);border-radius:16px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:12px}.risk-row p{margin:5px 0 0;font-size:10px;color:#837c72}.team-chips{display:flex;flex-wrap:wrap;gap:8px}.team-chip{padding:7px 10px;border-radius:999px;background:#f2ece2;border:1px solid #e6dccd;font-size:10px;font-weight:700}

.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{text-align:left;padding:11px 12px;font-size:9px;color:#9a9389;font-weight:800;letter-spacing:.04em;border-bottom:1px solid var(--line)}.table td{padding:13px 12px;border-bottom:1px solid #eee8df;font-size:11px;vertical-align:middle}.table tbody tr:hover{background:rgba(244,239,231,.55)}.person{display:flex;align-items:center;gap:10px}.person strong{display:block;font-size:12px}.person span{display:block;font-size:9px;color:#989187;margin-top:2px}.avatar-shell{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:13px;overflow:hidden;background:linear-gradient(145deg,#efe6d8,#dfd0b8);color:#4a4338;flex:0 0 auto}.avatar-shell.large{width:88px;height:88px;border-radius:25px}.avatar-shell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}.avatar-fallback{position:relative;z-index:1;font-weight:900;font-size:12px}.avatar-shell.large .avatar-fallback{font-size:23px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:13px 16px;margin:0}.kv dt{font-size:10px;color:#918a80}.kv dd{margin:0;font-size:11px;font-weight:700}.secret{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;letter-spacing:.08em;background:#211f1a;color:#f2e7bd;padding:16px;border-radius:14px}.link-card{text-decoration:none;color:inherit}
.finance-hero{background:linear-gradient(130deg,#f4e8c1,#f8f2e8 52%,#eedfda);border:1px solid #eadfce;border-radius:28px;padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:17px;box-shadow:var(--shadow-sm)}.finance-summary .amount{font-family:"Noto Serif TC",serif;font-size:40px;margin:8px 0 4px}.finance-summary p{font-size:11px;color:#756e64}.score-ring{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#d0aa3c var(--score),#eee6d8 0);position:relative}.score-ring:after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}.score-ring strong{position:relative;z-index:1;font-size:11px}

.modal-backdrop{position:fixed;inset:0;background:rgba(24,20,15,.42);display:grid;place-items:center;padding:24px;z-index:100;backdrop-filter:blur(8px)}.modal{width:min(690px,100%);max-height:min(88vh,920px);overflow:hidden;background:#fbf8f2;border:1px solid rgba(255,255,255,.7);border-radius:28px;box-shadow:0 35px 100px rgba(41,34,24,.24);display:flex;flex-direction:column}.modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h3{font-family:"Noto Serif TC",serif;margin:0;font-size:20px}.modal-body{padding:22px;overflow:auto}.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:#f7f2ea}

</style>

<body>
  <div id="globalLoader" class="global-loader"><i></i></div>
  <div id="toastRoot"></div>

  <section id="loginView" class="login-shell">
    <div class="login-ambient"></div>
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-logo-wrap brand-logo-wrap-lg">
          <img src="https://cdn.phototourl.com/free/2026-09-22-a9f9fb68-5bf7-44c8-aeff-04af75c8bd72.png" alt="銳能娛樂 Logo">
        </div>
        <div>
          <div class="eyebrow">銳能娛樂・內部工作系統</div>
          <h1>中央控制中心</h1>
        </div>
      </div>
      <p class="login-copy">專案、人事、財務、文件與內部控制台，集中在同一個工作入口。</p>
      <form id="loginForm" class="stack-lg">
        <label class="field"><span>員工帳號</span><input id="loginUsername" autocomplete="username" required /></label>
        <label class="field"><span>密碼</span><input id="loginPassword" type="password" autocomplete="current-password" required /></label>
        <button class="btn btn-primary btn-wide" type="submit">登入工作臺</button>
      </form>
      <div class="login-note">此系統僅供授權人員使用。敏感資料、帳號與管理操作皆會留下紀錄。</div>
    </div>
  </section>

  <div id="appView" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div class="brand-row">
          <div class="brand-logo-wrap"><img src="https://cdn.phototourl.com/free/2026-09-22-a9f9fb68-5bf7-44c8-aeff-04af75c8bd72.png" alt="銳能娛樂 Logo"></div>
          <div><strong>銳能娛樂</strong><span>中央控制中心</span></div>
        </div>
        <button id="closeNav" class="icon-btn mobile-only" aria-label="關閉選單">×</button>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-user">
        <div class="avatar" id="sideAvatar">銳</div>
        <div class="grow"><strong id="sideName">—</strong><span id="sideRole">—</span></div>
        <button id="logoutBtn" class="icon-btn" title="登出" aria-label="登出">↪</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="openNav" class="icon-btn mobile-only" aria-label="開啟選單">☰</button>
        <div class="page-heading"><div id="pageEyebrow" class="eyebrow">中央控制</div><h2 id="pageTitle">中央總覽</h2></div>
        <div class="top-actions"><button id="quickProposal" class="btn btn-ghost">＋ 提案</button><button id="quickTask" class="btn btn-primary">＋ 任務</button></div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="modalRoot"></div>

  <script src="config.js?v=3.0"></script>
  <script>
const C = window.REBORN_CONFIG;
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const state = { token: localStorage.getItem(C.SESSION_KEY)||'', me:null, page:'dashboard', data:{}, cache:new Map(), requests:0 };
const P = p => state.me?.permissions?.includes('*') || state.me?.permissions?.includes(p);
const esc = v => String(v ?? '').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money = n => new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(n||0));
const date = v => v ? new Date(v).toLocaleDateString('zh-TW') : '—';
const dt = v => v ? new Date(v).toLocaleString('zh-TW',{hour12:false}) : '—';
const uid = () => Math.random().toString(36).slice(2,9);

const LABELS = {
  DRAFT:'草稿',PLANNING:'規劃中',IN_PROGRESS:'進行中',REVIEW:'待檢核',COMPLETED:'已完成',ARCHIVED:'已封存',OPEN:'待處理',DONE:'已完成',TODO:'待開始',
  INTERNAL:'內部專案',EVENT_PROJECT:'賽事專案',MARKETING_PROJECT:'行銷專案',SYSTEM_PROJECT:'系統專案',BRAND_PROJECT:'品牌專案',
  ON_TRACK:'進度正常',WATCH:'需要關注',AT_RISK:'高風險',AUTO:'依任務自動',MANUAL:'手動設定',
  PENDING:'待處理',APPROVED:'已核准',REJECTED:'已退回',ACTIVE:'啟用',PAUSED:'暫停',LEFT:'已離職',PAID:'已付款',CANCELLED:'已取消',CONFIRMED:'已確認',
  LOW:'低',MEDIUM:'一般',HIGH:'高',URGENT:'緊急',NORMAL:'一般',
  PROJECT:'新專案',PROCESS:'流程改善',EVENT:'賽事／活動',PURCHASE:'採購需求',MARKETING:'行銷企劃',OTHER:'其他',GENERAL:'一般公告',HR:'人事',SYSTEM:'系統',
  FULL_TIME:'正職',EVENT_PART_TIME:'賽事期工讀',CONTRACTOR:'合作人員',
  ADMIN:'行政管理',BROADCAST:'轉播製作',DESIGN:'視覺設計',FINANCE:'財務',TECH:'技術開發',
  MONTHLY:'月薪',DAILY:'日薪',PER_EVENT:'按場次',ONE_TIME:'單次勞務',HOURLY:'時薪',
  PERSONAL:'事假',SICK:'病假',EVENT_UNAVAILABLE:'賽事無法排班',
  TRANSPORT:'交通',EQUIPMENT:'設備',
  SALARY:'薪資',EVENT_FEE:'賽事勞務報酬',PERFORMANCE_BONUS:'績效獎金',BONUS:'其他獎金',REIMBURSEMENT:'費用核銷',
  EMPLOYEE_AGREEMENT:'人員任用暨勞務報酬確認書',CONTROL:'內部控制台',SUCCESS:'成功',FAILED:'失敗',
  SUPER_ADMIN:'最高管理員',PROJECT_MANAGER:'專案主管',EVENT_STAFF:'賽事期工讀',
  SAVE_EMPLOYEE:'儲存員工資料',CREATE_USER:'建立員工帳號',LOGIN:'登入系統',LOGOUT:'登出系統',CHANGE_PASSWORD:'變更密碼',VIEW_VAULT:'查看機密庫',VAULT_REAUTH:'機密庫二次驗證',
  SAVE_PROJECT:'儲存專案',CREATE_PROPOSAL:'建立提案',REVIEW_PROPOSAL:'審核提案',CREATE_TASK:'建立任務',UPDATE_TASK_STATUS:'更新任務狀態',SAVE_WORKLOG:'儲存工作日誌',CREATE_ANNOUNCEMENT:'發布公告',
  CREATE_LEAVE:'建立請假申請',REVIEW_LEAVE:'審核請假',CREATE_EXPENSE:'建立費用申請',REVIEW_EXPENSE:'審核費用',CREATE_COMPENSATION:'新增薪資／報酬',SAVE_PERFORMANCE:'新增績效評核',GENERATE_PDF:'產生 PDF',CREATE_SYSTEM_LINK:'新增控制台'
};
const label = v => LABELS[String(v||'').toUpperCase()] || String(v||'—');
const options = (vals,current='') => vals.map(v=>`<option value="${esc(v)}" ${String(current)===v?'selected':''}>${esc(label(v))}</option>`).join('');
const readActions = new Set(['me','dashboard','listProjects','getProject','listProposals','listTasks','listWorklogs','listAnnouncements','listEmployees','listEmployeesLite','listLeave','listExpenses','listCompensation','listDocuments','listSystemLinks','listUsers','listRoles','listAudit','financeOverview','listPerformance','getEmployeePhoto']);

function setLoading(on){
  state.requests += on ? 1 : -1; state.requests=Math.max(0,state.requests);
  $('#globalLoader')?.classList.toggle('active',state.requests>0);
}
function clearCache(){ state.cache.clear(); }
async function api(action, payload={}, {fresh=false}={}){
  if(!C.API_URL || C.API_URL.includes('PASTE_')) throw new Error('請先在 config.js 填入 Apps Script Web App 網址');
  const cacheKey = action+'|'+JSON.stringify(payload||{});
  const cached = state.cache.get(cacheKey);
  if(!fresh && readActions.has(action) && cached && Date.now()-cached.at < 20000) return cached.data;
  setLoading(true);
  try{
    const res = await fetch(C.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:state.token,payload})});
    const out = await res.json();
    if(!out.ok){
      if(out.code==='UNAUTHORIZED'){ localStorage.removeItem(C.SESSION_KEY); state.token=''; state.me=null; showLogin(); }
      throw new Error(out.message||'系統發生錯誤');
    }
    if(readActions.has(action)) state.cache.set(cacheKey,{at:Date.now(),data:out.data}); else clearCache();
    return out.data;
  } finally { setLoading(false); }
}
function toast(msg,type='ok'){ const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;$('#toastRoot').appendChild(el);setTimeout(()=>el.remove(),3200); }
function busy(btn,on=true,text='處理中…'){if(!btn)return;if(on){btn.dataset.old=btn.textContent;btn.disabled=true;btn.textContent=text}else{btn.disabled=false;btn.textContent=btn.dataset.old||'完成'}}
function showLogin(){ $('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden'); }
function showApp(){ $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden'); }
const employeePhotoCache=new Map();
function photoSrc(x){ return x?.photoThumb || x?.photoDataUrl || ''; }
function avatarHtml(x,large=false){ const initial=esc((x?.name||'銳').slice(0,1)),src=photoSrc(x),fileId=x?.photoFileId||'',cls=large?'avatar-shell large':'avatar-shell';return `<span class="${cls}">${src?`<img src="${esc(src)}" alt="${esc(x?.name||'員工')}" loading="lazy" onerror="this.remove()">`:fileId?`<img data-drive-file="${esc(fileId)}" alt="${esc(x?.name||'員工')}" loading="lazy">`:''}<span class="avatar-fallback">${initial}</span></span>`; }
async function hydrateEmployeePhotos(root=document){const imgs=$$('img[data-drive-file]',root).filter(i=>!i.dataset.loading);for(const img of imgs){const id=img.dataset.driveFile;if(!id)continue;img.dataset.loading='1';try{let src=employeePhotoCache.get(id);if(!src){const d=await api('getEmployeePhoto',{fileId:id});src=d.dataUrl;employeePhotoCache.set(id,src)}img.src=src;img.removeAttribute('data-drive-file')}catch(e){img.remove()}}}
let photoObserver=null;
function watchEmployeePhotos(){if(photoObserver)return;photoObserver=new MutationObserver(()=>hydrateEmployeePhotos());photoObserver.observe(document.body,{childList:true,subtree:true});hydrateEmployeePhotos()}

function healthPill(v){const k=String(v||'ON_TRACK').toUpperCase();const c=k==='AT_RISK'?'risk':k==='WATCH'?'watch':'';return `<span class="health-pill ${c}">${esc(label(k))}</span>`}
function projectProgress(x){return Math.max(0,Math.min(100,Number(x.effectiveProgress ?? x.progress ?? 0)))}

const navGroups = [
  ['工作臺',[
    ['dashboard','中央總覽','dashboard.view'],['projects','專案計畫','projects.view'],['proposals','員工提案','proposals.view'],['tasks','任務看板','tasks.view'],['worklogs','工作日誌','worklogs.view'],['announcements','公告中心','announcements.view']
  ]],
  ['人事與行政',[
    ['employees','員工檔案','employees.view'],['leave','請假／排班申請','leave.view'],['documents','文件中心','documents.view']
  ]],
  ['財務管理',[
    ['finance','財務中心','compensation.view'],['expenses','費用申請','expenses.view']
  ]],
  ['系統與安全',[
    ['systems','控制台中心','systems.view'],['vault','工作臺機密庫','vault.view'],['accounts','帳號與權限','accounts.view'],['audit','操作紀錄','audit.view']
  ]]
];
function renderNav(){
  $('#nav').innerHTML=navGroups.map(([g,items])=>{const visible=items.filter(x=>P(x[2]));if(!visible.length)return '';return `<div class="nav-section">${esc(g)}</div>${visible.map(([id,t])=>`<a href="#${id}" data-page="${id}" class="nav-item ${state.page===id?'active':''}"><span class="nav-dot"></span>${esc(t)}</a>`).join('')}`;}).join('');
  $$('[data-page]').forEach(a=>a.onclick=e=>{e.preventDefault();navigate(a.dataset.page);});
}
function setTitle(title,eyebrow='中央控制'){ $('#pageTitle').textContent=title;$('#pageEyebrow').textContent=eyebrow; }
async function navigate(page){
  if(page==='compensation') page='finance';
  state.page=page;location.hash=page;renderNav();$('#sidebar').classList.remove('open');
  const routes={dashboard:renderDashboard,projects:renderProjects,proposals:renderProposals,tasks:renderTasks,worklogs:renderWorklogs,announcements:renderAnnouncements,employees:renderEmployees,leave:renderLeave,expenses:renderExpenses,finance:renderFinance,documents:renderDocuments,systems:renderSystems,vault:renderVault,accounts:renderAccounts,audit:renderAudit};
  $('#content').innerHTML='<div class="empty">正在載入資料…</div>';
  try{await (routes[page]||renderDashboard)()}catch(err){$('#content').innerHTML=`<div class="empty">${esc(err.message)}</div>`;toast(err.message,'err')}
}
function statusBadge(v,override=''){const s=String(v||'').toUpperCase();const c=/DONE|APPROVED|ACTIVE|PAID|COMPLETED|CONFIRMED|SUCCESS/.test(s)?'green':/REJECT|SUSPEND|LEFT|FAILED|CANCEL/.test(s)?'red':/REVIEW|IN_PROGRESS|OPEN|PENDING|PLANNING/.test(s)?'yellow':'blue';return `<span class="badge ${c}"><i class="dot"></i>${esc(override||label(v))}</span>`}
function panel(title,body,action=''){return `<section class="panel"><div class="panel-head"><h3>${esc(title)}</h3>${action}</div><div class="panel-body">${body}</div></section>`}
function empty(text='目前沒有資料'){return `<div class="empty">${esc(text)}</div>`}
function modal(title,body,{saveText='儲存',onSave=null,wide=false}={}){const id='m'+uid();$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="${id}"><div class="modal" style="${wide?'width:min(980px,100%)':''}"><div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close>×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn btn-ghost" data-close>取消</button>${onSave?`<button class="btn btn-primary" data-save>${esc(saveText)}</button>`:''}</div></div></div>`;const root=$('#'+id);$$('[data-close]',root).forEach(b=>b.onclick=()=>root.remove());root.onclick=e=>{if(e.target===root)root.remove()};if(onSave){$('[data-save]',root).onclick=async e=>{try{busy(e.currentTarget,true);await onSave(root);root.remove()}catch(err){toast(err.message,'err');busy(e.currentTarget,false)}}}return root}
function formDataObj(root){const o={};$$('[name]',root).forEach(el=>{if(el.type==='checkbox')o[el.name]=el.checked;else if(el.multiple)o[el.name]=[...el.selectedOptions].map(x=>x.value);else o[el.name]=el.value});return o}

async function boot(){
  $('#loginForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;try{busy(b,true,'登入中…');const d=await api('login',{username:$('#loginUsername').value.trim(),password:$('#loginPassword').value},{fresh:true});state.token=d.token;localStorage.setItem(C.SESSION_KEY,state.token);state.me=d.user;clearCache();initApp()}catch(err){toast(err.message,'err')}finally{busy(b,false)}};
  if(state.token){try{state.me=await api('me',{}, {fresh:true});initApp()}catch{showLogin()}}else showLogin();
}
function initApp(){
  showApp();watchEmployeePhotos();$('#sideName').textContent=state.me.name||state.me.username;$('#sideRole').textContent=state.me.roleName||label(state.me.role);$('#sideAvatar').textContent=(state.me.name||'銳').slice(0,1);
  $('#logoutBtn').onclick=async()=>{try{await api('logout',{}, {fresh:true})}catch{}localStorage.removeItem(C.SESSION_KEY);state.token='';state.me=null;clearCache();showLogin()};
  $('#openNav').onclick=()=>$('#sidebar').classList.add('open');$('#closeNav').onclick=()=>$('#sidebar').classList.remove('open');
  $('#quickProposal').classList.toggle('hidden',!P('proposals.create'));$('#quickTask').classList.toggle('hidden',!P('tasks.create'));$('#quickProposal').onclick=()=>openProposalForm();$('#quickTask').onclick=()=>openTaskForm();
  const start=(location.hash||'#dashboard').slice(1);navigate(start);if(state.me.mustChangePassword)setTimeout(forcePasswordChange,250);
}

async function renderDashboard(){
  setTitle('中央總覽','今日工作概況');const d=await api('dashboard');state.data.dashboard=d;
  $('#content').innerHTML=`<section class="hero"><div><div class="eyebrow">銳能娛樂工作臺</div><h3>${esc(state.me.name||state.me.username)}，歡迎回來。</h3><p>專案進度、待辦工作、人事與行政狀態都集中在這裡。</p></div><div class="meta"><span>${esc(state.me.employeeId||'管理員')}</span><span>${esc(state.me.roleName||label(state.me.role))}</span></div></section>
  <div class="stats"><div class="stat"><span>進行中專案</span><strong>${d.stats.projects}</strong><small>規劃中、進行中與待檢核</small></div><div class="stat"><span>待審提案</span><strong>${d.stats.proposals}</strong><small>等待主管處理</small></div><div class="stat"><span>我的未完成任務</span><strong>${d.stats.tasks}</strong><small>尚未完成</small></div><div class="stat"><span>在職人員</span><strong>${d.stats.employees}</strong><small>目前啟用中的員工</small></div></div>
  <div class="section-grid">${panel('我的近期任務',d.myTasks?.length?`<div class="stack">${d.myTasks.map(t=>`<div class="task-card"><div class="meta"><span class="priority-${String(t.priority||'low').toLowerCase()}">${esc(label(t.priority||'MEDIUM'))}</span><span>${esc(t.projectName||'一般工作')}</span></div><h5>${esc(t.title)}</h5><div class="card-foot">${statusBadge(t.status)}<span class="tiny muted">截止 ${date(t.dueDate)}</span></div></div>`).join('')}</div>`:empty('目前沒有待辦任務'))}<div class="stack">${panel('待處理',`<dl class="kv"><dt>待審提案</dt><dd>${d.pending.proposals}</dd><dt>待審費用</dt><dd>${d.pending.expenses}</dd><dt>待審請假</dt><dd>${d.pending.leave}</dd></dl>`)}${panel('最新公告',d.announcements?.length?`<div class="timeline">${d.announcements.map(a=>`<div class="timeline-item"><div class="timeline-rail"><div class="timeline-dot"></div></div><div class="timeline-content"><strong>${esc(a.title)}</strong><p>${esc(a.content)}</p><p>${dt(a.createdAt)}</p></div></div>`).join('')}</div>`:empty())}</div></div>`;
}

async function renderProjects(){
  setTitle('專案計畫','PROJECT STUDIO');
  const items=await api('listProjects');state.data.projects=items;
  const active=items.filter(x=>!['COMPLETED','ARCHIVED'].includes(x.status));
  const atRisk=active.filter(x=>String(x.health||'ON_TRACK')==='AT_RISK').length;
  const totalBudget=active.reduce((n,x)=>n+Number(x.budget||0),0);
  $('#content').innerHTML=`
    <section class="hero project-hero"><div><div class="eyebrow">REBORNNMENT PROJECT STUDIO</div><h3>把每一個專案，做成可追蹤的工作流程。</h3><p>目標、團隊、預算、里程碑、任務、風險與進度更新集中管理。</p></div><div class="meta"><span>${active.length} 個進行中</span><span>${atRisk} 個高風險</span></div></section>
    <div class="stats"><div class="stat"><span>進行中專案</span><strong>${active.length}</strong><small>不含已完成與封存</small></div><div class="stat"><span>高風險專案</span><strong>${atRisk}</strong><small>需要主管優先關注</small></div><div class="stat"><span>專案總預算</span><strong>${money(totalBudget)}</strong><small>目前開啟專案預算</small></div><div class="stat"><span>本月更新</span><strong>${items.filter(x=>String(x.updatedAt||'').slice(0,7)===new Date().toISOString().slice(0,7)).length}</strong><small>本月有異動的專案</small></div></div>
    <div class="toolbar"><input class="search" id="projectSearch" placeholder="搜尋專案、負責人、類型…"><select id="projectFilter" class="search" style="max-width:190px"><option value="">全部狀態</option>${['PLANNING','IN_PROGRESS','REVIEW','COMPLETED','AT_RISK'].map(v=>`<option value="${v}">${label(v)}</option>`).join('')}</select><div class="grow"></div>${P('projects.create')?'<button class="btn btn-primary" id="newProject">＋ 建立專案</button>':''}</div><div style="height:16px"></div><div class="cards" id="projectCards"></div>`;
  const draw=()=>{
    const q=$('#projectSearch').value.toLowerCase(),f=$('#projectFilter').value;
    const filtered=items.filter(x=>{
      const text=[x.name,x.ownerName,x.status,x.category,x.projectCode].join(' ').toLowerCase();
      const okF=!f||(f==='AT_RISK'?x.health==='AT_RISK':x.status===f);return text.includes(q)&&okF;
    });
    $('#projectCards').innerHTML=filtered.map(x=>{
      const p=projectProgress(x),risk=String(x.riskLevel||'LOW').toLowerCase();
      return `<article class="card project-card risk-${risk}"><i class="project-accent"></i><div class="meta"><span>${esc(x.projectCode)}</span><span>${esc(label(x.category||'INTERNAL'))}</span>${statusBadge(x.status)}</div><h4>${esc(x.name)}</h4><p>${esc(x.objective||x.description||'尚未設定專案目標')}</p><div class="project-kpis"><div class="mini-kpi"><span>負責人</span><strong>${esc(x.ownerName||'未指定')}</strong></div><div class="mini-kpi"><span>截止</span><strong>${date(x.dueDate)}</strong></div><div class="mini-kpi"><span>預算</span><strong>${money(x.budget)}</strong></div></div><div class="card-foot"><div style="flex:1"><div class="tiny muted" style="margin-bottom:6px">整體進度 ${p}%</div><div class="progress"><i style="width:${p}%"></i></div></div>${healthPill(x.health)}</div><div class="card-foot"><span class="tiny muted">${esc((x.teamNames||'').split(',').filter(Boolean).length)} 位成員 · ${esc(label(x.priority||'MEDIUM'))}優先</span><button class="btn btn-ghost btn-sm" data-project="${esc(x.id)}">進入專案</button></div></article>`;
    }).join('')||empty('目前沒有符合條件的專案');
    $$('[data-project]').forEach(b=>b.onclick=()=>openProjectDetail(items.find(x=>x.id===b.dataset.project)));
  };
  draw();$('#projectSearch').oninput=draw;$('#projectFilter').onchange=draw;if($('#newProject'))$('#newProject').onclick=()=>openProjectForm();
}
async function openProjectForm(x={}){
  const employees=await api('listEmployeesLite');
  const teamSet=new Set(String(x.teamEmployeeIds||'').split(',').filter(Boolean));
  modal(x.id?'編輯專案':'建立專案',`
    <div class="grid-2"><label class="field"><span>專案名稱</span><input name="name" value="${esc(x.name||'')}" required></label><label class="field"><span>專案代碼</span><input name="projectCode" value="${esc(x.projectCode||'')}" placeholder="WINTER-2026"></label><label class="field"><span>專案類型</span><select name="category">${options(['EVENT_PROJECT','MARKETING_PROJECT','SYSTEM_PROJECT','BRAND_PROJECT','INTERNAL'],x.category||'EVENT_PROJECT')}</select></label><label class="field"><span>優先度</span><select name="priority">${options(['LOW','MEDIUM','HIGH','URGENT'],x.priority||'MEDIUM')}</select></label><label class="field"><span>負責人</span><select name="ownerId"><option value="">由我負責</option>${employees.map(e=>`<option value="${esc(e.employeeId)}" ${x.ownerId===e.employeeId?'selected':''}>${esc(e.name)} · ${esc(e.jobTitle||'')}</option>`).join('')}</select></label><label class="field"><span>健康狀態</span><select name="health">${options(['ON_TRACK','WATCH','AT_RISK'],x.health||'ON_TRACK')}</select></label><label class="field"><span>開始日期</span><input type="date" name="startDate" value="${esc((x.startDate||'').slice(0,10))}"></label><label class="field"><span>截止日期</span><input type="date" name="dueDate" value="${esc((x.dueDate||'').slice(0,10))}"></label><label class="field"><span>預算</span><input type="number" name="budget" value="${esc(x.budget||0)}"></label><label class="field"><span>目前實際支出</span><input type="number" name="actualCost" value="${esc(x.actualCost||0)}"></label><label class="field"><span>進度計算</span><select name="progressMode">${options(['AUTO','MANUAL'],x.progressMode||'AUTO')}</select></label><label class="field"><span>手動進度 %</span><input type="number" min="0" max="100" name="progress" value="${esc(x.progress||0)}"></label><label class="field"><span>狀態</span><select name="status">${options(['DRAFT','PLANNING','IN_PROGRESS','REVIEW','COMPLETED','ARCHIVED'],x.status||'DRAFT')}</select></label><label class="field"><span>風險等級</span><select name="riskLevel">${options(['LOW','MEDIUM','HIGH','URGENT'],x.riskLevel||'LOW')}</select></label></div>

async function imageToPayload(f){
  if(!f.type.startsWith('image/'))return fileToPayload(f);
  const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});
  const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=data});
  const render=(max,q)=>{const scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)};
  const full=render(1200,.82),thumb=render(260,.72);
  return {name:(f.name.replace(/\.[^.]+$/,'')||'employee')+'.jpg',type:'image/jpeg',base64:full.split(',')[1],thumbDataUrl:thumb};
}
async function fileToPayload(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:f.name,type:f.type,base64:r.result.split(',')[1]});r.onerror=reject;r.readAsDataURL(f)})}
function openEmployee(x){const r=modal(`${x.name} · ${x.employeeId}`,`<div class="person">${avatarHtml(x,true)}<div><h3 style="margin:0">${esc(x.name)}</h3><div class="meta"><span>${esc(label(x.department))}</span><span>${esc(x.jobTitle)}</span>${statusBadge(x.status)}</div></div></div><div class="divider"></div><dl class="kv"><dt>電話</dt><dd>${esc(x.phone||'—')}</dd><dt>電子信箱</dt><dd>${esc(x.email||'—')}</dd><dt>人員類型</dt><dd>${esc(label(x.employeeType))}</dd><dt>到職日期</dt><dd>${date(x.startDate)}</dd><dt>報酬方式</dt><dd>${esc(label(x.payType))} · ${money(x.payRate)}</dd><dt>備註</dt><dd>${esc(x.note||'—')}</dd></dl>`,{onSave:null});const foot=$('.modal-foot',r);if(P('employees.edit'))foot.insertAdjacentHTML('beforeend','<button class="btn btn-ghost" data-edit>編輯</button>');if(P('documents.create'))foot.insertAdjacentHTML('beforeend','<button class="btn btn-primary" data-pdf>產生員工 PDF</button>');if($('[data-edit]',r))$('[data-edit]',r).onclick=()=>{r.remove();openEmployeeForm(x)};if($('[data-pdf]',r))$('[data-pdf]',r).onclick=async()=>{const d=await api('generateEmployeePdf',{id:x.id});toast('PDF 已建立');window.open(d.url,'_blank')}}

async function renderLeave(){setTitle('請假／排班申請','人事行政');const items=await api('listLeave');$('#content').innerHTML=`<div class="toolbar"><div class="muted small">正職、工讀皆可送出請假或無法排班申請。</div><div class="grow"></div>${P('leave.create')?'<button class="btn btn-primary" id="newLeave">＋ 新增申請</button>':''}</div><div style="height:14px"></div>${panel('申請紀錄',items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>員工</th><th>類型</th><th>期間</th><th>原因</th><th>狀態</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.employeeName)}</td><td>${esc(label(x.leaveType))}</td><td>${date(x.startDate)} → ${date(x.endDate)}</td><td>${esc(x.reason)}</td><td>${statusBadge(x.status)}</td><td>${P('leave.review')&&x.status==='PENDING'?`<button class="btn btn-ghost btn-sm" data-leave="${esc(x.id)}">審核</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:empty())}`;if($('#newLeave'))$('#newLeave').onclick=()=>modal('請假／無法排班申請',`<div class="grid-2"><label class="field"><span>類型</span><select name="leaveType">${options(['PERSONAL','SICK','EVENT_UNAVAILABLE','OTHER'],'PERSONAL')}</select></label><label class="field"><span>開始日</span><input name="startDate" type="date"></label><label class="field"><span>結束日</span><input name="endDate" type="date"></label></div><label class="field"><span>原因</span><textarea name="reason"></textarea></label>`,{onSave:async r=>{await api('saveLeave',formDataObj(r));toast('申請已送出');navigate('leave')}});$$('[data-leave]').forEach(b=>b.onclick=()=>reviewSimple('reviewLeave',b.dataset.leave,'請假',()=>navigate('leave')))}
async function reviewSimple(action,id,kind,done){const ok=confirm(`確定核准此${kind}申請？\n按「取消」將改為退回。`);const note=prompt('審核備註（可留白）')||'';await api(action,{id,status:ok?'APPROVED':'REJECTED',reviewNote:note});toast('審核已完成');done()}

async function renderExpenses(){setTitle('費用申請','財務管理');const items=await api('listExpenses');$('#content').innerHTML=`<div class="toolbar"><div class="muted small">採購、交通、賽事支出與代墊報銷都在這裡送審。</div><div class="grow"></div>${P('expenses.create')?'<button class="btn btn-primary" id="newExpense">＋ 費用申請</button>':''}</div><div style="height:14px"></div>${panel('費用紀錄',items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>申請人</th><th>用途</th><th>分類</th><th>金額</th><th>專案</th><th>狀態</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.employeeName)}</td><td>${esc(x.title)}</td><td>${esc(label(x.category))}</td><td>${money(x.amount)}</td><td>${esc(x.projectName||'—')}</td><td>${statusBadge(x.status)}</td><td>${P('expenses.review')&&x.status==='PENDING'?`<button class="btn btn-ghost btn-sm" data-exp="${esc(x.id)}">審核</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:empty())}`;if($('#newExpense'))$('#newExpense').onclick=async()=>{const p=await api('listProjects');modal('費用申請',`<div class="grid-2"><label class="field"><span>用途</span><input name="title"></label><label class="field"><span>分類</span><select name="category">${options(['EVENT','TRANSPORT','EQUIPMENT','DESIGN','MARKETING','OTHER'],'EVENT')}</select></label><label class="field"><span>金額</span><input name="amount" type="number"></label><label class="field"><span>專案</span><select name="projectId"><option value="">非專案</option>${p.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></label></div><label class="field"><span>說明</span><textarea name="description"></textarea></label>`,{onSave:async r=>{await api('saveExpense',formDataObj(r));toast('費用申請已送出');navigate('expenses')}})};$$('[data-exp]').forEach(b=>b.onclick=()=>reviewSimple('reviewExpense',b.dataset.exp,'費用',()=>navigate('expenses')))}

async function renderFinance(){
  setTitle('財務中心','財務與績效');
  let d;
  try{ d=await api('financeOverview'); }catch{ const [comp,perf]=await Promise.all([api('listCompensation'),P('performance.view')?api('listPerformance'):Promise.resolve([])]); d={compensation:comp,performance:perf,stats:{total:comp.reduce((s,x)=>s+Number(x.amount||0),0),pending:comp.filter(x=>x.status==='PENDING').reduce((s,x)=>s+Number(x.amount||0),0),paid:comp.filter(x=>x.status==='PAID').reduce((s,x)=>s+Number(x.amount||0),0),performanceBonus:comp.filter(x=>x.compType==='PERFORMANCE_BONUS').reduce((s,x)=>s+Number(x.amount||0),0)}}; }
  const items=d.compensation||[],perf=d.performance||[],s=d.stats||{};
  $('#content').innerHTML=`<div class="finance-hero"><div class="finance-summary"><div class="eyebrow">財務概況</div><div class="amount">${money(s.total||0)}</div><p>目前系統內薪資、勞務報酬與獎金紀錄總額。</p></div><div class="stats" style="margin:0;grid-template-columns:1fr 1fr"><div class="stat"><span>待付款</span><strong>${money(s.pending||0)}</strong><small>尚未標記付款</small></div><div class="stat"><span>績效獎金</span><strong>${money(s.performanceBonus||0)}</strong><small>個人績效獎勵</small></div></div></div>
  <div class="toolbar"><div class="muted small">統一管理薪資、賽事報酬、獎金與個人績效。</div><div class="grow"></div>${P('performance.create')?'<button class="btn btn-ghost" id="newPerformance">＋ 績效評核</button>':''}${P('compensation.create')?'<button class="btn btn-primary" id="newPay">＋ 新增薪資／報酬</button>':''}</div><div style="height:14px"></div>
  <div class="section-grid">${panel('薪資／勞務報酬',items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>員工</th><th>項目</th><th>期間／賽事</th><th>金額</th><th>付款日</th><th>狀態</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.employeeName)}</td><td>${esc(label(x.compType))}</td><td>${esc(x.reference||'—')}</td><td>${money(x.amount)}</td><td>${date(x.paidDate)}</td><td>${statusBadge(x.status,x.status==='PENDING'?'待付款':'')}</td></tr>`).join('')}</tbody></table></div>`:empty())}${panel('個人績效',perf.length?`<div class="stack">${perf.slice(0,12).map(x=>`<div class="task-card"><div class="card-foot" style="margin-top:0"><div><strong>${esc(x.employeeName)}</strong><div class="tiny muted">${esc(x.period||'未指定期間')}</div></div><div class="score-ring" style="--score:${Math.max(0,Math.min(100,Number(x.score||0)))}%"><strong>${esc(x.score||0)}</strong></div></div><p>${esc(x.criteria||'')}</p><div class="card-foot"><span class="badge yellow">獎金 ${money(x.bonusAmount)}</span>${statusBadge(x.status)}</div></div>`).join('')}</div>`:empty('尚無績效紀錄'))}</div>`;
  if($('#newPay'))$('#newPay').onclick=openCompensationForm;
  if($('#newPerformance'))$('#newPerformance').onclick=openPerformanceForm;
}
async function openCompensationForm(){const e=await api('listEmployeesLite');modal('新增薪資／勞務報酬',`<div class="grid-2"><label class="field"><span>員工</span><select name="employeeId">${e.map(x=>`<option value="${esc(x.employeeId)}">${esc(x.name)}</option>`).join('')}</select></label><label class="field"><span>類型</span><select name="compType">${options(['SALARY','EVENT_FEE','PERFORMANCE_BONUS','BONUS','REIMBURSEMENT','OTHER'],'EVENT_FEE')}</select></label><label class="field"><span>金額</span><input name="amount" type="number"></label><label class="field"><span>賽事／期間／說明</span><input name="reference"></label><label class="field"><span>狀態</span><select name="status"><option value="PENDING">待付款</option><option value="PAID">已付款</option></select></label><label class="field"><span>付款日</span><input name="paidDate" type="date"></label></div><label class="field"><span>備註</span><textarea name="note"></textarea></label>`,{saveText:'新增紀錄',onSave:async r=>{await api('saveCompensation',formDataObj(r));toast('報酬紀錄已建立');navigate('finance')}})}
async function openPerformanceForm(){const e=await api('listEmployeesLite');modal('新增個人績效評核',`<div class="grid-2"><label class="field"><span>員工</span><select name="employeeId">${e.map(x=>`<option value="${esc(x.employeeId)}">${esc(x.name)}</option>`).join('')}</select></label><label class="field"><span>評核期間</span><input name="period" placeholder="例如：2026 冬季盃／2026-09"></label><label class="field"><span>績效分數</span><input name="score" type="number" min="0" max="100" value="80"></label><label class="field"><span>績效獎金</span><input name="bonusAmount" type="number" min="0" value="0"></label><label class="field"><span>狀態</span><select name="status"><option value="CONFIRMED">確認</option><option value="DRAFT">草稿</option></select></label></div><label class="field"><span>評核依據</span><textarea name="criteria" placeholder="例如：準時率、執行品質、臨場處理、團隊協作…"></textarea></label><label class="field"><span>主管評語</span><textarea name="comment"></textarea></label><p class="small muted">若選擇「確認」且填寫績效獎金，系統會同步建立一筆「待付款」的績效獎金紀錄。</p>`,{saveText:'儲存績效',onSave:async r=>{await api('savePerformance',formDataObj(r));toast('績效評核已建立');navigate('finance')},wide:true})}

async function renderDocuments(){setTitle('文件中心','公司文件');const items=await api('listDocuments');$('#content').innerHTML=panel('已產生文件',items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>文件編號</th><th>名稱</th><th>類型</th><th>關聯對象</th><th>建立時間</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.documentCode)}</td><td>${esc(x.title)}</td><td>${esc(label(x.type))}</td><td>${esc(x.entityName||'—')}</td><td>${dt(x.createdAt)}</td><td><a class="btn btn-ghost btn-sm" target="_blank" href="${esc(x.url)}">開啟 PDF</a></td></tr>`).join('')}</tbody></table></div>`:empty('尚未產生文件'))}

async function renderSystems(){setTitle('控制台中心','內部系統入口');const items=await api('listSystemLinks');$('#content').innerHTML=`<div class="toolbar"><div class="muted small">依員工權限顯示可使用的內部控制台。</div><div class="grow"></div>${P('systems.edit')?'<button class="btn btn-primary" id="newSystem">＋ 新增系統</button>':''}</div><div style="height:14px"></div><div class="cards">${items.map(x=>`<a class="card link-card" target="_blank" href="${esc(x.url)}"><div class="meta"><span>${esc(label(x.category||'CONTROL'))}</span></div><h4>${esc(x.name)}</h4><p>${esc(x.description||'')}</p><div class="card-foot"><span class="tiny muted">授權入口</span><span>開啟</span></div></a>`).join('')||empty()}</div>`;if($('#newSystem'))$('#newSystem').onclick=()=>modal('新增控制台連結',`<div class="grid-2"><label class="field"><span>名稱</span><input name="name"></label><label class="field"><span>網址</span><input name="url"></label><label class="field"><span>分類</span><input name="category" value="CONTROL"></label><label class="field"><span>所需權限代碼</span><input name="requiredPermission" placeholder="systems.view"></label></div><label class="field"><span>說明</span><textarea name="description"></textarea></label>`,{onSave:async r=>{await api('saveSystemLink',formDataObj(r));toast('系統連結已新增');navigate('systems')}})}

async function renderVault(){setTitle('工作臺機密庫','機密資料');$('#content').innerHTML=`<section class="panel"><div class="panel-head"><h3>二次驗證</h3></div><div class="panel-body"><p class="muted small">查看工作臺帳密前，需要重新輸入目前登入帳號的密碼。每次解鎖與查看都會寫入操作紀錄。</p><div class="grid-2"><label class="field"><span>目前登入密碼</span><input id="reauthPwd" type="password"></label><div style="display:flex;align-items:end"><button class="btn btn-primary" id="unlockVault">解鎖機密庫</button></div></div><div id="vaultArea" style="margin-top:18px"></div></div></section>`;$('#unlockVault').onclick=async e=>{try{busy(e.currentTarget,true,'驗證中…');const d=await api('reauthVault',{password:$('#reauthPwd').value});const items=await api('getVault',{vaultToken:d.vaultToken},{fresh:true});$('#vaultArea').innerHTML=`<div class="cards">${items.map(x=>`<div class="card"><div class="meta"><span>內部系統</span></div><h4>${esc(x.label)}</h4><div class="secret">${esc(x.secret)}</div><div class="card-foot"><span class="tiny muted">${esc(x.note||'')}</span>${x.url?`<a class="btn btn-ghost btn-sm" target="_blank" href="${esc(x.url)}">前往控制台</a>`:''}</div></div>`).join('')}</div>`;toast('機密庫已解鎖')}catch(err){toast(err.message,'err')}finally{busy(e.currentTarget,false)}}}

async function renderAccounts(){setTitle('帳號與權限','存取控制');const items=await api('listUsers');$('#content').innerHTML=`<div class="toolbar"><div class="muted small">帳號不可自行註冊，只能由授權管理員建立。</div><div class="grow"></div>${P('accounts.create')?'<button class="btn btn-primary" id="newUser">＋ 建立員工帳號</button>':''}</div><div style="height:14px"></div>${panel('系統帳號',items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>帳號</th><th>員工</th><th>角色</th><th>狀態</th><th>最後登入</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.employeeName||x.employeeId)}</td><td>${esc(x.roleName||label(x.role))}</td><td>${statusBadge(x.status)}</td><td>${dt(x.lastLoginAt)}</td></tr>`).join('')}</tbody></table></div>`:empty())}`;if($('#newUser'))$('#newUser').onclick=async()=>{const [e,roles]=await Promise.all([api('listEmployeesLite'),api('listRoles')]);modal('建立員工帳號',`<div class="grid-2"><label class="field"><span>員工</span><select name="employeeId">${e.map(x=>`<option value="${esc(x.employeeId)}">${esc(x.name)} · ${esc(x.employeeId)}</option>`).join('')}</select></label><label class="field"><span>帳號</span><input name="username" placeholder="例如 RN26001"></label><label class="field"><span>角色</span><select name="role">${roles.map(x=>`<option value="${esc(x.role)}">${esc(x.name)}</option>`).join('')}</select></label><label class="field"><span>暫時密碼</span><input name="tempPassword" value="${esc(randomPassword())}"></label></div><p class="small muted">第一次登入後，員工應立即更換密碼。系統只儲存密碼雜湊，不保存原始登入密碼。</p>`,{saveText:'建立帳號',onSave:async r=>{await api('createUser',formDataObj(r));toast('員工帳號已建立');navigate('accounts')}})}}
function randomPassword(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';return Array.from({length:12},()=>chars[Math.floor(Math.random()*chars.length)]).join('')}

async function renderAudit(){setTitle('操作紀錄','系統稽核');const items=await api('listAudit');$('#content').innerHTML=panel('最近 300 筆操作',items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>時間</th><th>使用者</th><th>動作</th><th>目標</th><th>結果</th><th>備註</th></tr></thead><tbody>${items.map(x=>`<tr><td>${dt(x.createdAt)}</td><td>${esc(x.actorName||x.actorUserId)}</td><td>${esc(label(x.action))}</td><td>${esc(x.target||'—')}</td><td>${statusBadge(x.result)}</td><td>${esc(x.meta||'')}</td></tr>`).join('')}</tbody></table></div>`:empty())}

function forcePasswordChange(){const r=modal('第一次登入：設定新密碼',`<p class="small muted">這是第一次登入或管理員剛建立的帳號。請先更換暫時密碼再繼續使用。</p><label class="field"><span>目前暫時密碼</span><input type="password" name="currentPassword"></label><label class="field"><span>新密碼（至少 8 碼）</span><input type="password" name="newPassword"></label><label class="field"><span>再次輸入新密碼</span><input type="password" name="confirmPassword"></label>`,{saveText:'更新密碼',onSave:async root=>{const d=formDataObj(root);if(d.newPassword!==d.confirmPassword)throw new Error('兩次新密碼不一致');await api('changePassword',d);state.me.mustChangePassword=false;toast('密碼已更新')}});$$('[data-close]',r).forEach(b=>b.remove());r.onclick=()=>{}}
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(state.me&&p&&p!==state.page)navigate(p)});
boot();

  </script>
