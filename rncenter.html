<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<meta name="application-name" content="銳能中控台">
<meta name="apple-mobile-web-app-title" content="銳能中控台">
<title>銳能娛樂｜中央控制中心</title>
<link rel="manifest" href="rncenter.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="rn-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="rn-icon-192.png">
<link rel="apple-touch-icon" href="rn-apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000;--white:#fff;--bg:#f3f3f3;--line:#e2e2e2;--line-2:#c9c9c9;
  --ink:#000;--ink-2:#3d3d3d;--muted:#737373;--faint:#a6a6a6;--hover:#f6f6f6;--sel:#ededed;
  /* 銳能黃：主要按鈕、選中的選單、重點數字。config.js 可用 BRAND_COLOR 換色 */
  --brand:#FFD400;--brand-2:#F2C500;--brand-edge:#D9B000;--brand-soft:#FFF9DB;--brand-tint:#FFF1A8;
  --ok:#1e7b4a;--warn:#b26b00;--bad:#c4372b;--info:#2e64b0;
  --chart-in:#2a78d6;--chart-out:#eb6834;
  --side:232px;--top:64px;--r:6px;--r-lg:10px;
  --font:"Barlow","Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  --cond:"Barlow Condensed","Barlow","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.6;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body.no-scroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.35}
p{margin:0}
:focus-visible{outline:2px solid var(--black);outline-offset:2px}
.side :focus-visible,.tile:focus-visible,.band :focus-visible,.sign-now :focus-visible,.portal-top :focus-visible,.checkin :focus-visible{outline-color:var(--brand)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}.strong{font-weight:600}
.red{color:var(--bad)}.nowrap{white-space:nowrap}.right{text-align:right}.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* 頂部讀取線 */
.bar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--brand);z-index:200;opacity:0;transition:width .3s ease,opacity .2s}
.bar.on{opacity:1;width:70%;transition:width 8s cubic-bezier(.1,.6,.2,1),opacity .2s}

/* LOGO */
.logo{display:inline-grid;place-items:center;background:var(--black);border-radius:8px;overflow:hidden;flex:none;position:relative}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo b{display:none;color:#fff;font-family:var(--cond);font-weight:700;letter-spacing:.02em}
.logo.fallback img{display:none}.logo.fallback b{display:block}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--white);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover);border-color:#b5b5b5}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:var(--brand);border-color:var(--brand-edge);color:#000}
.btn-pri:hover{background:var(--brand-2);border-color:var(--brand-edge)}
.btn-dark{background:var(--black);border-color:var(--black);color:#fff}
.btn-dark:hover{background:#2b2b2b;border-color:#2b2b2b}
.btn-lg{height:44px;padding:0 20px;font-size:15px}
.btn-sm{height:30px;padding:0 10px;font-size:13px}
.btn-quiet{border-color:transparent;background:transparent}
.btn-quiet:hover{background:var(--sel);border-color:transparent}
.btn-bad{color:var(--bad)}
.btn-block{width:100%}
.btn .ico{width:16px;height:16px}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:var(--r);border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--sel)}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2);cursor:pointer;font-weight:500}
.link:hover{text-decoration-color:var(--black)}

/* 登入 */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-box{width:min(380px,100%)}
.login-brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.login-brand .logo{width:52px;height:52px;border-radius:12px}
.login-brand .logo b{font-size:20px}
.login-brand h1{font-size:22px}
.login-brand p{color:var(--muted);font-size:13px}
.login-card{background:var(--white);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:var(--r-lg);padding:24px;display:grid;gap:16px}
.login-foot{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.7}
.preview-note{background:var(--white);border:1px dashed var(--line-2);border-radius:var(--r);padding:10px 12px;font-size:12.5px;color:var(--ink-2);margin-bottom:16px}

/* 欄位 */
.f{display:grid;gap:6px;min-width:0}
.f>span{font-size:13px;font-weight:500;color:var(--ink-2)}
.f>span em{font-style:normal;color:var(--faint);font-weight:400;margin-left:6px}
.inp,.f input:not([type=checkbox]):not([type=radio]):not([type=file]),.f select,.f textarea{width:100%;height:38px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--white);outline:none;transition:border-color .12s,box-shadow .12s}
.f textarea{height:auto;min-height:96px;padding:9px 11px;resize:vertical;line-height:1.65}
.inp:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--black);box-shadow:0 0 0 3px rgba(0,0,0,.08)}
.f small{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px}
.span2{grid-column:span 2}
.form{display:grid;gap:16px}
.form-sec{font-size:13px;font-weight:700;padding-top:6px;border-top:1px solid var(--line);margin-top:4px;padding-top:16px}
.check{display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:14px;line-height:1.5}
.check input{width:16px;height:16px;margin:2px 0 0;accent-color:#000;flex:none}
.check small{display:block;color:var(--muted);font-size:12px}
select.inp{padding-right:28px}
.search{position:relative;min-width:0}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);width:16px;height:16px}
.search .inp,.f .search input.inp{padding-left:32px}
.search .ico{z-index:1;pointer-events:none}

/* 外框 */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--black);color:#fff;display:flex;flex-direction:column;z-index:30}
.side-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;text-decoration:none}
.side-brand .logo{width:38px;height:38px}
.side-brand .logo b{font-size:15px}
.side-brand strong{display:block;font-size:15px;line-height:1.3}
.side-brand span{display:block;font-size:12px;color:#8c8c8c}
.nav{flex:1;overflow:auto;padding:6px 10px 12px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.nav-g{font-size:12px;color:#707070;padding:16px 10px 6px}
.nav-i{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r);color:#b3b3b3;text-decoration:none;font-size:14px;font-weight:500;position:relative}
.nav-i:hover{color:#fff;background:#141414}
.nav-i.on{color:#fff;background:#1c1c1c}
.nav-i.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--brand)}
.nav-i .cnt{margin-left:auto;font-size:12px;font-weight:600;color:#000;background:var(--brand);border-radius:10px;padding:0 7px;line-height:18px}
.side-me{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid #1f1f1f;background:none;border-left:0;border-right:0;border-bottom:0;color:#fff;text-align:left;cursor:pointer;width:100%}
.side-me:hover{background:#0d0d0d}
.side-me strong{display:block;font-size:13.5px;line-height:1.3}
.side-me span{display:block;font-size:12px;color:#8c8c8c}
.side-me .av{--bgc:#262626;background:#262626;color:#ddd;display:inline-grid;font-size:calc(var(--s) * .36)}

.main{min-width:0;display:flex;flex-direction:column}
.top{height:var(--top);display:flex;align-items:center;gap:12px;padding:0 28px;background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-logo{display:none}
.top-title{min-width:0;flex:1;display:flex;align-items:center;gap:10px}
.top-title h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-back{display:inline-flex;align-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:13.5px;white-space:nowrap}
.top-back:hover{color:var(--ink)}
.top-act{display:flex;align-items:center;gap:8px}
.sync{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.sync.err{color:var(--warn)}
.sync .icon-btn{width:30px;height:30px}
.sync.spin .ico{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.view{padding:24px 28px 56px;width:100%;max-width:1360px}
.tabbar{display:none}

/* 版面元件 */
.box{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}
.box-h h2,.box-h h3{font-size:15px}
.box-h .muted{font-size:12.5px;font-weight:400}
.box-b{padding:16px 18px}
.box-empty{padding:28px 18px;color:var(--muted);font-size:13.5px}
.box-empty .btn{margin-top:10px}
.stack{display:grid;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
.cols-even{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1}
.toolbar .search{width:240px}
.hello{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hello h2{font-size:20px}
.hello span{color:var(--muted)}

/* 列表 */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);min-width:0;text-decoration:none;color:inherit}
.rows>.row:first-child{border-top:0}
button.row{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;font-size:inherit}
.rows>button.row:first-child{border-top:0}
a.row:hover,button.row:hover,.row.click:hover{background:var(--hover);cursor:pointer}
.row-main{flex:1;min-width:0}
.row-main strong,.row-t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12.5px;margin-top:1px}
.row-end{display:flex;align-items:center;gap:8px;flex:none}
.date-chip{width:50px;flex:none;text-align:center;border:1px solid var(--line);border-radius:var(--r);padding:3px 0 4px;line-height:1.15}
.date-chip b{display:block;font-family:var(--cond);font-size:21px;font-weight:600;line-height:1.1}
.date-chip span{display:block;font-size:11px;color:var(--muted)}
.date-chip.today{background:var(--black);border-color:var(--black);color:#fff}
.date-chip.today b{color:var(--brand)}
.date-chip.today span{color:#bdbdbd}

/* 表格 */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--white)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--hover)}
.tbl th.right,.tbl td.right{text-align:right}
.tbl .t-main{font-weight:600}
.tbl .t-sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who>div{min-width:0}
.who>div>strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who>div>span{display:block;font-size:12px;color:var(--muted)}
.who>div>strong em{font-style:normal;font-weight:400;color:var(--muted);margin-left:8px}

/* 狀態、標籤 */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.st-ok::before{background:var(--ok)}.st-bad::before{background:var(--bad)}.st-warn::before{background:var(--warn)}.st-info::before{background:var(--info)}
.st-bad{color:var(--bad)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--ink-2);white-space:nowrap;background:var(--white)}
.tag-dark{background:var(--black);border-color:var(--black);color:var(--brand)}
.tag-brand{background:var(--brand);border-color:var(--brand-edge);color:#000}
.tag-warn{border-color:#ecd3a8;color:var(--warn)}
.prog{height:4px;background:#e6e6e6;border-radius:2px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--black)}
.prog-row{display:flex;align-items:center;gap:8px}
.prog-row .prog{flex:1}
.prog-row span{font-size:12.5px;color:var(--ink-2);width:34px;text-align:right}
.avs{display:inline-flex}
.avs .av{margin-left:-6px;box-shadow:0 0 0 2px #fff}
.avs .av:first-child{margin-left:0}
.avs em{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px;align-self:center}

/* 頭像 */
.av{--s:28px;width:var(--s);height:var(--s);border-radius:50%;background:#e8e8e8;color:#3d3d3d;position:relative;overflow:hidden;display:inline-grid;place-items:center;flex:none;font-size:calc(var(--s) * .36);font-weight:600;line-height:1}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av i{font-style:normal}
button.av{border:0;padding:0;cursor:zoom-in}

/* 分段、頁籤 */
.seg{display:inline-flex;padding:2px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--white);flex:none}
.seg button{height:30px;padding:0 12px;border:0;border-radius:4px;background:none;font-size:13.5px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--black);color:var(--brand)}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:10px 0;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;box-shadow:inset 0 -2px transparent}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px var(--black)}
.tabs button i{font-style:normal;color:var(--faint);margin-left:4px;font-weight:400}

/* 數字列 */
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:16px}
.fig{padding:14px 18px;border-left:1px solid var(--line);min-width:0}
.fig:first-child{border-left:0}
.fig span{display:block;font-size:12.5px;color:var(--muted)}
.fig b{display:block;font-size:22px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig small{display:block;font-size:12px;color:var(--muted)}

/* 下一場賽事 */
.band{background:var(--black);color:#fff;border-radius:var(--r-lg);padding:22px 24px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center;margin-bottom:16px}
.band-count{display:flex;align-items:flex-end;gap:6px;padding-right:28px;border-right:1px solid #2a2a2a;min-width:120px}
.band-count b{font-family:var(--cond);font-size:72px;line-height:.82;font-weight:600;color:var(--brand)}
.band-count span{font-size:14px;color:#a6a6a6;padding-bottom:2px}
.band-count.today b{font-size:56px}
.band-main{min-width:0}
.band-main .band-type{font-size:13px;color:#a6a6a6}
.band-main h2{font-size:22px;margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band-meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:#cfcfcf;font-size:13.5px}
.band-side{display:grid;gap:10px;min-width:220px}
.band-side .prog{background:#2e2e2e}
.band-side .prog i{background:var(--brand)}
.band-side .prog-row span{color:#cfcfcf}
.band-side p{font-size:13px;color:#a6a6a6}
.band .btn{background:var(--brand);color:#000;border-color:var(--brand)}
.band .btn:hover{background:var(--brand-2)}
.band-empty{display:flex;align-items:center;justify-content:space-between;gap:16px}
.band-empty p{color:#bdbdbd}

/* 專案詳細 */
.p-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.p-head h2{font-size:24px}
.p-meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--muted);font-size:13.5px;margin-top:6px}
.p-meta b{color:var(--ink-2);font-weight:500}
.p-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.show-m{display:none!important}
.prose{white-space:pre-wrap;line-height:1.75;color:var(--ink-2)}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:9px 14px;margin:0}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;padding:10px 18px;align-items:start;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl-dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);margin-top:3px;display:grid;place-items:center;background:#fff;cursor:pointer;padding:0}
.tl-dot.done{background:var(--black);border-color:var(--black);color:#fff}
.tl-dot .ico{width:10px;height:10px;stroke-width:2.4}
.tl.done .tl-t{color:var(--muted);text-decoration:line-through}
.feed-i{padding:12px 18px;border-top:1px solid var(--line)}
.feed-i:first-child{border-top:0}
.feed-i header{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.feed-i header b{color:var(--ink);font-weight:600}

/* 任務看板 */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:#ebebeb;border-radius:var(--r-lg);padding:8px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 8px;font-size:13.5px;font-weight:600}
.col-h span{color:var(--muted);font-weight:500}
.col-list{display:grid;gap:8px}
.card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;text-align:left;width:100%;display:block}
.card:hover{border-color:var(--line-2)}
.card h4{font-size:14px;font-weight:600;line-height:1.45;margin-bottom:6px}
.card .row-sub{margin-top:0}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}
.col-empty{font-size:12.5px;color:var(--muted);padding:10px 6px}
.board-tabs{display:none}
.chk{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line-2);display:inline-grid;place-items:center;background:#fff;cursor:pointer;flex:none;padding:0}
.chk.on{background:var(--black);border-color:var(--black);color:#fff}
.chk .ico{width:12px;height:12px;stroke-width:2.4}
.chk:not(.on) .ico{opacity:0}
button.chk:not(.on):hover .ico{opacity:.35}
.task-done .row-t{color:var(--muted);text-decoration:line-through}

/* 行事曆 */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.cal-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cal-bar h2{font-size:18px;min-width:110px}
.cal{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-wd div{padding:8px 10px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.cal-d{min-height:112px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left;border-top:0;border-left:0;font-size:inherit}
.cal-d:nth-child(7n){border-right:0}
.cal-grid .cal-d:nth-last-child(-n+7){border-bottom:0}
.cal-d:hover{background:var(--hover)}
.cal-d.out{background:#fafafa;color:var(--faint)}
.cal-d.sel{box-shadow:inset 0 0 0 2px var(--black)}
.cal-n{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-size:13px;font-weight:500}
.cal-d.today .cal-n{background:var(--brand);color:#000;font-weight:700}
.cal-e{display:block;font-size:12px;line-height:1.35;padding:2px 5px;border-radius:3px;background:#f0f0f0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid #bdbdbd}
.cal-e.mine{border-left-color:var(--black);background:#e6e6e6;font-weight:600}
.cal-e.x{text-decoration:line-through;color:var(--faint)}
.cal-e time{color:var(--muted);margin-right:4px;font-weight:400}
.cal-more{font-size:11.5px;color:var(--muted);padding-left:5px}
.cal-dots{display:none;gap:3px;justify-content:center}
.cal-dots i{width:5px;height:5px;border-radius:50%;background:#9a9a9a}
.cal-dots i.mine{background:var(--black)}
.agenda-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.agenda-h h3{font-size:15px}
.ag{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font-size:inherit}
.ag:first-child{border-top:0}
.ag:hover{background:var(--hover)}
.ag time{font-weight:600;line-height:1.35}
.ag time small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.ag.x .ag-t{text-decoration:line-through;color:var(--muted)}

/* 排班詳細 */
.sch-head{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:grid;gap:10px}
.sch-head h3{font-size:18px}
.checkin{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--black);color:#fff;border-radius:var(--r-lg);padding:14px 16px}
.checkin p{font-size:13px;color:#bdbdbd}
.checkin strong{display:block;font-size:15px}
.checkin .btn{background:var(--brand);color:#000;border-color:var(--brand)}
.roster-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.roster-i:first-child{border-top:0}
.roster-i select{height:30px;font-size:13px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r);background:#fff}

/* 人員選擇 */
.picker{border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.picker-top{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--line);background:#fafafa;flex-wrap:wrap}
.picker-top .search{flex:1;min-width:140px}
.picker-top .inp{height:32px}
.picker-top .count{font-size:12.5px;color:var(--muted);white-space:nowrap}
.picker-list{max-height:280px;overflow:auto}
.pk{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);cursor:pointer}
.pk:first-child{border-top:0}
.pk:hover{background:var(--hover)}
.pk input[type=checkbox]{width:16px;height:16px;accent-color:#000;margin:0}
.pk-name{min-width:0}
.pk-name strong{display:block;font-weight:600;font-size:13.5px}
.pk-name>span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-role{width:110px;height:30px!important;font-size:13px}
.pk:not(.on) .pk-role{visibility:hidden}

/* 抽屜、對話框 */
.dw-wrap{position:fixed;inset:0;z-index:100}
.dw-mask{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;transition:opacity .18s}
.dw{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;display:flex;flex-direction:column;transform:translateX(24px);opacity:0;transition:transform .2s ease,opacity .2s ease;box-shadow:-12px 0 40px rgba(0,0,0,.12)}
.dw-wide{width:min(780px,100%)}
.dw-wrap.in .dw-mask{opacity:1}
.dw-wrap.in .dw{transform:none;opacity:1}
.dw-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px 0 22px;height:60px;border-bottom:1px solid var(--line);flex:none}
.dw-h h2{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dw-b{flex:1;overflow:auto;padding:20px 22px 28px;-webkit-overflow-scrolling:touch}
.dw-f{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 22px;border-top:1px solid var(--line);flex:none;background:#fff;flex-wrap:wrap}
.dw-f .grow{flex:1}
.dw-sec{margin-top:22px}
.dw-sec>h4{font-size:14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.dw-sec .rows{border:1px solid var(--line);border-radius:var(--r-lg)}
.dw-sec .row{padding:10px 14px}
.person-head{display:flex;align-items:center;gap:16px}
.person-head h3{font-size:20px}
.dlg-wrap{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.36)}
.dlg{width:min(420px,100%);background:#fff;border-radius:var(--r-lg);padding:22px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.dlg h3{font-size:17px}
.dlg p{color:var(--ink-2);line-height:1.7;white-space:pre-wrap}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.lightbox{position:fixed;inset:0;z-index:160;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:min(560px,100%);max-height:86vh;border-radius:8px;background:#222}
.lightbox p{color:#ddd}
.secret{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);margin-top:8px}
.secret code{font-family:var(--font);font-size:17px;font-weight:600;letter-spacing:.04em;overflow-wrap:anywhere}

/* 提示 */
.toasts{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:300;display:grid;gap:8px;justify-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--black);color:#fff;padding:10px 14px;border-left:3px solid var(--brand);border-radius:var(--r);font-size:13.5px;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.2);pointer-events:auto;animation:toast .18s ease}
.toast.err{background:#fff;color:var(--bad);border:1px solid #efc5c0}
@keyframes toast{from{transform:translateY(-6px);opacity:0}}
.note{border:1px solid var(--line);background:#fafafa;border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--ink-2);line-height:1.7}
.note.warn{border-color:#ecd3a8;background:#fdf8ef}
.loading{padding:60px 0;color:var(--muted);text-align:center}
.mail-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .av{--s:64px}
.photo-pick label{cursor:pointer}

/* ═════ V6：側欄分類（點分類才展開裡面的系統） ═════ */
.nav-home{margin:2px 0 8px}
.nav-cat{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:var(--r);color:#bdbdbd;text-decoration:none;font-size:14.5px;font-weight:600;position:relative;margin-top:2px}
.nav-cat:hover{color:#fff;background:#141414}
.nav-cat.on{color:#fff}
.nav-cat.on>.ico:first-child{color:var(--brand)}
.nav-cat .chev{width:14px;height:14px;margin-left:auto;color:#555;transition:transform .15s}
.nav-cat.open .chev{transform:rotate(90deg);color:#8c8c8c}
.nav-cat .cnt{margin-left:auto;font-size:12px;font-weight:600;color:#000;background:var(--brand);border-radius:10px;padding:0 7px;line-height:18px}
.nav-cat .cnt+.chev{margin-left:6px}
.nav-sub{display:grid;gap:1px;margin:2px 0 8px 19px;padding-left:10px;border-left:1px solid #262626}
.nav-sub .nav-i{padding:7px 10px;font-size:13.5px}
.nav-sub .nav-i.on::before{left:-11px}
.top-me{display:none;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.tabbar a{position:relative}
.tb-dot{position:absolute;top:5px;left:calc(50% + 5px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--brand);color:#000;font-size:10px;font-weight:700;font-style:normal;line-height:16px;text-align:center}

/* ═════ V6：大廳四大分類（四方格） ═════ */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.tile{position:relative;aspect-ratio:1/1;min-width:0;background:var(--black);color:#fff;border:2px solid var(--black);border-radius:14px;text-decoration:none;overflow:hidden;container-type:inline-size;transition:border-color .12s,transform .12s}
.tile:hover{border-color:var(--brand)}
.tile:active{transform:scale(.985)}
.tile-in{position:absolute;inset:0;display:flex;flex-direction:column;padding:20px;padding:8cqw}
.tile-ico{width:46px;height:46px;width:19cqw;height:19cqw;border-radius:11px;border-radius:4.6cqw;background:var(--brand);color:#000;display:grid;place-items:center;flex:none}
.tile-ico .ico{width:24px;height:24px;width:10.5cqw;height:10.5cqw;stroke-width:1.7}
.tile-badge{position:absolute;top:18px;right:18px;top:7.5cqw;right:7.5cqw;min-width:28px;height:28px;min-width:11cqw;height:11cqw;padding:0 9px;padding:0 3.4cqw;border-radius:99px;background:#fff;color:#000;font-weight:700;font-size:13px;font-size:max(11px,5.4cqw);display:grid;place-items:center}
.tile-name{margin-top:auto;font-size:32px;font-size:14cqw;font-weight:700;line-height:1.1;letter-spacing:.06em}
.tile-sub{margin-top:6px;font-size:12.5px;font-size:max(11px,5cqw);color:#9b9b9b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-stats{display:flex;gap:18px;gap:7cqw;margin-top:12px;margin-top:5cqw;padding-top:10px;padding-top:4.5cqw;border-top:1px solid #2b2b2b;min-width:0}
.tile-stats div{min-width:0}
.tile-stats b{display:block;font-family:var(--cond);font-size:24px;font-size:10cqw;font-weight:600;line-height:1.05;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-stats span{display:block;font-size:11.5px;font-size:max(10px,4.6cqw);color:#9b9b9b;white-space:nowrap;margin-top:2px}

/* ═════ V6：分類頁 ═════ */
.hub-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.hub-head .tile-ico{width:52px;height:52px;border-radius:12px}
.hub-head .tile-ico .ico{width:27px;height:27px}
.hub-head h2{font-size:24px;letter-spacing:.04em}
.hub-head p{color:var(--muted);font-size:13.5px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mod{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:16px;text-decoration:none;color:inherit;min-height:176px;transition:border-color .12s}
.mod:hover{border-color:var(--black)}
.mod-h{display:flex;align-items:flex-start;gap:12px}
.mod-ico{width:40px;height:40px;border-radius:10px;background:var(--black);color:var(--brand);display:grid;place-items:center;flex:none}
.mod-ico .ico{width:20px;height:20px}
.mod-h strong{display:block;font-size:16px;line-height:1.35}
.mod-h p{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.mod-figs{margin-top:auto;display:flex;gap:24px;flex-wrap:wrap}
.mod-figs b{display:inline-block;font-family:var(--cond);font-size:27px;font-weight:600;line-height:1.1;white-space:nowrap}
.mod-figs .hot b{background:var(--brand);padding:0 6px;border-radius:4px}
.mod-figs span{display:block;font-size:12px;color:var(--muted)}

/* ═════ V6：文件簽署 ═════ */
.doc-ico{width:34px;height:40px;border-radius:5px;border:1px solid var(--line-2);background:#fff;display:grid;place-items:center;color:var(--ink-2);flex:none}
.doc-ico .ico{width:17px;height:17px}
.doc-ico.done{background:var(--black);border-color:var(--black);color:var(--brand)}
.doc-ico.todo{background:var(--brand);border-color:var(--brand-edge);color:#000}
.row.todo{background:var(--brand-soft)}
a.row.todo:hover{background:#fff4c2}
.sign-now{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--black);color:#fff;border-radius:var(--r-lg);padding:16px 18px;margin-bottom:16px;flex-wrap:wrap;border-left:5px solid var(--brand)}
.sign-now strong{display:block;font-size:16px}
.sign-now p{font-size:13px;color:#bdbdbd}
.sign-now .acts{display:flex;gap:8px;flex-wrap:wrap}
.sign-now .btn{background:#1d1d1d;border-color:#363636;color:#fff}
.sign-now .btn:hover{background:#2a2a2a}
.sign-now .btn-pri{background:var(--brand);border-color:var(--brand);color:#000}
.sign-now .btn-pri:hover{background:var(--brand-2)}
.doc-content{font-size:15px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.signer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 18px;border-top:1px solid var(--line)}
.signer:first-child{border-top:0}
.signer.now{background:var(--brand-soft)}
.signer.gone{opacity:.6}
.signer .seq{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:12px;color:var(--muted);margin-top:4px;background:#fff}
.signer.done .seq{background:var(--black);border-color:var(--black);color:var(--brand)}
.signer .who{align-items:flex-start}
.signer .who>div>span{white-space:normal}
.sig-img{display:block;max-width:190px;max-height:70px;margin-top:8px;padding:4px 8px;background:#fff;border:1px solid var(--line);border-radius:6px}
.signer-acts{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.file-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:#fff;min-width:0}
.file-card .file-ext{width:40px;height:48px;border-radius:4px;background:var(--black);color:var(--brand);display:grid;place-items:center;font-family:var(--cond);font-size:13px;font-weight:700;flex:none}
.file-card .file-main{flex:1;min-width:0}
.file-card .file-main strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-card .file-main span{font-size:12px;color:var(--muted)}
.file-card .file-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ev{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:9px 18px;border-top:1px solid var(--line);font-size:13px;line-height:1.55}
.ev:first-child{border-top:0}
.ev time{color:var(--muted);font-size:12px;padding-top:1px}
.ev b{font-weight:600}
.sg-add{display:flex;gap:8px;flex-wrap:wrap}
.sg-add select{flex:1;min-width:200px}
.sg-list{list-style:none;margin:10px 0 0;padding:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.sg-i{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);background:#fff}
.sg-i:first-child{border-top:0}
.sg-n{width:22px;height:22px;border-radius:50%;background:var(--black);color:var(--brand);font-size:12px;font-weight:700;display:grid;place-items:center}
.sg-list:not(.seq) .sg-n{background:var(--sel);color:var(--muted)}
.sg-who{min-width:0}
.sg-who strong{display:block;font-size:13.5px}
.sg-who span{display:block;font-size:12px;color:var(--muted)}
.sg-acts{display:flex;gap:2px}
.sg-acts .icon-btn{width:30px;height:30px}
.sg-acts .icon-btn:disabled{opacity:.3;cursor:default}
.sg-empty{margin-top:10px;padding:14px;border:1px dashed var(--line-2);border-radius:var(--r-lg);color:var(--muted);font-size:13px}
.sig-saved{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-lg);background:#fafafa;flex-wrap:wrap}
.sig-saved img{height:44px;max-width:150px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.sig-saved div{flex:1;min-width:120px}
.sig-saved strong{display:block;font-size:13.5px}
.sig-saved span{font-size:12px;color:var(--muted)}

/* 表單裡的分段按鈕不要撐滿、檔案欄位樣式 */
.f>.seg,.form>.seg{justify-self:start}
.f input[type=file]{font-size:13px;color:var(--ink-2);max-width:100%}
.f input[type=file]::file-selector-button{height:32px;padding:0 12px;margin-right:10px;border:1px solid var(--line-2);border-radius:var(--r);background:#fff;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.f input[type=file]::file-selector-button:hover{background:var(--hover)}
.fig b em{font-style:normal}
.note .ico{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
.portal-on .toasts{top:calc(80px + env(safe-area-inset-top))}
/* V6.1：新版本提示列、下載電腦版 */
.upd{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:260;display:flex;align-items:center;gap:10px;background:var(--brand);color:#000;border:1px solid var(--brand-edge);border-radius:12px;padding:8px 8px 8px 14px;box-shadow:0 12px 32px rgba(0,0,0,.22);font-size:14px;max-width:calc(100% - 32px);animation:toast .18s ease}
.upd>span{display:flex;align-items:center;gap:8px;min-width:0}
.upd>span .ico{width:18px;height:18px;flex:none}
.upd .icon-btn{width:32px;height:32px;color:#000}
.upd .icon-btn:hover{background:rgba(0,0,0,.08)}
.login-dl{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink)}
.login-dl .ico{width:15px;height:15px}
/* V7：隊伍與分組 */
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em}
.link-btn{background:none;border:0;padding:0;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer}
.inp-sm{height:30px;font-size:13px;padding:0 8px}
.gtag{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;margin-right:6px;border-radius:4px;font-size:11.5px;font-weight:700;line-height:1;vertical-align:1px;background:#e9e9e9;color:#222;font-style:normal}
.gtag.g-A{background:var(--brand);color:#000}.gtag.g-B{background:#1c7ed6;color:#fff}.gtag.g-C{background:#2f9e44;color:#fff}.gtag.g-D{background:#7048e8;color:#fff}
.seed{display:inline-flex;vertical-align:-2px;margin-right:4px;color:#e8a400}.seed .ico{width:14px;height:14px;fill:currentColor;stroke:currentColor}
.grps{display:grid;gap:16px;margin-bottom:16px}.grps.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.grps.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.grps.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grp{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0;overflow:hidden}
.grp-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.grp-h .gtag{min-width:28px;height:24px;font-size:14px}
.grp-list{display:flex;flex-direction:column;gap:6px;padding:10px}
.grp-list.loose{flex-direction:row;flex-wrap:wrap}.grp-list.loose .tchip{width:auto;min-width:180px;flex:1 1 200px;max-width:280px}
.tchip{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;align-items:center;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left;cursor:pointer;font:inherit}
.tchip:hover{border-color:var(--line-2);background:var(--hover)}
.tchip-no{grid-row:1/3;min-width:30px;height:30px;display:grid;place-items:center;border-radius:6px;background:#f1f1f1;font-weight:700;font-size:12.5px;color:var(--ink-2)}
.tchip-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tchip-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1em}
.tchip.x{opacity:.55}.tchip.x .tchip-name{text-decoration:line-through}
.tchip.pop{animation:tpop .32s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes tpop{from{opacity:0;transform:translateY(-8px) scale(.94);background:var(--brand-soft)}to{opacity:1;transform:none}}
.draw-note{margin-top:12px;font-size:12.5px;color:var(--muted)}
.draw-note b{color:var(--ink)}
.reveal-h{display:flex;gap:24px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px;background:#0d0d0d;color:#fff;border-radius:var(--r-lg)}
.reveal-h div{display:flex;flex-direction:column}.reveal-h .muted{color:#9a9a9a!important}.reveal-h b{font-size:17px}.reveal-h .mono{color:var(--brand)}
.dw .grps{gap:10px}.dw .grps.g3,.dw .grps.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.draw-res{display:grid;gap:6px;font-size:13px}.draw-res div{display:flex;gap:6px;align-items:baseline}
tr.x td{color:var(--faint)}tr.x .t-main{text-decoration:line-through}
/* 賽程 */
.flow{display:flex;align-items:stretch;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.flow-i{flex:1 0 150px;max-width:260px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:11px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.flow-i.on{border-color:var(--black)}.flow-i.done{background:#fafafa}
.flow-k{font-size:11.5px;color:var(--muted)}.flow-i b{font-size:15px}.flow-i>span{font-size:12.5px;color:var(--ink-2)}
.flow-champ{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-weight:600;color:#000!important;background:var(--brand);border-radius:4px;padding:1px 7px;align-self:flex-start}
.flow-champ .ico{width:14px;height:14px}
.flow-arrow{align-self:center;color:var(--faint);flex:none}
.stg-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stg-k{font-size:12px;color:var(--muted)}.stg-h h3{font-size:17px;margin:2px 0 4px}
.stg-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stg-res{display:grid;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.stg-res>div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stg .tbl-wrap+.stg-res{border-top:1px solid var(--line)}
.lbl{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;background:#ececec;color:var(--ink-2);margin-right:2px}.lbl.ok{background:#e3f4e9;color:var(--ok)}
.rchip{display:inline-flex;align-items:center;gap:2px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff}
.rchip em{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}
.rchip.ok{border-color:#bfe3cc;background:#f2fbf5}.rchip.out{color:var(--muted);background:#fafafa}
.rchip .gtag{min-width:18px;height:17px;font-size:10.5px;margin-right:4px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffbe6,#fff)}
.pod{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;display:flex;flex-direction:column;min-width:0}
.pod span{font-size:12px;color:var(--muted)}.pod b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pod em{font-style:normal;font-size:12.5px;color:var(--ink-2)}
.pod.p1{border-color:var(--brand-edge);background:var(--brand-soft)}.pod.p1 span{color:#7a6300;font-weight:700}
.mtbl .gtag{margin-right:3px}
.tpick-tools{display:flex;gap:6px;flex-wrap:wrap}
.tpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;max-height:300px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:#fafafa}
.tp{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:13.5px;min-width:0}
.tp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp input{accent-color:#000;width:15px;height:15px;flex:none}.tp.on{border-color:var(--black);background:var(--brand-soft)}
.gpick{display:flex;gap:18px;flex-wrap:wrap}
.res-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:12px;padding:10px 12px;background:#fafafa;border:1px solid var(--line);border-radius:var(--r)}
.res-tools .grow{flex:1}
.res-tbl td{padding-top:7px;padding-bottom:7px}
.seg-sm button{height:26px;padding:0 9px;font-size:12.5px}
/* 撥款 */
.pay-who{display:flex;align-items:center;gap:12px;margin-bottom:14px}.pay-who strong{display:block;font-size:16px}.pay-who span{font-size:12.5px;color:var(--muted)}
.pay-tbl input[type=checkbox]{width:16px;height:16px;accent-color:#000}
.pay-total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;margin:12px 0 16px;border-radius:var(--r);background:#0d0d0d;color:#fff}
.pay-total b{font-size:22px;color:var(--brand);font-variant-numeric:tabular-nums}
.pay-doc h4{display:flex;align-items:center;gap:6px}
.dw-f .btn-pri{white-space:nowrap}
/* 印章 */
.seal-maker{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start}
.seal-prev{width:150px;height:150px;border:1px solid var(--line);border-radius:var(--r-lg);display:grid;place-items:center;background:repeating-conic-gradient(#f4f4f4 0 25%,#fff 0 50%) 0 0/16px 16px}
.seal-prev img{width:128px;height:128px;object-fit:contain}
.seal-wait{font-size:12.5px;color:var(--muted)}
.seal-opts{display:grid;gap:10px;min-width:0}
.seal-row{display:flex;gap:8px;flex-wrap:wrap}
.seal-up{align-self:flex-start;cursor:pointer}.seal-up-hint{display:block;margin-top:-4px}
.seal-cur{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-lg);background:#fafafa;margin-top:14px;flex-wrap:wrap}
.seal-cur img{width:64px;height:64px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
.seal-cur div{flex:1;min-width:120px}.seal-cur strong{display:block;font-size:13.5px}.seal-cur span{font-size:12px;color:var(--muted)}
.seal-choices{display:flex;gap:8px;flex-wrap:wrap}
.seal-ch{display:flex;flex-direction:column;align-items:center;gap:6px;width:116px;padding:10px 8px;border:1px solid var(--line-2);border-radius:var(--r-lg);background:#fff;cursor:pointer;font:inherit;font-size:12.5px}
.seal-ch img{width:64px;height:64px;object-fit:contain}
.seal-ch-new{width:64px;height:64px;display:grid;place-items:center;border:1.5px dashed var(--line-2);border-radius:8px;color:var(--muted)}
.seal-ch.on{border-color:var(--black);box-shadow:0 0 0 1px var(--black);background:var(--brand-soft)}
.sig-wrap{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}.sig-wrap .sig-img{margin-top:0}
.seal-img{width:62px;height:62px;object-fit:contain;padding:3px;background:#fff;border:1px solid var(--line);border-radius:6px}
.sg-i{grid-template-columns:auto auto minmax(0,1fr) 130px auto}
.sg-role{height:32px;font-size:13px}
.note.handoff{border-color:var(--brand-edge);background:var(--brand-soft);color:#000}
/* 快速搜尋 */
.top-search{display:none}
.qs-wrap{align-items:start;padding-top:12vh}
.qs{width:min(620px,100%);background:#fff;border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,.28);overflow:hidden;display:flex;flex-direction:column;max-height:72vh}
.qs-in{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.qs-in .inp{border:0;box-shadow:none;height:36px;font-size:16px;padding:0;flex:1;outline:none}
.qs-in .inp:focus{box-shadow:none}
kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;font:600 11px/1 var(--font);color:var(--ink-2);background:#fafafa;margin-right:3px}
.qs-list{overflow:auto;padding:6px}
.qs-g{font-size:11.5px;font-weight:600;color:var(--muted);padding:8px 10px 4px}
.qs-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;font:inherit}
.qs-i.on{background:var(--brand-soft)}
.qs-i span{min-width:0;display:flex;flex-direction:column}.qs-i strong{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qs-i small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs-empty{padding:28px;text-align:center;color:var(--muted)}
.qs-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);align-items:center}.qs-foot .grow{flex:1}
/* 行事曆 V7 */
.cal-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}
.cal-filters .grow{flex:1}
.chip-t{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border:1px solid var(--line-2);border-radius:999px;background:#fff;font:inherit;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip-t .ico{width:14px;height:14px}.chip-t.on{background:var(--black);border-color:var(--black);color:var(--brand)}.chip-t.on .ico{fill:var(--brand)}
.layers{display:flex;gap:4px;flex-wrap:wrap}
.lyr{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:12.5px;color:var(--faint);cursor:pointer}
.lyr i{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.3}
.lyr.on{color:var(--ink);border-color:var(--line-2)}.lyr.on i{opacity:1}
.cal-e{border-left:3px solid var(--c,#bdbdbd);background:#f3f3f3;background:color-mix(in srgb,var(--c,#bdbdbd) 13%,#fff);font-weight:500}
.cal-e.mine{background:color-mix(in srgb,var(--c,#bdbdbd) 24%,#fff);font-weight:600;border-left-color:var(--c,#000)}
.cal-e.dim,.ce.dim{opacity:.6}
.cal-e.imp{font-weight:700}
.imp-m{font-style:normal;font-weight:800;color:#e8590c;margin-right:3px}.imp-m.crit{color:var(--bad)}
.ce{display:grid;gap:1px;width:100%;padding:8px 10px 8px 12px;border:1px solid var(--line);border-left:4px solid var(--c,#999);border-radius:6px;background:#fff;background:color-mix(in srgb,var(--c,#999) 6%,#fff);text-align:left;cursor:pointer;font:inherit;min-width:0}
.ce:hover{background:color-mix(in srgb,var(--c,#999) 14%,#fff)}
.ce-t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.ce-t em{font-style:normal;margin-left:6px;padding:0 5px;border-radius:3px;background:var(--c);color:#fff;font-size:11px}
.ce.k-match .ce-t em{background:#f76707}.ce-n{font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.ce-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ce-av{margin-top:4px}
.ce.x .ce-n{text-decoration:line-through;color:var(--muted)}.ce.imp{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,#999) 40%,transparent)}
.ag-list{display:grid;gap:8px;padding:12px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wk-d{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);min-height:340px;display:flex;flex-direction:column;min-width:0;position:relative}
.wk-d.today{border-color:var(--black)}.wk-d.sel{box-shadow:0 0 0 1px var(--black)}
.wk-h{display:flex;align-items:baseline;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px;color:var(--muted)}
.wk-h b{font-size:18px;color:var(--ink)}.wk-d.today .wk-h b{background:var(--brand);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:15px}
.wk-list{display:grid;gap:6px;padding:8px;align-content:start;flex:1}
.wk-list .ce{padding:6px 7px 6px 9px}.wk-list .ce-s,.wk-list .ce-av{display:none}
.wk-empty{font-size:12px;color:var(--faint);text-align:center;padding:8px 0}
.wk-add{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s}
.wk-d:hover .wk-add,.wk-add:focus{opacity:1}.wk-add .ico{width:14px;height:14px}
.cal-list{padding:4px 0}
.cl-day{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:12px 18px;border-top:1px solid var(--line)}.cl-day:first-child{border-top:0}
.cl-items{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sch-head{border-left:4px solid var(--c,#999);padding-left:12px}
.sch-dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.tag-crit{background:var(--bad);border-color:var(--bad);color:#fff}
.sch-look{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:var(--c);box-shadow:0 0 0 1px var(--line-2);cursor:pointer;padding:0;position:relative}
.sw.on{box-shadow:0 0 0 2px var(--black)}
.sw.auto{background:repeating-linear-gradient(45deg,#eee 0 4px,#fff 0 8px);font:700 11px/1 var(--font);color:var(--ink-2);display:grid;place-items:center}
.sw.custom{background:conic-gradient(#e03131,#f76707,#ffd400,#2f9e44,#1c7ed6,#7048e8,#d6336c,#e03131);overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.rep{display:flex;align-items:center;gap:8px}.rep select.inp{flex:1 1 auto;min-width:120px;width:auto}.rep input.inp{flex:0 0 84px;width:84px}
/* 簽名板 */
.sigpad{border:1px solid var(--line-2);border-radius:var(--r-lg);background:#fff;overflow:hidden}
.sigpad-tools{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:#fafafa;flex-wrap:wrap}
.sigpad-tools .grow{flex:1}
.sigpad-tools .lbl{font-size:12.5px;color:var(--muted)}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-2);cursor:pointer;padding:0}
.swatch.on{box-shadow:0 0 0 2px var(--black)}
.seg-sm button{height:26px;padding:0 10px;font-size:12.5px}
.sigpad-area{position:relative;height:220px;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.sigpad-area canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.sigpad-line{position:absolute;left:28px;right:28px;bottom:54px;border-bottom:1.5px solid #d5d5d5;pointer-events:none}
.sigpad-x{position:absolute;left:28px;bottom:58px;font-size:20px;line-height:1;color:#c2c2c2;pointer-events:none}
.sigpad-hint{position:absolute;left:0;right:0;top:38%;text-align:center;color:var(--faint);font-size:14px;pointer-events:none}
.sigpad.has .sigpad-hint{display:none}
.sigpad-note{padding:6px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:#fafafa}

/* ═════ V6：收支 ═════ */
.led-period{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.led-period h2{font-size:18px;min-width:118px}
.amt-in{color:var(--ok)}
.tbl tr.void td{color:var(--faint);text-decoration:line-through}
.tbl tr.void td .st,.tbl tr.void td .tag{text-decoration:none}
.led-sum{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:10px 18px;border-bottom:1px solid var(--line)}
.led-sum b{color:var(--ink);font-weight:600}
.chart-box{position:relative;padding:8px 14px 14px}
.chart-legend{display:flex;gap:16px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart-svg{display:block;width:100%;overflow:visible}
.chart-svg .grid{stroke:#ececec;stroke-width:1}
.chart-svg .axis{stroke:#cfcfcf;stroke-width:1}
.chart-svg text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart-svg .hit{fill:transparent;cursor:default}
.chart-svg g.col:hover .hit,.chart-svg g.col:focus .hit{fill:rgba(0,0,0,.035)}
.chart-svg g.col:focus{outline:none}
.chart-tip{position:absolute;z-index:5;pointer-events:none;background:#fff;border:1px solid var(--line-2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:9px 11px;font-size:12.5px;min-width:168px}
.chart-tip strong{display:block;margin-bottom:4px}
.chart-tip div{display:flex;align-items:center;gap:8px;justify-content:space-between}
.chart-tip div span{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.chart-tip div i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chart-tip div b{font-weight:600}
.chart-tip .net{border-top:1px solid var(--line);margin-top:5px;padding-top:5px}
.cbars{display:grid;gap:12px;padding:14px 18px}
.cbar-t{display:flex;align-items:baseline;gap:8px;font-size:13px}
.cbar-t span{flex:1;min-width:0}
.cbar-t b{font-weight:600}
.cbar-t em{font-style:normal;color:var(--muted);font-size:12px;width:38px;text-align:right}
.cbar-bar{height:8px;margin-top:5px;border-radius:0 4px 4px 0}
.acc-row{display:flex;justify-content:space-between;gap:12px;padding:11px 18px;border-top:1px solid var(--line)}
.acc-row:first-child{border-top:0}

/* ═════ V6：信件連結簽署頁（不用登入） ═════ */
.portal{min-height:100vh;background:var(--bg)}
.portal-top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--black);color:#fff;border-bottom:4px solid var(--brand);position:sticky;top:0;z-index:20}
.portal-top .logo{width:36px;height:36px}
.portal-top strong{display:block;font-size:15px;line-height:1.3}

<script src="config.js?v=6.0"></script>
<script>
/* 預覽模式：config.js 沒有 API_URL 時使用的範例資料（正式上線不會用到） */
const Mock=(()=>{
  const pad=n=>String(n).padStart(2,'0');
  const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
  const iso=(n,h=12,m=0)=>{const d=new Date();d.setDate(d.getDate()+n);d.setHours(h,m,0,0);return d.toISOString()};
  const atIso=(date,time,addMin=0)=>{const [y,mo,d]=date.split('-').map(Number);const [h,mi]=time.split(':').map(Number);return new Date(y,mo-1,d,h,mi+addMin).toISOString()};
  const now=()=>new Date().toISOString();
  const uid=p=>p+'_'+Math.random().toString(36).slice(2,10);
  const clone=o=>JSON.parse(JSON.stringify(o));
  const photo=(bg,fg)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 80 80"><rect width="80" height="80" fill="${bg}"/><circle cx="40" cy="31" r="14" fill="${fg}"/><path d="M12 80c2-17 13-25 28-25s26 8 28 25z" fill="${fg}"/></svg>`);
  const ME='RN-ADMIN-001';
  let db=null,audit=[];
  const emp=id=>db.employees.find(e=>e.employeeId===id);
  const proj=id=>db.projects.find(p=>p.id===id);
  const meUser=()=>({id:'usr1',employeeId:ME,username:'admin',role:'SUPER_ADMIN',roleName:'最高管理員',name:emp(ME).name,status:'ACTIVE',permissions:['*'],mustChangePassword:false,photoThumb:emp(ME).photoThumb});
  const log=(action,meta='')=>audit.unshift({id:uid('aud'),createdAt:now(),actorUserId:'usr1',actorName:emp(ME).name,action,target:'',result:'SUCCESS',meta});

  // ── V6 預覽用：簽名圖、文件簽署流程、收支 ──
  const sigImg=seed=>{try{const c=document.createElement('canvas');c.width=360;c.height=110;const g=c.getContext('2d');let s=seed*7919+13;const r=()=>(s=(s*9301+49297)%233280)/233280;g.strokeStyle=seed%3===0?'#1d3f9e':'#111';g.lineWidth=3.2;g.lineCap='round';g.lineJoin='round';g.beginPath();let x=24,y=62;g.moveTo(x,y);for(let i=0;i<6;i++){const nx=x+34+r()*18,ny=30+r()*52;g.bezierCurveTo(x+14,y-36*r(),nx-14,ny+36*r(),nx,ny);x=nx;y=ny}g.stroke();g.lineWidth=2.2;g.beginPath();g.moveTo(40,92);g.quadraticCurveTo(170,78+r()*16,320,86);g.stroke();return c.toDataURL('image/png')}catch(e){return ''}};
  const demoPdf=btoa('%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 300 144]>>endobj\ntrailer<</Root 1 0 R>>\n%%EOF');
  const sv=d=>{const o=Object.assign({},d);o.excerpt=String(o.content||'').replace(/\s+/g,' ').slice(0,120);delete o.content;delete o.attachData;o.hasAttachment=!!d.attachName;o.hasSignedPdf=d.status==='COMPLETED';return o};
  const stv=s=>{const o=Object.assign({},s);o.previewToken=s.token;delete o.token;return o};
  const lv=x=>{const o=Object.assign({},x);delete o.receiptData;delete o.receiptType;return o};
  const sSteps=id=>db.signSteps.filter(s=>s.docId===id).sort((a,b)=>a.seq-b.seq||String(a.createdAt).localeCompare(String(b.createdAt)));
  const sEv=(docId,stepId,actor,action,detail)=>db.signEvents.push({id:uid('sev'),docId,stepId:stepId||'',createdAt:now(),actorName:actor,action,detail:detail||''});
  const sState=id=>({doc:sv(db.signDocs.find(d=>d.id===id)),steps:sSteps(id).map(stv)});
  const sDoc=id=>{const d=db.signDocs.find(x=>x.id===id);if(!d)throw new Error('找不到這份文件。');return d};
  function sAdvance(doc){
    let q=0;const live=sSteps(doc.id).filter(s=>!['TRANSFERRED','CANCELLED'].includes(s.status));
    if(live.length&&live.every(s=>s.status==='SIGNED')){doc.status='COMPLETED';doc.completedAt=now();sEv(doc.id,'','系統','COMPLETE','所有簽署人都已簽署，已產生簽署完成 PDF');q+=queue([...new Set([doc.issuerId,...live.map(s=>s.employeeId)])],{kind:'SIGN',subject:'【銳能】文件已完成簽署：'+doc.title}).queued}
    else if(doc.flow==='SEQUENTIAL'&&!live.some(s=>s.status==='PENDING')){const n=live.find(s=>s.status==='WAITING');if(n){n.status='PENDING';n.notifiedAt=now();q+=queue([n.employeeId],{kind:'SIGN',subject:'【銳能】請簽署文件：'+doc.title}).queued}}
    doc.updatedAt=now();return q;
  }
  function sSign(doc,s,p,channel){
    if(doc.status!=='PENDING')throw new Error('這份文件已經不在簽署中。');if(!p.agree)throw new Error('請先勾選「我已閱讀並同意這份文件的內容」。');if(!/^data:image\/png;base64,/.test(p.signature||''))throw new Error('簽名沒有收到或格式不正確，請重新簽一次。');
    let sk='';if(doc.sealMode==='SEAL'){if(p.sealKind==='ORG'){need(channel==='APP','你沒有使用公司印章的權限。');need(db.seals.org,'還沒有設定公司印章，請管理員先在「我的帳號 → 公司印章」設定。');db.stepSeals[s.id]=db.seals.org;sk='ORG'}else{need(/^data:image\/png;base64,/.test(p.seal||''),'這份文件需要簽名並蓋章，請先選擇或產生印章。');db.stepSeals[s.id]=p.seal;sk='PERSONAL';if(p.rememberSeal&&channel==='APP')db.seals.mine=p.seal}}
    db.signatures[s.id]=p.signature;Object.assign(s,{status:'SIGNED',signedAt:now(),channel,signNote:p.note||'',viewedAt:s.viewedAt||now(),updatedAt:now(),sealKind:sk,handoff:false});sEv(doc.id,s.id,s.name,'SIGN',({LINK:'透過信件連結簽署',IN_PERSON:'在發文者的裝置上當面簽署',APP:'在中控台簽署'}[channel]||'簽署')+(sk==='ORG'?'，蓋公司章':sk?'，蓋個人章':''));return sAdvance(doc);
  }
  function sReject(doc,s,reason,actor){
    if(doc.status!=='PENDING')throw new Error('這份文件已經不在簽署中。');if(!String(reason||'').trim())throw new Error('請填寫退回原因，發文者才知道要怎麼修改。');
    Object.assign(s,{status:'REJECTED',rejectReason:reason,updatedAt:now()});sSteps(doc.id).forEach(x=>{if(x!==s&&['PENDING','WAITING'].includes(x.status))x.status='CANCELLED'});Object.assign(doc,{status:'REJECTED',closedReason:s.name+' 退回：'+reason,updatedAt:now()});sEv(doc.id,s.id,actor,'REJECT',reason);
    return queue([doc.issuerId].filter(x=>x!==s.employeeId),{kind:'SIGN',subject:'【銳能】文件被退回：'+doc.title}).queued;
  }
  function sTransfer(doc,s,toId,note,actor){
    if(doc.status!=='PENDING')throw new Error('這份文件已經不在簽署中。');if(!['PENDING','WAITING'].includes(s.status))throw new Error('這個簽署步驟已經處理過，不能轉交。');
    const e=emp(toId);if(!e||e.status!=='ACTIVE')throw new Error('請選擇一位在職的人員。');if(!e.email&&!e.hasAccount)throw new Error(e.name+' 沒有信箱也沒有中控台帳號，無法簽署。');
    if(sSteps(doc.id).some(x=>x.employeeId===toId&&['PENDING','WAITING','SIGNED'].includes(x.status)))throw new Error(e.name+' 已經在這份文件的簽署名單裡。');
    const ns={id:uid('sst'),docId:doc.id,seq:s.seq,employeeId:toId,name:e.name,status:s.status,viewedAt:'',signedAt:'',signNote:'',channel:'',transferredFrom:s.id,transferredTo:'',transferNote:note||'',rejectReason:'',notifiedAt:now(),createdAt:now(),updatedAt:now(),hasEmail:!!e.email};ns.token=('pv'+ns.id).replace(/[^A-Za-z0-9]/g,'');db.signSteps.push(ns);
    Object.assign(s,{status:'TRANSFERRED',transferredTo:ns.id,transferNote:note||'',updatedAt:now()});doc.updatedAt=now();sEv(doc.id,s.id,actor,'TRANSFER',s.name+' 轉交給 '+e.name+(note?'：'+note:''));
    return (ns.status==='PENDING'?queue([toId],{kind:'SIGN',subject:'【銳能】文件轉交給你簽署：'+doc.title}).queued:0)+queue([doc.issuerId].filter(x=>x!==ME&&x!==toId),{kind:'SIGN',subject:'【銳能】文件已轉交：'+doc.title}).queued;

async function api(action,payload={}){

    if(PREVIEW)return await Mock.call(action,payload,S.token);

    catch(e){throw new Error('連線失敗，請檢查網路後再試一次。')}

/* ═════════════ 桌面版與自動更新 ═════════════
 * 桌面版（ZIP 安裝的捷徑、Mac App，或從瀏覽器「安裝」的 App）開的都是網站上的 rncenter.html，網站一更新就是新版。
 * 打開 2.5 秒後、之後每 10 分鐘、以及切換視窗時，會讀網站上的 rncenter.html 比對 APP_BUILD：
 * 剛打開還沒操作、或視窗在背景（而且沒有打到一半的內容）就直接更新；其他時候顯示「有新版本」提示列。
 */
const UPD={last:0,found:'',dismissed:'',timer:0,touched:0,installEvt:null,zipOk:null};
const pageUrl=()=>location.href.split('#')[0].split('?')[0];
const onWeb=()=>/^https?:$/.test(location.protocol);
const isAppWindow=()=>sGet('rn_desktop')==='1'||(!!window.matchMedia&&['standalone','minimal-ui','window-controls-overlay'].some(m=>matchMedia(`(display-mode: ${m})`).matches));
const isDesktopOS=()=>/Windows NT|Macintosh/.test(navigator.userAgent)&&!(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
const zipUrl=()=>String(C.DESKTOP_ZIP||'');
function sGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function sSet(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}
const verParts=v=>String(v).split('.').map(n=>parseInt(n,10)||0);
function isNewer(a,b){const x=verParts(a),y=verParts(b);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0}return false}
/* 有開著的表單、對話框，或輸入框裡有改過還沒送出的內容 */
function hasDraft(){
  if(S.drawer||S.portal||$('.dlg-wrap')||$('.lightbox'))return true;
  return $$('input,textarea').some(el=>!el.closest('[hidden]')&&!/^(hidden|checkbox|radio|file|button|submit)$/.test(el.type)&&el.value!==el.defaultValue);
}
async function checkUpdate(manual=false){
  if(!onWeb()){if(manual)toast('這個頁面是從本機檔案開啟的，沒辦法檢查更新。','err');return}
  if(S.portal&&!manual)return;
  UPD.last=Date.now();
  let v='';
  try{
    const r=await fetch(pageUrl(),{cache:'no-cache'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const m=(await r.text()).match(/const APP_BUILD='(\d[^']*)'/);v=m?m[1]:'';
  }catch(e){if(manual)toast('沒辦法連到網站檢查更新，請確認網路後再試。','err');return}
  if(!v||!isNewer(v,APP_BUILD)){UPD.found='';$('#updBar')?.remove();if(manual)toast(`已經是最新版本（${APP_BUILD}）`);return}
  UPD.found=v;
  // 剛打開還沒操作、或視窗在背景，而且沒有打到一半的內容：直接更新。
  // 同一個版本只自動更新一次，避免網站快取還沒換新時一直重新載入。
  const quiet=document.visibilityState==='hidden'||!UPD.touched;
  if(!manual&&quiet&&!hasDraft()&&sGet('rn_upd_auto')!==v){sSet('rn_upd_auto',v);applyUpdate();return}
  if(manual||UPD.dismissed!==v)showUpdateBar(v);
}
function applyUpdate(){
  sSet('rn_upd_from',APP_BUILD);
  const u=new URL(location.href);u.searchParams.set('v',(UPD.found||'new')+'-'+Date.now().toString(36));
  location.replace(u.href);
}
function showUpdateBar(v){
  let el=$('#updBar');
  if(!el){el=document.createElement('div');el.id='updBar';el.className='upd';el.setAttribute('role','status');document.body.appendChild(el)}
  el.innerHTML=`<span>${icon('upgrade')}<span>中控台有新版本 <b>${esc(v)}</b></span></span><button class="btn btn-sm btn-dark" data-upd>立即更新</button><button class="icon-btn" data-upd-x aria-label="稍後再說">${icon('x')}</button>`;
  $('[data-upd]',el).onclick=applyUpdate;
  $('[data-upd-x]',el).onclick=()=>{UPD.dismissed=v;el.remove()};
}
function startUpdateChecks(){
  if(UPD.timer||!onWeb())return;
  ['pointerdown','keydown'].forEach(t=>document.addEventListener(t,()=>{UPD.touched=Date.now()},true));
  UPD.timer=setInterval(()=>checkUpdate(),10*60*1000);
  setTimeout(()=>checkUpdate(),2500);
  document.addEventListener('visibilitychange',()=>{if(Date.now()-UPD.last>3*60*1000)checkUpdate()});
}
/* 網址上的 ?v=（更新用）和 ?desktop=1（桌面版捷徑）用完就拿掉，其他參數（例如 ?sign=）保留 */
function cleanUrl(){
  const q=new URLSearchParams(location.search);
  if(q.has('desktop'))sSet('rn_desktop','1');
  if(!q.has('v')&&!q.has('desktop'))return;
  q.delete('v');q.delete('desktop');const s=q.toString();
  try{history.replaceState(null,'',pageUrl()+(s?'?'+s:'')+location.hash)}catch(e){}
}
function noteUpdated(){
  const from=sGet('rn_upd_from');if(from===null)return;sSet('rn_upd_from',null);
  if(from===APP_BUILD)return;
  const say=()=>setTimeout(()=>toast(`已更新到新版本 ${APP_BUILD}`),500);
  if(document.visibilityState!=='hidden')return say();
  const on=()=>{if(document.visibilityState!=='hidden'){document.removeEventListener('visibilitychange',on);say()}};
  document.addEventListener('visibilitychange',on);
}
async function desktopZipReady(){
  if(UPD.zipOk!==null)return UPD.zipOk;
  if(!zipUrl()||!onWeb()||isAppWindow()||!isDesktopOS())return UPD.zipOk=false;
  try{const r=await fetch(zipUrl(),{method:'HEAD',cache:'no-cache'});UPD.zipOk=r.ok&&!/text\/html/i.test(r.headers.get('content-type')||'')}catch(e){UPD.zipOk=false}

function compact(n){n=Math.round(num(n));const a=Math.abs(n);if(a>=1e8)return (n/1e8).toFixed(a>=1e9?0:1).replace(/\.0$/,'')+'億';if(a>=1e4)return (n/1e4).toFixed(a>=1e5?0:1).replace(/\.0$/,'')+'萬';return n.toLocaleString('zh-TW')}

function settlement(p){
  const shifts=S.db.schedules.filter(s=>s.projectId===p.id&&s.status!=='CANCELLED'),map=new Map();
  shifts.forEach(s=>{const roles=schRoles(s);schIds(s).forEach(eid=>{const r=map.get(eid)||{eid,assigned:0,present:0,late:0,absent:0,hours:0,days:new Set(),roles:new Set()};r.assigned++;if(roles[eid])r.roles.add(roles[eid]);const c=checkinOf(s.id,eid);
    if(c&&['ON_TIME','LATE'].includes(c.attendanceStatus)&&c.checkInAt){r.present++;if(c.attendanceStatus==='LATE')r.late++;const plan=(at(s.endDate||s.startDate,s.endTime)-at(s.startDate,s.startTime))/36e5;let h=c.checkOutAt?(new Date(c.checkOutAt)-new Date(c.checkInAt))/36e5:plan;if(!(h>0)||h>24)h=plan;r.hours+=Math.max(0,h);r.days.add(ymd(s.startDate))}
    else if(c&&c.attendanceStatus==='ABSENT')r.absent++;map.set(eid,r)})});
  const settled=new Map();S.db.compensation.filter(c=>c.projectId===p.id&&c.compType==='EVENT_FEE'&&c.status!=='CANCELLED').forEach(c=>settled.set(c.employeeId,(settled.get(c.employeeId)||0)+num(c.amount)));
  return [...map.values()].map(r=>{const e=emp(r.eid)||{name:r.eid,employeeId:r.eid},rate=num(e.payRate),hrs=Math.round(r.hours*2)/2;let amount=0,rule='';
    switch(e.payType){case 'HOURLY':amount=Math.round(rate*hrs);rule=`${money(rate)} × ${hrs} 小時`;break;case 'DAILY':amount=rate*r.days.size;rule=`${money(rate)} × ${r.days.size} 天`;break;case 'ONE_TIME':amount=r.present?rate:0;rule='單次勞務';break;case 'MONTHLY':amount=0;rule='月薪人員，不另計';break;default:amount=rate*r.present;rule=`${money(rate)} × ${r.present} 場`}
    return Object.assign(r,{e,amount,rule,hours:hrs,settled:settled.get(r.eid)||0})}).sort((a,b)=>b.present-a.present||byName(a.e,b.e));
}
function settleHtml(p){
  const rows=settlement(p),key='settle_'+p.id;
  if(!S.ui[key]){const picks={},amts={};rows.forEach(r=>{picks[r.eid]=!r.settled&&r.amount>0;amts[r.eid]=r.amount});S.ui[key]={picks,amts}}
  const stt=S.ui[key];rows.forEach(r=>{if(!(r.eid in stt.amts)){stt.amts[r.eid]=r.amount;stt.picks[r.eid]=!r.settled&&r.amount>0}});
  if(!rows.length)return box('賽事結算',empty('這個專案的排程還沒有排班人員。先在「排班」新增排程並排入人員，簽到後就能在這裡結算。'));
  const body=rows.map(r=>`<tr><td><input type="checkbox" data-settle-pick="${esc(r.eid)}" ${stt.picks[r.eid]?'checked':''} ${r.settled?'':''} aria-label="選取 ${esc(r.e.name)}" style="width:16px;height:16px;accent-color:#000"></td><td class="cell-main"><div class="who">${avatar(r.e,30)}<div><strong>${esc(r.e.name)}</strong><span>${esc([...r.roles].join('、')||r.e.jobTitle||'')}</span></div></div></td><td data-label="出勤">${r.present}/${r.assigned} 場${r.late?`，遲到 ${r.late}`:''}${r.absent?`，<span class="red">缺席 ${r.absent}</span>`:''}${r.hours?`<span class="t-sub">${r.hours} 小時</span>`:''}</td><td data-label="計算方式" class="small">${esc(r.rule)}</td><td data-label="結算金額" class="right"><input class="inp num" data-settle-amt="${esc(r.eid)}" type="number" min="0" step="10" value="${esc(stt.amts[r.eid])}" style="width:110px;height:32px;text-align:right"></td><td data-label="狀態">${r.settled?st('PAID',`已結算 ${money(r.settled)}`):'<span class="muted small">尚未結算</span>'}</td></tr>`).join('');
  return `<div class="note" style="margin-bottom:14px">依排班與簽到紀錄試算：按場次以出席場數計、時薪以簽到到簽退的時數計（未簽退以排定時間計）、日薪以出席天數計。金額可以直接修改，確認後會建立「待付款」報酬，付款後到「報酬」頁標記。</div>
  <section class="box"><div class="tbl-wrap"><table class="tbl tbl-cards"><thead><tr><th style="width:36px"></th><th>人員</th><th>出勤</th><th>計算方式</th><th class="right">結算金額</th><th>狀態</th></tr></thead><tbody>${body}</tbody></table></div>
  <div class="dw-f" style="border-radius:0 0 10px 10px"><span id="settleSum" class="strong"></span><span class="grow"></span><button class="btn btn-pri" data-act="settle" data-pid="${esc(p.id)}">建立待付款報酬</button></div></section>`;
}
function settleSum(pid){const stt=S.ui['settle_'+pid];if(!stt)return;const ids=Object.keys(stt.picks).filter(k=>stt.picks[k]);const total=ids.reduce((s,k)=>s+num(stt.amts[k]),0);const el=$('#settleSum');if(el)el.textContent=`已選 ${ids.length} 人，合計 ${money(total)}`}

function settleNow(pid){
  const p=proj(pid),stt=S.ui['settle_'+pid];if(!p||!stt)return;
  const rows=settlement(p);const items=rows.filter(r=>stt.picks[r.eid]&&num(stt.amts[r.eid])>0).map(r=>({employeeId:r.eid,amount:num(stt.amts[r.eid]),note:r.rule}));
  if(!items.length){toast('請勾選要結算的人員，並確認金額大於 0。','err');return}
  const dup=items.filter(i=>rows.find(r=>r.eid===i.employeeId)?.settled);
  ask({title:'建立待付款報酬',text:`將為 ${items.length} 位人員建立「${p.name} 勞務報酬」，合計 ${money(items.reduce((s,i)=>s+i.amount,0))}。${dup.length?`\n其中 ${dup.length} 位已經結算過，系統會略過。`:''}`,ok:'建立'}).then(async r=>{if(!r)return;
    try{await save('settleProject',{projectId:pid,items},d=>{d.created.forEach(c=>upsert('compensation',c));delete S.ui['settle_'+pid]},d=>`已建立 ${d.created.length} 筆待付款報酬${d.skipped.length?`，略過 ${d.skipped.length} 位`:''}`)}catch(e){toast(e.message,'err')}});
}

function drawReveal(root,draw){

}

/* ═════════════ 賽事專案：賽程階段、場次、晉級淘汰 ═════════════ */
const STAGE_L={PENDING:'未開始',ONGOING:'進行中',DONE:'已結束'};
const MATCH_L={SCHEDULED:'未開始',DONE:'已結束',CANCELLED:'取消'};
const stageSt=s=>st(s.status==='DONE'?'DONE':s.status==='ONGOING'?'IN_PROGRESS':'OFF',STAGE_L[s.status]||'未開始');
function rankStage(s){const res=stageRes(s);return stageIds(s).map(id=>({id,t:team(id),pts:res[id]?.pts,res:res[id]?.res||''})).filter(x=>x.pts!==''&&x.pts!=null).sort((a,b)=>num(b.pts)-num(a.pts))}
function bracketTab(p){
  const edit=P('projects.edit'),stages=stagesOf(p.id),loose=matchesOf(p.id,'');
  const tools=edit?`<div class="toolbar"><span class="small muted">把賽事分成幾個階段，每個階段排場次，結束後記錄晉級與淘汰。</span><span class="grow"></span><button class="btn" data-act="newMatch" data-pid="${esc(p.id)}">${icon('plus')}<span class="btn-label">新增場次</span></button><button class="btn btn-pri" data-act="newStage" data-pid="${esc(p.id)}">${icon('plus')}<span class="btn-label">新增階段</span></button></div>`:'';
  if(!stages.length&&!loose.length)return tools+box('賽程',empty('例如：小組賽（ABC 三組輪流）→ 決賽。每個階段可以一次排好多場，比完後填積分、標記哪些隊伍晉級或淘汰，晉級的隊伍可以直接帶到下一階段。',edit?`<button class="btn" data-act="newStage" data-pid="${esc(p.id)}">新增第一個階段</button>`:''));

}
function stageFlow(stages){
  return `<div class="flow">${stages.map((s,i)=>{const ids=stageIds(s),res=stageRes(s),adv=ids.filter(id=>res[id]?.res==='ADVANCE').length,last=i===stages.length-1,top=last&&s.status==='DONE'?rankStage(s)[0]:null;return `${i?`<span class="flow-arrow">${icon('right')}</span>`:''}<div class="flow-i ${s.status==='DONE'?'done':s.status==='ONGOING'?'on':''}"><span class="flow-k">第 ${i+1} 階段</span><b>${esc(s.name)}</b><span>${ids.length} 隊${adv?` → 晉級 ${adv}`:num(s.advanceCount)?` → 取 ${num(s.advanceCount)}`:''}</span>${top&&top.t?`<span class="flow-champ">${icon('trophy')}${esc(top.t.name)}</span>`:''}</div>`}).join('')}</div>`;
}
function stageCard(p,s,i,stages,edit){
  const ids=stageIds(s),res=stageRes(s),ms=matchesOf(p.id,s.id),adv=ids.filter(id=>res[id]?.res==='ADVANCE'),eli=ids.filter(id=>res[id]?.res==='ELIMINATE'),pend=ids.length-adv.length-eli.length,last=i===stages.length-1;
  const byPts=(a,b)=>num(res[b]?.pts)-num(res[a]?.pts);
  const chip=(id,cls)=>{const t=team(id),r=res[id]||{};return `<span class="rchip ${cls}">${t?gTag(t.groupName,t.drawNo||''):''}${esc(t?t.name:'(已刪除的隊伍)')}${r.pts!==''&&r.pts!=null?`<em>${esc(r.pts)} 分</em>`:''}</span>`};
  const ranked=last&&s.status==='DONE'?rankStage(s):[];
  const podium=ranked.length>=1?`<div class="podium">${ranked.slice(0,3).map((x,k)=>`<div class="pod p${k+1}"><span>${['冠軍','亞軍','季軍'][k]}</span><b>${esc(x.t?x.t.name:'(已刪除)')}</b><em>${esc(x.pts)} 分</em></div>`).join('')}</div>`:'';
  const resHtml=adv.length||eli.length?`<div class="stg-res">${adv.length?`<div><span class="lbl ok">晉級 ${adv.length}</span>${adv.sort(byPts).map(id=>chip(id,'ok')).join('')}</div>`:''}${eli.length?`<div><span class="lbl">淘汰 ${eli.length}</span>${eli.sort(byPts).map(id=>chip(id,'out')).join('')}</div>`:''}${pend?`<div class="small muted">還有 ${pend} 隊待定</div>`:''}</div>`:ids.length?`<div class="stg-res"><div class="small muted">${edit?'比完後按「登錄結果」，填積分並標記晉級或淘汰。':'還沒有登錄結果。'}</div></div>`:`<div class="stg-res"><div class="small muted">這個階段還沒有選參賽隊伍。</div></div>`;
  return `<section class="box stg"><div class="stg-h"><div><div class="stg-k">第 ${i+1} 階段</div><h3>${esc(s.name)}</h3><div class="row-sub"><span>${ids.length} 隊參賽</span>${num(s.advanceCount)?`<span>晉級名額 ${num(s.advanceCount)}</span>`:''}<span>${ms.length} 場</span>${s.note?`<span>${esc(s.note)}</span>`:''}</div></div><div class="stg-acts">${stageSt(s)}${edit?`<button class="btn btn-sm" data-act="stageResults" data-id="${esc(s.id)}">${icon('flag')}登錄結果</button><button class="btn btn-sm" data-act="newMatches" data-pid="${esc(p.id)}" data-sid="${esc(s.id)}">${icon('plus')}排場次</button><button class="icon-btn" data-act="editStage" data-id="${esc(s.id)}" aria-label="編輯階段" title="編輯階段">${icon('pen')}</button>`:''}</div></div>${podium}${ms.length?matchTable(ms,edit):''}${resHtml}</section>`;

function ledgerMonths(per){
  const t=todayYmd().slice(0,7);
  const end=per.mode==='month'?per.key:per.mode==='year'?(per.key===t.slice(0,4)?t:per.key+'-12'):t;
  const cl=S.db.ledger.filter(x=>x.status==='CLEARED'),out=[];
  for(let i=11;i>=0;i--){const ym=ymShift(end,-i),m=cl.filter(x=>String(x.entryDate).slice(0,7)===ym);out.push({ym,inc:sumKind(m,'INCOME'),exp:sumKind(m,'EXPENSE')})}
  return out;
}
function catBars(list,kind){

}
