function niceStep(max,count=4){const raw=max/count,mag=Math.pow(10,Math.floor(Math.log10(raw||1))),n=raw/mag;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag}
function axisLabel(v,big){if(!v)return '0';return big?(v/1e4).toLocaleString('zh-TW',{maximumFractionDigits:1})+'萬':Math.round(v).toLocaleString('zh-TW')}
function mountLedgerChart(){
  const el=$('#ledChart');if(!el||!S.ledMonths)return;
  if(S.ledRO){S.ledRO.disconnect();S.ledRO=null}
  const draw=()=>{
    const months=S.ledMonths,W=Math.max(280,el.clientWidth),H=W<480?220:250,ml=W<480?40:52,mr=8,mt=14,mb=26,iw=W-ml-mr,ih=H-mt-mb;
    const max=Math.max(1,...months.map(m=>Math.max(m.inc,m.exp))),step=niceStep(max),top=Math.max(step,Math.ceil(max/step)*step),big=top>=1e4;
    const y=v=>mt+ih-(v/top)*ih,band=iw/months.length,bw=Math.max(3,Math.min(18,(band-8)/2));
    const bar=(x,v,fill)=>{const h=(v/top)*ih;if(h<.5)return '';const yy=mt+ih-h,r=Math.min(4,h,bw/2);return `<path d="M${x},${mt+ih}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+bw-r}Q${x+bw},${yy} ${x+bw},${yy+r}V${mt+ih}Z" fill="${fill}"/>`};
    let grid='';for(let v=0;v<=top+1e-9;v+=step){grid+=`<line class="grid" x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml-6}" y="${y(v)+4}" text-anchor="end">${axisLabel(v,big)}</text>`}
    const every=W<480?2:1;
    const cols=months.map((m,i)=>{const cx=ml+band*i+band/2;return `<g class="col" data-i="${i}" tabindex="0" role="img" aria-label="${m.ym.slice(0,4)} 年 ${Number(m.ym.slice(5))} 月，收入 ${money(m.inc)}，支出 ${money(m.exp)}"><rect class="hit" x="${ml+band*i}" y="${mt}" width="${band}" height="${ih}"/>${bar(cx-bw-1,m.inc,'var(--chart-in)')}${bar(cx+1,m.exp,'var(--chart-out)')}${i%every===(months.length-1)%every?`<text x="${cx}" y="${H-8}" text-anchor="middle">${Number(m.ym.slice(5))}月</text>`:''}</g>`}).join('');
    el.innerHTML=`<svg class="chart-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${grid}<line class="axis" x1="${ml}" x2="${W-mr}" y1="${mt+ih}" y2="${mt+ih}"/>${cols}</svg><div class="chart-tip" hidden></div>`;
    const tip=$('.chart-tip',el);
    const show=g=>{const i=+g.dataset.i,m=months[i],cx=ml+band*i+band/2;tip.innerHTML=`<strong>${m.ym.slice(0,4)} 年 ${Number(m.ym.slice(5))} 月</strong><div><span><i style="background:var(--chart-in)"></i>收入</span><b>${money(m.inc)}</b></div><div><span><i style="background:var(--chart-out)"></i>支出</span><b>${money(m.exp)}</b></div><div class="net"><span>淨額</span><b class="${m.inc-m.exp<0?'red':''}">${netText(m.inc-m.exp)}</b></div>`;tip.hidden=false;const tw=tip.offsetWidth;let left=cx+12;if(left+tw>W)left=cx-tw-12;tip.style.left=Math.max(0,left)+'px';tip.style.top=Math.max(0,y(Math.max(m.inc,m.exp))-20)+'px'};
    $$('g.col',el).forEach(g=>{g.addEventListener('pointerenter',()=>show(g));g.addEventListener('focus',()=>show(g));g.addEventListener('pointerleave',()=>tip.hidden=true);g.addEventListener('blur',()=>tip.hidden=true)});
  };
  draw();
  let lastW=el.clientWidth;
  if(window.ResizeObserver){S.ledRO=new ResizeObserver(()=>{if(Math.abs(el.clientWidth-lastW)>4){lastW=el.clientWidth;draw()}});S.ledRO.observe(el)}
}

    const el=e.target;
    if(el.dataset.model){S.ui[el.dataset.model]=el.value;if(el.tagName!=='SELECT'){clearTimeout(S.mt);S.mt=setTimeout(render,140)}return}
    if(el.hasAttribute('data-pk-search')){const pk=el.closest('.picker'),q=el.value.trim().toLowerCase();$$('.pk',pk).forEach(r=>r.hidden=!!q&&!r.dataset.text.includes(q));return}
    if(el.dataset.settleAmt){const pid=S.page==='projects'&&S.arg;const stt=S.ui['settle_'+pid];if(stt){stt.amts[el.dataset.settleAmt]=num(el.value);settleSum(pid)}}
  });
  document.addEventListener('change',e=>{
    const el=e.target;
    if(el.hasAttribute('data-paysel')||el.hasAttribute('data-payall')){const sel=new Set(S.ui.paySel||[]);if(el.hasAttribute('data-payall'))$$('[data-paysel]').forEach(c=>{c.checked=el.checked;el.checked?sel.add(c.dataset.paysel):sel.delete(c.dataset.paysel)});else{el.checked?sel.add(el.dataset.paysel):sel.delete(el.dataset.paysel);const all=$('[data-payall]');if(all)all.checked=$$('[data-paysel]').every(c=>c.checked)}S.ui.paySel=[...sel];const b=$('[data-act="payMany"]');if(b){b.disabled=!sel.size;const l=$('[data-paylabel]',b);if(l)l.textContent=`一次付清（${sel.size} 人）`}return}
    if(el.dataset.model&&el.tagName==='SELECT'){S.ui[el.dataset.model]=el.value;render();return}
    if(el.type==='checkbox'&&el.closest('.pk')){el.closest('.pk').classList.toggle('on',el.checked);pickerCount(el.closest('.picker'));if(el.checked){const ri=$('.pk-role',el.closest('.pk'));if(ri&&window.innerWidth>760)ri.focus()}return}
    if(el.dataset.settlePick){const pid=S.arg;const stt=S.ui['settle_'+pid];if(stt){stt.picks[el.dataset.settlePick]=el.checked;settleSum(pid)}}
    if(el.hasAttribute('data-led-void')){S.ui.lv=el.checked;render();return}
    if(el.dataset.imp){const sel=S.ui.limp||(S.ui.limp=new Set());el.checked?sel.add(el.dataset.imp):sel.delete(el.dataset.imp);const all=$('[data-imp-all]');if(all)all.checked=$$('[data-imp]').every(c=>c.checked);const t=$('#impSum');if(t)t.textContent=impSumText();return}
    if(el.hasAttribute('data-imp-all')){const sel=S.ui.limp||(S.ui.limp=new Set());$$('[data-imp]').forEach(c=>{c.checked=el.checked;el.checked?sel.add(c.dataset.imp):sel.delete(c.dataset.imp)});const t=$('#impSum');if(t)t.textContent=impSumText();return}
    if(el.hasAttribute('data-imp-account')){S.ui.limpAcc=el.value;return}
  });
  document.addEventListener('click',e=>{const b=e.target.closest('[data-pk-clear]');if(!b)return;const pk=b.closest('.picker');$$('.pk input[type=checkbox]',pk).forEach(c=>{c.checked=false;c.closest('.pk').classList.remove('on')});pickerCount(pk)});
  document.addEventListener('focusout',()=>{if(S.dirty)setTimeout(()=>{if(S.dirty&&!isTyping())render()},150)});
  window.addEventListener('hashchange',route);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.token&&Date.now()-S.syncedAt>120000)sync()});
  setInterval(()=>{if(document.visibilityState==='visible'&&S.token&&Date.now()-S.syncedAt>300000)sync()},60000);
  $('#sideMe').onclick=meDrawer;$('#topMe').onclick=meDrawer;$('#topSearch').onclick=quickSearch;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();UPD.installEvt=e});
  window.addEventListener('appinstalled',()=>{UPD.installEvt=null;toast('已安裝到這台電腦，之後可以從開始選單或 Dock 打開')});
  $('#loginForm').onsubmit=async e=>{
    e.preventDefault();const b=$('#loginBtn');b.disabled=true;b.textContent='登入中…';
    try{const d=await api('login',{username:$('#lu').value.trim(),password:$('#lp').value});S.token=d.token;localStorage.setItem(C.SESSION_KEY,d.token);S.pwPrompted=false;applyBoot(d.boot||{me:d.user});showApp();if(!location.hash||location.hash==='#')history.replaceState(null,'','#home');route();afterSync();$('#lp').value=''}
    catch(err){toast(err.message,'err')}finally{b.disabled=false;b.textContent='登入'}
  };
}
function boot(){
  if(/^#[0-9a-f]{6}$/i.test(String(C.BRAND_COLOR||'')))document.documentElement.style.setProperty('--brand',C.BRAND_COLOR);
  bindGlobal();cleanUrl();
  // 信件裡的簽署連結：?sign=金鑰，不用登入
  const signToken=new URLSearchParams(location.search).get('sign');
  if(signToken){showPortal(signToken);return}
  noteUpdated();startUpdateChecks();
  S.token=localStorage.getItem(C.SESSION_KEY)||'';
  if(!S.token){showLogin();return}
  if(restore()){showApp();route();sync();return}
  S.me={name:'',permissions:[]};showApp();setHead('載入中');view('<div class="loading">正在載入工作資料…</div>');S.me=null;
  (async()=>{try{const d=await api('bootstrap');applyBoot(d);route();afterSync()}catch(e){if(S.token){view(`<div class="box box-empty">${esc(e.message)}<br><button class="btn" onclick="location.reload()" style="margin-top:12px">重新載入</button></div>`)}}})();
}
boot();
</script>
</body>
</html>
