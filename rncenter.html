ing:6px 0 16px}.timeline-content strong{font-size:11px}.timeline-content p{font-size:10px;color:#7c828b;line-height:1.6;margin:5px 0 0}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;overflow:auto;padding-bottom:3px}.kanban-col{background:rgba(255,255,255,.018);border:1px solid var(--line);border-radius:18px;padding:11px;min-height:420px}.kanban-head{display:flex;align-items:center;justify-content:space-between;padding:5px 4px 12px;font-size:11px;font-weight:900}.kanban-col .task-card{margin-bottom:10px}.secret{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;letter-spacing:.08em;padding:13px 14px;border-radius:12px;background:#090a0c;border:1px solid var(--line);margin:12px 0}

/* rncenter.html 內建保護樣式：即使外部 CSS 快取/遺失，Logo 與主框架也不會爆版 */
html,body{width:100%;max-width:100%;overflow-x:hidden}
img{max-width:100%;height:auto}
.brand-logo-wrap{flex:0 0 45px}
.brand-logo-wrap-lg{flex-basis:66px}
.brand-logo-wrap img{display:block;width:100%!important;height:100%!important;max-width:100%!important;object-fit:contain!important}
.sidebar{max-width:var(--sidebar)}
.main{width:auto}
@media(max-width:760px){.main{width:100%}}

</head>
<body>
  <div id="globalLoader" class="global-loader" aria-hidden="true"><i></i></div>
  <div id="toastRoot" aria-live="polite"></div>

  <section id="loginView" class="login-shell">
    <div class="login-ambient"></div>
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-logo-wrap brand-logo-wrap-lg">
          <img src="https://cdn.phototourl.com/free/2026-09-22-a9f9fb68-5bf7-44c8-aeff-04af75c8bd72.png" width="66" height="66" alt="銳能娛樂 Logo">
        </div>
        <div>
          <div class="eyebrow">銳能娛樂・內部工作系統</div>
          <h1>中央控制中心</h1>
        </div>
      </div>
      <p class="login-copy">專案、人事、財務、文件與內部控制台，集中在同一個工作入口。</p>
      <form id="loginForm" class="stack-lg">
        <label class="field"><span>員工帳號</span><input id="loginUsername" autocomplete="username" required /></label>
        <label class="field"><span>密碼</span><input id="loginPassword" type="password" autocomplete="current-password" required /></label>
        <button class="btn btn-primary btn-wide" type="submit">登入工作臺</button>
      </form>
      <div class="login-note">此系統僅供授權人員使用。敏感資料、帳號與管理操作皆會留下紀錄。</div>
    </div>
  </section>

  <div id="appView" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div class="brand-row">
          <div class="brand-logo-wrap">
            <img src="https://cdn.phototourl.com/free/2026-09-22-a9f9fb68-5bf7-44c8-aeff-04af75c8bd72.png" width="45" height="45" alt="銳能娛樂 Logo">
          </div>
          <div><strong>銳能娛樂</strong><span>中央控制中心</span></div>
        </div>
        <button id="closeNav" class="icon-btn mobile-only" type="button" aria-label="關閉選單">×</button>
      </div>

      <nav id="nav" class="nav" aria-label="主要功能"></nav>

      <div class="sidebar-user">
        <div class="avatar" id="sideAvatar">銳</div>
        <div class="grow"><strong id="sideName">—</strong><span id="sideRole">—</span></div>
        <button id="logoutBtn" class="icon-btn" type="button" title="登出" aria-label="登出">↪</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="openNav" class="icon-btn mobile-only" type="button" aria-label="開啟選單">☰</button>
        <div class="page-heading">
          <div id="pageEyebrow" class="eyebrow">中央控制</div>
          <h2 id="pageTitle">中央總覽</h2>
        </div>
        <div class="top-actions">
          <button id="quickProposal" class="btn btn-ghost" type="button">＋ 提案</button>
          <button id="quickTask" class="btn btn-primary" type="button">＋ 任務</button>
        </div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>
