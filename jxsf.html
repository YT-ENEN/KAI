    <div class="load-surface"><div class="load-logo" aria-hidden="true"><b>JC</b><i></i></div><p class="eyebrow">YOUR CITY IS GETTING READY</p><h1>回到你的江城。</h1><p id="boot-label">準備你的遊戲世界</p><div class="boot-track" role="progressbar" aria-label="帳戶載入進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><b id="boot-progress"></b></div><div class="load-bottom"><span>JIANGCHENG</span><strong id="boot-number">0%</strong></div><div class="load-stages"><span>介面</span><span>連線</span><span>帳戶</span><span>就緒</span></div><p id="load-error" class="load-error"></p><div class="row" style="justify-content:center"><button class="btn gold hidden" id="load-retry">重試載入</button><button class="btn light hidden" id="load-login">返回登入</button></div></div>

  <section id="login" class="login hidden"><div class="login-panel auth-panel"><div class="login-symbol" aria-hidden="true">JC</div><p class="eyebrow">YOUR CITY. YOUR PLAY.</p><h1>歡迎回到江城。</h1><p class="muted">一個帳戶，連起你的遊戲與江城生活。</p><div id="google-signin"><div class="skeleton" style="height:44px"></div></div><p id="login-status" class="login-status hint" role="status">Google 登入準備中…</p><button id="retry-login" class="text-button hidden" type="button">重試 Google 登入</button><div class="auth-divider"><span>或使用帳號密碼</span></div><div class="auth-tabs"><button type="button" data-auth-tab="login" class="active">登入帳號</button><button type="button" data-auth-tab="register">建立帳號</button></div><form id="local-login-form" class="stack"><div class="field"><label for="auth-username">帳號</label><input id="auth-username" name="username" autocomplete="username" pattern="[A-Za-z][A-Za-z0-9_]{2,23}" minlength="3" maxlength="24" placeholder="你的江城帳號" required></div><div class="field"><label for="auth-password">密碼</label><input id="auth-password" name="password" type="password" minlength="10" maxlength="128" autocomplete="current-password" placeholder="輸入登入密碼" required></div><button class="btn gold" type="submit">登入江城</button></form><form id="local-register-form" class="stack hidden"><div class="field"><label for="register-nickname">遊戲暱稱</label><input id="register-nickname" name="nickname" maxlength="20" autocomplete="nickname" required></div><div class="field"><label for="register-username">帳號，3–24 位英文／數字／底線</label><input id="register-username" name="username" pattern="[A-Za-z][A-Za-z0-9_]{2,23}" minlength="3" maxlength="24" autocomplete="username" placeholder="以英文字母開頭" required></div><div class="field"><label for="register-password">密碼，至少 10 個字元</label><input id="register-password" name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></div><div class="field"><label for="register-confirm">再次輸入密碼</label><input id="register-confirm" name="confirm" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></div><button class="btn gold" type="submit">建立帳號並登入</button></form><p id="auth-error" class="auth-error" role="alert"></p><p class="auth-link-note">已有 Google 遊戲帳戶？請先用 Google 登入，至「我的 → 備用帳密」設定，就能用兩種方式登入同一個帳戶。</p><p class="login-legal">RE 為虛構遊戲幣。所有資產與行情均為遊戲模擬。</p></div></section>

  function marketView(){const data=state.market;if(!data)return`<section class="panel skeleton" style="height:420px"></section>`;const stock=data.stocks.find(x=>x.id===state.symbol)||data.stocks[0];if(!stock)return'<p>市場尚未初始化。</p>';state.symbol=stock.id;return`<div class="note teal" style="margin-bottom:18px">${esc(data.clock?.label||'共享模擬市場')} · ${phaseName(data.clock?.phase)}。行情、五檔與基本面均為遊戲模擬。海外股票須經銀行核准；交割為真實營業日 T+2。</div><div class="market-layout"><section class="panel" style="padding:12px"><div class="stock-list">${data.stocks.map(s=>`<button class="stock-pick ${state.symbol===s.id?'active':''}" data-symbol="${esc(s.id)}"><div>${esc(s.name)}<small>${esc(s.id)} · ${esc(s.currency)}</small></div><span class="amount ${s.change>=0?'up':'down'}">${fmt(s.price)}</span></button>`).join('')}</div></section><div class="stack"><section class="panel"><div class="quote-head"><div><p class="eyebrow">${esc(stock.id)} · ${esc(stock.market)} · ${esc(stock.sector)}</p><h2>${esc(stock.name)}</h2></div><div style="text-align:right"><div class="quote-price ${stock.change>=0?'up':'down'}">${fmt(stock.price)}</div><small class="${stock.change>=0?'up':'down'}">${stock.change>=0?'+':''}${fmt(stock.change)}% · ${stock.currency}</small></div></div><div class="row between"><div class="row"><button class="text-button" data-interval="5m">5 分</button><button class="text-button" data-interval="1h">1 時</button><button class="text-button" data-interval="1d">日 K</button></div><small class="muted">${state.interval} · MA5 / MA20 / 成交量</small></div><canvas class="chart" id="k-chart" aria-label="${esc(stock.name)}K線圖"></canvas><div class="quote-stats">${[['模擬開盤',stock.open],['模擬最高',stock.high],['模擬最低',stock.low],['模擬成交量',stock.volume],['本益比',stock.pe],['殖利率 %',stock.yield],['市值 RE',stock.marketCap],['每張股數',1000]].map(([k,v])=>`<div><small>${k}</small><b>${fmt(v)}</b></div>`).join('')}</div></section>
      <div class="grid2"><section class="panel">${panelHead('模擬五檔')}<div class="orderbook"><div><small class="down">委買價 / 張</small>${stock.buy5.map(r=>`<div class="depth-row"><span>${fmt(r.price)}</span><span>${r.qty}</span></div>`).join('')}</div><div><small class="up">委賣價 / 張</small>${stock.sell5.map(r=>`<div class="depth-row ask"><span>${fmt(r.price)}</span><span>${r.qty}</span></div>`).join('')}</div></div><p class="hint">此遊戲由模擬流動性撮合，五檔為行情示意；不是玩家間的真實委託簿。</p></section><section class="panel">${panelHead('證券下單',`<span class="pill">可用 ${fmt(state.snapshot.available)} RE</span>`)}<form id="trade-form" class="stack"><div class="trade-side"><button type="button" class="buy ${state.side==='BUY'?'active':''}" data-side="BUY">買入</button><button type="button" class="sell ${state.side==='SELL'?'active':''}" data-side="SELL">賣出</button></div><div class="form-grid"><div class="field"><label>交易盤別</label><select name="session"><option value="INTRADAY_ODD">盤中零股</option><option value="REGULAR">盤中整張</option><option value="AFTER_FIXED">盤後定價</option><option value="AFTER_ODD">盤後零股</option></select></div><div class="field"><label>單位</label><select name="unit"><option value="ODD">股（1–999）</option><option value="LOT">張（1張=1000股）</option></select></div><div class="field"><label>委託方式</label><select name="type"><option value="LIMIT">限價</option><option value="MARKET">市價（僅整張）</option></select></div><div class="field"><label>委託價格 ${stock.currency}</label><input name="limit" type="number" step="0.01" min=".01" max="100000" value="${stock.price}" required></div><div class="field full"><label>委託數量</label><input name="qty" type="number" min="1" max="999" value="1" required></div></div><div class="note">成交不會立即扣款，T+2 由交割戶扣款。未交割買入不能賣出。手續費 0.1425%，至少 1 RE；海外以遊戲固定匯率 1 USD = 32 RE 換算。</div><button class="btn" type="submit">確認${state.side==='BUY'?'買入':'賣出'}委託</button></form></section></div></div></div>`;}
  function phaseName(phase){return({INTRADAY:'盤中交易',AFTER_FIXED:'盤後定價',AFTER_ODD:'盤後零股',CLOSED:'休市'})[phase]||'同步中';}
  function bankView(){const s=state.snapshot,p=P(),bank=state.bank;return`<div class="metrics" style="margin-top:0">${metric('錢包餘額',fmt(s.cash),'RE')}${metric('交割戶餘額',fmt(p.deposit),'RE','bank')}${metric('待交割預留',fmt(s.reserved),'RE','clock')}${metric('違約待補',fmt(s.debt),'RE','shield')}</div><div class="grid2"><section class="panel">${panelHead('資金移轉')}<form id="bank-form" class="stack"><div class="field"><label>轉帳方向</label><select name="direction"><option value="IN">錢包 → 交割戶</option><option value="OUT">交割戶 → 錢包</option></select></div><div class="field"><label>金額 RE</label><input name="amount" type="number" min="1" max="100000000" required></div><button class="btn">確認移轉</button></form><div class="line"></div><div class="row between"><div><h4 style="font-size:12px">交割日自動補款</h4><p class="hint" style="margin-top:3px">交割戶不足時，自錢包補足差額。</p></div><button class="btn outline small" data-mutation="bank.auto" data-args='{"enabled":${!p.autoDebit}}'>${p.autoDebit?'已開啟 · 關閉':'已關閉 · 開啟'}</button></div>${p.defaulted?'<div class="line"></div><button class="btn danger" data-mutation="default.cure">補繳違約交割款與罰金</button>':''}</section>
    <section class="panel">${panelHead('海外複委託',`<span class="pill gold">${esc(({NONE:'未申請',PENDING:'銀行審核中',APPROVED:'已開通',REJECTED:'未通過'})[p.overseas.status]||p.overseas.status)}</span>`)}<p class="muted" style="font-size:12px">向銀行申請海外證券資格。信用至少 600，且沒有尚未處理的違約紀錄。由銀行行員人工審核。</p><p class="hint">海外行情與匯率均為遊戲模擬；本遊戲統一採 T+2，並不代表各國實際交割規則。</p><button class="btn" style="margin-top:20px" data-action="overseas" ${['APPROVED','PENDING'].includes(p.overseas.status)?'disabled':''}>申請海外證券</button><div class="line"></div><h3>中央銀行職涯</h3><p class="hint">行員管理借貸、政黨與海外審核；資深行員可審核上市。行長決定人事與市場政策，最高議長可監督中央銀行。</p><div class="row wrap" style="margin-top:15px"><button class="btn light small" data-mutation="bank.jobApply" data-args='{"rank":"BANKER"}'>申請行員</button><button class="btn outline small" data-action="bank-console">銀行中控台</button><a class="btn outline small" href="#" data-classic="banker">原有借貸與銀行業務</a></div><p class="hint">目前權限：${esc(bank?.permission?.name||'同步中')}</p></section></div>`;}
  function ordersView(){const p=P(),s=state.snapshot,open=p.orders||[];return`<section class="panel">${panelHead('委託與交割紀錄',`<span class="pill">交割戶 ${fmt(p.deposit)} RE</span>`)}<div class="scroll-x"><table class="table"><thead><tr><th>證券</th><th>買賣 / 盤別</th><th>股數</th><th>成交價</th><th>交割總額 RE</th><th>狀態</th><th>交割時間</th><th></th></tr></thead><tbody>${open.map(o=>`<tr><td>${esc(o.symbol)}<small style="display:block" class="muted">${esc(o.name)}</small></td><td class="${o.side==='BUY'?'up':'down'}">${o.side==='BUY'?'買入':'賣出'}<small style="display:block">${esc(({REGULAR:'整張',INTRADAY_ODD:'零股',AFTER_FIXED:'盤後定價',AFTER_ODD:'盤後零股'})[o.session]||'')}</small></td><td>${fmt(o.qty)}</td><td>${o.price?fmt(o.price):'限 '+fmt(o.limit)}</td><td>${fmt(o.total)}</td><td>${esc(({OPEN:'委託中',FILLED:'待交割',SETTLED:'已交割',CANCELLED:'已取消',DEFAULT:'違約'})[o.status]||o.status)}</td><td>${dt(o.due)}</td><td>${o.status==='OPEN'?`<button class="btn outline small" data-mutation="order.cancel" data-args='${esc(JSON.stringify({id:o.id}))}'>刪單</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">尚無委託，先從一股開始。</td></tr>'}</tbody></table></div><p class="hint">週末及 HOLIDAYS 設定日期不算營業日；預設於 T+2 上午 10:00（台北）交割。離線時由排程處理，回來同步時也會補處理到期項目。</p></section><section class="panel" style="margin-top:20px">${panelHead('已交割庫存')}<div class="scroll-x"><table class="table"><thead><tr><th>股票代號</th><th>可賣股數</th><th>模擬現價</th><th>估值 RE</th></tr></thead><tbody>${Object.entries(p.positions).filter(([,q])=>q>0).map(([id,q])=>{const stock=state.market?.stocks.find(x=>x.id===id);return`<tr><td>${esc(id)} ${esc(stock?.name||'')}</td><td>${fmt(q)}</td><td>${fmt(stock?.price)}</td><td>${fmt(q*(stock?.price||0)*(stock?.fx||1))}</td></tr>`;}).join('')||'<tr><td colspan="4" class="empty">尚無已交割庫存。</td></tr>'}</tbody></table></div><div class="note" style="margin-top:15px">原版公司股票在首次登入時轉入新制庫存，舊持股表僅供股東治理同步，不能從舊版重複交易。原有 ETF 與會員卡保留在原版會員中心。</div><a class="btn outline small" href="#" data-classic="profile" style="margin-top:15px">原有 ETF 與會員資產</a></section>`;}
  function companyViewBase(){const companies=state.company?.companies||[],mine=companies.find(c=>c.owner===P().id);return`<div class="grid2"><section class="panel">${panelHead(mine?'我的商業版圖':'成立你的第一間公司')}${mine?`<p class="eyebrow">${esc(mine.sector)}</p><h2>${esc(mine.name)}</h2><div class="metrics" style="grid-template-columns:1fr 1fr;margin:20px 0">${metric('公司資本',fmt(mine.capital),'RE')}${metric('累積營收',fmt(mine.revenue),'RE','chart')}</div><div class="row wrap"><button class="btn" data-mutation="company.operate" ${mine.operated===P().daily.day?'disabled':''}>${mine.operated===P().daily.day?'今日已營運':'每日營運'}</button><button class="btn outline" data-action="company-fund">公司增資</button></div><p class="hint">公司資本與個人錢包分離，每日營運耗 2 行動力。不能透過公司頁無限提款。</p>`:`<form id="company-form" class="stack"><div class="field"><label>公司名稱</label><input name="name" maxlength="24" required></div><div class="field"><label>產業</label><select name="sector"><option>科技</option><option>金融</option><option>建設</option><option>娛樂</option><option>生技</option></select></div><div class="field"><label>投入資本額，至少 20,000 RE</label><input name="capital" type="number" min="20000" value="20000" required></div><button class="btn">成立公司</button></form>`}<div class="line"></div><a class="btn light small" href="#" data-classic="company">原有公司、人事與股東會</a></section><section class="panel">${panelHead('上市審核中心',mine?.listed?'<span class="pill gold">已上市</span>':'<span class="pill">銀行審核制</span>')}${mine?.listed?`<h2>${esc(mine.symbol)} · ${esc(mine.name)}</h2><p class="hint">審核通過，證券已加入共享市場。</p>`:`<p class="muted" style="font-size:12px;margin-bottom:20px">公司資本至少 50,000 RE、60 XP、信用 650，提交財務揭露後，交由資深行員以上審核。</p><form id="ipo-form" class="form-grid"><div class="field"><label>4 位數股票代號</label><input name="symbol" pattern="[1-9][0-9]{3}" maxlength="4" placeholder="例如 7001" required></div><div class="field"><label>上市參考價</label><input name="price" type="number" min="1" max="1000" step=".01" value="10" required></div><div class="field full"><label>流通股數</label><input name="shares" type="number" min="1000" max="10000000" value="100000" required></div><div class="field full"><label>財務揭露與上市計畫</label><textarea name="disclosure" maxlength="240" required></textarea></div><button class="btn full" ${!mine?'disabled':''}>送交銀行審核</button></form>`}<p class="hint">${(state.company?.requests||[]).map(r=>'申請 '+r.id+' · '+r.status).map(esc).join('<br>')||'尚無上市申請'}</p></section></div>`;}
  function power(){let html=title('JIANGCHENG CIVIC CENTER','市政中心')+subnav('power',[['election','選舉中心'],['party','我的政黨'],['careers','職涯與公職'],['bank','中央銀行']]);if(state.tab.power==='bank')return html+bankConsole();if(state.tab.power==='party')return html+partyView();if(state.tab.power==='careers')return html+careersView();return html+electionView();}
  function electionView(){const data=state.politics;if(!data)return'<div class="panel skeleton" style="height:350px"></div>';const e=data.election,phase=({NOMINATION:'候選登記 · 週一至三',VOTING:'全民投票 · 週四五',RESULT:'開票與任期 · 週六日'})[data.phase];return`<div class="note teal" style="margin-bottom:20px">${phase} · 每個 Google 遊戲身分、每個職位一票。需有 10 XP 才能投票。政黨抽成為遊戲規則，並非台灣法律規定。</div><div class="grid2"><section class="panel">${panelHead('江城選舉委員會',`<span class="pill gold">${esc(e.id)} 這一屆</span>`)}${Object.entries(data.offices).map(([key,office])=>{const cs=e.candidates.filter(c=>c.office===key);return`<div style="margin-bottom:20px"><div class="row between"><h3>${esc(office.name)} <small class="muted">${office.seats} 席</small></h3><button class="btn outline small" data-nominate="${key}" ${data.phase!=='NOMINATION'?'disabled':''}>參選登記</button></div><p class="hint" style="margin:5px 0 10px">需 ${office.xp} XP、信用 ${office.credit}、對應參選卡 1 張；登記費 1,000 RE。</p>${cs.map(c=>`<div class="candidate">${avatar(c.name,c.id,'avatar-small')}<div><h4>${esc(c.name)}</h4><p>${esc(c.statement||'讓江城更好。')}</p></div><div class="vote-count"><b class="amount">${c.votes}</b><small class="muted" style="display:block">票</small></div><button class="btn light small" data-mutation="election.vote" data-args='${esc(JSON.stringify({id:c.id}))}' ${data.phase!=='VOTING'||data.votes[key]?'disabled':''}>${data.votes[key]===c.id?'已投票':'投票'}</button></div>`).join('')||'<p class="hint">尚無候選人，等待新的名字出現。</p>'}</div>`;}).join('')}</section><div class="stack"><section class="panel">${panelHead('競選補助款')}${icon('vote')}<p class="muted" style="font-size:12px;margin-top:15px">總統、市長、立委達當選票數三分之一；兩席議員達最低當選票數二分之一，才能領取每票 30 RE。</p><p class="hint">遊戲內補助上限為該次申報支出，目前為 1,000 RE 登記費。黨籍候選人依登記時保存的比例分給黨庫，剩餘進個人錢包。</p><button class="btn" style="margin-top:18px" data-mutation="election.claim" data-args='${esc(JSON.stringify({week:e.id}))}' ${!e.finalized?'disabled':''}>領取本屆選舉補助</button></section><section class="panel">${panelHead('目前的權力版圖')}${Object.entries(data.city.offices||{}).map(([key,person])=>`<div class="mission"><span class="mission-icon gold">${icon('power')}</span><div><h4>${esc(data.offices[person.office||key]?.name||key)}</h4><p>${esc(person.name)}</p></div></div>`).join('')||'<p class="hint">尚無當選公職，等待第一屆開票。</p>'}<p class="hint">最高金融權限：${esc(data.city.speaker?.name||'中央銀行行長')}。當選公職不直接取得銀行任意提款權。</p><button class="btn outline small" style="margin-top:15px" data-action="tutorial-politics">查看選舉教學</button></section></div></div>`;}
  function partyViewBase(){const data=state.party,party=data?.party,parties=state.politics?.parties||[];return party?`<div class="grid2"><div class="stack"><section class="member-card"><p>JIANGCHENG PARTY MEMBERSHIP</p><h3>${esc(party.name)}</h3><p style="margin:10px 0 20px">${esc(P().nickname)} · 正式黨員</p><span class="amount" style="font-size:12px">${esc(data.member?.number||'')}</span></section><section class="panel">${panelHead('黨務中心')}<p class="muted" style="font-size:12px">${esc(party.manifesto)}</p><div class="metrics" style="grid-template-columns:1fr 1fr;margin:18px 0">${metric('黨庫資金',fmt(party.fund),'RE')}${metric('正式黨員',party.members,'人','social')}</div><p class="hint">黨主席：${esc(party.leaderName)}<br>入黨基金：${fmt(party.joinFee)} RE<br>競選補助黨務分成：${party.shareRate}%<br>主席任期：7 天；期滿任何黨員皆可啟動改選。</p><div class="row wrap" style="margin-top:18px"><button class="btn light small" data-mutation="party.promote">辦理黨務活動 · 1,000 RE</button><button class="btn outline small" data-mutation="party.leave">退出政黨</button></div></section></div><section class="panel">${panelHead('黨主席提名與表決')}${chairView(data.ballot)}<button class="btn outline" style="margin-top:20px" data-mutation="party.chair.start">啟動任期屆滿改選</button><p class="hint">提名 12 小時、投票 36 小時；投票需在改選開始前入黨。平票依提名順序。無有效票則原主席續任。</p></section></div>`:`<div class="grid2"><section class="panel">${panelHead('成立一個新的選擇')}<form id="party-form" class="stack"><div class="field"><label>政黨名稱</label><input name="name" maxlength="16" required></div><div class="form-grid"><div class="field"><label>入黨基金 RE</label><input name="joinFee" type="number" min="100" max="5000" value="1000" required></div><div class="field"><label>補助款黨務分成 %</label><input name="shareRate" type="number" min="0" max="30" value="20" required></div></div><div class="field"><label>政黨理念</label><textarea name="manifesto" maxlength="160" required></textarea></div><p class="note">需付 5,000 RE 申請費及入黨基金，銀行審核通過後成立。駁回全額退還；核准後創辦人為首任主席。</p><button class="btn">提交銀行審核</button></form></section>   async function loadSection(render=true){
    if(!state.snapshot)return;const seq=++state.sectionSeq,tab=state.tab[state.page],jobs=[];state.sectionError='';
    if(state.page==='home'||(state.page==='assets'&&['market','orders'].includes(tab)))jobs.push(JC_API.call('market',{symbol:state.symbol,interval:state.interval}).then(x=>state.market=x));
    if(state.page==='lottery')jobs.push(JC_API.call('legacy',{name:'getFortuneLotteryInfo',args:[account()]}).then(x=>{if(x?.status==='error')throw new Error(x.message);state.lottery=x;}));
    if((state.page==='assets'&&tab==='bank')||(state.page==='power'&&tab==='bank'))jobs.push(JC_API.call('bank').then(x=>state.bank=x));
    if(state.page==='assets'&&tab==='company')jobs.push(JC_API.call('company').then(x=>state.company=x));
    if(state.page==='power'){jobs.push(JC_API.call('politics').then(x=>state.politics=x));if(tab==='party')jobs.push(JC_API.call('party').then(x=>state.party=x));}
    if(state.page==='social'){
      if(['feed','people','room'].includes(tab))jobs.push(JC_API.call('community').then(x=>state.community=x));
      if(tab==='room'&&P().room)jobs.push(JC_API.call('room').then(x=>state.room=x).catch(()=>state.room=null));else if(tab==='room')state.room=null;
      if(['feed','chat','people'].includes(tab))jobs.push(JC_API.call('chat.list').then(x=>state.chatList=x));
      if(tab==='feed')jobs.push(fetchFeed());
      if(tab==='chat'&&state.peer)jobs.push(JC_API.call('chat.read',{id:state.peer}).then(x=>state.chat=x));
    }
    const results=await Promise.allSettled(jobs);if(seq!==state.sectionSeq)return;
    const failed=results.find(r=>r.status==='rejected');if(failed){if(failed.reason?.code==='AUTH'){showLogin(failed.reason.message);return;}state.sectionError=failed.reason?.message||'資料讀取失敗，請重試。';}
    if(render&&!window.JC_CLASSIC_ACTIVE&&!$('#content input:focus,#content textarea:focus,#content select:focus')&&!$('#modal-root').children.length)renderPage();
  }

  function drawChart(){const canvas=$('#k-chart'),bars=state.market?.candles;if(!canvas||!bars?.length)return;const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),width=rect.width,height=rect.height;canvas.width=width*dpr;canvas.height=height*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,width,height);const lo=Math.min(...bars.map(b=>b.l))*.998,hi=Math.max(...bars.map(b=>b.h))*1.002,y=v=>18+(hi-v)/(hi-lo)*(height-75),step=(width-48)/bars.length,maxVol=Math.max(...bars.map(b=>b.v));ctx.font='9px monospace';ctx.textAlign='right';for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3,yy=y(v);ctx.strokeStyle='#e9ede6';ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(width-40,yy);ctx.stroke();ctx.fillStyle='#92a08e';ctx.fillText(v.toFixed(2),width,yy+3);}bars.forEach((b,i)=>{const x=i*step+step*.5;ctx.strokeStyle=ctx.fillStyle=b.c>=b.o?'#cb7869':'#438b77';ctx.beginPath();ctx.moveTo(x,y(b.h));ctx.lineTo(x,y(b.l));ctx.stroke();ctx.fillRect(x-step*.3,Math.min(y(b.o),y(b.c)),Math.max(1,step*.6),Math.max(1,Math.abs(y(b.o)-y(b.c))));ctx.globalAlpha=.3;ctx.fillRect(x-step*.3,height-22-b.v/maxVol*24,Math.max(1,step*.6),b.v/maxVol*24);ctx.globalAlpha=1;});[[5,'#c3a562'],[20,'#7e8ac2']].forEach(([n,color])=>{ctx.strokeStyle=color;ctx.lineWidth=1.1;ctx.beginPath();for(let i=n-1;i<bars.length;i++){const avg=bars.slice(i-n+1,i+1).reduce((v,b)=>v+b.c,0)/n,x=i*step+step*.5;if(i===n-1)ctx.moveTo(x,y(avg));else ctx.lineTo(x,y(avg));}ctx.stroke();});ctx.fillStyle='#98a58f';ctx.textAlign='left';ctx.fillText(dt(bars[0].t),2,height-3);ctx.textAlign='right';ctx.fillText(dt(bars[bars.length-1].t),width-45,height-3);}
  const tutorialData={welcome:['歡迎來到江城','city',['先領每日補給，再到遊戲大廳選擇遊戲；每 10 分鐘恢復 1 行動力。','底部選單可進入遊戲、彩券、社群與個人頁；上方導覽可切換股票、銀行、公司、選舉、政黨及職涯。','此處所有玩家共享後端；離線快照只能看，交易必須等待連線。']],market:['第一次進入證券中心','chart',['先選股票代號，再選整張或零股；1 張為 1,000 股，零股為 1–999 股。','預設使用 30 分鐘加速盤：前 20 分鐘盤中，接著 5 分鐘盤後定價、5 分鐘盤後零股。','買入成交後 T+2 營業日由交割戶扣款。先轉錢進交割戶，或開啟錢包自動補款。','缺款會違約、扣信用並暫停交易；買入尚未交割前不能出售。海外需銀行審核。']],politics:['你的第一張選票','power',['先在身分抽卡取得總統、市長、立委或議員參選卡；登記時消耗 1 張卡並支付 1,000 RE。','週一至三登記，週四五投票，週六日開票。經驗至少 10 的玩家，每個職位各一票。','政黨成立需銀行審核；加入要付已揭露的入黨基金，並發行黨證。','達得票門檻可領遊戲補助；黨務分成轉入黨庫。主席由黨內提名與表決。']],bank:['銀行與最高議會','bank',['第一任行長由部署者指定。一般玩家須經行長審核才能成為行員。','行員處理海外及政黨申請；上市審核需資深行員以上，且不可自審。','最高議長抽中機率最低，符合條件才可就任；議長出現前中央銀行權力最高。']],cards:['身分卡包','cards',['三種卡包價格為 200、1,000、5,000 RE。每抽獨立，沒有隱藏保底。','完整機率在每個卡包下方公開；參選卡、銀行資格與最高議長卡皆有機會抽中。','抽中資格卡不會跳過信用、經驗或銀行審核。']]};

  async function compress(file){if(!file||!/^image\/(jpeg|png|webp|gif|heic|heif)$/.test(file.type))throw new Error('請選擇可讀取的照片檔案');if(file.size>12000000)throw new Error('原始照片請小於 12 MB');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const ratio=Math.min(1,512/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.78);if(data.length>210000)data=canvas.toDataURL('image/jpeg',.55);if(data.length>210000)throw new Error('壓縮後照片仍過大，請改用較小的照片');return{mime:'image/jpeg',base64:data.split(',')[1]};}finally{URL.revokeObjectURL(url);}}

on class="btn outline feed-load-more" data-action="more-posts">載入更多動態</button>':''}`}</div>`;}
  function bankConsole(){const perm=state.bank?.permission;if(!perm)return '<section class="panel skeleton" style="height:300px"></section>';const pending=(state.bank?.requests||[]).filter(r=>r.status==='PENDING').length;const staff=!!perm.rank;return `<section class="staff-workspace"><div class="staff-summary"><div><p class="eyebrow">BANK EMPLOYEE WORKSPACE</p><h2>銀行行員工作台</h2><p>${esc(perm.name)} · ${staff?'依你的職務權限提供可處理的業務':'查看銀行職缺，申請成為行員'}</p></div><span class="pill gold">${pending} 件待辦</span></div><div class="staff-shortcuts">${[['loans','shield','貸款與風控','貸款審核・風險處理'],['clients','profile','客戶服務','查詢・通知・轉帳'],['staff','social','銀行人事','職缺・錄用・薪資'],['policies','bank','營運控管','市場・公告・ETF'],['lottery','ticket','彩券管理','獎池・開獎紀錄']].map(([area,ic,name,sub])=>`<button class="staff-shortcut" data-staff-area="${area}" ${!staff?'disabled':''}>${icon(ic)}<span><b>${name}</b><small>${sub}</small></span><i>↗</i></button>`).join('')}<button class="staff-shortcut" data-classic-panel="hr">${icon('case')}<span><b>銀行職缺</b><small>查看職務・申請加入</small></span><i>↗</i></button></div></section>${staff?bankReviewView():'<section class="panel"><h3>加入江城銀行</h3><p class="hint">目前尚未擔任銀行行員。可以先查看職缺、提出申請，錄用後即可使用對應工作台。</p></section>'}`;}
  let feedObserver;
  const feedImages=new Map();
  function hydrateFeed(){feedObserver?.disconnect();feedObserver=new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;feedObserver.unobserve(entry.target);const node=entry.target,id=node.dataset.postImage;const draw=src=>{if(node.isConnected)node.innerHTML=`<img src="${src}" alt="江城居民分享的照片" loading="lazy">`;};if(feedImages.has(id)){draw(feedImages.get(id));continue;}JC_API.call('post.image',{id}).then(x=>{const src='data:'+x.mime+';base64,'+x.base64;feedImages.set(id,src);if(feedImages.size>40)feedImages.delete(feedImages.keys().next().value);draw(src);}).catch(()=>{if(node.isConnected)node.innerHTML=`<button class="text-button" data-retry-post-image="${esc(id)}">照片載入失敗，點此重試</button>`;});}},{rootMargin:'180px'});$$('[data-post-image]').forEach(el=>feedObserver.observe(el));}
  async function fetchFeed(more=false){const data=await JC_API.call('feed',{before:more?state.feedNext:''});state.feed=more?[...(state.feed||[]),...data.posts.filter(p=>!(state.feed||[]).some(q=>q.id===p.id))]:data.posts;state.feedNext=data.next||'';}
  function composePost(){state.composeImage=null;modal('分享江城日常',`<form id="post-form" class="stack"><div class="row">${avatar(P().nickname,P().id,'avatar-small')}<div><b style="font-size:13px">${esc(P().nickname)}</b><p class="hint" style="margin:0">公開分享給江城居民</p></div></div><textarea name="text" maxlength="600" rows="5" placeholder="今天發生了什麼新鮮事？" aria-label="貼文內容"></textarea><img class="compose-photo-preview hidden" id="compose-photo-preview" alt="待發布照片"><div class="compose-bottom"><button class="btn light small" type="button" data-action="post-photo">${icon('photo')} 加入照片</button><span class="compose-count">最多 600 字</span><button class="btn gold" type="submit">發布</button></div></form>`);}
  async function pickPostPhoto(){const input=document.createElement('input');input.type='file';input.accept='image/jpeg,image/png,image/webp';input.onchange=async()=>{try{if(!input.files[0])return;state.composeImage=await compress(input.files[0]);const preview=$('#compose-photo-preview');if(preview){preview.src='data:image/jpeg;base64,'+state.composeImage.base64;preview.classList.remove('hidden');}}catch(e){toast(e.message,true);}};input.click();}
  async function showComments(id){try{const data=await JC_API.call('post.read',{id});modal('留言',`<div>${(data.comments||[]).map(c=>`<div class="comment-item"><b>${esc(c.name)}</b><p>${esc(c.text)}</p><small>${dt(c.at)}</small></div>`).join('')||'<p class="empty">還沒有留言，來打聲招呼。</p>'}</div><form id="comment-form" class="comment-form"><input type="hidden" name="id" value="${esc(id)}"><input name="text" maxlength="200" required placeholder="新增留言…" aria-label="留言內容"><button class="btn gold">送出</button></form>`);}catch(e){toast(e.message,true);}}
  function renderNav(){const primary=nav.slice(0,5);$('#bottom-nav').innerHTML=primary.map(([id,name,ic])=>`<button data-page="${id}" class="${state.page===id?'active':''}" ${state.page===id?'aria-current="page"':''}>${icon(ic)}<span>${name}</span></button>`).join('');$('#top-nav').innerHTML=topRoutes.map(([page,tab,label])=>`<button data-route="${page}:${tab}" class="${currentRoute(page,tab)?'active':''}" ${currentRoute(page,tab)?'aria-current="page"':''}>${icon(topNavIcon(page,tab))}<span>${label}</span></button>`).join('');const active=$('#top-nav .active');if(active&&state.lastNavRoute!==state.page+':'+state.tab[state.page]){active.scrollIntoView({block:'nearest',inline:'center',behavior:'auto'});state.lastNavRoute=state.page+':'+state.tab[state.page];}}
  function route(value){const [page,tab]=String(value).split(':');if(tab)state.tab[page]=tab;go(page);}
  async function openGame(id){const game=GAMES.find(g=>g.id===id);if(!game)return;const pref=preferences();pref.recent=[id,...(pref.recent||[]).filter(x=>x!==id)].slice(0,6);savePreferences(pref);await window.JC_SINGLE.openClassic({game:id});}
  function nativeInteractions(){
    document.addEventListener('click',async event=>{const el=event.target.closest('button,a');if(!el)return;
      try{
        if(el.dataset.route){event.preventDefault();route(el.dataset.route);}
        else if(el.dataset.game){await openGame(el.dataset.game);}
        else if(el.dataset.favorite){const pref=preferences(),list=pref.favorites||[];pref.favorites=list.includes(el.dataset.favorite)?list.filter(x=>x!==el.dataset.favorite):[...list,el.dataset.favorite];savePreferences(pref);renderPage();}
        else if(el.dataset.gameFilter){state.gameFilter=el.dataset.gameFilter;renderPage();}
        else if(el.dataset.staffArea){await window.JC_SINGLE.openClassic({panel:'banker',area:el.dataset.staffArea});}
        else if(el.dataset.classicPanel){await window.JC_SINGLE.openClassic({panel:el.dataset.classicPanel,tab:state.tab.lottery});}
        else if(el.dataset.lotteryNumber){const n=Number(el.dataset.lotteryNumber);if(state.lotteryNumbers.includes(n))state.lotteryNumbers=state.lotteryNumbers.filter(x=>x!==n);else{if(state.lotteryNumbers.length===6)return toast('每注選擇 6 個號碼');state.lotteryNumbers.push(n);}renderPage();}
        else if(el.dataset.startChat){state.peer=el.dataset.startChat;state.peerName=el.dataset.name;state.tab.social='chat';renderPage();await loadSection(true);}
        else if(el.dataset.socialPerson){const person=state.community?.players.find(p=>p.id===el.dataset.socialPerson);if(person)modal(esc(person.name),`${avatar(person.name,person.id)}<p class="hint">${person.online?'在線上':'離線'} · ${person.xp} XP</p>`,P().friends?.includes(person.id)?`<button class="btn gold" data-start-chat="${esc(person.id)}" data-name="${esc(person.name)}" data-action="close">傳送訊息</button>`:`<button class="btn gold" data-mutation="friend.request" data-args='${esc(JSON.stringify({id:person.id}))}'>加為好友</button>`);}
        else if(el.dataset.likePost){if(state.busy)return;const post=state.feed?.find(p=>p.id===el.dataset.likePost);if(post)await act('post.like',{id:post.id,liked:!post.liked},el);}
        else if(el.dataset.commentsPost){await showComments(el.dataset.commentsPost);}
        else if(el.dataset.sharePost){const url=new URL(location.href);url.hash='social';url.searchParams.set('post',el.dataset.sharePost);await navigator.clipboard.writeText(url.toString());toast('已複製貼文連結');}
        else if(el.dataset.deletePost){modal('刪除這則貼文？','<p class="muted">貼文及留言將從動態牆移除。</p>',`<button class="btn outline" data-action="close">取消</button><button class="btn danger" data-mutation="post.delete" data-args='${esc(JSON.stringify({id:el.dataset.deletePost}))}'>刪除貼文</button>`);}
        else if(el.dataset.retryPostImage){hydrateFeed();}
        else switch(el.dataset.action){
          case'new-post':composePost();break;
          case'post-photo':await pickPostPhoto();break;
          case'more-posts':el.disabled=true;try{await fetchFeed(true);renderPage();}finally{if(el.isConnected)el.disabled=false;}break;
          case'refresh-lottery':state.lottery=null;renderPage();await loadSection(true);break;
          case'refresh':await refresh();await loadSection(true);toast('已更新');break;
          case'lottery-random':{const numbers=Array.from({length:49},(_,i)=>i+1);for(let i=48;i>0;i--){const random=crypto.getRandomValues(new Uint32Array(1))[0],j=random%(i+1);[numbers[i],numbers[j]]=[numbers[j],numbers[i]];}state.lotteryNumbers=numbers.slice(0,6).sort((a,b)=>a-b);renderPage();break;}
          case'buy-marksix':if(state.lotteryNumbers.length===6){const args=legacyRequest('buyMarkSixTicketV106',P().nickname,state.lotteryNumbers.slice().sort((a,b)=>a-b));modal('確認購買六合彩',`<div class="number-balls">${state.lotteryNumbers.map(n=>`<span class="number-ball">${n}</span>`).join('')}</div><p class="hint">本次扣除 ${fmt(state.lottery?.markSix?.ticketPrice||500)} RE。</p>`,`<button class="btn gold" data-mutation="legacy" data-args='${esc(JSON.stringify(args))}'>確認購買</button>`);}break;
        }
      }catch(e){toast(e.message||'操作失敗，請稍後重試',true);}
    });
    document.addEventListener('input',event=>{if(event.target.id==='game-search'){const input=event.target,start=input.selectionStart;state.gameSearch=input.value;const list=GAMES.filter(g=>(state.gameFilter==='all'||state.gameFilter==='favorite'&&(preferences().favorites||[]).includes(g.id)||g.kind===state.gameFilter)&&(g.name+g.en).toLowerCase().includes(state.gameSearch.toLowerCase()));$('#game-results').innerHTML=gameGrid(list);if(input.type!=='search')input.setSelectionRange(start,start);}});
    document.addEventListener('submit',async event=>{const form=event.target;try{
      if(form.getAttribute('id')==='post-form'){event.preventDefault();const text=form.elements.text.value.trim();if(!text&&!state.composeImage)return toast('輸入一些文字，或加入一張照片');const result=await act('post.create',{text,...(state.composeImage||{})},form.querySelector('[type="submit"]'));if(result)state.composeImage=null;}
      if(form.getAttribute('id')==='comment-form'){event.preventDefault();const id=form.elements.id.value,text=form.elements.text.value.trim();if(!text)return;const result=await act('post.comment',{id,text},form.querySelector('button'));if(result)await showComments(id);}
      if(form.getAttribute('id')==='lottery-big-form'){event.preventDefault();const count=Number(form.elements.count.value),price=Number(state.lottery?.big?.ticketPrice||1000);if(!Number.isSafeInteger(count)||count<1)return;const args=legacyRequest('buyLotteryTickets',P().nickname,count);modal('確認購買大樂透',`<p class="muted">購買 ${count} 張彩券，共 ${fmt(count*price)} RE。</p>`,`<button class="btn gold" data-mutation="legacy" data-args='${esc(JSON.stringify(args))}'>確認購買</button>`);}
    }catch(e){toast(e.message,true);}});
  }

  function frameEffect(id){const item=state.snapshot?.shop?.find(i=>i.id===id&&i.type==='frame');return item?.effect||(id==='FRAME'?'gold':'');}
  function avatar(name,id,size='',forcedFrame){
    let hash=0;for(const c of String(id))hash=(hash*31+c.charCodeAt(0))>>>0;const hue=32+hash%22;
    const person=state.community?.players?.find(q=>q.id===id)||state.chatList?.friends?.find(q=>q.id===id)||state.feed?.find(q=>q.author===id);
    const equipped=forcedFrame===undefined?(id===P()?.id?P().avatarFrame:person?.avatarFrame||person?.frame||''):forcedFrame;
    const effect=frameEffect(equipped);
    return `<span class="avatar ${size} ${effect?'fx-frame fx-'+effect:''}" style="background:linear-gradient(140deg,hsl(${hue},22%,30%),hsl(${hue+25},15%,66%))" ${effect?'aria-label="'+esc(name)+'的'+esc(state.snapshot.shop.find(i=>i.id===equipped)?.name||'頭像框')+'"':''}>${id===P()?.id&&state.photo?`<img src="${state.photo}" alt="${esc(name)}的照片">`:`<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="29" r="14" fill="#efe7d7"/><path d="M9 80c3-23 15-34 31-34s28 11 31 34" fill="#c8d2d0"/><path d="M31 48l9 18 9-18-9 6z" fill="#faf5e9"/><path d="M36 61h8l-1 19h-6z" fill="#767f86"/></svg>`}</span>`;
  }

  function loadGIS(){if(window.google?.accounts?.id)return Promise.resolve();if(gisPromise)return gisPromise;gisPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.async=true;script.onload=resolve;script.onerror=()=>{gisPromise=null;reject(new Error('Google 登入元件未載入，可改用下方帳號密碼登入。'));};document.head.appendChild(script);});return gisPromise;}

  async function deriveLoginKey(password,saltHex,iterations){if(!crypto.subtle)throw new Error('請透過 HTTPS 網站開啟備用登入');if(password.length<10||password.length>128)throw new Error('密碼長度需為 10–128 個字元');const salt=Uint8Array.from(saltHex.match(/../g)||[],v=>parseInt(v,16)),key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations},key,256);return [...new Uint8Array(bits)].map(v=>v.toString(16).padStart(2,'0')).join('');}
  async function submitLocalAuth(form,register){
    if(state.authBusy)return;const username=form.elements.username.value.trim().toLowerCase(),password=form.elements.password.value;$('#auth-error').textContent='';
    if(register&&password!==form.elements.confirm.value){$('#auth-error').textContent='兩次輸入的密碼不一致';return;}
    state.authBusy=true;const button=form.querySelector('[type="submit"]');button.disabled=true;beginLoad(register?'建立你的江城帳戶':'登入你的江城帳戶');
    try{const challenge=await JC_API.call('auth.challenge',{username,purpose:register?'register':'login'});loadSet(35,'安全連線已建立');const key=await deriveLoginKey(password,challenge.salt,challenge.iterations);loadSet(50,'密碼驗證資料已準備');const args={username,nonce:challenge.nonce,key};if(register)args.nickname=form.elements.nickname.value.trim();const session=await JC_API.call(register?'auth.register':'auth.login',args,{requestId:uid()});form.elements.password.value='';if(register)form.elements.confirm.value='';loadSet(65,'帳號驗證完成');await enter(session);}catch(e){$('#boot').classList.add('hidden');$('#auth-error').textContent=e.message;form.elements.password.value='';}finally{state.authBusy=false;button.disabled=false;}
  }

  async function submitBackup(form){if(state.busy)return;const button=form.querySelector('[type="submit"]'),original=button.textContent;const username=form.elements.username.value,password=form.elements.password.value;if(password!==form.elements.confirm.value){$('#backup-error').textContent='兩次輸入的密碼不一致';return;}state.busy=true;button.disabled=true;button.textContent='正在儲存…';try{const challenge=await JC_API.call('account.credentials.challenge',{username});const key=await deriveLoginKey(password,challenge.salt,challenge.iterations);const args={username,nonce:challenge.nonce,key};if(challenge.hasPassword)args.currentKey=await deriveLoginKey(form.elements.currentPassword?.value||'',challenge.currentSalt,challenge.currentIterations);const result=await JC_API.call('account.credentials',args,{requestId:uid()});await refresh(false);close();renderPage();toast(result.message);}catch(e){const node=$('#backup-error');if(node)node.textContent=e.message;}finally{state.busy=false;if(button.isConnected){button.disabled=false;button.textContent=original;}}}

  async function receiptPNG(receipt,index=0){const c=document.createElement('canvas');c.width=1080;c.height=680;const x=c.getContext('2d');x.fillStyle='#f5f6f8';x.fillRect(0,0,1080,680);x.fillStyle='#fff';x.fillRect(30,30,1020,620);x.fillStyle='#f0d16b';x.fillRect(30,30,1020,12);x.fillStyle='#242b35';x.font='700 34px system-ui,sans-serif';x.fillText('江城彩券行',75,104);x.font='15px system-ui,sans-serif';x.fillStyle='#8a929e';x.fillText('JIANGCHENG LOTTERY · ELECTRONIC RECEIPT',75,134);x.textAlign='right';x.font='700 30px system-ui,sans-serif';x.fillStyle='#313b49';x.fillText('六合彩 · 6 / 49',1005,105);x.font='16px system-ui,sans-serif';x.fillStyle='#8a929e';x.fillText('收據 #'+String(index+1).padStart(2,'0'),1005,136);x.textAlign='left';const numbers=receipt.numbers||[];numbers.forEach((n,i)=>{const px=145+i*155;x.beginPath();x.arc(px,259,51,0,Math.PI*2);x.fillStyle='#fbf2d4';x.fill();x.fillStyle='#9c8132';x.font='600 36px system-ui,sans-serif';x.textAlign='center';x.fillText(String(n).padStart(2,'0'),px,272);});x.textAlign='left';x.strokeStyle='#e7ebf0';x.setLineDash([6,6]);x.beginPath();x.moveTo(75,351);x.lineTo(1005,351);x.stroke();x.setLineDash([]);const fields=[['收據編號',String(receipt.receiptId)],['開獎期別',String(receipt.drawId||'—')],['購買時間',new Date(receipt.purchasedAt).toLocaleString('zh-TW',{hour12:false})],['購買金額',fmt(receipt.price)+' RE']];fields.forEach(([label,value],i)=>{x.font='17px system-ui,sans-serif';x.fillStyle='#929ba8';x.fillText(label,80,404+i*43);x.font='500 20px system-ui,sans-serif';x.fillStyle='#4a5564';x.fillText(value,250,404+i*43);});x.font='14px system-ui,sans-serif';x.fillStyle='#a5adb8';x.fillText('虛構 RE 遊戲幣購買憑證 · 請以伺服器紀錄為準',80,615);x.textAlign='right';x.fillText(receipt.status==='PENDING'?'等待開獎':'已結束',1000,615);return await new Promise((resolve,reject)=>c.toBlob(blob=>blob?resolve(blob):reject(new Error('收據圖片產生失敗')),'image/png'));}

  async function downloadReceipts(button){const receipts=selectedReceipts().slice(),owner=P().id;if(!receipts.length||state.receiptExporting)return;state.receiptExporting=true;button.disabled=true;const original=button.innerHTML;modal('正在產生收據',`<p class="muted" id="receipt-export-status">準備 ${receipts.length} 張獨立 PNG 收據…</p><div class="boot-track" style="width:100%;margin:20px 0"><b id="receipt-export-progress" style="display:block;height:100%;width:0%;background:#e2c76e"></b></div><p class="hint">完成後即可下載圖片壓縮檔。</p>`);try{const files=[];for(let i=0;i<receipts.length;i++){if(P()?.id!==owner)return;const blob=await receiptPNG(receipts[i],i);files.push({name:receiptFileName(receipts[i].receiptId),bytes:new Uint8Array(await blob.arrayBuffer())});const status=$('#receipt-export-status'),progress=$('#receipt-export-progress');if(status)status.textContent='已產生 '+(i+1)+' / '+receipts.length+' 張收據';if(progress)progress.style.width=Math.round((i+1)/receipts.length*100)+'%';if(i%5===0)await new Promise(resolve=>requestAnimationFrame(resolve));}if(P()?.id!==owner)return;if(state.receiptZipURL)URL.revokeObjectURL(state.receiptZipURL);state.receiptZipURL=URL.createObjectURL(zipReceipts(files));modal(receipts.length+' 張收據已準備完成',`<p class="muted">每張彩券各有一份獨立 PNG 圖片，已整理成一個 ZIP 壓縮檔。</p><p class="hint">按下方按鈕下載，解壓縮後即可查看全部 ${receipts.length} 張收據。</p>`,`<a class="btn gold" data-ready-receipts href="${state.receiptZipURL}" download="Jiangcheng-Receipts-${receipts.length}.zip">${icon('photo')} 下載 ${receipts.length} 張 PNG 收據</a>`);}catch(e){close();toast(e.message,true);}finally{state.receiptExporting=false;if(button.isConnected){button.disabled=false;button.innerHTML=original;}}}

    if(el.dataset.downloadReceipt){const receipt=selectedReceipts().find(r=>r.receiptId===el.dataset.downloadReceipt);if(receipt)saveDownload(await receiptPNG(receipt,selectedReceipts().indexOf(receipt)),receiptFileName(receipt.receiptId));}
    if(el.dataset.orgDraft)chooseOrgPhoto(el.dataset.orgDraft);
    if(el.dataset.orgUpload)chooseOrgPhoto(el.dataset.orgUpload,el.dataset.orgId);
    if(el.hasAttribute('data-org-retry'))hydrateOrgPhotos();
    if(el.hasAttribute('data-staff-appoint'))openAppointment();
  }catch(e){toast(e.message,true);}});
  document.addEventListener('input',event=>{if(event.target.id==='batch-count'){state.batchGroups=[];state.batchCount=Number(event.target.value);$('#batch-preview').innerHTML='<p class="empty">注數已變更，請重新電腦選號。</p>';$('#batch-count-label').textContent='尚未選號';$('#batch-total').textContent='0 RE';$('#batch-confirm').disabled=true;}});
  document.addEventListener('submit',event=>{const form=event.target;if(form.getAttribute('id')!=='batch-lottery-form')return;event.preventDefault();const groups=state.batchGroups.map(g=>g.slice()),price=Number(state.lottery.markSix.ticketPrice||500);if(!groups.length||Number(form.elements.count.value)!==groups.length)return toast('請先完成本次選號',true);const args=legacyRequest('buyMarkSixTicketsBatchV119',P().nickname,groups);modal('確認購買 '+groups.length+' 注六合彩',`<p class="muted">本次扣除 ${fmt(groups.length*price)} RE，並建立 ${groups.length} 張獨立電子收據。</p><p class="hint">確認後會一次送出全部號碼，不會重新亂數選號。</p>`,`<button class="btn light" data-action="close">返回</button><button class="btn gold" data-mutation="legacy" data-args='${esc(JSON.stringify(args))}'>確認購買 ${groups.length} 注</button>`);});

  nativeInteractions();
  boot();
})();

</script>
</body>
</html>
