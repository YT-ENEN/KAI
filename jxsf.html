<style>

  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--text);background:var(--bg);color-scheme:dark}

:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

.btn{--c1:#ffe48a;--c2:#f3a516;--sh:#9a5806;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:10px 18px;min-height:44px;font-weight:900;font-size:14px;color:#3a2000;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 4px 0 var(--sh),0 8px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.65);transition:transform .08s,box-shadow .08s,filter .15s;user-select:none;white-space:nowrap}

.btn.pink{--c1:#ff8cc6;--c2:#e5308a;--sh:#8a124d;color:#fff}.btn.cyan{--c1:#9af3ff;--c2:#1db4df;--sh:#0a5f7e;color:#00293a}
.btn.green{--c1:#90f8c8;--c2:#14c27b;--sh:#086e44;color:#00341f}.btn.red{--c1:#ff9aa8;--c2:#e8374f;--sh:#86132a;color:#fff}
.btn.dark{--c1:#40307a;--c2:#2a1b55;--sh:#130a2c;color:var(--text)}.btn.sm{min-height:34px;padding:6px 12px;font-size:12px;border-radius:11px}.btn.block{width:100%}

.pill.gold{background:rgba(255,210,94,.15);color:var(--gold);border-color:rgba(255,210,94,.35)}.pill.pink{background:rgba(255,79,163,.15);color:#ff9ccb;border-color:rgba(255,79,163,.35)}.pill.green{background:rgba(46,229,157,.14);color:#7ff5c4;border-color:rgba(46,229,157,.3)}

.tabs button{flex:1 0 auto;padding:9px 14px;border-radius:11px;font-weight:800;color:var(--muted);font-size:13px}.tabs button.on{background:linear-gradient(180deg,#ffe48a,#f3a516);color:#3a2000;box-shadow:0 3px 0 #9a5806}

.login{min-height:100dvh;display:grid;place-items:center;padding:20px}
.login-box{width:min(420px,100%);padding:28px 24px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02)),#1d1040;border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.5)}
.login-box h1{font-size:30px;font-weight:900;text-align:center;margin:16px 0 4px}.login-box>p{text-align:center}
#google-signin{display:flex;justify-content:center;min-height:44px;margin:22px 0 6px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0 14px}.divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.12)}
/* HUD + dock */
.hud{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(180deg,#1b0c38,rgba(27,12,56,.94));border-bottom:1px solid var(--line)}
.hud-me{display:flex;align-items:center;gap:10px;min-width:0;text-align:left}.hud-name{min-width:0}.hud-name b{display:block;font-size:14px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:900;color:var(--gold)}.lv .bar{width:70px;height:6px}
.hud-res{display:flex;gap:6px;align-items:center}.hud-res .pill{font-size:13px;padding:5px 10px;background:rgba(0,0,0,.35)}.hud-res .coin b{color:var(--gold)}
.net{background:#5a2a10;color:#ffd7a8;font-size:12px;padding:8px 14px;text-align:center}
main{max-width:1100px;margin:0 auto;padding:18px 14px 120px}
.dock{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#170a31;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.45)}

.dock button.on{color:var(--gold);background:rgba(255,210,94,.1)}.dock button.on i{filter:none;transform:translateY(-3px) scale(1.12)}

.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:900;font-size:calc(var(--s)*.42);color:#fff;position:relative;background:var(--bgc,#5b3ea8);border:2px solid rgba(255,255,255,.2);overflow:visible}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}.av.lg{--s:76px}.av.sm{--s:32px}

@keyframes ring{to{transform:rotate(360deg)}}

.hero{position:relative;overflow:hidden;border-radius:24px;padding:24px;min-height:210px;display:flex;align-items:center;background:linear-gradient(120deg,#ff3d81 0,#8a2be2 55%,#2a1a7a 100%);border:1px solid rgba(255,255,255,.18);box-shadow:0 16px 40px rgba(120,30,150,.45)}
.hero h1{font-size:32px;font-weight:900;line-height:1.2;margin:4px 0 8px;text-shadow:0 3px 0 rgba(0,0,0,.2)}.hero .kicker{font-weight:800;opacity:.9}.hero .sub{opacity:.92;margin-bottom:16px}

.hero>div{position:relative;z-index:1;max-width:62%}
.mission{display:flex;align-items:center;gap:12px}.mission .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(255,255,255,.08);flex-shrink:0}.mission>div{flex:1;min-width:0}.mission h4{font-size:14px;font-weight:900}.mission p{font-size:12px;color:var(--muted)}
.miles{display:flex;gap:6px;margin-top:10px}.miles .btn{flex:1;padding:6px 4px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px;scroll-snap-type:x mandatory}.hscroll::-webkit-scrollbar{display:none}.hscroll>*{scroll-snap-align:start}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

/* game tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:3/3.6;padding:14px;border-radius:20px;overflow:hidden;background:var(--g);text-align:left;border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s}
.tile:hover{transform:translateY(-4px)}.tile:active{transform:scale(.97)}
.tile .e{position:absolute;top:12%;left:50%;transform:translateX(-50%);font-size:68px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.35));transition:transform .2s}.tile:hover .e{transform:translateX(-50%) scale(1.1) rotate(-6deg)}
.tile::after{content:"";position:absolute;inset:auto 0 0;height:55%;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}
.tile h3,.tile p{position:relative;z-index:1}.tile h3{font-size:17px;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.4)}.tile p{font-size:11px;opacity:.85}
.tile .tag{position:absolute;top:10px;right:10px;z-index:2;font-size:10px;font-weight:900;padding:3px 8px;border-radius:99px;background:#fff;color:#c2185b;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.fav{position:absolute;top:8px;left:8px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.3);font-size:14px;display:grid;place-items:center}
/* sic bo */
.table-felt{position:relative;max-width:760px;margin:0 auto;border-radius:26px;padding:18px;background:radial-gradient(ellipse at 50% 30%,#1f6b4f 0,#0d3d2c 70%);border:6px solid #7a4a17;box-shadow:inset 0 0 0 2px #d9a24a,inset 0 0 60px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.45)}
.dice-stage{position:relative;height:190px;display:flex;align-items:center;justify-content:center;gap:24px;perspective:700px}
.die{width:60px;height:60px;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.9,.25,1.05)}
.face{position:absolute;inset:0;border-radius:12px;background:linear-gradient(145deg,#fff,#e9e3d4);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;box-shadow:inset 0 -4px 6px rgba(0,0,0,.12),inset 0 0 0 1px rgba(0,0,0,.08);backface-visibility:hidden}
.face i{width:11px;height:11px;border-radius:50%;place-self:center;opacity:0;background:#1d1530;box-shadow:inset 0 2px 2px rgba(0,0,0,.4)}.face i.on{opacity:1}.face.red i{background:#d61f3d}
.f1{transform:translateZ(30px)}.f6{transform:rotateY(180deg) translateZ(30px)}.f2{transform:rotateY(90deg) translateZ(30px)}.f5{transform:rotateY(-90deg) translateZ(30px)}.f3{transform:rotateX(90deg) translateZ(30px)}.f4{transform:rotateX(-90deg) translateZ(30px)}
.bowl{position:absolute;left:50%;top:6px;width:260px;height:175px;margin-left:-130px;border-radius:130px 130px 40px 40px;background:radial-gradient(circle at 35% 25%,#ffe6a0,#d99a2b 45%,#8a5512);box-shadow:inset 0 -14px 20px rgba(0,0,0,.35),0 16px 30px rgba(0,0,0,.45);z-index:3;transition:transform .55s cubic-bezier(.3,1.4,.5,1),opacity .4s;display:grid;place-items:center;font-size:40px;color:#6b3a07;font-weight:900}
.bowl.up{transform:translateY(-210px) rotate(-8deg);opacity:0}.bowl.shake{animation:shake .32s linear infinite}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-9px,3px) rotate(-5deg)}50%{transform:translate(8px,-2px) rotate(4deg)}75%{transform:translate(-5px,2px) rotate(-3deg)}100%{transform:translate(0,0) rotate(0)}}
.dice-result{text-align:center;min-height:56px}.dice-result b{display:block;font-size:30px;font-weight:900;letter-spacing:.05em}.dice-result.win b{color:#ffe35e;text-shadow:0 0 18px rgba(255,220,80,.8)}.dice-result.lose b{color:#ff8fa0}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.bets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}

.bet b{display:block;font-size:26px;font-weight:900}.bet span{font-size:11px;color:#cfe8dc}.bet em{font-style:normal;position:absolute;top:6px;right:8px;font-size:11px;color:var(--gold);font-weight:900}
.bet.on{background:rgba(255,210,94,.22);border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,94,.25),0 0 22px rgba(255,210,94,.35);transform:translateY(-2px)}
.bet.big b{color:#ff8a8a}.bet.small b{color:#8ac7ff}.bet.triple{grid-column:1/-1}.bet.triple b{color:var(--gold);font-size:20px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 8px}

.mkt{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px}.stock-list{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto}
.stock{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;text-align:left;font-weight:800;font-size:13px}.stock small{display:block;font-size:10px;color:var(--muted);font-weight:600}.stock.on{background:rgba(255,210,94,.14);box-shadow:inset 0 0 0 1px rgba(255,210,94,.35)}
.chart{width:100%;height:230px;display:block}.side{display:flex;background:rgba(0,0,0,.3);border-radius:12px;padding:4px}.side button{flex:1;padding:9px;border-radius:9px;font-weight:900;color:var(--muted)}.side .on.BUY{background:#e5394f;color:#fff}.side .on.SELL{background:#14b874;color:#fff}

.post{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}.post-h{display:flex;gap:10px;align-items:center;padding:12px 14px}.post-h b{font-size:14px}.post-h small{display:block;color:var(--muted);font-size:11px}

<body>
<div id="boot" class="boot"><div class="boot-box"><div class="logo-coin">JC</div><h1>江城大賭場</h1><p class="muted" id="boot-label">載入中…</p><div class="bar"><b id="boot-bar" style="width:5%"></b></div><p id="boot-err" class="err"></p><div class="row center"><button class="btn sm hidden" id="boot-retry">重試</button><button class="btn dark sm hidden" id="boot-login">返回登入</button></div></div></div>

<section id="login" class="login hidden"><div class="login-box">
  <div class="logo-coin">JC</div><h1>我是<span class="gold-t">江城首富</span></h1><p class="muted">骰寶・麻將・德州・拉霸・股票・選舉，一個帳號全部玩。</p>
  <div id="google-signin"></div><p id="login-status" class="muted small" style="text-align:center">Google 登入準備中…</p>
  <div class="divider">或使用帳號密碼</div>
  <div class="tabs" id="auth-tabs"><button class="on" data-auth="login">登入</button><button data-auth="register">註冊</button></div>
  <form id="f-login" class="stack"><div class="field"><label>帳號</label><input name="username" autocomplete="username" pattern="[A-Za-z][A-Za-z0-9_]{2,23}" required></div><div class="field"><label>密碼</label><input name="password" type="password" minlength="10" maxlength="128" autocomplete="current-password" required></div><button class="btn block">🎲 進入江城</button></form>
  <form id="f-register" class="stack hidden"><div class="field"><label>遊戲暱稱</label><input name="nickname" maxlength="20" required></div><div class="field"><label>帳號（英文開頭 3–24 字）</label><input name="username" pattern="[A-Za-z][A-Za-z0-9_]{2,23}" autocomplete="username" required></div><div class="field"><label>密碼（至少 10 字）</label><input name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></div><div class="field"><label>再輸入一次</label><input name="confirm" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></div><button class="btn pink block">建立帳號</button></form>
  <p id="auth-err" class="err" role="alert"></p>
  <p class="muted small" style="text-align:center">RE 為虛構遊戲幣，所有行情與遊戲皆為模擬。</p>
</div></section>

<div id="app" class="hidden"><header class="hud" id="hud"></header><div id="net" class="net hidden" role="status"></div><main id="view"></main><nav class="dock" id="dock" aria-label="主要選單"></nav></div>
<div id="modal"></div><div id="toasts" aria-live="polite"></div>
<section id="classic" class="classic hidden" aria-label="遊戲"><header class="classic-h"><button class="btn dark sm" id="classic-back">‹ 返回</button><b id="classic-title">遊戲</b><button class="btn dark sm" id="classic-home">🏠</button></header><div id="classic-loading" class="classic-loading"><p>🎲 正在準備遊戲…</p></div></section>

<!-- ▼▼ 步驟②：把舊版 HTML 的 <script id="jc-classic-bundle" …>…</script> 整段（很長的那一行）取代下面這一行 ▼▼ -->
<script id="jc-classic-bundle" type="application/octet-stream" data-encoding="gzip-base64"></script>
<!-- ▲▲ 步驟② 結束 ▲▲ -->

<script>
(() => {
'use strict';
/* ============================ 工具 ============================ */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('zh-TW', {maximumFractionDigits: 2}).format(Number(n) || 0);
const short = n => { n = Number(n) || 0; const a = Math.abs(n); if (a >= 1e8) return (n / 1e8).toFixed(a >= 1e10 ? 0 : 2).replace(/\.?0+$/, '') + '億'; if (a >= 1e5) return (n / 1e4).toFixed(a >= 1e6 ? 0 : 1).replace(/\.0$/, '') + '萬'; return fmt(n); };
const dt = n => n ? new Date(n).toLocaleString('zh-TW', {hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'}) : '—';
const uid = () => crypto.randomUUID();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const J = o => esc(JSON.stringify(o));
const hex = n => [...crypto.getRandomValues(new Uint8Array(n))].map(v => v.toString(16).padStart(2, '0')).join('');

/* ============================ 連線（與後端 bridge 相容） ============================ */
const SESSION_KEY = 'JC_SESSION';
const getSession = () => { try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY) || 'null'); } catch { return null; } };
const setSession = s => { const v = JSON.stringify(s); sessionStorage.setItem(SESSION_KEY, v); localStorage.setItem(SESSION_KEY, v); };
const clearSession = () => { sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_KEY); };

const API = (() => {
  const channel = hex(24); let peer, peerOrigin, ready, seq = 0, active = 0;
  const pending = new Map(), queue = [], inFlight = new Map(), last = new Map();
  const configured = () => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(JC_CONFIG.API_URL || '');
  const trusted = o => { try { const h = new URL(o).hostname; return h === 'script.google.com' || h === 'script.googleusercontent.com' || h.endsWith('-script.googleusercontent.com'); } catch { return false; } };
  addEventListener('message', e => {
    const m = e.data; if (!m || m.channel !== channel || !trusted(e.origin)) return;
    if (m.type === 'JC_READY' && !peer) { peer = e.source; peerOrigin = e.origin; return; }
    if (m.type !== 'JC_RESULT' || e.source !== peer || e.origin !== peerOrigin) return;
    const t = pending.get(m.id); if (!t) return; clearTimeout(t.timeout); pending.delete(m.id);
    if (m.result?.ok) t.resolve(m.result.data); else { const err = new Error(m.result?.error?.message || '連線失敗'); err.code = m.result?.error?.code || 'NETWORK'; t.reject(err); }
  });
  function connect() {
    if (ready) return ready;
    ready = (async () => {
      if (!configured()) { const e = new Error('請先在 HTML 開頭填入 Apps Script 網址'); e.code = 'CONFIG'; throw e; }
      const f = document.createElement('iframe'); f.hidden = true; f.title = '安全連線'; f.referrerPolicy = 'strict-origin';
      f.src = JC_CONFIG.API_URL + '?bridge=1&origin=' + encodeURIComponent(location.origin) + '&channel=' + channel; document.body.appendChild(f);
      for (let i = 0; i < 160; i++) { if (peer) return; await sleep(125); }
      f.remove(); const e = new Error('無法連線伺服器：請確認後端已部署給「所有人」，且 PUBLIC_ORIGINS 包含此網站。'); e.code = 'NETWORK'; throw e;
    })().catch(e => { ready = null; throw e; });
    return ready;
  }
  function raw(body) { return new Promise((resolve, reject) => { const id = 'r' + (++seq); const timeout = setTimeout(() => { pending.delete(id); const e = new Error('連線逾時，結果尚未確認。'); e.code = 'TIMEOUT'; reject(e); }, 45000); pending.set(id, {resolve, reject, timeout}); peer.postMessage({type: 'JC_RPC', channel, id, body: JSON.stringify(body)}, peerOrigin); }); }
  function pump() { while (active < 3 && queue.length) { const t = queue.shift(); active++; raw(t.body).then(t.resolve, t.reject).finally(() => { active--; pump(); }); } }
  async function call(action, args = {}, opt = {}) {
    await connect(); const s = getSession();
    const body = {action, args, token: s?.token || '', requestId: opt.requestId || uid()};
    return new Promise((resolve, reject) => { const task = {body, resolve, reject}; if (opt.urgent) queue.unshift(task); else queue.push(task); pump(); });
  }
  // 同一份讀取在 ttl 內只打一次伺服器，並合併同時發出的請求
  function cached(action, args = {}, ttl = 10000) {
    const key = action + JSON.stringify(args), old = last.get(key);
    if (old && Date.now() - old.at < ttl) return Promise.resolve(old.data);
    if (inFlight.has(key)) return inFlight.get(key);
    const p = call(action, args).then(d => { last.set(key, {data: d, at: Date.now()}); return d; }).finally(() => inFlight.delete(key));
    inFlight.set(key, p); return p;
  }
  const read = /^(get|checkNotifications|searchPlayers)/;
  function legacy(name, args) {
    const key = 'L:' + name + JSON.stringify(args);
    if (read.test(name)) {
      const old = last.get(key), ttl = /RoomState|MahjongState|BingoRoomState/.test(name) ? 1500 : 7000;
      if (document.hidden && old) return Promise.resolve(old.data);
      if (old && Date.now() - old.at < ttl) return Promise.resolve(old.data);
      if (inFlight.has(key)) return inFlight.get(key);
      const p = call('legacy', {name, args}).then(d => { last.set(key, {data: d, at: Date.now()}); if (last.size > 200) last.delete(last.keys().next().value); return d; }).finally(() => inFlight.delete(key));
      inFlight.set(key, p); return p;
    }
    return call('legacy', {name, args}, {urgent: true}).then(r => { invalidate(); return r; });
  }
  const invalidate = () => last.clear();
  return {connect, call, cached, legacy, invalidate, configured};
})();
window.JC_API = API;

/* ============================ 狀態 ============================ */
const S = {
  snap: null, sig: '', route: 'lobby', tab: {finance: 'market', civic: 'election', social: 'feed', me: 'profile', games: 'all'},
  market: null, symbol: '1001', interval: '5m', side: 'BUY', politics: null, party: null, bank: null, company: null, community: null, chatList: null,
  feed: null, feedNext: '', photo: '', busy: false, online: true, timer: 0, lastSync: 0, composeImage: null, sectionErr: '',
  dice: {bet: 1000, choice: 'BIG', rolling: false, history: [], spin: 0, lastReq: null, lastDice: [1, 2, 3], stats: {B: 0, S: 0, T: 0}}
};
const P = () => S.snap?.player;
const acct = () => S.snap?.accountEmail || getSession()?.email || '';
const energy = () => { const p = P(); if (!p) return 0; return Math.min(10, p.energy + Math.floor((Date.now() - p.energyAt) / 600000)); };
const level = p => Math.floor((p?.xp || 0) / 100) + 1;

/* ============================ UI 基礎 ============================ */
function toast(text, err = false) { const el = document.createElement('div'); el.className = 'toast' + (err ? ' err' : ''); el.textContent = text; $('#toasts').append(el); while ($('#toasts').children.length > 3) $('#toasts').firstElementChild.remove(); setTimeout(() => el.remove(), err ? 6500 : 3200); }
function modal(title, body, actions = '') { $('#modal').innerHTML = `<div class="modal-bg" data-bg><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h2>${title}</h2><button class="modal-x" data-act="close" aria-label="關閉">×</button></div><div class="modal-b">${body}${actions ? `<div class="modal-actions">${actions}</div>` : ''}</div></section></div>`; }
const closeModal = () => { $('#modal').innerHTML = ''; };
const modalOpen = () => !!$('#modal').children.length;
const typing = () => !!document.activeElement?.closest('#view input,#view textarea,#view select');
function netBanner(msg) { const n = $('#net'); if (msg) { n.textContent = msg; n.classList.remove('hidden'); } else n.classList.add('hidden'); S.online = !msg; }

const FX = {gold: '#ffd25e', arc: '#6fd3ff', star: '#b9a6ff', prism: '#ff9ad5', frost: '#bfe7ff', bloom: '#ffb3cc', solar: '#ffc24a', pulse: '#ff7aa2', orbit: '#a59bff'};
function frameOf(id) { if (!id) return ''; const it = S.snap?.shop?.find(i => i.id === id); return it?.effect || (id === 'FRAME' ? 'gold' : ''); }
function avatar(name, id, size = '', frame) {
  let h = 0; for (const c of String(id || name)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const fx = frameOf(frame), mine = id && id === P()?.id && S.photo;
  return `<span class="av ${size} ${fx ? 'fx' : ''}" style="--bgc:hsl(${h % 360},55%,45%);${fx ? '--fx:' + FX[fx] : ''}">${mine ? `<img src="${S.photo}" alt="">` : esc(String(name || '?').slice(0, 1))}</span>`;
}

function setLoad(pct, label) { $('#boot-bar').style.width = pct + '%'; if (label) $('#boot-label').textContent = label; }
function showBoot(label) { $('#boot').classList.remove('hidden'); $('#boot-err').textContent = ''; $('#boot-retry').classList.add('hidden'); $('#boot-login').classList.add('hidden'); setLoad(10, label); }
function bootFail(e) { $('#boot-err').textContent = e.message || '載入失敗'; $('#boot-retry').classList.remove('hidden'); $('#boot-login').classList.remove('hidden'); }

/* ============================ 動作 ============================ */
async function refresh() {
  const data = await API.call('snapshot');
  const sig = JSON.stringify(data.player) + data.cash + data.available + JSON.stringify(data.city);
  S.snap = data; netBanner('');
  const changed = sig !== S.sig; S.sig = sig;
  renderHud();
  return changed;
}
const DEPENDS_ON_SNAP = ['lobby', 'me', 'finance', 'civic', 'dice'];
async function act(action, args = {}, btn, requestId) {
  if (S.busy) return; S.busy = true;
  const id = requestId || uid(), html = btn?.innerHTML;
  if (btn) { btn.disabled = true; btn.textContent = '處理中…'; }
  try {
    const r = await API.call(action, args, {requestId: id, urgent: true});
    if (r?.status === 'error') throw new Error(r.message || '操作未完成');
    API.invalidate(); toast(r?.message || '已完成');
    closeModal();
    if (r?.cards) showCards(r.cards);
    await refresh().catch(() => {});
    await loadSection(true);
    return r;
  } catch (e) {
    if (e.code === 'AUTH') { clearSession(); showLogin(e.message); }
    else if (e.code === 'TIMEOUT' || e.code === 'NETWORK') {
      modal('結果待確認', `<p class="muted">${esc(e.message)}</p><p class="small muted" style="margin-top:8px">重試會使用相同操作編號，伺服器不會重複扣款。</p>`, `<button class="btn" data-retry='${J({action, args, id})}'>重試原操作</button>`);
    } else toast(e.message, true);
  } finally { S.busy = false; if (btn?.isConnected) { btn.disabled = false; btn.innerHTML = html; } }
}
function showCards(cards) { modal('🎁 抽卡結果', `<div class="grid2">${cards.map(c => `<div class="card pop" style="text-align:center"><span class="pill gold">${esc(c.rarity)}</span><div style="font-size:40px;margin:8px 0">${c.id === 'SPEAKER' ? '👑' : c.id.startsWith('RUN_') ? '🗳️' : c.id === 'BANK_EXEC' ? '🏦' : '🃏'}</div><b>${esc(c.name)}</b><p class="small muted">${esc(c.desc)}</p></div>`).join('')}</div>`); }

async function loadSection(render = true) {
  if (!S.snap) return; const r = S.route, t = S.tab[r], jobs = [];
  S.sectionErr = '';
  if (r === 'lobby' || (r === 'finance' && ['market', 'orders'].includes(t))) jobs.push(API.cached('market', {symbol: S.symbol, interval: S.interval}, 30000).then(x => S.market = x));
  if (r === 'finance' && t === 'company') jobs.push(API.cached('company', {}, 15000).then(x => S.company = x));
  if ((r === 'finance' && t === 'bank') || (r === 'civic' && t === 'bank')) jobs.push(API.cached('bank', {}, 15000).then(x => S.bank = x));
  if (r === 'civic') { jobs.push(API.cached('politics', {}, 20000).then(x => S.politics = x)); if (t === 'party') jobs.push(API.cached('party', {}, 15000).then(x => S.party = x)); }
  if (r === 'social') { jobs.push(API.cached('community', {}, 30000).then(x => S.community = x)); if (t === 'people') jobs.push(API.cached('chat.list', {}, 20000).then(x => S.chatList = x)); if (t === 'feed' && S.feed === null) jobs.push(fetchFeed()); }
  if (r === 'dice' && !S.dice.loaded) jobs.push(API.call('dice.history').then(x => { S.dice.loaded = true; S.dice.history = (x.history || []).map(h => ({dice: h.d, total: h.t, isWin: h.w})); }).catch(() => { S.dice.loaded = true; }));
  const res = await Promise.allSettled(jobs);
  const fail = res.find(x => x.status === 'rejected');
  if (fail) { if (fail.reason?.code === 'AUTH') { clearSession(); return showLogin(fail.reason.message); } S.sectionErr = fail.reason?.message || '資料讀取失敗'; }
  if (render && !typing() && !modalOpen() && !classicOpen() && !S.dice.rolling) renderView();
}

/* ============================ 導覽 ============================ */
const DOCK = [['lobby', '🏠', '大廳'], ['games', '🎲', '遊戲'], ['finance', '📈', '金融'], ['social', '💬', '社交'], ['me', '👤', '我的']];
const ROUTES = ['lobby', 'games', 'dice', 'finance', 'civic', 'social', 'me'];
function go(route, tab) {
  if (!ROUTES.includes(route)) route = 'lobby';
  if (tab) S.tab[route] = tab;
  S.route = route; history.replaceState(null, '', '#' + route + (S.tab[route] && route !== 'lobby' && route !== 'dice' ? ':' + S.tab[route] : ''));
  renderDock(); renderView(); scrollTo({top: 0}); loadSection(true);
}
function renderDock() { const cur = S.route === 'dice' ? 'games' : S.route === 'civic' ? 'lobby' : S.route; $('#dock').innerHTML = DOCK.map(([id, e, n]) => `<button data-go="${id}" class="${cur === id ? 'on' : ''}" ${cur === id ? 'aria-current="page"' : ''}><i>${e}</i>${n}</button>`).join(''); }
let coinShown = 0;
function renderHud() {
  const p = P(), s = S.snap; if (!p) return;
  $('#hud').innerHTML = `<button class="hud-me" data-go="me">${avatar(p.nickname, p.id, '', p.avatarFrame)}<span class="hud-name"><b>${esc(p.nickname)}</b><span class="lv">LV ${level(p)}<span class="bar"><b style="width:${p.xp % 100}%"></b></span></span></span></button>
  <div class="hud-res"><span class="pill coin" title="可用遊戲幣"><i>🪙</i><b id="hud-coin" class="num">${short(coinShown || s.cash)}</b></span><span class="pill" title="行動力，每 10 分鐘 +1">⚡ <b>${energy()}</b></span><button class="pill" data-act="refresh" aria-label="重新整理">⟳</button></div>`;
  tweenCoin(s.cash);
}
function tweenCoin(to) {
  const from = coinShown || to; coinShown = to; if (from === to) return;
  const t0 = performance.now(), el = () => $('#hud-coin');
  const step = now => { const k = Math.min(1, (now - t0) / 700), v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (el()) el().textContent = short(v); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function tabs(route, items) { return `<div class="tabs" role="tablist">${items.map(([id, n]) => `<button data-tab="${id}" data-route="${route}" class="${S.tab[route] === id ? 'on' : ''}">${n}</button>`).join('')}</div>`; }
function renderView() {
  if (!S.snap) return;
  const v = {lobby: vLobby, games: vGames, dice: vDice, finance: vFinance, civic: vCivic, social: vSocial, me: vMe}[S.route] || vLobby;
  $('#view').innerHTML = (S.sectionErr ? `<div class="note" style="margin-bottom:12px">⚠️ ${esc(S.sectionErr)} <button class="link" data-act="refresh">重試</button></div>` : '') + v();
  if ($('#k-chart')) drawChart();
  if (S.route === 'dice') setDice(S.dice.lastDice, true);
  hydrateImages();
}

    el.style.transform = `rotateZ(${tilt}deg) rotateX(${S.dice.spin + x}deg) rotateY(${S.dice.spin + y}deg)`;
    if (instant) { el.offsetHeight; el.style.transition = ''; }
  });
}
const CHIPS = [[100, '#607d8b'], [500, '#8e24aa'], [1000, '#e53935'], [5000, '#1e88e5'], [10000, '#43a047'], [50000, '#111']];
const CHOICE = {BIG: ['大', '11–17', '1:1', 'big'], SMALL: ['小', '4–10', '1:1', 'small'], ODD: ['單', '總和單數', '1:1', ''], EVEN: ['雙', '總和雙數', '1:1', ''], TRIPLE: ['圍骰 · 三顆相同', '任一圍骰', '1:30', 'triple']};

function diceRules() { modal('🎲 骰寶規則', `<div class="stack small"><p>三顆骰子由伺服器以安全亂數擲出，畫面只播放動畫，不會影響結果。</p><div class="list-row"><div><h4>大 / 小（1:1）</h4><p>總和 11–17 為大、4–10 為小。</p></div></div><div class="list-row"><div><h4>單 / 雙（1:1）</h4><p>總和為單數或雙數。</p></div></div><div class="list-row"><div><h4>圍骰（1:30）</h4><p>三顆點數相同即中獎。開出圍骰時，大小單雙全部由莊家通吃。</p></div></div><p class="muted">有貸款時，獲利的 10% 會自動還款。單注 100–1,000,000 RE。</p></div>`); }
function spawnCoins() {
  const to = $('#hud-coin')?.getBoundingClientRect(), from = $('#dice-result')?.getBoundingClientRect(); if (!to || !from) return;
  for (let i = 0; i < 10; i++) { const c = document.createElement('span'); c.className = 'coin-fx'; c.textContent = '🪙'; const x = from.left + from.width / 2 + (Math.random() * 120 - 60), y = from.top; c.style.left = x + 'px'; c.style.top = y + 'px'; c.style.setProperty('--dx', (to.left - x) + 'px'); c.style.setProperty('--dy', (to.top - y) + 'px'); c.style.animationDelay = i * 50 + 'ms'; document.body.append(c); setTimeout(() => c.remove(), 1300); }
}
async function roll(retryId) {
  const d = S.dice; if (d.rolling) return;
  if (!retryId) { if (d.bet < 100) return toast('最低押注 100 RE', true); if (d.bet > S.snap.cash) return toast('餘額不足', true); }
  const reqId = retryId || uid(); d.lastReq = {id: reqId, bet: d.bet, choice: d.choice};
  d.rolling = true; renderView(); const t0 = Date.now();
  let r;
  try {
    r = await API.call('dice.play', {bet: d.lastReq.bet, choice: d.lastReq.choice}, {requestId: reqId, urgent: true});
  } catch (e) {
    if (/未知的操作/.test(e.message) && ['BIG', 'SMALL'].includes(d.choice)) {
      try { r = await API.legacy('playDiceGame', [acct(), d.bet, d.choice.toLowerCase()]); if (r?.status === 'error') throw new Error(r.message); r.profit = (r.isWin ? d.bet : -d.bet) - (r.repayAmt || 0); toast('後端尚未安裝 4.0 修補包，暫用舊版骰子'); }
      catch (e2) { e = e2; }
    }
    if (!r) { d.rolling = false; if (e.code === 'AUTH') { clearSession(); return showLogin(e.message); } if (e.code !== 'TIMEOUT' && e.code !== 'NETWORK') d.lastReq = null; renderView(); return toast(e.message, true); }
  }
  d.lastReq = null;
  await sleep(Math.max(0, 1000 - (Date.now() - t0)));
  d.spin += 1080; setDice(r.dice, true);
  const bowl = $('#bowl'); if (bowl) { bowl.classList.remove('shake'); await sleep(120); bowl.classList.add('up'); }
  await sleep(450);
  const triple = r.dice[0] === r.dice[1] && r.dice[1] === r.dice[2];
  d.lastDice = r.dice; d.history.unshift({dice: r.dice, total: r.total, isWin: r.isWin});
  d.stats[triple ? 'T' : r.total >= 11 ? 'B' : 'S']++;
  d.rolling = false; S.snap.cash = r.newBalance; renderHud(); renderView();
  const box = $('#dice-result');
  if (box) { box.className = 'dice-result pop ' + (r.isWin ? 'win' : 'lose'); box.innerHTML = `<b>${r.dice.join(' · ')} ＝ ${r.total} 點 ${triple ? '圍骰！' : r.total >= 11 ? '大' : '小'}</b><span class="${r.isWin ? '' : 'muted'}">${r.isWin ? '贏得 +' + fmt(r.profit) + ' RE 🎉' : '輸 ' + fmt(Math.abs(r.profit)) + ' RE'}${r.repayAmt ? '（自動還款 ' + fmt(r.repayAmt) + '）' : ''}</span>`; }
  if (r.isWin) spawnCoins();
  if (navigator.vibrate) navigator.vibrate(r.isWin ? [30, 40, 60] : 20);
}

function drawChart() {
  const cv = $('#k-chart'), bars = S.market?.candles; if (!cv || !bars?.length) return;
  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2), W = r.width, H = r.height; cv.width = W * dpr; cv.height = H * dpr;
  const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const lo = Math.min(...bars.map(b => b.l)) * .998, hi = Math.max(...bars.map(b => b.h)) * 1.002, y = v => 10 + (hi - v) / (hi - lo) * (H - 50), step = (W - 46) / bars.length, mv = Math.max(...bars.map(b => b.v));
  c.font = '10px sans-serif'; c.textAlign = 'right';
  for (let i = 0; i < 4; i++) { const v = lo + (hi - lo) * i / 3; c.strokeStyle = 'rgba(255,255,255,.08)'; c.beginPath(); c.moveTo(0, y(v)); c.lineTo(W - 42, y(v)); c.stroke(); c.fillStyle = '#b9abd9'; c.fillText(v.toFixed(2), W, y(v) + 3); }
  bars.forEach((b, i) => { const x = i * step + step / 2; c.strokeStyle = c.fillStyle = b.c >= b.o ? '#ff6b7f' : '#36e3a0'; c.beginPath(); c.moveTo(x, y(b.h)); c.lineTo(x, y(b.l)); c.stroke(); c.fillRect(x - step * .3, Math.min(y(b.o), y(b.c)), Math.max(1, step * .6), Math.max(1, Math.abs(y(b.o) - y(b.c)))); c.globalAlpha = .25; c.fillRect(x - step * .3, H - 4 - b.v / mv * 30, Math.max(1, step * .6), b.v / mv * 30); c.globalAlpha = 1; });
  [[5, '#ffd25e'], [20, '#9aa6ff']].forEach(([n, col]) => { c.strokeStyle = col; c.beginPath(); for (let i = n - 1; i < bars.length; i++) { const a = bars.slice(i - n + 1, i + 1).reduce((s, b) => s + b.c, 0) / n, x = i * step + step / 2; i === n - 1 ? c.moveTo(x, y(a)) : c.lineTo(x, y(a)); } c.stroke(); });
}

/* ============================ 照片 / 帳密 ============================ */
async function compress(file) {
  if (!file || !/^image\//.test(file.type)) throw new Error('請選擇照片檔');
  if (file.size > 12e6) throw new Error('照片請小於 12 MB');
  const url = URL.createObjectURL(file);
  try { const img = new Image(); img.src = url; await img.decode(); const k = Math.min(1, 512 / Math.max(img.naturalWidth, img.naturalHeight)), cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k)); const c = cv.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height); c.drawImage(img, 0, 0, cv.width, cv.height); let d = cv.toDataURL('image/jpeg', .78); if (d.length > 210000) d = cv.toDataURL('image/jpeg', .55); if (d.length > 210000) throw new Error('照片太大，請換小一點的'); return {mime: 'image/jpeg', base64: d.split(',')[1]}; }
  finally { URL.revokeObjectURL(url); }
}
function pickImage(cb) { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/jpeg,image/png,image/webp'; i.onchange = async () => { try { if (i.files[0]) cb(await compress(i.files[0])); } catch (e) { toast(e.message, true); } }; i.click(); }
async function loadPhoto() { if (!P()?.photo) return; try { const x = await API.call('photo'); S.photo = 'data:' + x.mime + ';base64,' + x.base64; renderHud(); if (S.route === 'me') renderView(); } catch {} }
async function deriveKey(pw, saltHex, iterations) {
  if (!crypto.subtle) throw new Error('請透過 HTTPS 開啟'); if (pw.length < 10 || pw.length > 128) throw new Error('密碼需 10–128 字');
  const salt = Uint8Array.from(saltHex.match(/../g) || [], v => parseInt(v, 16)), key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt, iterations}, key, 256);
  return [...new Uint8Array(bits)].map(v => v.toString(16).padStart(2, '0')).join('');
}

async function classicSource() {
  if (!classicPromise) classicPromise = (async () => {
    const enc = ($('#jc-classic-bundle')?.textContent || '').trim();

});
function composePost() { S.composeImage = null; modal('📸 分享江城日常', `<form data-form="post" class="stack"><textarea name="text" maxlength="600" placeholder="今天贏了多少？"></textarea><img id="compose-pv" class="hidden" style="width:100%;max-height:260px;object-fit:contain;border-radius:12px" alt="預覽"><div class="row between"><button type="button" class="btn dark sm" data-act="post-photo">📷 加照片</button><button class="btn pink">發布</button></div></form>`); }
async function showComments(id) { const d = await API.call('post.read', {id}); modal('💬 留言', `${(d.comments || []).map(c => `<div class="list-row"><div><h4>${esc(c.name)}</h4><p style="color:var(--text)">${esc(c.text)}</p><p>${dt(c.at)}</p></div></div>`).join('') || '<p class="empty">還沒有留言</p>'}<form data-form="comment" class="row" style="margin-top:10px"><input type="hidden" name="id" value="${esc(id)}"><input name="text" maxlength="200" required placeholder="留言…" style="flex:1"><button class="btn sm">送出</button></form>`); }
function openBackup() { const has = !!P().localUsername; modal(has ? '更改備用密碼' : '設定備用帳密', `<form id="f-backup" class="stack"><p class="small muted">登入同一個遊戲帳戶，保留所有進度。</p><div class="field"><label>帳號</label><input name="username" pattern="[A-Za-z][A-Za-z0-9_]{2,23}" value="${esc(P().localUsername || '')}" ${has ? 'readonly' : ''} required></div>${has ? '<div class="field"><label>目前密碼</label><input name="current" type="password" minlength="10" required></div>' : ''}<div class="field"><label>新密碼（至少 10 字）</label><input name="password" type="password" minlength="10" maxlength="128" required></div><div class="field"><label>再輸入一次</label><input name="confirm" type="password" minlength="10" maxlength="128" required></div><button class="btn block">儲存</button><p class="err" id="backup-err"></p></form>`); }
async function submitBackup(f) {
  if (f.password.value !== f.confirm.value) return $('#backup-err').textContent = '兩次密碼不一致';
  const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = '處理中…';
  try { const ch = await API.call('account.credentials.challenge', {username: f.username.value}); const a = {username: f.username.value, nonce: ch.nonce, key: await deriveKey(f.password.value, ch.salt, ch.iterations)}; if (ch.hasPassword) a.currentKey = await deriveKey(f.current?.value || '', ch.currentSalt, ch.currentIterations); const r = await API.call('account.credentials', a, {urgent: true}); closeModal(); toast(r.message); await refresh(); }
  catch (e) { const n = $('#backup-err'); if (n) n.textContent = e.message; } finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = '儲存'; } }
}

/* ============================ 登入 / 開機 ============================ */
let gisPromise, loginSeq = 0, authBusy = false;
function loadGIS() { if (window.google?.accounts?.id) return Promise.resolve(); if (!gisPromise) gisPromise = new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = ok; s.onerror = () => { gisPromise = null; no(new Error('Google 登入載入失敗，可改用帳號密碼')); }; document.head.append(s); }); return gisPromise; }
async function prepareGoogle() {
  const seq = ++loginSeq, st = $('#login-status');
  try {
    st.textContent = 'Google 登入準備中…'; const [, ch] = await Promise.all([loadGIS(), API.call('challenge')]);
    if (seq !== loginSeq) return;
    google.accounts.id.initialize({client_id: JC_CONFIG.GOOGLE_CLIENT_ID, nonce: ch.nonce, auto_select: false, callback: async res => { showBoot('驗證 Google 帳戶…'); try { const s = await API.call('login', {credential: res.credential, challenge: ch.nonce}); setLoad(50, '身分已確認'); await enter(s); } catch (e) { showLogin(e.message); } }});
    $('#google-signin').innerHTML = ''; google.accounts.id.renderButton($('#google-signin'), {theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', width: Math.min(320, $('#google-signin').clientWidth || 320)});
    st.textContent = '';
  } catch (e) { if (seq === loginSeq) st.textContent = e.message; }
}
async function localAuth(f, register) {
  if (authBusy) return; $('#auth-err').textContent = '';
  const username = f.username.value.trim().toLowerCase(), pw = f.password.value;
  if (register && pw !== f.confirm.value) return $('#auth-err').textContent = '兩次密碼不一致';
  authBusy = true; showBoot(register ? '建立帳戶…' : '登入中…');
  try { const ch = await API.call('auth.challenge', {username, purpose: register ? 'register' : 'login'}); setLoad(30, '安全驗證中…'); const a = {username, nonce: ch.nonce, key: await deriveKey(pw, ch.salt, ch.iterations)}; if (register) a.nickname = f.nickname.value.trim(); const s = await API.call(register ? 'auth.register' : 'auth.login', a); f.password.value = ''; setLoad(50, '登入成功'); await enter(s); }
  catch (e) { $('#boot').classList.add('hidden'); $('#auth-err').textContent = e.message; f.password.value = ''; }
  finally { authBusy = false; }
}
function showLogin(msg = '') {
  clearTimeout(S.timer); Object.assign(S, {snap: null, sig: '', market: null, politics: null, party: null, bank: null, company: null, community: null, chatList: null, feed: null, photo: ''}); coinShown = 0;
  S.dice.history = []; S.dice.loaded = false; S.dice.stats = {B: 0, S: 0, T: 0};
  $('#app').classList.add('hidden'); $('#boot').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#auth-err').textContent = msg; closeModal(); prepareGoogle();
}
async function logout() { try { await API.call('logout'); } catch {} clearSession(); if (classicOpen()) closeClassic(null); showLogin('你已登出'); }
async function enter(session) {
  setSession(session); loginSeq++;
  $('#login').classList.add('hidden');
  try {
    await API.connect(); setLoad(65, '讀取帳戶…');
    await refresh(); setLoad(90, '準備遊戲大廳…');
    $('#app').classList.remove('hidden');
    const [r, t] = location.hash.slice(1).split(':'); if (ROUTES.includes(r)) { S.route = r; if (t) S.tab[r] = t; }
    renderDock(); renderView(); setLoad(100, '歡迎回到江城！');
    await sleep(250); $('#boot').classList.add('hidden');
    loadSection(true); loadPhoto(); S.lastSync = Date.now(); API.call('sync', {}).catch(() => {});
    schedule(20000);
  } catch (e) { if (e.code === 'AUTH') { clearSession(); showLogin(e.message); } else bootFail(e); }
}
/* 輪詢：前景 20 秒、背景 90 秒；只打 snapshot，資料有變才重繪；sync 每 3 分鐘一次 */
function schedule(ms) { clearTimeout(S.timer); S.timer = setTimeout(poll, ms); }
async function poll() {
  if (!S.snap) return;
  if (document.hidden || classicOpen()) return schedule(90000);
  try {
    const changed = await refresh();
    if (Date.now() - S.lastSync > 180000) { S.lastSync = Date.now(); API.call('sync', {}).catch(() => {}); }
    if (changed && DEPENDS_ON_SNAP.includes(S.route) && !typing() && !modalOpen() && !S.dice.rolling) renderView();
    if (['social', 'civic'].includes(S.route) || (S.route === 'finance' && S.tab.finance === 'market')) loadSection(true);
  } catch (e) { if (e.code === 'AUTH') { clearSession(); return showLogin(e.message); } netBanner('連線不穩，正在重試…（' + e.message + '）'); }
  schedule(20000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.snap) schedule(300); });
addEventListener('resize', () => { if ($('#k-chart')) drawChart(); });
addEventListener('hashchange', () => { const [r, t] = location.hash.slice(1).split(':'); if (S.snap && ROUTES.includes(r) && (r !== S.route || (t && t !== S.tab[r]))) go(r, t); });
$('#boot-retry').onclick = () => { const s = getSession(); if (s) { showBoot('重新連線…'); enter(s); } else showLogin(); };
$('#boot-login').onclick = () => { clearSession(); showLogin(); };
$('#classic-back').onclick = () => closeClassic(S.route);
$('#classic-home').onclick = () => closeClassic('lobby');
$('#classic').addEventListener('click', e => { if (e.target.id === 'classic-retry') { closeClassic(null); } });

(async () => { const s = getSession(); if (s && s.expires > Date.now()) { showBoot('恢復登入…'); await enter(s); } else { clearSession(); showLogin(); } })();
})();
</script>
</body>
