  <script id="jc-transport">
/* One authenticated message channel; no JSONP credentials or CORS workarounds. */
(() => {
  'use strict';
  const channel = crypto.getRandomValues(new Uint8Array(24)).reduce((s,v)=>s+v.toString(16).padStart(2,'0'),'');
  let peer, peerOrigin, readyPromise, seq=0;
  const pending=new Map(), inFlight=new Map(), last=new Map(), queue=[];
  let active=0;
  const sleep = ms=>new Promise(r=>setTimeout(r,ms));
  const configured=()=>/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(window.JC_CONFIG?.API_URL||'');
  const trusted=origin=>{try{const h=new URL(origin).hostname;return h==='script.google.com'||h.endsWith('-script.googleusercontent.com')||h==='script.googleusercontent.com';}catch{return false;}};
  window.addEventListener('message',event=>{
    const m=event.data;
    if(!m||m.channel!==channel||!trusted(event.origin))return;
    if(m.type==='JC_READY'&&!peer){peer=event.source;peerOrigin=event.origin;window.dispatchEvent(new Event('jc:connected'));return;}
    if(m.type!=='JC_RESULT'||event.source!==peer||event.origin!==peerOrigin)return;
    const task=pending.get(m.id);if(!task)return;clearTimeout(task.timeout);pending.delete(m.id);
    if(m.result?.ok)task.resolve(m.result.data);else{const e=new Error(m.result?.error?.message||'連線失敗');e.code=m.result?.error?.code||'NETWORK';task.reject(e);}
  });
  function connect(){
    if(readyPromise)return readyPromise;
    readyPromise=(async()=>{
      if(!configured()){const e=new Error('請先在 HTML 開頭設定區 填入 Apps Script 網址與 Google Client ID');e.code='CONFIG';throw e;}
      const iframe=document.createElement('iframe');iframe.hidden=true;iframe.title='江城安全連線';iframe.referrerPolicy='strict-origin';
      iframe.src=window.JC_CONFIG.API_URL+'?bridge=1&origin='+encodeURIComponent(location.origin)+'&channel='+channel;document.body.appendChild(iframe);
      for(let i=0;i<160;i++){if(peer)return;await sleep(125);}
      iframe.remove();const e=new Error('無法建立連線。請檢查後端是否允許所有人存取、PUBLIC_ORIGINS 是否等於此網站來源，以及是否已使用新版 Code.gs 部署。');e.code='NETWORK';throw e;
    })().catch(e=>{readyPromise=null;throw e;});return readyPromise;
  }
  function raw(body){return new Promise((resolve,reject)=>{const id='rpc'+(++seq);const timeout=setTimeout(()=>{pending.delete(id);const e=new Error('連線逾時，結果尚未確認。請用「重試原操作」查詢，避免重複交易。');e.code='TIMEOUT';reject(e);},45000);pending.set(id,{resolve,reject,timeout});peer.postMessage({type:'JC_RPC',channel,id,body:JSON.stringify(body)},peerOrigin);});}
  function pump(){while(active<2&&queue.length){const task=queue.shift();active++;raw(task.body).then(task.resolve,task.reject).finally(()=>{active--;pump();});}}
  async function call(action,args={},options={}){await connect();const stored=JSON.parse(sessionStorage.getItem('JC_SESSION')||'null');const body={action,args,token:stored?.token||'',requestId:options.requestId||crypto.randomUUID()};return new Promise((resolve,reject)=>{queue.push({body,resolve,reject});pump();});}
  const read=/^(get|checkNotifications|searchPlayers)/;
  function legacy(name,args){
    const key=name+JSON.stringify(args);
    if(read.test(name)){
      if(document.hidden&&last.has(key))return Promise.resolve(last.get(key).data);
      if(inFlight.has(key))return inFlight.get(key);
      const old=last.get(key),ttl=/RoomState|MahjongState|BingoRoomState/.test(name)?1500:/Presence|Notifications/.test(name)?25000:7000;
      if(old&&Date.now()-old.at<ttl)return Promise.resolve(old.data);
      const promise=call('legacy',{name,args}).then(data=>{last.set(key,{data,at:Date.now()});if(last.size>200)last.delete(last.keys().next().value);return data;}).finally(()=>inFlight.delete(key));inFlight.set(key,promise);return promise;
    }
    return call('legacy',{name,args}).then(result=>{last.clear();return result;});
  }
  window.JC_API={connect,call,configured,legacy};
  if(location.pathname.endsWith('legacy.html')){
    window.google=window.google||{};
    const runner=(success,failure,userObject)=>new Proxy({}, {get(_,name){if(name==='withSuccessHandler')return f=>runner(f,failure,userObject);if(name==='withFailureHandler')return f=>runner(success,f,userObject);if(name==='withUserObject')return u=>runner(success,failure,u);return(...args)=>{legacy(name,args).then(r=>success?.(r,userObject)).catch(e=>{if(failure)failure(e,userObject);else console.warn('江城連線：',e.message);});};}});
    window.google.script={get run(){return runner();}};
  }
})();

</script>

  function marketView(){const data=state.market;if(!data)return`<section class="panel skeleton" style="height:420px"></section>`;const stock=data.stocks.find(x=>x.id===state.symbol)||data.stocks[0];if(!stock)return'<p>市場尚未初始化。</p>';state.symbol=stock.id;return`<div class="note teal" style="margin-bottom:18px">${esc(data.clock?.label||'共享模擬市場')} · ${phaseName(data.clock?.phase)}。行情、五檔與基本面均為遊戲模擬。海外股票須經銀行核准；交割為真實營業日 T+2。</div><div class="market-layout"><section class="panel" style="padding:12px"><div class="stock-list">${data.stocks.map(s=>`<button class="stock-pick ${state.symbol===s.id?'active':''}" data-symbol="${esc(s.id)}"><div>${esc(s.name)}<small>${esc(s.id)} · ${esc(s.currency)}</small></div><span class="amount ${s.change>=0?'up':'down'}">${fmt(s.price)}</span></button>`).join('')}</div></section><div class="stack"><section class="panel"><div class="quote-head"><div><p class="eyebrow">${esc(stock.id)} · ${esc(stock.market)} · ${esc(stock.sector)}</p><h2>${esc(stock.name)}</h2></div><div style="text-align:right"><div class="quote-price ${stock.change>=0?'up':'down'}">${fmt(stock.price)}</div><small class="${stock.change>=0?'up':'down'}">${stock.change>=0?'+':''}${fmt(stock.change)}% · ${stock.currency}</small></div></div><div class="row between"><div class="row"><button class="text-button" data-interval="5m">5 分</button><button class="text-button" data-interval="1h">1 時</button><button class="text-button" data-interval="1d">日 K</button></div><small class="muted">${state.interval} · MA5 / MA20 / 成交量</small></div><canvas class="chart" id="k-chart" aria-label="${esc(stock.name)}K線圖"></canvas><div class="quote-stats">${[['模擬開盤',stock.open],['模擬最高',stock.high],['模擬最低',stock.low],['模擬成交量',stock.volume],['本益比',stock.pe],['殖利率 %',stock.yield],['市值 RE',stock.marketCap],['每張股數',1000]].map(([k,v])=>`<div><small>${k}</small><b>${fmt(v)}</b></div>`).join('')}</div></section>

  function bankView(){const s=state.snapshot,p=P(),bank=state.bank;return`<div class="metrics" style="margin-top:0">${metric('錢包餘額',fmt(s.cash),'RE')}${metric('交割戶餘額',fmt(p.deposit),'RE','bank')}${metric('待交割預留',fmt(s.reserved),'RE','clock')}${metric('違約待補',fmt(s.debt),'RE','shield')}</div><div class="grid2"><section class="panel">${panelHead('資金移轉')}<form id="bank-form" class="stack"><div class="field"><label>轉帳方向</label><select name="direction"><option value="IN">錢包 → 交割戶</option><option value="OUT">交割戶 → 錢包</option></select></div><div class="field"><label>金額 RE</label><input name="amount" type="number" min="1" max="100000000" required></div><button class="btn">確認移轉</button></form><div class="line"></div><div class="row between"><div><h4 style="font-size:12px">交割日自動補款</h4><p class="hint" style="margin-top:3px">交割戶不足時，自錢包補足差額。</p></div><button class="btn outline small" data-mutation="bank.auto" data-args='{"enabled":${!p.autoDebit}}'>${p.autoDebit?'已開啟 · 關閉':'已關閉 · 開啟'}</button></div>${p.defaulted?'<div class="line"></div><button class="btn danger" data-mutation="default.cure">補繳違約交割款與罰金</button>':''}</section>
    <section class="panel">${panelHead('海外複委託',`<span class="pill gold">${esc(({NONE:'未申請',PENDING:'銀行審核中',APPROVED:'已開通',REJECTED:'未通過'})[p.overseas.status]||p.overseas.status)}</span>`)}<p class="muted" style="font-size:12px">向銀行申請海外證券資格。信用至少 600，且沒有尚未處理的違約紀錄。由銀行行員人工審核。</p><p class="hint">海外行情與匯率均為遊戲模擬；本遊戲統一採 T+2，並不代表各國實際交割規則。</p><button class="btn" style="margin-top:20px" data-action="overseas" ${['APPROVED','PENDING'].includes(p.overseas.status)?'disabled':''}>申請海外證券</button><div class="line"></div><h3>中央銀行職涯</h3><p class="hint">行員管理借貸、政黨與海外審核；資深行員可審核上市。行長決定人事與市場政策，最高議長可監督中央銀行。</p><div class="row wrap" style="margin-top:15px"><button class="btn light small" data-mutation="bank.jobApply" data-args='{"rank":"BANKER"}'>申請行員</button><button class="btn outline small" data-action="bank-console">銀行中控台</button><a class="btn outline small" href="#" data-classic="banker">原有借貸與銀行業務</a></div><p class="hint">目前權限：${esc(bank?.permission?.name||'同步中')}</p></section></div>`;}
  function ordersView(){const p=P(),s=state.snapshot,open=p.orders||[];return`<section class="panel">${panelHead('委託與交割紀錄',`<span class="pill">交割戶 ${fmt(p.deposit)} RE</span>`)}<div class="scroll-x"><table class="table"><thead><tr><th>證券</th><th>買賣 / 盤別</th><th>股數</th><th>成交價</th><th>交割總額 RE</th><th>狀態</th><th>交割時間</th><th></th></tr></thead><tbody>${open.map(o=>`<tr><td>${esc(o.symbol)}<small style="display:block" class="muted">${esc(o.name)}</small></td><td class="${o.side==='BUY'?'up':'down'}">${o.side==='BUY'?'買入':'賣出'}<small style="display:block">${esc(({REGULAR:'整張',INTRADAY_ODD:'零股',AFTER_FIXED:'盤後定價',AFTER_ODD:'盤後零股'})[o.session]||'')}</small></td><td>${fmt(o.qty)}</td><td>${o.price?fmt(o.price):'限 '+fmt(o.limit)}</td><td>${fmt(o.total)}</td><td>${esc(({OPEN:'委託中',FILLED:'待交割',SETTLED:'已交割',CANCELLED:'已取消',DEFAULT:'違約'})[o.status]||o.status)}</td><td>${dt(o.due)}</td><td>${o.status==='OPEN'?`<button class="btn outline small" data-mutation="order.cancel" data-args='${esc(JSON.stringify({id:o.id}))}'>刪單</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">尚無委託，先從一股開始。</td></tr>'}</tbody></table></div><p class="hint">週末及 HOLIDAYS 設定日期不算營業日；預設於 T+2 上午 10:00（台北）交割。離線時由排程處理，回來同步時也會補處理到期項目。</p></section><section class="panel" style="margin-top:20px">${panelHead('已交割庫存')}<div class="scroll-x"><table class="table"><thead><tr><th>股票代號</th><th>可賣股數</th><th>模擬現價</th><th>估值 RE</th></tr></thead><tbody>${Object.entries(p.positions).filter(([,q])=>q>0).map(([id,q])=>{const stock=state.market?.stocks.find(x=>x.id===id);return`<tr><td>${esc(id)} ${esc(stock?.name||'')}</td><td>${fmt(q)}</td><td>${fmt(stock?.price)}</td><td>${fmt(q*(stock?.price||0)*(stock?.fx||1))}</td></tr>`;}).join('')||'<tr><td colspan="4" class="empty">尚無已交割庫存。</td></tr>'}</tbody></table></div><div class="note" style="margin-top:15px">原版公司股票在首次登入時轉入新制庫存，舊持股表僅供股東治理同步，不能從舊版重複交易。原有 ETF 與會員卡保留在原版會員中心。</div><a class="btn outline small" href="#" data-classic="profile" style="margin-top:15px">原有 ETF 與會員資產</a></section>`;}
  function companyView(){const companies=state.company?.companies||[],mine=companies.find(c=>c.owner===P().id);return`<div class="grid2"><section class="panel">${panelHead(mine?'我的商業版圖':'成立你的第一間公司')}${mine?`<p class="eyebrow">${esc(mine.sector)}</p><h2>${esc(mine.name)}</h2><div class="metrics" style="grid-template-columns:1fr 1fr;margin:20px 0">${metric('公司資本',fmt(mine.capital),'RE')}${metric('累積營收',fmt(mine.revenue),'RE','chart')}</div><div class="row wrap"><button class="btn" data-mutation="company.operate" ${mine.operated===P().daily.day?'disabled':''}>${mine.operated===P().daily.day?'今日已營運':'每日營運'}</button><button class="btn outline" data-action="company-fund">公司增資</button></div><p class="hint">公司資本與個人錢包分離，每日營運耗 2 行動力。不能透過公司頁無限提款。</p>`:`<form id="company-form" class="stack"><div class="field"><label>公司名稱</label><input name="name" maxlength="24" required></div><div class="field"><label>產業</label><select name="sector"><option>科技</option><option>金融</option><option>建設</option><option>娛樂</option><option>生技</option></select></div><div class="field"><label>投入資本額，至少 20,000 RE</label><input name="capital" type="number" min="20000" value="20000" required></div><button class="btn">成立公司</button></form>`}<div class="line"></div><a class="btn light small" href="#" data-classic="company">原有公司、人事與股東會</a></section><section class="panel">${panelHead('上市審核中心',mine?.listed?'<span class="pill gold">已上市</span>':'<span class="pill">銀行審核制</span>')}${mine?.listed?`<h2>${esc(mine.symbol)} · ${esc(mine.name)}</h2><p class="hint">審核通過，證券已加入共享市場。</p>`:`<p class="muted" style="font-size:12px;margin-bottom:20px">公司資本至少 50,000 RE、60 XP、信用 650，提交財務揭露後，交由資深行員以上審核。</p><form id="ipo-form" class="form-grid"><div class="field"><label>4 位數股票代號</label><input name="symbol" pattern="[1-9][0-9]{3}" maxlength="4" placeholder="例如 7001" required></div><div class="field"><label>上市參考價</label><input name="price" type="number" min="1" max="1000" step=".01" value="10" required></div><div class="field full"><label>流通股數</label><input name="shares" type="number" min="1000" max="10000000" value="100000" required></div><div class="field full"><label>財務揭露與上市計畫</label><textarea name="disclosure" maxlength="240" required></textarea></div><button class="btn full" ${!mine?'disabled':''}>送交銀行審核</button></form>`}<p class="hint">${(state.company?.requests||[]).map(r=>'申請 '+r.id+' · '+r.status).map(esc).join('<br>')||'尚無上市申請'}</p></section></div>`;}
  function power(){let html=title('JIANGCHENG CIVIC CENTER','市政中心')+subnav('power',[['election','選舉中心'],['party','我的政黨'],['careers','職涯與公職'],['bank','中央銀行']]);if(state.tab.power==='bank')return html+bankConsole();if(state.tab.power==='party')return html+partyView();if(state.tab.power==='careers')return html+careersView();return html+electionView();}
  function electionView(){const data=state.politics;if(!data)return'<div class="panel skeleton" style="height:350px"></div>';const e=data.election,phase=({NOMINATION:'候選登記 · 週一至三',VOTING:'全民投票 · 週四五',RESULT:'開票與任期 · 週六日'})[data.phase];return`<div class="note teal" style="margin-bottom:20px">${phase} · 每個 Google 遊戲身分、每個職位一票。需有 10 XP 才能投票。政黨抽成為遊戲規則，並非台灣法律規定。</div><div class="grid2"><section class="panel">${panelHead('江城選舉委員會',`<span class="pill gold">${esc(e.id)} 這一屆</span>`)}${Object.entries(data.offices).map(([key,office])=>{const cs=e.candidates.filter(c=>c.office===key);return`<div style="margin-bottom:20px"><div class="row between"><h3>${esc(office.name)} <small class="muted">${office.seats} 席</small></h3><button class="btn outline small" data-nominate="${key}" ${data.phase!=='NOMINATION'?'disabled':''}>參選登記</button></div><p class="hint" style="margin:5px 0 10px">需 ${office.xp} XP、信用 ${office.credit}、對應參選卡 1 張；登記費 1,000 RE。</p>${cs.map(c=>`<div class="candidate">${avatar(c.name,c.id,'avatar-small')}<div><h4>${esc(c.name)}</h4><p>${esc(c.statement||'讓江城更好。')}</p></div><div class="vote-count"><b class="amount">${c.votes}</b><small class="muted" style="display:block">票</small></div><button class="btn light small" data-mutation="election.vote" data-args='${esc(JSON.stringify({id:c.id}))}' ${data.phase!=='VOTING'||data.votes[key]?'disabled':''}>${data.votes[key]===c.id?'已投票':'投票'}</button></div>`).join('')||'<p class="hint">尚無候選人，等待新的名字出現。</p>'}</div>`;}).join('')}</section><div class="stack"><section class="panel">${panelHead('競選補助款')}${icon('vote')}<p class="muted" style="font-size:12px;margin-top:15px">總統、市長、立委達當選票數三分之一；兩席議員達最低當選票數二分之一，才能領取每票 30 RE。</p><p class="hint">遊戲內補助上限為該次申報支出，目前為 1,000 RE 登記費。黨籍候選人依登記時保存的比例分給黨庫，剩餘進個人錢包。</p><button class="btn" style="margin-top:18px" data-mutation="election.claim" data-args='${esc(JSON.stringify({week:e.id}))}' ${!e.finalized?'disabled':''}>領取本屆選舉補助</button></section><section class="panel">${panelHead('目前的權力版圖')}${Object.entries(data.city.offices||{}).map(([key,person])=>`<div class="mission"><span class="mission-icon gold">${icon('power')}</span><div><h4>${esc(data.offices[person.office||key]?.name||key)}</h4><p>${esc(person.name)}</p></div></div>`).join('')||'<p class="hint">尚無當選公職，等待第一屆開票。</p>'}<p class="hint">最高金融權限：${esc(data.city.speaker?.name||'中央銀行行長')}。當選公職不直接取得銀行任意提款權。</p><button class="btn outline small" style="margin-top:15px" data-action="tutorial-politics">查看選舉教學</button></section></div></div>`;}
  function partyView(){const data=state.party,party=data?.party,parties=state.politics?.parties||[];return party?`<div class="grid2"><div class="stack"><section class="member-card"><p>JIANGCHENG PARTY MEMBERSHIP</p><h3>${esc(party.name)}</h3><p style="margin:10px 0 20px">${esc(P().nickname)} · 正式黨員</p><span class="amount" style="font-size:12px">${esc(data.member?.number||'')}</span></section><section class="panel">${panelHead('黨務中心')}<p class="muted" style="font-size:12px">${esc(party.manifesto)}</p><div class="metrics" style="grid-template-columns:1fr 1fr;margin:18px 0">${metric('黨庫資金',fmt(party.fund),'RE')}${metric('正式黨員',party.members,'人','social')}</div><p class="hint">黨主席：${esc(party.leaderName)}<br>入黨基金：${fmt(party.joinFee)} RE<br>競選補助黨務分成：${party.shareRate}%<br>主席任期：7 天；期滿任何黨員皆可啟動改選。</p><div class="row wrap" style="margin-top:18px"><button class="btn light small" data-mutation="party.promote">辦理黨務活動 · 1,000 RE</button><button class="btn outline small" data-mutation="party.leave">退出政黨</button></div></section></div><section class="panel">${panelHead('黨主席提名與表決')}${chairView(data.ballot)}<button class="btn outline" style="margin-top:20px" data-mutation="party.chair.start">啟動任期屆滿改選</button><p class="hint">提名 12 小時、投票 36 小時；投票需在改選開始前入黨。平票依提名順序。無有效票則原主席續任。</p></section></div>`:`<div class="grid2"><section class="panel">${panelHead('成立一個新的選擇')}<form id="party-form" class="stack"><div class="field"><label>政黨名稱</label><input name="name" maxlength="16" required></div><div class="form-grid"><div class="field"><label>入黨基金 RE</label><input name="joinFee" type="number" min="100" max="5000" value="1000" required></div><div class="field"><label>補助款黨務分成 %</label><input name="shareRate" type="number" min="0" max="30" value="20" required></div></div><div class="field"><label>政黨理念</label><textarea name="manifesto" maxlength="160" required></textarea></div><p class="note">需付 5,000 RE 申請費及入黨基金，銀行審核通過後成立。駁回全額退還；核准後創辦人為首任主席。</p><button class="btn">提交銀行審核</button></form></section><section class="panel">${panelHead('江城政黨')}${parties.map(q=>`<div class="review-item party-card" style="padding:15px"><h3>${esc(q.name)}</h3><p>${esc(q.manifesto)}</p><p>主席 ${esc(q.leaderName)} · ${q.members} 人</p><p>入黨 ${fmt(q.joinFee)} RE · 補助款分成 ${q.shareRate}%</p><button class="btn outline small" style="margin-top:12px" data-join-party="${esc(q.id)}">了解並加入</button></div>`).join('')||'<p class="empty">第一個政黨，正在等待創辦人。</p>'}</section></div>`;}
  function chairView(b){if(!b)return'<p class="muted" style="font-size:12px">目前沒有進行中的黨主席改選。</p>';return`<span class="pill">${b.finalized?'已結算':Date.now()<b.nominationEnd?'提名中':Date.now()<b.end?'投票中':'等待結算'}</span><p class="hint">提名截止 ${dt(b.nominationEnd)}<br>投票截止 ${dt(b.end)}</p><div class="row wrap" style="margin-top:15px"><button class="btn light small" data-mutation="party.chair.nominate">自我提名</button><button class="btn outline small" data-action="chair-nominate">提名其他黨員</button><button class="btn outline small" data-mutation="party.chair.finalize">結算改選</button></div>${b.candidates.map(c=>`<div class="candidate"><div><h4>${esc(c.name)}</h4><p>${c.votes} 票</p></div><button class="btn light small" data-mutation="party.chair.vote" data-args='${esc(JSON.stringify({id:c.id}))}'>投給他</button></div>`).join('')}`;}
  function careersView(){const p=P(),w=state.snapshot.city;return`<div class="grid2"><section class="panel">${panelHead('你的職涯',`<span class="pill gold">${esc(state.snapshot.jobs[p.job]?.name)}</span>`)}${Object.entries(state.snapshot.jobs).map(([id,j])=>`<div class="mission"><span class="mission-icon">${icon(j.card?'crown':'case')}</span><div><h4>${esc(j.name)}</h4><p>每日 ${fmt(j.salary)} RE · ${j.card?'需對應聘書卡':`${j.xp||0} XP / 信用 ${j.credit||0}`}</p></div><button class="btn outline small" data-mutation="job.select" data-args='${esc(JSON.stringify({job:id}))}' ${p.job===id?'disabled':''}>${p.job===id?'現職':'就任'}</button></div>`).join('')}</section><section class="panel">${panelHead('金融議會最高議長')}<div class="tutorial-art">${icon('crown')}</div><p class="muted" style="font-size:12px">${w.speaker?'現任議長：'+esc(w.speaker.name):'最高議長尚未現身，中央銀行仍是最高金融權力中心。'}</p><p class="hint">需持有最低機率的最高議長卡、200 XP、信用 700。全服限一名現任議長；就任會消耗卡片並留存公告。</p><button class="btn gold" style="margin-top:20px" data-mutation="council.claim">申請就任最高議長</button><div class="line"></div><h3>公職服務</h3><p class="hint">當選後，完成每日 25 活躍度即可領公職服務薪資。政見政策每日限生效一次。</p><button class="btn light small" style="margin:14px 0" data-mutation="office.salary">領取今日公職薪資</button><form id="policy-form" class="row"><select name="policy"><option value="TRANSPARENT">透明監理</option><option value="INNOVATION">創新產業</option><option value="EMPLOYMENT">就業優先</option></select><button class="btn small">公布政策</button></form></section></div>`;}

  async function loadSection(render=true){
    if(!state.snapshot)return;const seq=++state.sectionSeq,tab=state.tab[state.page],jobs=[];state.sectionError='';

  function drawChart(){const canvas=$('#k-chart'),bars=state.market?.candles;if(!canvas||!bars?.length)return;const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),width=rect.width,height=rect.height;canvas.width=width*dpr;canvas.height=height*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,width,height);const lo=Math.min(...bars.map(b=>b.l))*.998,hi=Math.max(...bars.map(b=>b.h))*1.002,y=v=>18+(hi-v)/(hi-lo)*(height-75),step=(width-48)/bars.length,maxVol=Math.max(...bars.map(b=>b.v));ctx.font='9px monospace';ctx.textAlign='right';for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3,yy=y(v);ctx.strokeStyle='#e9ede6';ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(width-40,yy);ctx.stroke();ctx.fillStyle='#92a08e';ctx.fillText(v.toFixed(2),width,yy+3);}bars.forEach((b,i)=>{const x=i*step+step*.5;ctx.strokeStyle=ctx.fillStyle=b.c>=b.o?'#cb7869':'#438b77';ctx.beginPath();ctx.moveTo(x,y(b.h));ctx.lineTo(x,y(b.l));ctx.stroke();ctx.fillRect(x-step*.3,Math.min(y(b.o),y(b.c)),Math.max(1,step*.6),Math.max(1,Math.abs(y(b.o)-y(b.c))));ctx.globalAlpha=.3;ctx.fillRect(x-step*.3,height-22-b.v/maxVol*24,Math.max(1,step*.6),b.v/maxVol*24);ctx.globalAlpha=1;});[[5,'#c3a562'],[20,'#7e8ac2']].forEach(([n,color])=>{ctx.strokeStyle=color;ctx.lineWidth=1.1;ctx.beginPath();for(let i=n-1;i<bars.length;i++){const avg=bars.slice(i-n+1,i+1).reduce((v,b)=>v+b.c,0)/n,x=i*step+step*.5;if(i===n-1)ctx.moveTo(x,y(avg));else ctx.lineTo(x,y(avg));}ctx.stroke();});ctx.fillStyle='#98a58f';ctx.textAlign='left';ctx.fillText(dt(bars[0].t),2,height-3);ctx.textAlign='right';ctx.fillText(dt(bars[bars.length-1].t),width-45,height-3);}
  const tutorialData={welcome:['歡迎來到江城','city',['先領每日補給，再到遊戲大廳選擇遊戲；每 10 分鐘恢復 1 行動力。','底部選單可進入遊戲、彩券、社群與個人頁；上方導覽可切換股票、銀行、公司、選舉、政黨及職涯。','此處所有玩家共享後端；離線快照只能看，交易必須等待連線。']],market:['第一次進入證券中心','chart',['先選股票代號，再選整張或零股；1 張為 1,000 股，零股為 1–999 股。','預設使用 30 分鐘加速盤：前 20 分鐘盤中，接著 5 分鐘盤後定價、5 分鐘盤後零股。','買入成交後 T+2 營業日由交割戶扣款。先轉錢進交割戶，或開啟錢包自動補款。','缺款會違約、扣信用並暫停交易；買入尚未交割前不能出售。海外需銀行審核。']],politics:['你的第一張選票','power',['先在身分抽卡取得總統、市長、立委或議員參選卡；登記時消耗 1 張卡並支付 1,000 RE。','週一至三登記，週四五投票，週六日開票。經驗至少 10 的玩家，每個職位各一票。','政黨成立需銀行審核；加入要付已揭露的入黨基金，並發行黨證。','達得票門檻可領遊戲補助；黨務分成轉入黨庫。主席由黨內提名與表決。']],bank:['銀行與最高議會','bank',['第一任行長由部署者指定。一般玩家須經行長審核才能成為行員。','行員處理海外及政黨申請；上市審核需資深行員以上，且不可自審。','最高議長抽中機率最低，符合條件才可就任；議長出現前中央銀行權力最高。']],cards:['身分卡包','cards',['三種卡包價格為 200、1,000、5,000 RE。每抽獨立，沒有隱藏保底。','完整機率在每個卡包下方公開；參選卡、銀行資格與最高議長卡皆有機會抽中。','抽中資格卡不會跳過信用、經驗或銀行審核。']]};

  async function compress(file){if(!file||!/^image\/(jpeg|png|webp|gif|heic|heif)$/.test(file.type))throw new Error('請選擇可讀取的照片檔案');if(file.size>12000000)throw new Error('原始照片請小於 12 MB');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const ratio=Math.min(1,512/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.78);if(data.length>210000)data=canvas.toDataURL('image/jpeg',.55);if(data.length>210000)throw new Error('壓縮後照片仍過大，請改用較小的照片');return{mime:'image/jpeg',base64:data.split(',')[1]};}finally{URL.revokeObjectURL(url);}}

  function postCard(post){return`<article class="post-card" data-post-id="${esc(post.id)}"><div class="post-head">${avatar(post.name,post.author,'avatar-small')}<div><h4>${esc(post.name)}</h4><small>${dt(post.at)} · 江城動態</small></div>${post.author===P().id?`<button class="icon-button" data-delete-post="${esc(post.id)}" aria-label="刪除此貼文">${icon('more')}</button>`:''}</div>${post.text?`<div class="post-body">${esc(post.text)}</div>`:''}${post.hasImage?`<div class="post-media" data-post-image="${esc(post.id)}"><span>照片載入中…</span></div>`:''}<div class="post-actions"><div class="row"><button class="${post.liked?'liked':''}" data-like-post="${esc(post.id)}" aria-label="${post.liked?'取消喜歡':'喜歡'}" aria-pressed="${post.liked}">${icon('heart')}</button><button data-comments-post="${esc(post.id)}" aria-label="留言">${icon('comment')}</button><button data-share-post="${esc(post.id)}" aria-label="複製貼文連結">${icon('send')}</button></div><p class="post-likes">${fmt(post.likeCount)} 個喜歡</p><button class="post-comment-link" data-comments-post="${esc(post.id)}">${post.commentCount?'查看全部 '+post.commentCount+' 則留言':'留一句話，和朋友聊聊'}</button></div></article>`;}

  function bankConsole(){const perm=state.bank?.permission;if(!perm)return '<section class="panel skeleton" style="height:300px"></section>';const pending=(state.bank?.requests||[]).filter(r=>r.status==='PENDING').length;const staff=!!perm.rank;return `<section class="staff-workspace"><div class="staff-summary"><div><p class="eyebrow">BANK EMPLOYEE WORKSPACE</p><h2>銀行行員工作台</h2><p>${esc(perm.name)} · ${staff?'依你的職務權限提供可處理的業務':'查看銀行職缺，申請成為行員'}</p></div><span class="pill gold">${pending} 件待辦</span></div><div class="staff-shortcuts">${[['loans','shield','貸款與風控','貸款審核・風險處理'],['clients','profile','客戶服務','查詢・通知・轉帳'],['staff','social','銀行人事','職缺・錄用・薪資'],['policies','bank','營運控管','市場・公告・ETF'],['lottery','ticket','彩券管理','獎池・開獎紀錄']].map(([area,ic,name,sub])=>`<button class="staff-shortcut" data-staff-area="${area}" ${!staff?'disabled':''}>${icon(ic)}<span><b>${name}</b><small>${sub}</small></span><i>↗</i></button>`).join('')}<button class="staff-shortcut" data-classic-panel="hr">${icon('case')}<span><b>銀行職缺</b><small>查看職務・申請加入</small></span><i>↗</i></button></div></section>${staff?bankReviewView():'<section class="panel"><h3>加入江城銀行</h3><p class="hint">目前尚未擔任銀行行員。可以先查看職缺、提出申請，錄用後即可使用對應工作台。</p></section>'}`;}
  let feedObserver;
  const feedImages=new Map();
  function hydrateFeed(){feedObserver?.disconnect();feedObserver=new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;feedObserver.unobserve(entry.target);const node=entry.target,id=node.dataset.postImage;const draw=src=>{if(node.isConnected)node.innerHTML=`<img src="${src}" alt="江城居民分享的照片" loading="lazy">`;};if(feedImages.has(id)){draw(feedImages.get(id));continue;}JC_API.call('post.image',{id}).then(x=>{const src='data:'+x.mime+';base64,'+x.base64;feedImages.set(id,src);if(feedImages.size>40)feedImages.delete(feedImages.keys().next().value);draw(src);}).catch(()=>{if(node.isConnected)node.innerHTML=`<button class="text-button" data-retry-post-image="${esc(id)}">照片載入失敗，點此重試</button>`;});}},{rootMargin:'180px'});$$('[data-post-image]').forEach(el=>feedObserver.observe(el));}

  function nativeInteractions(){

      try{
        if(el.dataset.route){event.preventDefault();route(el.dataset.route);}

        else if(el.dataset.startChat){state.peer=el.dataset.startChat;state.peerName=el.dataset.name;state.tab.social='chat';renderPage();await loadSection(true);}
        else if(el.dataset.socialPerson){const person=state.community?.players.find(p=>p.id===el.dataset.socialPerson);if(person)modal(esc(person.name),`${avatar(person.name,person.id)}<p class="hint">${person.online?'在線上':'離線'} · ${person.xp} XP</p>`,P().friends?.includes(person.id)?`<button class="btn gold" data-start-chat="${esc(person.id)}" data-name="${esc(person.name)}" data-action="close">傳送訊息</button>`:`<button class="btn gold" data-mutation="friend.request" data-args='${esc(JSON.stringify({id:person.id}))}'>加為好友</button>`);}
        else if(el.dataset.likePost){if(state.busy)return;const post=state.feed?.find(p=>p.id===el.dataset.likePost);if(post)await act('post.like',{id:post.id,liked:!post.liked},el);}
        else if(el.dataset.commentsPost){await showComments(el.dataset.commentsPost);}
        else if(el.dataset.sharePost){const url=new URL(location.href);url.hash='social';url.searchParams.set('post',el.dataset.sharePost);await navigator.clipboard.writeText(url.toString());toast('已複製貼文連結');}
        else if(el.dataset.deletePost){modal('刪除這則貼文？','<p class="muted">貼文及留言將從動態牆移除。</p>',`<button class="btn outline" data-action="close">取消</button><button class="btn danger" data-mutation="post.delete" data-args='${esc(JSON.stringify({id:el.dataset.deletePost}))}'>刪除貼文</button>`);}
        else if(el.dataset.retryPostImage){hydrateFeed();}
        else switch(el.dataset.action){
          case'new-post':composePost();break;
          case'post-photo':await pickPostPhoto();break;
          case'more-posts':el.disabled=true;try{await fetchFeed(true);renderPage();}finally{if(el.isConnected)el.disabled=false;}break;
          case'refresh-lottery':state.lottery=null;renderPage();await loadSection(true);break;
          case'refresh':await refresh();await loadSection(true);toast('已更新');break;
          case'lottery-random':{const numbers=Array.from({length:49},(_,i)=>i+1);for(let i=48;i>0;i--){const random=crypto.getRandomValues(new Uint32Array(1))[0],j=random%(i+1);[numbers[i],numbers[j]]=[numbers[j],numbers[i]];}state.lotteryNumbers=numbers.slice(0,6).sort((a,b)=>a-b);renderPage();break;}
          case'buy-marksix':if(state.lotteryNumbers.length===6){const args=legacyRequest('buyMarkSixTicketV106',P().nickname,state.lotteryNumbers.slice().sort((a,b)=>a-b));modal('確認購買六合彩',`<div class="number-balls">${state.lotteryNumbers.map(n=>`<span class="number-ball">${n}</span>`).join('')}</div><p class="hint">本次扣除 ${fmt(state.lottery?.markSix?.ticketPrice||500)} RE。</p>`,`<button class="btn gold" data-mutation="legacy" data-args='${esc(JSON.stringify(args))}'>確認購買</button>`);}break;
        }
      }catch(e){toast(e.message||'操作失敗，請稍後重試',true);}
    });
    document.addEventListener('input',event=>{if(event.target.id==='game-search'){const input=event.target,start=input.selectionStart;state.gameSearch=input.value;const list=GAMES.filter(g=>(state.gameFilter==='all'||state.gameFilter==='favorite'&&(preferences().favorites||[]).includes(g.id)||g.kind===state.gameFilter)&&(g.name+g.en).toLowerCase().includes(state.gameSearch.toLowerCase()));$('#game-results').innerHTML=gameGrid(list);if(input.type!=='search')input.setSelectionRange(start,start);}});
    document.addEventListener('submit',async event=>{const form=event.target;try{
      if(form.getAttribute('id')==='post-form'){event.preventDefault();const text=form.elements.text.value.trim();if(!text&&!state.composeImage)return toast('輸入一些文字，或加入一張照片');const result=await act('post.create',{text,...(state.composeImage||{})},form.querySelector('[type="submit"]'));if(result)state.composeImage=null;}
      if(form.getAttribute('id')==='comment-form'){event.preventDefault();const id=form.elements.id.value,text=form.elements.text.value.trim();if(!text)return;const result=await act('post.comment',{id,text},form.querySelector('button'));if(result)await showComments(id);}
      if(form.getAttribute('id')==='lottery-big-form'){event.preventDefault();const count=Number(form.elements.count.value),price=Number(state.lottery?.big?.ticketPrice||1000);if(!Number.isSafeInteger(count)||count<1)return;const args=legacyRequest('buyLotteryTickets',P().nickname,count);modal('確認購買大樂透',`<p class="muted">購買 ${count} 張彩券，共 ${fmt(count*price)} RE。</p>`,`<button class="btn gold" data-mutation="legacy" data-args='${esc(JSON.stringify(args))}'>確認購買</button>`);}
    }catch(e){toast(e.message,true);}});
  }

  function frameEffect(id){const item=state.snapshot?.shop?.find(i=>i.id===id&&i.type==='frame');return item?.effect||(id==='FRAME'?'gold':'');}
  function avatar(name,id,size='',forcedFrame){
    let hash=0;for(const c of String(id))hash=(hash*31+c.charCodeAt(0))>>>0;const hue=32+hash%22;
    const person=state.community?.players?.find(q=>q.id===id)||state.chatList?.friends?.find(q=>q.id===id)||state.feed?.find(q=>q.author===id);
    const equipped=forcedFrame===undefined?(id===P()?.id?P().avatarFrame:person?.avatarFrame||person?.frame||''):forcedFrame;
    const effect=frameEffect(equipped);
    return `<span class="avatar ${size} ${effect?'fx-frame fx-'+effect:''}" style="background:linear-gradient(140deg,hsl(${hue},22%,30%),hsl(${hue+25},15%,66%))" ${effect?'aria-label="'+esc(name)+'的'+esc(state.snapshot.shop.find(i=>i.id===equipped)?.name||'頭像框')+'"':''}>${id===P()?.id&&state.photo?`<img src="${state.photo}" alt="${esc(name)}的照片">`:`<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="29" r="14" fill="#efe7d7"/><path d="M9 80c3-23 15-34 31-34s28 11 31 34" fill="#c8d2d0"/><path d="M31 48l9 18 9-18-9 6z" fill="#faf5e9"/><path d="M36 61h8l-1 19h-6z" fill="#767f86"/></svg>`}</span>`;
  }
  function syncTopFrame(){const node=$('#top-avatar');if(!node||!P())return;const effect=frameEffect(P().avatarFrame);node.className='avatar avatar-small'+(effect?' fx-frame fx-'+effect:'');}
  function framePreview(item,size=''){return`<div class="frame-stage fx-stage-${item.effect||'gold'} ${size}">${avatar(P().nickname,P().id,'large',item.id)}</div>`;}
  function shopView(){const items=state.snapshot.shop.filter(i=>state.shopFilter==='all'||state.shopFilter==='frames'&&i.type==='frame'||state.shopFilter==='themes'&&i.type==='background'||state.shopFilter==='items'&&!['frame','background'].includes(i.type));return`<div class="shop-header"><div><p class="eyebrow">JIANGCHENG STORE</p><h2>讓頭像，多一點你的個性。</h2><p>挑一款喜歡的動態光環，帶著它出現在江城。</p></div><span class="pill gold">${fmt(state.snapshot.available)} RE</span></div><div class="filter-chips">${[['all','全部商品'],['frames','特效頭像框'],['themes','主題背景'],['items','道具補給']].map(([id,label])=>`<button data-shop-filter="${id}" class="${state.shopFilter===id?'active':''}">${label}</button>`).join('')}</div><div class="shop-grid">${items.map(item=>{const own=P().inventory.includes(item.id),equipped=P().avatarFrame===item.id;return`<article class="panel shop-item">${item.type==='frame'?`<button class="frame-preview-button" data-preview-frame="${item.id}" aria-label="預覽${esc(item.name)}">${framePreview(item)}<span class="frame-live-label">${item.id==='FRAME'?'經典金框':'動態預覽'}</span></button>`:`<div class="shop-art ${esc(item.color)}">${icon(({background:'city',ticket:'ticket',energy:'coffee'})[item.type])}</div>`}<div class="shop-info"><h3>${esc(item.name)}</h3><p>${esc(item.desc)}</p><div class="row between"><span class="shop-price">${fmt(item.price)} RE</span>${item.type==='frame'&&own?`<button class="btn small ${equipped?'light':'gold'}" data-mutation="profile.frame" data-args='${esc(JSON.stringify({id:equipped?'':item.id}))}'>${equipped?'卸下':'裝備'}</button>`:`<button class="btn small" data-mutation="shop.buy" data-args='${esc(JSON.stringify({id:item.id}))}' ${own?'disabled':''}>${own?'已擁有':'購買'}</button>`}</div></div></article>`;}).join('')}</div>`;}
  function framesView(){const items=state.snapshot.shop.filter(i=>i.type==='frame'&&P().inventory.includes(i.id));return`<section class="panel" style="margin-bottom:20px"><div class="row between wrap"><div><h3>我的特效頭像框</h3><p class="hint">裝備後，個人頁、社群動態與好友清單都會套用。</p></div><button class="btn light small" data-open-frame-shop>前往商城</button></div></section><div class="owned-frames"><button class="owned-frame ${!P().avatarFrame?'equipped':''}" data-mutation="profile.frame" data-args='{"id":""}'>${avatar(P().nickname,P().id,'large','')}<b>原始頭像</b><small>${!P().avatarFrame?'使用中':'不使用頭像框'}</small></button>${items.map(item=>`<button class="owned-frame ${P().avatarFrame===item.id?'equipped':''}" data-mutation="profile.frame" data-args='${esc(JSON.stringify({id:item.id}))}'>${avatar(P().nickname,P().id,'large',item.id)}<b>${esc(item.name)}</b><small>${P().avatarFrame===item.id?'使用中':'點擊裝備'}</small></button>`).join('')}</div>`;}
  function previewFrame(id){const item=state.snapshot.shop.find(i=>i.id===id&&i.type==='frame');if(!item)return;const own=P().inventory.includes(id);modal(esc(item.name),framePreview(item,'frame-stage-large')+`<p class="hint" style="text-align:center">${esc(item.desc)}</p><p class="hint" style="text-align:center">${fmt(item.price)} RE · ${own?'已擁有':'購買後即可裝備'}</p>`,own?`<button class="btn gold" data-mutation="profile.frame" data-args='${esc(JSON.stringify({id}))}'>${P().avatarFrame===id?'重新套用':'裝備頭像框'}</button>`:`<button class="btn gold" data-mutation="shop.buy" data-args='${esc(JSON.stringify({id}))}'>購買頭像框</button>`);}
  document.addEventListener('click',event=>{const el=event.target.closest('button');if(!el)return;if(el.dataset.shopFilter){state.shopFilter=el.dataset.shopFilter;renderPage();}if(el.dataset.previewFrame)previewFrame(el.dataset.previewFrame);if(el.hasAttribute('data-open-frame-shop')){state.shopFilter='frames';route('profile:shop');}});

  nativeInteractions();
  boot();
})();

</script>
</body>
</html>
