<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>銳能冬季盃 2027｜REBORN WINTER CUP 2027</title>
<meta name="description" content="REBORN ENTERTAINMENT（銳能娛樂）第三賽季《銳能冬季盃 2027》Garena Free Fire 賽事：24 隊、1/9～1/31 七個比賽日，凍感全場啦！">
<meta property="og:type" content="website">
<meta property="og:title" content="銳能冬季盃 2027｜REBORN WINTER CUP 2027">
<meta property="og:description" content="24 隊爭奪冬季冠軍，總獎勵新台幣 14,500 元＋65,000 鑽石。1/9 開打，凍感全場啦！">
<meta name="theme-color" content="#141518">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Saira+Condensed:wght@500;600;700;800&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#1b1c20;--bg-deep:#141518;--sf:#24252b;--sf2:#2d2f36;--ln:#383a42;--ln2:#4c4f59;
  --ink:#f1f2f5;--ink2:#c9ccd4;--mute:#969aa6;
  --lilac:#a995ff;--lilac2:#bdb0ff;--lilac-ink:#17142a;
  --ice:#8fc8ff;--ice-ink:#0d1b29;--silver:#d9dde5;--gold:#f2cf7a;
  --ok:#6edcad;--warn:#f4c46a;--bad:#ff8b99;
  --sans:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"Saira Condensed","Noto Sans TC",sans-serif;
  --top:60px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.75;color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:hidden}
a{color:var(--ice)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--num);letter-spacing:.02em}
.muted{color:var(--mute)}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.ic-s{width:16px;height:16px}

/* ── 頂部 ── */
.top{position:sticky;top:0;z-index:50;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--bg-deep);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;height:40px;text-decoration:none;color:var(--ink);flex:none}
.brand img{height:32px;width:auto;display:block}
.logo-slot .fb{display:none}
.logo-slot.missing img{display:none}
.logo-slot.missing .fb{display:flex}
.brand .fb{font-family:var(--num);font-weight:800;font-size:22px;letter-spacing:.12em;align-items:center}
.brand .ev{margin-left:14px;padding-left:14px;border-left:1px solid var(--ln2);font-weight:700;font-size:14px;color:var(--ink2);white-space:nowrap}
.top-act{display:flex;align-items:center;gap:10px;margin-left:auto}
.live{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;background:#e5384f;color:#fff;font-weight:900;font-size:13px;text-decoration:none;letter-spacing:.04em}
.live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.menu-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 10px;border:1px solid var(--ln2);background:transparent;color:var(--ink);cursor:pointer;font-weight:700;font-size:15px}
.menu-btn:hover{border-color:var(--ink2)}
.menu-btn svg{width:22px;height:22px}
.me-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 4px;border:1px solid var(--ln2);background:transparent;cursor:pointer;max-width:190px}
.me-btn .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.ava{width:30px;height:30px;object-fit:cover;background:var(--lilac);color:var(--lilac-ink);display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.acct{position:absolute;top:calc(var(--top) - 2px);right:20px;min-width:200px;padding:6px;background:var(--sf);border:1px solid var(--ln2);box-shadow:0 18px 40px rgba(0,0,0,.45);display:none}
.acct.open{display:block}
.acct a,.acct button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;color:var(--ink);text-decoration:none;cursor:pointer;font-size:15px;text-align:left}
.acct a:hover,.acct button:hover{background:var(--sf2)}
.acct .who{padding:8px 12px 10px;border-bottom:1px solid var(--ln);margin-bottom:4px;font-size:13px;color:var(--mute);word-break:break-all}

/* 全螢幕選單 */
.mo{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s}
.mo.open{visibility:visible;opacity:1}
.mo-head{height:var(--top);flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--ln);background:var(--bg-deep)}
.mo nav{flex:1;overflow:auto;width:100%;max-width:760px;margin:0 auto;padding:18px 20px 30px}
.mo nav a{display:flex;align-items:center;gap:14px;padding:16px 2px;border-bottom:1px solid var(--ln);font-size:clamp(22px,4.4vw,30px);font-weight:900;color:var(--ink);text-decoration:none;letter-spacing:.03em;transition:padding .15s,color .15s}
.mo nav a:hover{padding-left:10px;color:var(--lilac2)}
.mo nav a.on{color:var(--lilac)}
.mo nav a .chip{margin-left:auto}
.mo nav a.locked{color:var(--mute)}
.mo .soc{display:flex;gap:10px;margin-top:22px}
.mo .skyline{flex:none;display:block;width:100%;height:clamp(90px,14vw,170px)}
.notice{background:var(--ice);color:var(--ice-ink);font-size:14px;font-weight:700}
.notice .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px}
.notice p{margin:0;flex:1}
.notice button{border:0;background:none;color:inherit;cursor:pointer;padding:4px;display:grid}

/* 右側追蹤列、報名分頁 */
.follow{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;background:var(--bg-deep);border:1px solid var(--ln);border-right:0}
.follow .lab{writing-mode:vertical-rl;font-size:12px;letter-spacing:.4em;color:var(--mute);padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--ln)}
.follow a{display:grid;place-items:center;width:34px;height:34px;color:var(--ink2)}
.follow a:hover{color:var(--ink);background:var(--sf2)}
.signup-tab{position:fixed;right:0;bottom:24px;z-index:41;display:flex;align-items:center;gap:8px;padding:14px 10px;writing-mode:vertical-rl;background:var(--lilac);color:var(--lilac-ink);text-decoration:none;font-weight:900;font-size:15px;letter-spacing:.28em}
.signup-tab:hover{background:var(--lilac2)}
.signup-tab svg{writing-mode:horizontal-tb}

/* 按鈕、標籤 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border:0;cursor:pointer;font-weight:900;font-size:16px;letter-spacing:.04em;text-decoration:none;color:var(--lilac-ink);background:var(--lilac);clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--lilac2)}
.btn:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--ink)}
.btn.ice{background:var(--ice);color:var(--ice-ink)}
.btn.ice:hover{background:#a9d5ff}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ln2);clip-path:none}
.btn.line:hover{box-shadow:inset 0 0 0 1.5px var(--ink2)}
.btn.danger{background:var(--bad);color:#2a0a10}
.btn.small{min-height:38px;padding:0 16px;font-size:14px;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.btn.line.small{clip-path:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link-btn{border:0;background:none;padding:0;color:var(--ice);text-decoration:underline;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;font-size:12.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;background:var(--sf2);color:var(--ink2)}
.chip.lilac{background:var(--lilac);color:var(--lilac-ink)}
.chip.ice{background:var(--ice);color:var(--ice-ink)}
.chip.gold{background:var(--gold);color:#2b2006}
.chip.ok{background:rgba(110,220,173,.16);color:var(--ok)}
.chip.warn{background:rgba(244,196,106,.16);color:var(--warn)}
.chip.bad{background:rgba(255,139,153,.16);color:var(--bad)}
.chip.live{background:#e5384f;color:#fff}

/* ── 封面 ── */
.cover{position:relative;background:#0f1013;line-height:0}
.cover .logo-slot{display:block}
.cover img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 50%}

/* 跑馬燈 */
.ticker{position:relative;overflow:hidden;background:var(--lilac);color:var(--lilac-ink);font-weight:900;font-size:15px;letter-spacing:.03em;border-bottom:1px solid #000}
.tk-track{display:flex;width:max-content;animation:tk 48s linear infinite}
.ticker:hover .tk-track{animation-play-state:paused}
.tk-track span{display:inline-flex;align-items:center;gap:14px;padding:11px 0 11px 26px;white-space:nowrap}
.tk-track span svg{width:16px;height:16px;opacity:.7}
@keyframes tk{to{transform:translateX(-50%)}}

/* 報名門票 */
.ticket-sec{position:relative;padding:40px 0 clamp(120px,15vw,200px);overflow:hidden}
.ticket-sec .skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:clamp(110px,16vw,230px);pointer-events:none}
.ticket{--stub:230px;--r:15px;position:relative;z-index:2;display:grid;grid-template-columns:var(--stub) 1fr;background:var(--sf);
  -webkit-mask:radial-gradient(circle var(--r) at var(--stub) 0,#0000 calc(var(--r) - .5px),#000 var(--r)) top/100% 51% no-repeat,radial-gradient(circle var(--r) at var(--stub) 100%,#0000 calc(var(--r) - .5px),#000 var(--r)) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle var(--r) at var(--stub) 0,#0000 calc(var(--r) - .5px),#000 var(--r)) top/100% 51% no-repeat,radial-gradient(circle var(--r) at var(--stub) 100%,#0000 calc(var(--r) - .5px),#000 var(--r)) bottom/100% 51% no-repeat}
.stub{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:24px 26px;background:var(--lilac);color:var(--lilac-ink)}
.stub .k{font-size:13px;font-weight:700;letter-spacing:.1em}
.stub b{font-size:30px;font-weight:900;line-height:1.2}
.stub span{font-family:var(--num);font-size:19px;font-weight:700}
.tmain{display:flex;align-items:center;gap:20px 28px;flex-wrap:wrap;padding:22px 28px;border-left:2px dashed var(--bg)}
.tinfo{flex:1;min-width:260px}
.tinfo .lbl{font-size:13px;color:var(--mute);font-weight:700;letter-spacing:.06em}
.tinfo .dates{display:block;margin-top:6px;font-size:14px;color:var(--ink2)}
.cd{display:flex;align-items:baseline;gap:4px;margin-top:2px;font-family:var(--num);font-weight:800;color:var(--ink)}
.cd b{font-size:46px;line-height:1;min-width:1.15em;text-align:right;font-variant-numeric:tabular-nums}
.cd small{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--mute);margin:0 10px 0 2px}

/* 區塊標題與裝飾 */
.sec{position:relative;padding:76px 0 0}
.sec-h{position:relative;z-index:1;display:flex;align-items:flex-end;gap:18px;margin:0 0 26px}
.sec-h h2{margin:0;font-size:clamp(26px,3.4vw,36px);font-weight:900;line-height:1.15;letter-spacing:.03em}
.sec-h h2::before{content:"";display:block;width:34px;height:5px;margin-bottom:12px;background:var(--lilac)}
.sec-h .rule{flex:1;height:1px;background:var(--ln);margin-bottom:9px}
.sec-h .aside{font-size:14px;color:var(--mute);margin-bottom:4px;white-space:nowrap}
.deco{position:absolute;pointer-events:none;z-index:0}
.deco.balloon .bb{fill:#25262c}
.deco.balloon .bg{fill:none;stroke:#2d2f35;stroke-width:2.5}
.deco.cloud{fill:#202126}
.skyline .k1{fill:#202126}
.skyline .k2{fill:#27282e}
.skyline .k2s{stroke:#27282e}
.skyline .k0{fill:var(--bg)}
.skyline .k3{fill:#2d2e35}
.skyline .k3s{stroke:#2d2e35}
.skyline .k4{fill:#383a42}
.skyline .kb .bb{fill:#26272d}
.skyline .kb .bg{fill:none;stroke:#2f3137;stroke-width:2.5}

/* 賽事資訊 */
.info{display:grid;grid-template-columns:1.1fr 1fr;gap:34px;align-items:start}
.lead{margin:0;font-size:17.5px;line-height:1.9;color:var(--ink2)}
.lead b{color:var(--ink)}
.facts{margin:0;display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink)}
.facts div{padding:12px 0 12px;border-bottom:1px solid var(--ln)}
.facts div:nth-child(odd){padding-right:18px}
.facts dt{font-size:12.5px;color:var(--mute);font-weight:700;letter-spacing:.06em}
.facts dd{margin:2px 0 0;font-weight:700}
.facts dd .num{font-size:22px;font-weight:800}

/* 賽制圖 */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px}
.ft{position:relative;display:flex;flex-direction:column;gap:4px;padding:18px 16px 16px;background:var(--sf);border:0;border-top:4px solid var(--ln2);color:var(--ink);text-align:left;cursor:pointer;transition:background .15s}
.ft:hover{background:var(--sf2)}
.ft:not(:last-child)::after{content:"";position:absolute;right:-16px;top:48px;width:10px;height:10px;border-top:2px solid var(--mute);border-right:2px solid var(--mute);transform:rotate(45deg)}
.ft .fn{font-family:var(--num);font-size:60px;font-weight:800;line-height:.9;letter-spacing:-.01em}
.ft .fn small{font-size:17px;font-weight:700;color:var(--mute);margin-left:6px;letter-spacing:0}
.ft h3{margin:6px 0 0;font-size:19px;font-weight:900}
.ft .fd{font-family:var(--num);font-size:17px;font-weight:700;color:var(--ice)}
.ft ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.ft li{display:flex;gap:8px}
.ft li i{width:9px;height:9px;flex:none;margin-top:5px;background:var(--mute)}
.ft .more{margin-top:auto;padding-top:12px;font-size:13px;font-weight:700;color:var(--lilac)}
.ft.now{border-top-color:var(--lilac)}
.ft.done{opacity:.62}
.ft.cup{border-top-color:var(--gold)}
.ft.cup .fn{color:var(--gold)}

/* 比賽日門票 */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.dtk{position:relative;display:flex;flex-direction:column;align-items:flex-start;padding:14px 12px 12px;background:var(--sf);border:0;border-top:4px solid var(--c,var(--ln2));color:var(--ink);text-align:left;cursor:pointer;transition:background .15s}
.dtk:hover{background:var(--sf2)}
.dtk .dn{font-family:var(--num);font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--mute)}
.dtk .dd{font-family:var(--num);font-size:40px;font-weight:800;line-height:1.02}
.dtk .dw{font-size:13px;color:var(--mute)}
.dtk .ds{margin-top:10px;font-weight:900;font-size:15px;line-height:1.35}
.dtk .st{margin-top:12px}
.dtk.past{opacity:.5}
.dtk.today{box-shadow:inset 0 0 0 2px var(--c)}

/* 獎勵 */
.podium{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:12px;align-items:end}
.pd{display:flex;flex-direction:column;justify-content:flex-end;padding:22px 22px 20px;color:var(--lilac-ink)}
.pd .rk{font-family:var(--num);font-size:84px;font-weight:800;line-height:.8;letter-spacing:-.02em}
.pd .tt{font-size:20px;font-weight:900;margin-top:10px}
.pd .cash{font-family:var(--num);font-size:36px;font-weight:800;line-height:1.1;margin-top:10px}
.pd .cash small{font-size:18px;margin-right:2px}
.pd .dia{display:flex;align-items:center;gap:6px;font-family:var(--num);font-size:23px;font-weight:700}
.pd .medal{align-self:flex-start;margin-top:12px;padding:3px 10px;background:var(--lilac-ink);color:var(--gold);font-size:13px;font-weight:900}
.pd.p1{min-height:330px;background:var(--lilac);order:2}
.pd.p2{min-height:280px;background:var(--ice);color:var(--ice-ink);order:1}
.pd.p3{min-height:250px;background:var(--silver);color:#1d2027;order:3}
.prow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.prow div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:var(--sf)}
.prow b{font-size:17px}
.prow span{display:flex;align-items:center;gap:6px;font-family:var(--num);font-size:24px;font-weight:800;color:var(--ice)}
.prize-note{margin:16px 0 0;font-size:14.5px;color:var(--mute)}
.prize-note b{color:var(--ink);font-family:var(--num);font-size:18px}

/* 折疊面板 */
.acc{border-top:2px solid var(--ink)}
.acc>details{border-bottom:1px solid var(--ln)}
.acc summary{list-style:none;display:flex;align-items:center;gap:14px;padding:18px 2px;cursor:pointer;font-weight:700;font-size:17px}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover .q{color:var(--lilac2)}
.acc summary .q{flex:1}
.acc summary time{font-family:var(--num);font-size:16px;color:var(--mute);font-weight:600;min-width:92px}
.pm{position:relative;width:26px;height:26px;flex:none}
.pm::before,.pm::after{content:"";position:absolute;left:5px;right:5px;top:12px;height:2px;background:var(--ink2);transition:transform .2s,opacity .2s}
.pm::after{transform:rotate(90deg)}
details[open]>summary .pm::after{transform:rotate(0);opacity:0}
.acc .ab{padding:0 2px 20px;color:var(--ink2);animation:drop .22s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}

/* 主辦贊助 */
.partners{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.partner{display:flex;align-items:center;gap:18px;padding:22px 24px;background:var(--sf);min-height:108px}
.partner small{display:block;font-size:12.5px;color:var(--mute);font-weight:700;letter-spacing:.06em}
.partner b{font-size:18px}
.partner .pl{height:50px;width:auto;max-width:150px;object-fit:contain}
.partner .mark{display:grid;place-items:center;width:56px;height:56px;background:var(--sf2);font-weight:900;font-size:22px;flex:none}

/* 內頁標頭 */
.ph{position:relative;overflow:hidden;padding:42px 0 clamp(96px,12vw,150px);border-bottom:1px solid var(--ln)}
.ph .skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:clamp(90px,12vw,170px);pointer-events:none}
.ph-in{position:relative;z-index:1;display:flex;align-items:center;gap:20px}
.ph-in .logo-slot img{height:76px;width:auto}
.ph-in .fb{font-family:var(--num);font-weight:800;font-size:18px;letter-spacing:.1em;color:var(--mute)}
.ph-in small{display:block;font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--lilac)}
.ph-in h1{margin:2px 0 0;font-size:clamp(30px,5vw,46px);font-weight:900;letter-spacing:.04em;line-height:1.15}
.ph-in p{margin:4px 0 0;color:var(--mute)}

/* 表格 */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.data{width:100%;border-collapse:collapse;font-size:15px}
.data th,.data td{padding:12px 14px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
.data thead th{border-bottom:2px solid var(--ink);font-size:13px;color:var(--mute);letter-spacing:.06em}
.data th[scope=row]{width:9em;color:var(--mute);font-weight:700;font-size:14px}
.data .n{font-family:var(--num);font-size:18px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}

/* 規則頁 */
.rules details{background:var(--sf);margin:0 0 10px;scroll-margin-top:calc(var(--top) + 14px)}
.rules summary{list-style:none;display:flex;align-items:center;gap:14px;padding:18px 22px;cursor:pointer;font-size:19px;font-weight:900}
.rules summary::-webkit-details-marker{display:none}
.rules summary .no{font-family:var(--num);font-size:16px;font-weight:700;color:var(--lilac);min-width:28px}
.rules summary .q{flex:1}
.rules .rb{padding:0 22px 24px;color:var(--ink2);animation:drop .22s ease}
.rules h4{margin:20px 0 8px;font-size:16.5px;color:var(--ink)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.steps3 div{padding:14px 16px;background:var(--sf2);font-size:14.5px}
.steps3 div b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:2px}
.steps3 div span{font-family:var(--num);font-size:24px;font-weight:800;color:var(--lilac);display:block;line-height:1}
.note{padding:14px 16px;border-left:4px solid var(--lilac);background:var(--sf2);font-size:14.5px;color:var(--ink2)}
.note.warn{border-color:var(--warn)}
.note.bad{border-color:var(--bad)}
.note.ok{border-color:var(--ok)}
.note p{margin:0}
.note p+p{margin-top:6px}
.md h4{margin:18px 0 6px;color:var(--ink);font-size:16px}
.md h4:first-child{margin-top:0}
.md ul,.md ol{margin:6px 0;padding-left:1.3em}
.md li{margin:4px 0}
.md p{margin:6px 0}
.md b{color:var(--ink)}

/* 報名 */
.flowline{display:grid;grid-template-columns:repeat(5,1fr);margin:0;padding:0;list-style:none;counter-reset:s;border-top:2px solid var(--ink)}
.flowline li{position:relative;padding:16px 14px 16px 0;font-weight:700;font-size:15px;border-bottom:1px solid var(--ln)}
.flowline li::before{counter-increment:s;content:counter(s);display:block;font-family:var(--num);font-size:34px;font-weight:800;line-height:1;color:var(--lilac);margin-bottom:6px}
.gate{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:24px 26px;background:var(--sf);border-left:6px solid var(--lilac)}
.gate h3{margin:0;font-size:22px}
.gate p{margin:4px 0 0;color:var(--mute)}
.mbar{margin-bottom:14px}
form.reg{display:grid;gap:14px}
.panel{background:var(--sf);padding:24px}
form.reg h3{margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:10px}
form.reg .sub{margin:0 0 18px;color:var(--mute);font-size:14.5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13.5px;font-weight:700;color:var(--ink2)}
.req{font-size:12px;color:var(--bad);font-weight:700;margin-left:6px}
.opt{font-size:12px;color:var(--mute);font-weight:500;margin-left:6px}
.in{width:100%;height:46px;padding:0 13px;background:var(--bg);border:1px solid var(--ln2);border-radius:0;color:var(--ink);font-size:16px;transition:border-color .15s}
.in::placeholder{color:#6f7380}
.in:focus{outline:none;border-color:var(--ice);box-shadow:inset 0 0 0 1px var(--ice)}
.in[readonly]{color:var(--mute);background:var(--sf2)}
.field.bad .in{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.ferr{font-size:13px;color:var(--bad);display:none}
.field.bad .ferr{display:block}
.hint{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mute)}
.logo-drop{display:grid;grid-template-columns:140px 1fr;gap:20px;align-items:center;margin-top:20px;padding:16px;border:1.5px dashed var(--ln2);transition:border-color .15s,background .15s}
.logo-drop.drag{border-color:var(--ice);background:rgba(143,200,255,.06)}
.logo-drop.bad{border-color:var(--bad)}
.checker{width:140px;height:140px;background:repeating-conic-gradient(#2c2e35 0 25%,#24252b 0 50%) 0 0/18px 18px;display:grid;place-items:center;overflow:hidden;color:var(--mute)}
.checker img{max-width:90%;max-height:90%;object-fit:contain}
.logo-drop .t{font-weight:900}
.logo-drop p{margin:4px 0 12px;font-size:14px;color:var(--mute)}
.players{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--bg);border-top:4px solid var(--ln2)}
.pcard.cap{border-top-color:var(--lilac)}
.pcard.sub{border-top-color:var(--ln)}
.pcard-head{display:flex;align-items:center;gap:8px}
.pcard-head .role{font-weight:900;font-size:16px}
.pcard-head .chip{margin-left:auto}
.pcard .field{gap:3px}
.pcard .field>label{font-size:12.5px;color:var(--mute);font-weight:700}
.pcard .in{height:42px;font-size:15.5px}
.photo-f{display:flex;align-items:flex-end;gap:12px;margin-top:4px}
.sq{position:relative;width:118px;height:118px;flex:none;display:grid;place-items:center;border:1.5px dashed var(--ln2);background:var(--sf);color:var(--mute);cursor:pointer;overflow:hidden;font-size:12.5px;line-height:1.4;text-align:center;padding:0}
.sq:hover{border-color:var(--ice);color:var(--ice)}
.sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sq.has{border-style:solid;border-color:var(--ln2)}
.photo-f .pt{font-size:12.5px;color:var(--mute);line-height:1.5}
.photo-f .pt b{display:block;color:var(--ink2);font-size:13px}
.photo-f .rm{margin-top:6px;font-size:12.5px;border:0;background:none;color:var(--bad);cursor:pointer;padding:0;text-decoration:underline}
.notes-box{max-height:340px;overflow:auto;padding:16px 20px;background:var(--bg);border:1px solid var(--ln);font-size:14.5px}
.notes-hint{margin:8px 0 0;font-size:13px;color:var(--warn)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;cursor:pointer;font-weight:500}
.check input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--lilac);flex:none}
.check.off{opacity:.5;cursor:not-allowed}
.check.bad span{color:var(--bad)}
.submit-bar{position:sticky;bottom:0;z-index:5;display:flex;justify-content:flex-end;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0 16px;background:var(--bg);border-top:1px solid var(--ln)}
.submit-bar .muted{font-size:14px;margin-right:auto}
.confirm-logo{display:flex;align-items:center;gap:16px;margin:12px 0 14px}
.confirm-logo .checker{width:84px;height:84px}
.confirm-logo b{font-size:22px}
.mini{width:100%;border-collapse:collapse;font-size:14px}
.mini th,.mini td{padding:8px 8px;border-bottom:1px solid var(--ln);text-align:left}
.mini th{color:var(--mute);font-weight:700;font-size:12.5px}
.mini td.uid{font-family:var(--num);font-size:16px}
.done-card{max-width:680px;margin:0 auto;padding:40px 0 10px}
.done-card .big{font-family:var(--num);font-size:16px;font-weight:700;letter-spacing:.14em;color:var(--lilac)}
.done-card h2{margin:4px 0 6px;font-size:38px;font-weight:900}
.next{margin:24px 0 0;padding:0;list-style:none;counter-reset:n;border-top:2px solid var(--ink)}
.next li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--ln)}
.next li::before{counter-increment:n;content:counter(n);font-family:var(--num);font-size:26px;font-weight:800;color:var(--lilac);line-height:1.1;min-width:22px}

/* 我的隊伍 */
.team-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.tlogo{width:96px;height:96px;flex:none;background:var(--bg);display:grid;place-items:center;overflow:hidden}
.tlogo img{width:84%;height:84%;object-fit:contain}
.tlogo b{font-size:34px;font-weight:900}
.team-head h2{margin:0;font-size:32px;line-height:1.25}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.roster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rc{display:flex;gap:14px;padding:12px;background:var(--sf);min-width:0}
.rc .ph2{width:72px;height:72px;flex:none;background:var(--bg);display:grid;place-items:center;font-size:24px;font-weight:900;overflow:hidden}
.rc .ph2 img{width:100%;height:100%;object-fit:cover}
.rc div{min-width:0}
.rc small{display:block;font-size:12.5px;color:var(--mute)}
.rc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .uid{font-family:var(--num);font-size:15px;color:var(--ice)}
.meta{display:flex;gap:6px 22px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin-top:16px}

/* 賽程頁 */
.sched details{background:var(--sf);margin:0 0 10px;border-left:5px solid var(--c,var(--ln2))}
.sched summary{list-style:none;display:grid;grid-template-columns:78px 96px 1fr auto 26px;align-items:center;gap:16px;padding:16px 20px;cursor:pointer}
.sched summary::-webkit-details-marker{display:none}
.sched .dn{font-family:var(--num);font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--mute)}
.sched .dd{font-family:var(--num);font-size:34px;font-weight:800;line-height:1}
.sched .dd small{display:block;font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--mute);margin-top:4px}
.sched h3{margin:0;font-size:18px}
.sched .tm{font-size:14px;color:var(--mute)}
.sched .sb{padding:0 20px 20px 20px;animation:drop .22s ease}
.sched.past details{opacity:.7}
.mlist{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:14px}
.mlist td{padding:9px 10px;border-bottom:1px solid var(--ln)}
.mlist td.n{font-family:var(--num);font-weight:700;width:76px;color:var(--mute)}

/* 隊伍查詢 */
.lock{display:grid;grid-template-columns:auto 1fr;gap:20px 28px;align-items:center;padding:28px;background:var(--sf);border-left:6px solid var(--ice)}
.lock .lk{width:74px;height:74px;display:grid;place-items:center;background:var(--ice);color:var(--ice-ink)}
.lock .lk svg{width:36px;height:36px}
.lock h2{margin:0;font-size:24px}
.lock p{margin:4px 0 0;color:var(--ink2)}
.lock .cd b{font-size:40px}
.tq{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tq .in{max-width:320px}
.seg{display:inline-flex;border:1px solid var(--ln2)}
.seg button{border:0;background:none;padding:0 14px;height:44px;font-weight:700;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.teams details{background:var(--sf);margin:0 0 8px}
.teams summary{list-style:none;display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer}
.teams summary::-webkit-details-marker{display:none}
.teams summary .tl2{width:46px;height:46px;flex:none;background:var(--bg);display:grid;place-items:center;overflow:hidden}
.teams summary .tl2 img{width:86%;height:86%;object-fit:contain}
.teams summary .tl2 b{font-weight:900}
.teams summary .nm{flex:1;min-width:0}
.teams summary .nm b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teams summary .nm small{color:var(--mute);font-size:13px}
.teams .tb{padding:4px 16px 18px;animation:drop .22s ease}

/* 成績 */
.seg.tabs{display:flex;overflow-x:auto;scrollbar-width:none;margin-bottom:18px}
.seg.tabs::-webkit-scrollbar{display:none}
.seg.tabs button{flex:none;white-space:nowrap}
.seg.tabs button .dot{display:inline-block;width:7px;height:7px;background:var(--ok);margin-left:7px;vertical-align:middle}
.stage-info{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;margin-bottom:12px;font-size:14px;color:var(--mute)}
.stage-info b{color:var(--ink)}
.mstrip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.mstrip span{font-size:12.5px;padding:3px 9px;background:var(--sf);color:var(--mute)}
.mstrip span.done{background:var(--sf2);color:var(--ink)}
.stand{width:100%;border-collapse:collapse;font-size:15px}
.stand thead th{padding:8px 10px;font-size:12.5px;font-weight:700;color:var(--mute);letter-spacing:.06em;text-align:center;border-bottom:2px solid var(--ink);white-space:nowrap}
.stand thead th.l{text-align:left}
.stand tr.row{cursor:pointer}
.stand tr.row td{padding:11px 10px;border-bottom:1px solid var(--ln);text-align:center}
.stand tr.row:hover td{background:var(--sf)}
.stand .rk{font-family:var(--num);font-size:26px;font-weight:800;width:64px}
.stand .tn{text-align:left!important}
.stand .tn div{display:flex;align-items:center;gap:10px;min-width:0}
.stand .tn img,.stand .tn .lg{width:34px;height:34px;object-fit:contain;flex:none}
.stand .tn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stand .v{font-family:var(--num);font-size:19px;font-weight:700}
.stand .tot{font-family:var(--num);font-size:28px;font-weight:800}
.stand tr.z-adv td:first-child{box-shadow:inset 5px 0 0 var(--ice)}
.stand tr.z-adv .rk{color:var(--ice)}
.stand tr.z-mid td:first-child{box-shadow:inset 5px 0 0 var(--lilac)}
.stand tr.z-mid .rk{color:var(--lilac)}
.stand tr.z-out td{color:var(--mute)}
.stand tr.z-gold td:first-child{box-shadow:inset 5px 0 0 var(--gold)}
.stand tr.z-gold .rk{color:var(--gold)}
.zl{display:block;font-size:12px;font-weight:500;color:var(--mute)}
.mp{display:inline-flex;align-items:center;height:20px;padding:0 7px;font-size:11.5px;font-weight:900;background:var(--gold);color:#2b2006;white-space:nowrap}
.stand tr.detail td{background:var(--sf);text-align:left;padding:12px 14px}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{font-size:12.5px;padding:4px 9px;background:var(--bg)}
.hist span b{font-family:var(--num);font-size:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.champ{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:22px 24px;margin-bottom:16px;background:var(--gold);color:#2b2006}
.champ .tlogo{width:84px;height:84px;background:#fff6dc}
.champ small{font-weight:900;letter-spacing:.12em}
.champ h3{margin:2px 0 0;font-size:30px;font-weight:900}
.rush{display:flex;gap:10px 24px;flex-wrap:wrap;align-items:center;padding:12px 16px;margin-bottom:14px;background:var(--sf);font-size:14px}
.rush b{color:var(--ink)}
.empty{padding:44px 20px;text-align:center;color:var(--mute);background:var(--sf)}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:20px}
.skeleton{height:120px;background:var(--sf);animation:sk 1.2s ease-in-out infinite alternate}
@keyframes sk{to{background:var(--sf2)}}

/* 頁尾 */
.foot{position:relative;margin-top:110px;padding:30px 0 70px;background:var(--bg-deep);color:var(--mute);font-size:14px}
.foot-clouds{position:absolute;left:0;right:0;top:-46px;width:100%;height:48px;fill:var(--bg-deep);pointer-events:none}
.foot .row{display:flex;gap:24px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.foot .logo-slot img{height:38px;width:auto}
.foot .fb{font-family:var(--num);font-weight:800;font-size:24px;letter-spacing:.12em;color:var(--ink)}
.foot nav{display:flex;gap:6px 18px;flex-wrap:wrap}
.foot nav a{color:var(--mute);text-decoration:none}
.foot nav a:hover{color:var(--ink)}
.soc{display:flex;gap:8px}
.soc a{display:grid;place-items:center;width:38px;height:38px;background:var(--sf);color:var(--ink2)}
.soc a:hover{color:var(--ink);background:var(--sf2)}
.foot p{margin:16px 0 0}

/* 彈窗、提示 */
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(10,10,12,.78);display:grid;place-items:center;padding:16px;animation:fade .16s ease}
.modal{position:relative;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--sf);border-top:5px solid var(--lilac);padding:26px 26px 24px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .2s ease}
.modal.wide{width:min(780px,100%)}
.modal.ice{border-top-color:var(--ice)}
.modal.gold{border-top-color:var(--gold)}
.modal .k{font-family:var(--num);font-size:14px;font-weight:700;letter-spacing:.14em;color:var(--lilac)}
.modal h3{margin:2px 0 10px;font-size:24px;font-weight:900;padding-right:30px;line-height:1.3}
.modal .x{position:absolute;right:12px;top:12px;width:38px;height:38px;border:0;background:none;color:var(--mute);cursor:pointer;display:grid;place-items:center}
.modal .x:hover{color:var(--ink)}
.modal .acts{justify-content:flex-end;margin-top:22px}
.popup-art{position:relative;margin:-26px -26px 18px;line-height:0}
.popup-art img{width:100%;aspect-ratio:16/9;object-fit:cover}
.gbtn{display:flex;justify-content:center;min-height:48px;margin:18px 0 8px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(92vw,460px);pointer-events:none}
.toast{padding:12px 18px;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:rise .2s ease}
.toast.error{background:var(--bad);color:#2a0a10}
.busy{position:fixed;inset:0;z-index:95;display:grid;place-items:center;align-content:center;gap:14px;background:rgba(10,10,12,.78);color:var(--ink);font-weight:700;text-align:center;padding:20px}
.spin{width:42px;height:42px;margin:0 auto;border:3px solid var(--ln2);border-top-color:var(--lilac);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.preview-chip{position:fixed;left:12px;bottom:12px;z-index:45;display:flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;background:var(--warn);color:#2b2006;font-size:13px;font-weight:900}
.preview-chip button{border:0;padding:4px 10px;background:#2b2006;color:var(--warn);font-size:12px;font-weight:700;cursor:pointer}

/* 響應式 */
@media (max-width:1100px){.follow{display:none}}
@media (max-width:1000px){
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ft::after{display:none}
  .ft.cup{grid-column:1/-1}
  .days{grid-template-columns:repeat(4,minmax(0,1fr))}
  .players,.roster{grid-template-columns:repeat(2,minmax(0,1fr))}
  .info{grid-template-columns:1fr}
}
@media (max-width:760px){
  .brand .ev{display:none}
  .menu-btn span{display:none}
  .menu-btn{padding:0 9px}
  .me-btn .nm{display:none}
  .me-btn{padding:0 4px}
  .grid3,.two,.partners,.steps3{grid-template-columns:1fr}
  .flowline{grid-template-columns:1fr 1fr}
  .sched summary{grid-template-columns:56px 1fr auto 22px;gap:12px;padding:14px 14px}
  .sched summary .dn{display:none}
  .sched .dd{font-size:28px}
  .sched .sb{padding:0 14px 16px}
}
@media (max-width:640px){
  body{font-size:15.5px}
  .top{padding:0 12px}
  .brand img{height:28px}
  .cover img{aspect-ratio:1/1}
  .ticket{--sh:104px;grid-template-columns:1fr;
    -webkit-mask:radial-gradient(circle var(--r) at 0 var(--sh),#0000 calc(var(--r) - .5px),#000 var(--r)) left/51% 100% no-repeat,radial-gradient(circle var(--r) at 100% var(--sh),#0000 calc(var(--r) - .5px),#000 var(--r)) right/51% 100% no-repeat;
    mask:radial-gradient(circle var(--r) at 0 var(--sh),#0000 calc(var(--r) - .5px),#000 var(--r)) left/51% 100% no-repeat,radial-gradient(circle var(--r) at 100% var(--sh),#0000 calc(var(--r) - .5px),#000 var(--r)) right/51% 100% no-repeat}
  .stub{height:var(--sh);padding:16px 22px}
  .stub b{font-size:26px}
  .tmain{border-left:0;border-top:2px dashed var(--bg);padding:20px 22px}
  .tinfo{min-width:0}
  .cd b{font-size:38px}
  .tcta,.tcta .btn{width:100%}
  .sec{padding-top:58px}
  .facts{grid-template-columns:1fr}
  .facts div:nth-child(odd){padding-right:0}
  .flow{grid-template-columns:1fr}
  .days{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 6px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .dtk{flex:0 0 42%;scroll-snap-align:start}
  .podium{grid-template-columns:1fr}
  .pd{min-height:0!important}
  .pd.p1{order:0}
  .pd .rk{font-size:64px}
  .prow{grid-template-columns:1fr}
  .players,.roster{grid-template-columns:1fr}

function mergePub(p) {

  p.settings.social = Object.assign(clone(DEFAULT_SETTINGS.social), p.settings.social || {});
  p.schedule = p.schedule && p.schedule.length ? p.schedule : b.schedule;
  p.stages = Object.assign(b.stages, p.stages || {});
  p.teams = p.teams || []; p.news = p.news || []; p.texts = p.texts || {};

}
async function loadPublic() {

}

function teamsOpenNow() { const t = S.pub.teamsOpen || teamsInfo(S.pub.settings, S.pub.schedule); if (t.mode === 'auto' && t.at && now() >= t.at) return Object.assign({}, t, { open: true }); return t; }
function regLine() {

function eventRange() {

}
function dayState(d) {

    `SUMMARY:${e(EVENT.name + '｜' + d.title.replace('｜', ' '))}`, `DESCRIPTION:${e(ms.map(m => '第 ' + m.n + ' 場 ' + m.map).join('\n') + (d.stream ? '\n直播：' + d.stream : ''))}`,

function registerArea() {

  const m = S.me.member || {};
  if (s.requireMember && !m.found) return `<div class="note bad"><p><b>本賽事限銳能會員報名。</b>這個 Google 帳號（${esc(S.me.user.email)}）沒有對應的會員資料，請先到銳能會員中心註冊，並綁定同一個 Google 帳號後再回來報名。</p><p style="margin-top:12px"><a class="btn small" href="${esc(SITE.MEMBER_CENTER_URL)}">前往銳能會員中心</a></p></div>`;

function phaseText(r) {
  const s = S.pub.settings;

  if (r.phase === 'closed') return '目前暫停報名，請留意官方公告。';

}
function slotText(t) { return t.slot === 'main' ? `目前是正取隊伍（報名序號 ${t.no}）` : t.slot === 'wait' ? `目前是候補第 ${t.waitNo} 位` : '報名已取消'; }

function reviewChip(t) { return t.review === 'approved' ? '<span class="chip ok">審核通過</span>' : t.review === 'fix' ? '<span class="chip bad">需要修改</span>' : '<span class="chip">待審核</span>'; }

          <div><div class="t">隊伍 LOGO<span class="req">必填</span></div><p>建議 512×512 以上的正方形圖片，PNG 透明背景最佳；也可以直接把圖片拖曳到這裡。</p>
            <button type="button" class="btn line small" data-act="pick-logo">${f.logo ? '更換 LOGO' : '上傳 LOGO'}</button><input type="file" accept="image/*" hidden id="fLogo"><div class="ferr" style="margin-top:8px"></div></div>
        </div>

        <h3>選手名單</h3>
        <p class="sub">每場 4 人上場：隊長＋正選隊員 3 名。每位選手填暱稱、遊戲名稱與遊戲 UID，照片可以不上傳。</p>

        ${f.notesRead ? '' : '<p class="notes-hint" id="notesHint">請把注意事項捲動到最後，才能勾選同意。</p>'}
        <label class="check ${f.notesRead ? '' : 'off'}" id="agreeRow"><input type="checkbox" id="fAgree" ${f.agree ? 'checked' : ''} ${f.notesRead ? '' : 'disabled'}><span>我已閱讀參賽注意事項，同意遵守賽事規則</span></label>
        <label class="check" id="consentRow" ${anyPhoto ? '' : 'hidden'}><input type="checkbox" id="fConsent" ${f.consent ? 'checked' : ''}><span>照片中的選手都已同意，並同意主辦單位將照片用於賽事網站、直播畫面與宣傳</span></label>

    </form>`;
  },
  bind() {
    const form = $('form.reg'); if (!form) return;
    const f = S.form;
    form.addEventListener('input', e => {
      const el = e.target;
      if (el.id === 'fTeam') { f.teamName = el.value; $('#nameCount').textContent = glen(el.value.trim()) + '/12'; }
      else if (el.id === 'fLine') f.lineId = el.value;
      else if (el.dataset.p !== undefined) {
        if (el.dataset.k === 'uid') { const v = el.value.replace(/\D/g, ''); if (v !== el.value) el.value = v; }
        f.players[Number(el.dataset.p)][el.dataset.k] = el.value;
      }
      const fld = el.closest('.field'); if (fld) fld.classList.remove('bad');
      Form.saveDraft();
    });
    form.addEventListener('change', e => {
      const el = e.target;
      if (el.id === 'fAgree') { f.agree = el.checked; $('#agreeRow').classList.remove('bad'); }
      if (el.id === 'fConsent') { f.consent = el.checked; $('#consentRow').classList.remove('bad'); }
      if (el.id === 'fLogo' && el.files[0]) Form.setLogo(el.files[0]);
      if (el.dataset.photo !== undefined && el.files[0]) Form.setPhoto(Number(el.dataset.photo), el.files[0]);

    form.addEventListener('submit', e => { e.preventDefault(); Form.confirm(); });
    const box = $('#notesBox');
    const checkRead = () => {

      if (box.scrollTop + box.clientHeight >= box.scrollHeight - 24) {

    drop.addEventListener('drop', e => { const file = e.dataTransfer.files && e.dataTransfer.files[0]; if (file) Form.setLogo(file); });
  },
  saveDraft() {
    const f = S.form; if (!f || f.mode !== 'new') return;

    Form._t = setTimeout(() => store.set('rwc27_draft', JSON.stringify({ teamName: f.teamName, lineId: f.lineId, players: f.players.map(p => ({ nickname: p.nickname, gameName: p.gameName, uid: p.uid })) })), 400);

  async setLogo(file) {

  validate() {

    else if (/[<>"'`\\]/.test(name)) errs.push(['teamName', '隊伍名稱不能包含 < > " \' ` \\ 等符號']);
    if (!f.logo) errs.push(['logo', '請上傳隊伍 LOGO']);
    const need = 4 + f.subsRequired, seen = {};
    f.players.forEach((p, i) => {
      const nn = p.nickname.trim(), gn = p.gameName.trim(), uid = p.uid.trim();
      if (i >= need && !nn && !gn && !uid) { if (p.photo) errs.push([`p${i}-nickname`, '有上傳照片就要填寫這位選手的資料']); return; }
      if (!nn) errs.push([`p${i}-nickname`, '請填寫暱稱']); else if (glen(nn) > 20) errs.push([`p${i}-nickname`, '最多 20 個字']);
      if (!gn) errs.push([`p${i}-gameName`, '請填寫遊戲名稱']); else if (glen(gn) > 24) errs.push([`p${i}-gameName`, '最多 24 個字']);
      if (!/^\d{6,12}$/.test(uid)) errs.push([`p${i}-uid`, 'UID 請填 6～12 位數字']);
      else if (seen[uid] !== undefined) errs.push([`p${i}-uid`, `和${ROLE_LABELS[seen[uid]]}的 UID 重複`]);
      else seen[uid] = i;
    });
    if (!f.agree) errs.push(['agree', f.notesRead ? '請勾選同意遵守賽事規則' : '請先把注意事項捲動到最後，再勾選同意']);
    if (f.players.some(p => p.photo) && !f.consent) errs.push(['consent', '有上傳照片時，請勾選照片使用同意']);
    return errs;
  },
  showErrors(errs) {
    $$('form.reg .field.bad').forEach(el => el.classList.remove('bad'));
    $$('form.reg .check.bad').forEach(el => el.classList.remove('bad'));
    let first = null;
    errs.forEach(([k, msg]) => {
      let el;
      if (k === 'logo') { el = $('#logoDrop'); el.classList.add('bad'); const fe = el.querySelector('.ferr'); fe.textContent = msg; fe.style.display = 'block'; }

    toast(`還有 ${errs.length} 個地方需要修正`, 'error');
  },
  confirm() {
    const errs = Form.validate();
    if (errs.length) return Form.showErrors(errs);
    const f = S.form, edit = f.mode === 'edit';
    const rows = f.players.map((p, i) => p.uid.trim() ? `<tr><td>${ROLE_LABELS[i]}</td><td>${esc(p.nickname.trim())}</td><td>${esc(p.gameName.trim())}</td><td class="uid">${esc(p.uid.trim())}</td></tr>` : '').join('');
    openModal(`<span class="k">${edit ? '修改報名' : '確認報名'}</span><h3>${edit ? '確認修改內容' : '確認報名資料'}</h3>
      <p class="muted" style="margin:0">${edit ? '儲存後隊伍資料會重新送審。' : '送出後，報名截止前仍可以在「我的隊伍」修改。'}</p>
      <div class="confirm-logo"><div class="checker">${f.logo && f.logo.preview ? `<img src="${esc(f.logo.preview)}" alt="">` : ''}</div><b>${esc(f.teamName.trim())}</b></div>

      <div class="acts"><button class="btn line" data-act="close-modal">返回修改</button><button class="btn" data-act="submit-reg">${edit ? '儲存修改' : '送出報名'}</button></div>`, 'wide');
  },
  async submit() {
    const f = S.form;
    const images = {}, thumbs = {}, remove = [];
    if (f.logo && f.logo.changed) { images.logo = f.logo.full; thumbs.logo = f.logo.thumb; }
    f.players.forEach((p, i) => {
      const k = 'p' + (i + 1);
      if (p.photo && p.photo.changed) { images[k] = p.photo.full; thumbs[k] = p.photo.thumb; }
      else if (!p.photo && p.had) remove.push(k);
    });

/* 圖片處理：上傳前自動縮小 */
const Img = {
  async check(file) {
    if (!file.type.startsWith('image/')) throw new Error('請選擇圖片檔（JPG、PNG）');
    if (file.size > 20 * 1024 * 1024) throw new Error('圖片太大，請選擇 20MB 以內的檔案');
    try { if (window.createImageBitmap) return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* 改用 Image 讀取 */ }
    return await new Promise((ok, no) => {
      const url = URL.createObjectURL(file); const im = new Image();
      im.onload = () => { ok(im); URL.revokeObjectURL(url); };
      im.onerror = () => { no(new Error('無法讀取這張圖片，請改用 JPG 或 PNG')); URL.revokeObjectURL(url); };
      im.src = url;
    });
  },
  canvas(img, max) {
    const w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height);
    return c;
  },
  async logo(img) {
    let c = Img.canvas(img, 1024), d = c.toDataURL('image/png');
    if (d.length > 2.6e6) { c = Img.canvas(img, 720); d = c.toDataURL('image/png'); }
    if (d.length > 2.6e6) { d = c.toDataURL('image/webp', 0.92); if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', 0.92); }
    return d;
  },
  photo(img) { return Img.canvas(img, 1280).toDataURL('image/jpeg', 0.86); },
  thumb(img, size, keepAlpha) {
    for (const s of [size, Math.round(size * 0.75), Math.round(size * 0.55)]) {
      const c = Img.canvas(img, s);
      let d = c.toDataURL('image/webp', 0.84);
      if (!d.startsWith('data:image/webp')) d = keepAlpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.8);
      if (d.length <= 46000) return d;
    }
    return '';
  },
};

function stageView(code) {
  const pub = S.pub, sc = pub.settings.scoring, st = pub.stages[code];
  const r = computeStage(pub, code);
  const days = scheduleOf(code).map(d => `${fmtMD(d.date)}${d.time ? ' ' + d.time : ''}`).join('、');
  const info = `<div class="stage-info"><span><b>${STAGES[code].name}</b></span><span>${esc(days)}</span><span>已完成 <b>${r.played}</b> / ${r.max} 場</span>${!r.finished && r.played ? '<span class="chip ok">進行中，排名隨時更新</span>' : ''}</div>`;
  const strip = `<div class="mstrip">${st.matches.map(m => `<span class="${m.done ? 'done' : ''}">第 ${m.n} 場 ${esc(m.map)}</span>`).join('')}</div>`;
  if (!r.rows.length || !r.played) {
    const why = (code === 'GA' || code === 'GB') && !pub.settings.groupsPublished ? '分組公布、比賽開始後會在這裡更新排名。' : '比賽開始後會在這裡更新排名。';
    return info + strip + `<div class="empty"><h3>尚未開賽</h3><p>${why}</p></div>`;
  }
  let head = '';
  if (code === 'CR') {
    const champId = r.champion || (r.finished && r.rows[0] && r.rows[0].played ? r.rows[0].id : null);
    const champ = champId ? teamById(champId) : null;
    head = champ ? `<div class="champ"><div class="tlogo">${teamMark(champ)}</div><div><small>銳能冬季盃 2027 冠軍</small><h3>${esc(champ.name)}</h3><p style="margin:0">${r.champion ? `取得賽點後，在第 ${r.champAt} 場吃雞奪冠` : `${r.max} 場打完沒有隊伍完成冠軍衝刺，依總積分奪冠`}</p></div></div>`
      : `<div class="rush"><span>賽點門檻 <b>${r.threshold} 分</b></span><span>已完成 <b>${r.played}</b> / ${r.max} 場</span><span>取得賽點 <b>${r.rows.filter(x => x.eligible).length}</b> 隊</span>${r.finished ? '<span>已打滿場次，依總積分排名</span>' : ''}</div>`;
  }
  const rows = r.rows.map((x, i) => {
    const rank = i + 1, t = teamById(x.id);
    let z = zoneOf(code, rank, sc);
    if (code === 'CR') z = (x.id === r.champion || (r.finished && rank === 1)) ? ['z-gold', '冠軍'] : rank <= 6 && r.finished ? ['z-adv', EVENT.prizes[rank - 1].title] : ['', ''];
    const mp = code === 'CR' && x.eligible && !r.finished ? '<span class="mp">賽點</span>' : '';
    return `<tr class="row ${z[0]}" data-act="row" tabindex="0" aria-expanded="false">
      <td class="rk">${rank}</td>
      <td class="tn"><div>${teamLogo(t)}<b>${esc(t.name)}</b>${mp}</div>${z[1] ? `<span class="zl">${esc(z[1])}</span>` : ''}</td>
      ${code === 'CR' ? `<td class="v hide-s">${x.bonus || 0}</td>` : ''}
      <td class="v">${x.booyah}</td><td class="v">${x.kills}</td><td class="v hide-s">${x.place}</td><td class="tot">${x.total}</td></tr>
      <tr class="detail" hidden><td colspan="${code === 'CR' ? 7 : 6}"><div class="hist">${x.hist.length ? x.hist.map(h => `<span>第 ${h.n} 場 ${esc(h.map)}：第 <b>${h.p}</b> 名／<b>${h.k}</b> 殺／<b>${h.pts}</b> 分</span>`).join('') : '還沒有比賽紀錄'}</div></td></tr>`;
  }).join('');
  const legend = code === 'GA' || code === 'GB'
    ? '<div class="legend"><span><i style="background:var(--ice)"></i>第 1～4 名直進總決賽</span><span><i style="background:var(--lilac)"></i>第 5～10 名進入突圍賽</span><span><i style="background:var(--ln2)"></i>第 11～12 名淘汰</span></div>'
    : code === 'BR' ? '<div class="legend"><span><i style="background:var(--ice)"></i>前 4 名晉級總決賽</span></div>'
    : code === 'PR' ? `<div class="legend"><span><i style="background:var(--ice)"></i>前 ${sc.bonus.length} 名取得冠軍衝刺初始積分</span></div>`
    : `<div class="legend"><span><span class="mp">賽點</span>　已達 ${sc.threshold} 分，下一場起吃雞即奪冠</span></div>`;
  return info + strip + head + `<div class="scroll-x"><table class="stand"><thead><tr><th>排名</th><th class="l">隊伍</th>${code === 'CR' ? '<th class="hide-s">初始</th>' : ''}<th>吃雞</th><th>擊殺</th><th class="hide-s">排名分</th><th>總分</th></tr></thead><tbody>${rows}</tbody></table></div>${legend}

}

    if (S.tf === 'B' && t.group !== 'B') return false;
    if (S.tf === 'final' && !final.has(t.id)) return false;
    if (q && ![t.name].concat(t.players.map(p => p.nickname + ' ' + p.gameName)).join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
  if (!list.length) return `<div class="empty"><h3>${S.tf === 'final' && !final.size ? '12 強尚未產生' : '找不到符合的隊伍'}</h3><p>換個關鍵字或篩選條件試試看。</p></div>`;
  return list.map(t => {
    const sd = standingOf(t.id);
    return `<details><summary><span class="tl2">${teamMark(t)}</span><span class="nm"><b>${esc(t.name)}</b><small>${sd ? esc(sd) : t.players.length + ' 位選手'}</small></span>${t.group ? `<span class="chip ${t.group === 'A' ? 'ice' : 'lilac'}">${t.group}組</span>` : ''}${final.has(t.id) ? '<span class="chip gold">12 強</span>' : ''}<span class="pm" aria-hidden="true"></span></summary>
      <div class="tb"><div class="roster">${t.players.map(p => `<div class="rc"><div class="ph2">${p.photo ? `<img src="${esc(p.photo)}" alt="">` : esc(Array.from(p.nickname || '?')[0])}</div><div><small>${{ C: '隊長', P: '正選', S: '替補' }[p.role] || ''}</small><b>${esc(p.nickname)}</b><small>${esc(p.gameName)}</small></div></div>`).join('')}</div></div></details>`;
  }).join('');
}
function bindTeams() {
  const el = $('#tq'); if (!el) return;
  el.addEventListener('input', () => { S.tq = el.value; $('#teamList').innerHTML = teamListHtml(); });
}

/* ==========================================================================
 *  登入
 * ========================================================================== */
let gisReady = false;
function initGIS() {
  if (PREVIEW || !SITE.GOOGLE_CLIENT_ID) return;
  let tries = 0;
  const t = setInterval(() => {
    tries++;
    if (window.google && google.accounts && google.accounts.id) {
      clearInterval(t);
      google.accounts.id.initialize({ client_id: SITE.GOOGLE_CLIENT_ID, callback: onCredential, auto_select: false, cancel_on_tap_outside: true, itp_support: true });
      gisReady = true;
      const box = $('#gbtn'); if (box) renderGBtn(box);
    } else if (tries > 75) clearInterval(t);
  }, 200);
}
function renderGBtn(box) {
  box.innerHTML = '';
  google.accounts.id.renderButton(box, { type: 'standard', theme: 'filled_black', size: 'large', text: 'signin_with', shape: 'rectangular', logo_alignment: 'left', locale: 'zh-TW', width: Math.min(320, box.clientWidth || 320) });
}
function openLogin() {
  if (PREVIEW) { openModal(`<span class="k">登入</span><h3>預覽模式登入</h3><p class="muted">網站還沒連接後端，這裡用示範帳號登入，資料只存在你的瀏覽器。</p><div class="acts" style="justify-content:flex-start"><button class="btn" data-act="preview-login">以示範帳號登入</button></div>`); return; }
  if (!SITE.GOOGLE_CLIENT_ID) { openModal('<span class="k">登入</span><h3>暫時無法登入</h3><p>網站尚未設定 Google 登入，請聯繫主辦單位。</p><div class="acts"><button class="btn" data-act="close-modal">我知道了</button></div>'); return; }
  openModal(`<span class="k">登入</span><h3>使用 Google 登入</h3><p class="muted" style="margin:0">隊長請用要報名的 Google 帳號登入；如果是銳能會員，請用綁定會員的同一個帳號，系統會自動帶入會員資料。</p>
    <div class="gbtn" id="gbtn">${gisReady ? '' : '<div class="spin"></div>'}</div>
    <p class="muted" style="font-size:13px;text-align:center;margin:0">按了沒反應時，請允許瀏覽器開啟彈出視窗。</p>`);
  if (gisReady) renderGBtn($('#gbtn'));
}
async function onCredential(resp) {
  busy('登入中…');
  try { applyLogin(await api('auth.google', { credential: resp.credential })); }
  catch (e) { busy(false); toast(e.message, 'error'); }
}
async function previewLogin() { busy('登入中…'); try { applyLogin(await api('auth.google', { credential: 'preview' })); } catch (e) { busy(false); toast(e.message, 'error'); } }
function applyLogin(r) {
  S.token = r.token; store.set('rwc27_token', r.token);
  S.me = { user: r.user, member: r.member, team: r.team, reg: r.reg };
  if (r.reg) S.pub.reg = r.reg;
  if (S.form && S.form.owner !== (r.user && r.user.email)) S.form = null;
  busy(false); closeModal();
  toast(r.member && r.member.found ? `歡迎回來，${r.member.nickname || r.user.name}！已帶入會員資料` : '登入成功');
  route(true);
  if (parseHash().path === 'register') { const f = $('#form'); if (f) f.scrollIntoView({ behavior: 'smooth' }); }
}
function logout() {
  const tok = S.token;
  S.token = null; S.me = null; S.form = null; store.del('rwc27_token');
  if (!PREVIEW && window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
  api('auth.logout', { token: tok }).catch(() => {});
  toast('已登出');
  route();
}

/* ==========================================================================
 *  彈窗、提示、讀取中
 * ========================================================================== */
let lastFocus = null;
function openModal(html, tone = '') {
  lastFocus = document.activeElement;
  const wide = tone === 'wide';
  $('#modal').innerHTML = `<div class="modal-back" data-act="backdrop"><div class="modal ${wide ? 'wide' : tone}" role="dialog" aria-modal="true"><button class="x" data-act="close-modal" aria-label="關閉">${IC.close}</button>${html}</div></div>`;
  const first = $('#modal .modal .acts .btn, #modal .modal input, #modal .modal button:not(.x)');
  if (first) first.focus({ preventScroll: true });
}
function closeModal() {
  if (S.popKey && $('#modal .popup-art')) { store.set('rwc27_pop', S.popKey); S.popKey = null; }
  $('#modal').innerHTML = '';
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
function toast(msg, type) {
  const el = document.createElement('div'); el.className = 'toast ' + (type || ''); el.textContent = msg;
  $('#toast').appendChild(el); setTimeout(() => el.remove(), type === 'error' ? 5200 : 3200);
}
function busy(msg) {
  let el = $('#busy');
  if (msg === false) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'busy'; el.className = 'busy'; el.setAttribute('role', 'alert'); document.body.appendChild(el); }
  el.innerHTML = `<div class="spin"></div><div>${esc(msg)}</div>`;
}

/* ==========================================================================
 *  事件
 * ========================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('#acct')) closeAcct(); return; }
  const act = el.dataset.act;
  if (act === 'backdrop') { if (e.target === el) closeModal(); return; }
  switch (act) {
    case 'login': openMenu(false); openLogin(); break;
    case 'preview-login': previewLogin(); break;
    case 'logout': closeAcct(); logout(); break;
    case 'acct': { const m = $('#acct'); const open = !m.classList.contains('open'); m.classList.toggle('open', open); el.setAttribute('aria-expanded', String(open)); e.stopPropagation(); break; }
    case 'menu': openMenu(true); break;
    case 'menu-x': openMenu(false); break;
    case 'close-modal': closeModal(); break;
    case 'pop-x': closeModal(); break;
    case 'pop-go': closeModal(); break;
    case 'notice-x': store.set('rwc27_notice', S.pub.settings.noticeBar); renderChrome(); break;
    case 'stage': stageModal(el.dataset.s); break;
    case 'day': dayModal(el.dataset.id); break;
    case 'ics': downloadIcs(el.dataset.id); break;
    case 'pick-logo': $('#fLogo').click(); break;
    case 'pick-photo': $(`input[data-photo="${el.dataset.i}"]`).click(); break;
    case 'rm-photo': Form.removePhoto(Number(el.dataset.i)); break;
    case 'clear-draft': store.del('rwc27_draft'); S.form = null; route(true); break;
    case 'submit-reg': Form.submit(); break;
    case 'withdraw': withdrawDialog(); break;
    case 'withdraw-go': doWithdraw(); break;
    case 'tab': S.recTab = el.dataset.c; S.recPicked = true; $$('.tabs button').forEach(b => { b.classList.toggle('on', b === el); b.setAttribute('aria-selected', String(b === el)); }); $('#stageBox').innerHTML = stageView(S.recTab); break;
    case 'row': { const d = el.nextElementSibling; if (d) { d.hidden = !d.hidden; el.setAttribute('aria-expanded', String(!d.hidden)); } break; }
    case 'tf': S.tf = el.dataset.k; $$('.tq .seg button').forEach(b => b.classList.toggle('on', b === el)); $('#teamList').innerHTML = teamListHtml(); break;
    case 'demo': S.demo = !S.demo; S.recPicked = false; S.lookup = null; busy('載入中…'); loadPublic().then(() => { busy(false); toast(S.demo ? '已切換到比賽期間的示範資料（只在預覽模式）' : '已回到報名期間'); route(true); }); break;
    case 'reset': if (confirm('要清除預覽資料，回到一開始的示範狀態嗎？')) { Mock.reset(); store.del('rwc27_token'); store.del('rwc27_draft'); store.del('rwc27_pop'); location.reload(); } break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal').innerHTML) closeModal(); else if ($('#mo').classList.contains('open')) openMenu(false); closeAcct(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.row')) { e.preventDefault(); e.target.click(); }
});
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('hashchange', () => route());

/* ==========================================================================
 *  啟動
 * ========================================================================== */
(async function boot() {
  S.pub = basePub();
  route();
  initGIS();
  await Promise.all([loadPublic(), loadMe()]);
  route(true);
  setTimeout(maybePopup, 600);
  setInterval(tickCountdown, 1000);
  setInterval(async () => {
    if (document.visibilityState !== 'visible' || parseHash().path !== 'record' || S.demo) return;
    await loadPublic();
    const box = $('#stageBox'); if (box) box.innerHTML = stageView(S.recTab);
  }, 60000);
})();
</script>
</body>
