<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>冬季盃後台｜銳能冬季盃 2027</title>
<meta name="theme-color" content="#0c1440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Saira+Condensed:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#f2f5fb;--card:#fff;--ink:#18203d;--ink-2:#45516e;--mute:#7884a1;--line:#e2e8f3;--line-2:#cbd5e9;
  --nav:#0c1440;--nav-2:#131d55;--nav-ink:#b7c2e2;--pri:#6a4bf0;--pri-2:#5a3be0;--ice:#1d8de0;--ok:#14916a;--warn:#b5760b;--bad:#d03f59;
  --sans:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;--num:"Saira Condensed","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--sans);font-size:15px;line-height:1.6;color:var(--ink);background:var(--bg)}
a{color:var(--pri)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
.num{font-family:var(--num);letter-spacing:.02em}
.muted{color:var(--mute)}
.small{font-size:13px}
.logo-slot .fb{display:none}
.logo-slot.missing img{display:none}
.logo-slot.missing .fb{display:inline-flex}

/* 登入 */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 80% 0,rgba(139,92,255,.35),transparent 60%),radial-gradient(800px 500px at 10% 20%,rgba(92,200,255,.22),transparent 60%),#0a1033}
.login-card{width:min(420px,100%);background:#fff;border-radius:16px;padding:30px 28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.login-card .lg{display:flex;justify-content:center;margin-bottom:6px}
.login-card .lg img{height:96px;width:auto}
.login-card .lg .fb{font-family:var(--num);font-weight:800;font-size:28px;letter-spacing:.08em;color:var(--nav)}
.login-card h1{margin:4px 0 2px;text-align:center;font-size:22px}
.login-card p.sub{margin:0 0 22px;text-align:center;color:var(--mute);font-size:14px}
.login-card .field{margin-bottom:14px}
.login-card .btn{width:100%;margin-top:6px}

/* 外框 */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--nav) 236px,transparent 236px)}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;padding:16px 12px;z-index:30}
.side .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;color:#fff;text-decoration:none}
.side .brand img{height:30px;width:auto}
.side .brand .fb{font-family:var(--num);font-weight:800;font-size:20px;letter-spacing:.1em}
.side .brand b{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;padding-left:10px;border-left:1px solid rgba(255,255,255,.2)}
.side nav{display:grid;gap:2px}
.side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--nav-ink);text-decoration:none;font-weight:500}
.side nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.side nav a.on{background:linear-gradient(90deg,rgba(92,200,255,.22),rgba(139,92,255,.2));color:#fff;box-shadow:inset 3px 0 0 #5cc8ff}
.side nav a .cnt{margin-left:auto;font-size:12px;padding:0 7px;border-radius:999px;background:#d03f59;color:#fff;font-weight:700}
.side .me{margin-top:auto;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.side .me b{display:block;color:#fff;font-size:14px}
.side .me .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.side .me button,.side .me a{border:1px solid rgba(255,255,255,.18);background:none;color:var(--nav-ink);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;text-decoration:none}
.side .me button:hover,.side .me a:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.topbar{display:none}
.main{min-width:0;padding:24px 28px 90px}
.head{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:24px;font-weight:900}
.head .sp{flex:1}
.sync{font-size:12.5px;color:var(--mute)}
.preview-flag{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:16px;border-radius:10px;background:#fff6e2;border:1px solid #f1d59a;color:#7a5306;font-size:14px}

/* 元件 */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card+.card{margin-top:14px}
.card h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:10px}
.card h2 .sp{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 16px;border:1px solid transparent;border-radius:8px;background:var(--pri);color:#fff;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--pri-2)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:#f4f6fb}
.btn.ok{background:var(--ok)}
.btn.warn{background:#fff;color:var(--warn);border-color:#ecc77a}
.btn.danger{background:#fff;color:var(--bad);border-color:#efb3bf}
.btn.danger:hover{background:#fff3f5}
.btn.solid-danger{background:var(--bad)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px;border-radius:6px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.in{width:100%;min-height:38px;padding:7px 11px;border:1px solid var(--line-2);border-radius:8px;background:#fff;font-size:15px}
.in:focus{border-color:var(--ice);outline:none;box-shadow:0 0 0 3px rgba(29,141,224,.15)}
textarea.in{min-height:96px;resize:vertical;line-height:1.6}
select.in{padding-right:28px}
.in.sm{min-height:32px;padding:4px 8px;font-size:14px}
.hint{font-size:12.5px;color:var(--mute)}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:999px;background:#cfd6e6;position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.sw input::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked{background:var(--pri)}
.sw input:checked::after{transform:translateX(18px)}
.sw small{display:block;font-size:12.5px;color:var(--mute);font-weight:400}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line-2);border-radius:8px;cursor:pointer;font-weight:500}
.radio label:has(input:checked){border-color:var(--pri);background:#f3f0ff;color:var(--pri-2)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;line-height:1.7}
.b-main{background:#e4f2fd;color:#1469ad}
.b-wait{background:#fff1d9;color:#9a6209}
.b-cancel{background:#eef0f4;color:#6d7690}
.b-pending{background:#eee9ff;color:#5838d6}
.b-approved{background:#ddf5ec;color:#0f7a57}
.b-fix{background:#fde6ea;color:#b9324b}
.b-A{background:#e0f2ff;color:#0f5e99}
.b-B{background:#f1e8ff;color:#6c33c9}
.b-none{background:#f0f2f6;color:#8a93a8}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{flex:none;padding:10px 14px;border:0;background:none;color:var(--mute);font-weight:700;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--pri)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{position:sticky;top:0;background:#f7f9fd;color:var(--ink-2);font-weight:700;font-size:13px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:#f8f9ff}
.tbl .c{text-align:center}
.tbl .n{font-family:var(--num);font-size:16px;font-weight:700}
.tlogo{width:38px;height:38px;object-fit:contain;border-radius:6px;background:repeating-conic-gradient(#eef1f7 0 25%,#fff 0 50%) 0 0/12px 12px;display:block}
.tname b{display:block}
.tname small{color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi small{display:block;color:var(--mute);font-size:13px}
.kpi b{font-family:var(--num);font-size:32px;line-height:1.15}
.kpi b span{font-size:17px;color:var(--mute)}
.kpi.hot{border-color:#efb3bf;background:#fff8f9}
.bar{height:8px;border-radius:999px;background:#e8edf6;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5cc8ff,#8b5cff)}
.list{display:grid}
.list .it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .sp{flex:1;min-width:0}
.list .it b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-ok{color:var(--ok);font-weight:700}
.status-bad{color:var(--bad);font-weight:700}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .in{width:auto}
.toolbar .search{flex:1;min-width:200px;max-width:340px}
.bulk{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:12px;border-radius:10px;background:#efeaff;border:1px solid #d6cbff}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.callout{padding:12px 14px;border-radius:10px;background:#f3f0ff;border:1px solid #ddd3ff;font-size:14px}
.callout.warn{background:#fff6e2;border-color:#f1d59a;color:#6d4a05}
.callout.bad{background:#fff0f3;border-color:#f2bdc8;color:#8f2236}
.callout.ok{background:#e8f8f1;border-color:#b9e6d3;color:#0d5f44}
.callout p{margin:0}

/* 側邊詳細面板 */
.drawer-back{position:fixed;inset:0;z-index:60;background:rgba(9,14,40,.4);animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(640px,100%);background:#fff;box-shadow:-20px 0 60px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@keyframes fade{from{opacity:0}}
.drawer header{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer header .lg{width:64px;height:64px;object-fit:contain;border-radius:10px;background:repeating-conic-gradient(#eef1f7 0 25%,#fff 0 50%) 0 0/14px 14px;cursor:zoom-in;flex:none}
.drawer header h2{margin:0;font-size:21px;line-height:1.3}
.drawer header .x{margin-left:auto;align-self:flex-start}
.drawer .body{flex:1;overflow:auto;padding:18px 20px 30px}
.drawer .acts-bar{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin-bottom:16px}
.kv div small{display:block;font-size:12.5px;color:var(--mute)}
.kv div span{word-break:break-all}
.ph{width:48px;height:48px;border-radius:4px;object-fit:cover;background:#eef1f7;display:grid;place-items:center;color:var(--mute);font-size:12px;cursor:zoom-in}
.ph.none{cursor:default}
.hist{list-style:none;margin:0;padding:0;font-size:13.5px}
.hist li{padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
.hist li time{color:var(--mute);white-space:nowrap;font-family:var(--num);font-size:14px}
.sec-t{margin:18px 0 8px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}

/* 分組 */
.gwrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.gbox h3{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}
.gbox h3 .num{font-size:24px}
.gteam{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px}
.gteam:hover{background:#f6f8fd}
.gteam .tlogo{width:30px;height:30px}
.gteam .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gteam .seed{font-size:12px;color:var(--warn);font-weight:700}
.reveal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reveal ol{margin:0;padding-left:1.4em;min-height:200px}
.reveal li{animation:fade .3s}

/* 成績 */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mcard{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:6px}
.mcard.done{border-color:#b9e6d3;background:#f4fcf8}
.mcard.draft{border-color:#f1d59a;background:#fffbf1}
.mcard b{font-size:15px}
.mcard .btn{margin-top:auto}
.ed-row{display:grid;grid-template-columns:64px minmax(0,1fr) 92px 64px;gap:8px;align-items:center;padding:4px 0}
.ed-row .rk{font-family:var(--num);font-size:18px;font-weight:800;text-align:center}
.ed-row .pts{font-family:var(--num);font-size:18px;font-weight:700;text-align:right}
.ed-row.dup select{border-color:var(--bad);background:#fff5f7}
.stand td.tot{font-family:var(--num);font-size:19px;font-weight:800}
.stand tr.z-adv td:first-child{box-shadow:inset 3px 0 0 #1d8de0}
.stand tr.z-mid td:first-child{box-shadow:inset 3px 0 0 #8b5cff}
.stand tr.z-out td{color:#98a1b6}
.stand tr.z-gold td:first-child{box-shadow:inset 3px 0 0 #e0a92e}
.mp{display:inline-block;padding:0 7px;border-radius:999px;background:#fff1d0;color:#9a6209;font-size:12px;font-weight:700;margin-left:6px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;max-height:340px;overflow:auto;padding:4px}
.pick label{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px}
.pick label:has(input:checked){border-color:var(--pri);background:#f3f0ff}

/* 彈窗 */
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(9,14,40,.5);display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{position:relative;width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:14px;padding:22px 22px 20px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal.wide{width:min(760px,100%)}
.modal h3{margin:0 0 10px;font-size:19px;padding-right:30px}
.modal .x{position:absolute;right:12px;top:12px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}
.xbtn{width:34px;height:34px;border:0;border-radius:8px;background:none;color:var(--mute);cursor:pointer;display:grid;place-items:center}
.xbtn:hover{background:#f1f3f8;color:var(--ink)}
.imgview{display:grid;place-items:center;min-height:240px;background:repeating-conic-gradient(#eef1f7 0 25%,#fff 0 50%) 0 0/18px 18px;border-radius:10px}
.imgview img{max-width:100%;max-height:60vh}
.pw{font-family:var(--num);font-size:30px;font-weight:800;letter-spacing:.06em;text-align:center;padding:14px;background:#f3f0ff;border-radius:10px;margin:12px 0;user-select:all}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(92vw,440px);pointer-events:none}
.toast{padding:11px 16px;border-radius:10px;background:#18203d;color:#fff;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:fade .2s}
.toast.error{background:#b9324b}
.busy{position:fixed;inset:0;z-index:95;display:grid;place-items:center;align-content:center;gap:12px;background:rgba(242,245,251,.7);backdrop-filter:blur(2px);font-weight:700;text-align:center;padding:20px}
.spin{width:38px;height:38px;margin:0 auto;border:3px solid #d9def0;border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.md h4{margin:12px 0 4px}
.md ul,.md ol{margin:4px 0;padding-left:1.3em}
.md p{margin:4px 0}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.gwrap{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;background:none}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .side{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.35)}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(9,14,40,.4);z-index:25}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;padding:10px 14px;background:var(--nav);color:#fff}
  .topbar b{font-size:15px}
  .topbar button{border:0;background:none;color:#fff;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
  .main{padding:16px 14px 90px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .gwrap{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .hide-m{display:none}
}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}.ed-row{grid-template-columns:44px minmax(0,1fr) 70px 44px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="layer"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ==========================================================================
 *  後台設定（上線前只需要改這裡）
 * ========================================================================== */
const ADMIN = {
  API_URL: 'https://script.google.com/macros/s/AKfycbx_pUdvEH7wV1vREWl2WVzTxQZDljJHsWMWmsBNoiC6zqA1gEDwiCG6-Df3_NXGUJqS/exec',                   // 和網站相同的 Apps Script /exec 網址；留空＝預覽模式（帳號 admin／密碼 admin1234）
  SITE_URL: 'https://www.rebormnent.com/rnwintercup.html',  // 冬季盃網站網址（「查看網站」按鈕）
  BRAND_LOGO: '銳能白',            // 銳能娛樂 LOGO（和網頁放在同一個資料夾）
  EVENT_LOGO: '銳能冬季盃LOGO',     // 冬季盃 LOGO
};

/* ==========================================================================
 *  共用資料（和網站相同）
 * ========================================================================== */
const ROLE_CODES = ['C', 'P', 'P', 'P', 'S', 'S'];
const ROLE_LABELS = ['隊長', '正選隊員 1', '正選隊員 2', '正選隊員 3', '替補隊員 1', '替補隊員 2'];
const MAPS = ['百慕達', '天堂島', '喀拉哈里', '未來城', '索拉'];

const Score = {
  cmp(a, b) { return b.total - a.total || b.booyah - a.booyah || b.kills - a.kills || a.last - b.last; },
  row(id, bonus) { return { id, bonus: bonus || 0, total: bonus || 0, place: 0, kills: 0, booyah: 0, played: 0, last: 99, hist: [] }; },
  apply(rows, m, sc) {
    let winner = null;
    Object.keys(m.res || {}).forEach(id => {
      if (!rows.has(id)) rows.set(id, Score.row(id, 0));
      const r = rows.get(id); const p = Number(m.res[id][0]) || 0; const k = Number(m.res[id][1]) || 0;
      const placePts = p >= 1 && p <= sc.place.length ? Number(sc.place[p - 1]) || 0 : 0;
      const pts = placePts + k * (Number(sc.kill) || 0);
      r.total += pts; r.place += placePts; r.kills += k; r.played++;
      if (p === 1) { r.booyah++; winner = id; }
      r.hist.push({ n: m.n, map: m.map, p, k, pts });
    });
    rows.forEach((r, id) => { const x = (m.res || {})[id]; r.last = x ? Number(x[0]) || 99 : 99; });
    return winner;
  },
  table(matches, teamIds, sc, bonus) {
    const rows = new Map();
    (teamIds || []).forEach(id => rows.set(id, Score.row(id, bonus && bonus[id])));
    matches.filter(m => m.done).forEach(m => Score.apply(rows, m, sc));
    return Array.from(rows.values()).sort(Score.cmp);
  },
  bonusFrom(prRows, sc) {
    const b = {};
    if (!prRows.some(r => r.played)) return b;
    prRows.slice(0, sc.bonus.length).forEach((r, i) => { b[r.id] = Number(sc.bonus[i]) || 0; });
    return b;
  },
  champion(matches, teamIds, sc, bonus) {
    const rows = new Map();
    (teamIds || []).forEach(id => rows.set(id, Score.row(id, bonus && bonus[id])));
    const thr = Number(sc.threshold) || 90;
    const elig = {};
    rows.forEach((r, id) => { if (r.total >= thr) elig[id] = 0; });
    let champion = null, champAt = 0, seq = 0;
    matches.filter(m => m.done).forEach(m => {
      if (champion) return;
      seq++;
      const w = Score.apply(rows, m, sc);
      if (w && elig[w] !== undefined && elig[w] < seq) { champion = w; champAt = seq; }
      rows.forEach((r, id) => { if (elig[id] === undefined && r.total >= thr) elig[id] = seq; });
    });
    let list = Array.from(rows.values()).map(r => Object.assign(r, { eligible: elig[r.id] !== undefined, eligibleAt: elig[r.id] })).sort(Score.cmp);
    if (champion) list = [list.find(r => r.id === champion)].concat(list.filter(r => r.id !== champion));
    const done = matches.filter(m => m.done).length;
    return { rows: list, champion, champAt, played: champion ? champAt : done, max: matches.length, finished: !!champion || (matches.length > 0 && done >= matches.length), threshold: thr };
  },
};

      const rnd = Math.random; const power = {}; ids.forEach(id => { power[id] = 0.6 + rnd(); });
      const sc = db.settings.scoring;
      let bonus = {};
      if (d.code === 'CR') bonus = Score.bonusFrom(Score.table(db.stages.PR.matches, db.stages.PR.teams, sc), sc);
      for (const m of st.matches) {
        if (m.done) continue;
        if (d.code === 'CR' && Score.champion(st.matches, ids, sc, bonus).champion) break;
        m.res = simMatch(ids, d.code === 'CR' ? Object.fromEntries(ids.map(id => [id, power[id] * (1.4 + rnd())])) : power, rnd); m.done = true;
      }
      log(a.username, 'match.save', STAGES[d.code].name + '：產生示範成績');
      return { code: d.code, stage: st };
    },
  };
  async function call(action, data) {
    await sleep(150 + Math.random() * 250);
    load();
    const h = H[action]; if (!h) fail('預覽模式不支援這個操作');
    const r = h(data || {}); save();
    return clone(r);
  }
  function reset() { db = MockSeed(); db.sessions = {}; save(); }
  return { call, reset };
})();

async function api(action, data) {
  if (PREVIEW) return Mock.call(action, Object.assign({ token: A.token }, data || {}));

  try { res = await fetch(ADMIN.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, token: A.token }, data || {})) }); }
  catch (e) { throw new Error('連線失敗，請檢查網路後再試一次'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('伺服器沒有正確回應，請確認 Apps Script 已部署新版本'); }
  if (!j.ok) {
    const e = new Error(j.error || '發生錯誤'); e.code = j.code;

  }
  return j;
}

function exportCsv() {
  const cell = v => { const s = String(v == null ? '' : v); if (/^\d{6,}$/.test(s)) return `"=""${s}"""`; return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ['報名序號', '隊伍ID', '隊伍名稱', '狀態', '候補順位', '審核', '審核意見', '組別', '種子隊', '隊長信箱', 'Google名稱', '會員編號', 'LINE ID'];

  const rows = A.d.teams.slice().sort(byNo).map(t => {

  toast('已匯出 ' + rows.length + ' 隊');
}

function collectSettings() {
  const s = clone(A.d.settings), tab = A.setTab, v = id => ($('#' + id) || {}).value;
  if (tab === 'reg') {
    const rm = $('input[name=rm]:checked'); s.regMode = rm ? rm.value : 'auto';
    s.regStart = v('rs') || ''; s.regEnd = v('re') || '';
    if (s.regMode === 'auto' && s.regStart && s.regEnd && twTime(s.regStart) >= twTime(s.regEnd)) throw new Error('截止時間要晚於開始時間');
    s.capacity = Number(v('cap')) || 24; s.waitlist = Number(v('wl')) || 0; s.subsRequired = Number(v('subs'));
    s.requireMember = $('#reqm').checked; s.rosterLock = $('#lock').checked; s.autoPromote = $('#auto').checked; s.mailOn = $('#mailon').checked;
  } else if (tab === 'site') {
    s.liveOn = $('#lv').checked; s.liveUrl = v('lu2').trim(); s.communityUrl = v('cu').trim(); s.communityLabel = v('cl').trim();
    s.noticeBar = v('nb').trim(); s.contact = v('ct').trim(); s.rulebookUrl = v('rb').trim();
    $$('[data-soc]').forEach(el => { s.social[el.dataset.soc] = el.value.trim(); });
    s.popupOn = $('#pon').checked; s.popupTitle = v('pti').trim(); s.popupBtn = v('pbt').trim(); s.popupBody = v('pbd');
    s.popupUrl = v('pulSel') === 'url' ? v('pul').trim() : v('pulSel');
    if (s.popupOn && !s.popupTitle) throw new Error('要開啟彈出公告，請填寫標題');
    const tom = $('input[name=tom]:checked'); s.teamsOpen = tom ? tom.value : 'auto';
    const bad = [s.liveUrl, s.communityUrl, s.rulebookUrl, /^https?:/i.test(s.popupUrl) ? s.popupUrl : ''].concat(Object.values(s.social)).find(u => u && !/^https?:\/\//i.test(u));
    if (bad) throw new Error('網址要以 https:// 開頭：' + bad);
    if (s.liveOn && !s.liveUrl) throw new Error('要顯示直播，請填寫直播網址');
  } else if (tab === 'score') {
    s.scoring.place = $$('[data-place]').map(el => Number(el.value) || 0);
    s.scoring.bonus = $$('[data-bonus]').map(el => Number(el.value) || 0);
    s.scoring.kill = Number(v('kp')) || 0; s.scoring.threshold = Number(v('th')) || 90;
    s.maps = $$('[data-mapn]').map(el => el.value.trim()).filter(Boolean);
    if (!s.maps.length) throw new Error('至少要有一張地圖');
  }
  return s;
}

function genPw() { const L = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ', N = '23456789', all = L + N; const r = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }; let s = L[r(L.length)] + N[r(N.length)]; for (let i = 0; i < 8; i++) s += all[r(all.length)]; return s.split('').sort(() => r(3) - 1).join(''); }

/* ==========================================================================
 *  圖片（和網站相同的縮圖規則）
 * ========================================================================== */
const Img = {
  async check(file) {
    if (!file.type.startsWith('image/')) throw new Error('請選擇圖片檔（JPG、PNG）');
    if (file.size > 20 * 1024 * 1024) throw new Error('圖片太大，請選擇 20MB 以內的檔案');
    try { if (window.createImageBitmap) return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* 改用 Image */ }
    return await new Promise((ok, no) => { const url = URL.createObjectURL(file); const im = new Image(); im.onload = () => { ok(im); URL.revokeObjectURL(url); }; im.onerror = () => { no(new Error('無法讀取這張圖片')); URL.revokeObjectURL(url); }; im.src = url; });
  },
  canvas(img, max) { const w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h)); const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k)); const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height); return c; },
  async logo(img) { let c = Img.canvas(img, 1024), d = c.toDataURL('image/png'); if (d.length > 2.6e6) { c = Img.canvas(img, 720); d = c.toDataURL('image/png'); } if (d.length > 2.6e6) { d = c.toDataURL('image/webp', 0.92); if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', 0.92); } return d; },
  photo(img) { return Img.canvas(img, 1280).toDataURL('image/jpeg', 0.86); },
  thumb(img, size, keepAlpha) { for (const s of [size, Math.round(size * 0.75), Math.round(size * 0.55)]) { const c = Img.canvas(img, s); let d = c.toDataURL('image/webp', 0.84); if (!d.startsWith('data:image/webp')) d = keepAlpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.8); if (d.length <= 46000) return d; } return ''; },
};

/* ==========================================================================
 *  彈窗、提示
 * ========================================================================== */
function openModal(html, cls = '') { $('#modal').innerHTML = `<div class="modal-back" data-act="backdrop"><div class="modal ${cls}" role="dialog" aria-modal="true"><button class="xbtn x" data-act="close-modal" aria-label="關閉">${IC.x}</button>${html}</div></div>`; const f = $('#modal .modal input:not([disabled]), #modal .modal textarea, #modal .modal select'); if (f) f.focus(); }
function closeModal() { const m = $('#modal'); m.innerHTML = ''; m.onchange = null; m.oninput = null; if (A._reveal && A._reveal.t) clearTimeout(A._reveal.t); A._reveal = null; }
function closeLayer() { $('#layer').innerHTML = ''; D = null; }
function toast(msg, type) { const el = document.createElement('div'); el.className = 'toast ' + (type || ''); el.textContent = msg; $('#toast').appendChild(el); setTimeout(() => el.remove(), type === 'error' ? 5200 : 3000); }
function busy(msg) { let el = $('#busy'); if (msg === false) { if (el) el.remove(); return; } if (!el) { el = document.createElement('div'); el.id = 'busy'; el.className = 'busy'; document.body.appendChild(el); } el.innerHTML = `<div class="spin"></div><div>${esc(msg)}</div>`; }

/* ==========================================================================
 *  事件
 * ========================================================================== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'backdrop') { if (e.target === el) closeModal(); return; }
  if (act === 'team' && e.target.closest('[data-stop]')) return;
  switch (act) {
    case 'nav': document.body.classList.toggle('nav-open'); break;
    case 'logout': logout(); break;
    case 'refresh': refresh(); break;
    case 'reset-demo': if (confirm('要清除預覽資料，回到一開始的示範狀態嗎？（網站預覽也會一起重置）')) { Mock.reset(); store.del('rwc27_admin_token'); location.reload(); } break;
    case 'mypw': openModal(`<h3>修改我的密碼</h3><div class="field"><label for="m1">目前的密碼</label><input class="in" id="m1" type="password" autocomplete="current-password"></div><div class="field" style="margin-top:10px"><label for="m2">新密碼</label><input class="in" id="m2" type="password" autocomplete="new-password"><span class="hint">至少 8 個字元，需含英文與數字</span></div><div class="field" style="margin-top:10px"><label for="m3">再輸入一次新密碼</label><input class="in" id="m3" type="password" autocomplete="new-password"></div><div class="foot"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn" data-act="mypw-go">儲存</button></div>`); break;
    case 'mypw-go': {
      if ($('#m2').value !== $('#m3').value) { toast('兩次輸入的新密碼不一樣', 'error'); break; }
      busy('儲存中…');
      try { const r = await api('admin.password', { oldPassword: $('#m1').value, newPassword: $('#m2').value }); A.token = r.token; store.set('rwc27_admin_token', r.token); busy(false); closeModal(); toast('密碼已更新'); } catch (err) { busy(false); toast(err.message, 'error'); }
      break;
    }
    case 'close-modal': closeModal(); break;
    case 'close-layer': closeLayer(); break;
    case 'team': openTeam(el.dataset.id); break;
    case 'sel': e.stopPropagation(); if (el.checked) A.sel.add(el.dataset.id); else A.sel.delete(el.dataset.id); refreshPageQuiet(); break;
    case 'sel-all': { const list = filteredTeams(); if (el.checked) list.forEach(t => A.sel.add(t.id)); else list.forEach(t => A.sel.delete(t.id)); refreshPageQuiet(); break; }
    case 'bulk-clear': A.sel.clear(); refreshPageQuiet(); break;
    case 'bulk-approve': {
      const ids = Array.from(A.sel).filter(id => { const t = team(id); return t && t.review !== 'approved' && t.slot !== 'cancel'; });
      if (!ids.length) { toast('選取的隊伍都已經審核通過'); break; }
      openModal(`<h3>將 ${ids.length} 隊設為審核通過？</h3><label class="sw"><input type="checkbox" id="rmail" checked><span>寄信通知隊長</span></label><div class="foot"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn ok" data-act="bulk-go">確定</button></div>`);
      A._bulk = ids; break;
    }
    case 'bulk-go': {
      const notify = $('#rmail').checked; closeModal(); let ok = 0;
      for (const id of A._bulk) { busy(`審核中… ${ok + 1}/${A._bulk.length}`); try { const r = await api('admin.team.update', { id, patch: { review: 'approved' }, notify }); upsertTeam(r.team); ok++; } catch (err) { toast(err.message, 'error'); } }
      busy(false); A.sel.clear(); toast(`已審核通過 ${ok} 隊`); refreshPageQuiet(); break;
    }
    case 'bulk-mail': A.mailTarget = 'ids'; A.mailIds = Array.from(A.sel); location.hash = '#mail'; break;
    case 'csv': exportCsv(); break;
    case 'logos-zip': zipDownload('admin.logos.zip', { which: 'main' }, 'logos.zip'); break;
    case 'team-zip': zipDownload('admin.team.zip', { id: D.id }, 'team.zip'); break;
    case 'review': reviewDialog(el.dataset.v); break;
    case 'review-go': { const v = el.dataset.v; const notify = $('#rmail') ? $('#rmail').checked : false; const patch = { review: v }; if (v === 'fix') { const note = $('#rn').value.trim(); if (!note) { toast('請填寫要隊長修改的地方', 'error'); break; } patch.reviewNote = note; } closeModal(); teamPatch(patch, { notify }); break; }
    case 'slot': slotDialog(el.dataset.v); break;
    case 'slot-go': { const v = el.dataset.v; const notify = $('#rmail') ? $('#rmail').checked : false; const patch = { slot: v }; if (v === 'cancel') patch.cancelReason = ($('#cr') || {}).value || ''; closeModal(); teamPatch(patch, { notify }); break; }
    case 'save-note': teamPatch({ adminNote: $('#dn').value }); break;
    case 'edit-team': openTeam(D.id, true); break;
    case 'cancel-edit': D.edit = false; D.form = null; renderDrawer(); break;
    case 'pick-logo': $('#eLogo').click(); break;
    case 'pick-photo': $(`[data-ephoto="${el.dataset.i}"]`).click(); break;
    case 'rm-photo': { const k = 'p' + (Number(el.dataset.i) + 1); if (!D.form.remove.includes(k)) D.form.remove.push(k); renderDrawer(); break; }
    case 'save-edit': { const f = D.form; teamPatch({ teamName: f.teamName, lineId: f.lineId, players: f.players.map(p => ({ nickname: p.nickname, gameName: p.gameName, uid: p.uid })) }, { images: f.images, thumbs: f.thumbs, remove: f.remove }); break; }
    case 'del-team': { const t = team(D.id); openModal(`<h3>永久刪除「${esc(t.teamName)}」？</h3><p>報名資料會從資料庫刪除，雲端硬碟裡的 LOGO 與照片會移到垃圾桶（30 天內可以復原）。這個動作無法在後台復原。</p><div class="foot"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn solid-danger" data-act="del-go">永久刪除</button></div>`); break; }
    case 'del-go': { const id = D.id; closeModal(); busy('刪除中…'); try { await api('admin.team.delete', { id }); A.d.teams = A.d.teams.filter(t => t.id !== id); busy(false); closeLayer(); toast('已刪除'); refreshPageQuiet(); } catch (err) { busy(false); toast(err.message, 'error'); } break; }
    case 'img': viewImage(el.dataset.kind); break;
    case 'dl-img': { const b = dataUrlBlob(A._img.dataUrl); if (b) downloadBlob(b, A._img.name.includes('.') ? A._img.name : A._img.name + '.' + (b.type.split('/')[1] || 'png').replace('svg+xml', 'svg').replace('jpeg', 'jpg')); break; }
    case 'draw': openModal(`<h3>隨機抽籤分組</h3><p>會把 ${A.d.teams.filter(t => t.slot === 'main').length} 支正取隊伍隨機分成 A、B 兩組，<b>覆蓋目前的分組</b>。抽籤碼與結果會留下紀錄。</p><div class="foot"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn" data-act="draw-go">開始抽籤</button></div>`); break;
    case 'draw-go': doDraw(); break;
    case 'skip-reveal': { const rv = A._reveal; if (rv) { clearTimeout(rv.t); while (rv.i < rv.seq.length) { const [g, nm] = rv.seq[rv.i++]; $('#rv' + g).insertAdjacentHTML('beforeend', `<li>${esc(nm)}</li>`); } } break; }
    case 'move': { busy('儲存中…'); try { const r = await api('admin.groups.save', { assign: { [el.dataset.id]: el.dataset.g } }); A.d.teams = r.teams; busy(false); refreshPageQuiet(); } catch (err) { busy(false); toast(err.message, 'error'); } break; }
    case 'publish': { const pub = el.dataset.v === '1'; if (pub && A.d.teams.some(t => t.slot === 'main' && !t.group) && !confirm('還有正取隊伍沒有分組，確定要公布嗎？')) break; busy('儲存中…'); try { const r = await api('admin.groups.save', { assign: {}, publish: pub }); A.d.teams = r.teams; A.d.settings = Object.assign(A.d.settings, r.settings); busy(false); toast(pub ? '已公布到網站' : '已取消公布'); refreshPageQuiet(); } catch (err) { busy(false); toast(err.message, 'error'); } break; }
    case 'save-schedule': saveSchedule(); break;
    case 'res-tab': A.resTab = el.dataset.c; $('#page').innerHTML = pResults(); break;
    case 'edit-match': openMatch(Number(el.dataset.n)); break;
    case 'm-clear': ME.rows.forEach(r => { r.id = ''; r.k = 0; }); renderMatch(); break;
    case 'm-save': saveMatch(el.dataset.done === '1'); break;
    case 'auto-teams': autoTeams(); break;
    case 'pick-teams': pickTeams(); break;
    case 'save-teams': saveStageTeams(el.dataset.ids.split(',').filter(Boolean)); break;
    case 'save-picked': saveStageTeams($$('#pk input:checked').map(x => x.value)); break;
    case 'demo-results': { busy('產生中…'); try { const r = await api('demo.results', { code: A.resTab }); A.d.stages[r.code] = r.stage; busy(false); toast('已產生示範成績（網站預覽的戰績查詢也看得到）'); renderPage(); } catch (err) { busy(false); toast(err.message, 'error'); } break; }
    case 'news-add': { A.d.news = collectNews(); A.d.news.unshift({ id: '', title: '', body: '', date: (() => { const p = twParts(Date.now()); return `${p.y}-${p2(p.mo)}-${p2(p.d)}`; })(), pinned: false, visible: true }); $('#page').innerHTML = pNews(); break; }
    case 'news-del': { A.d.news = collectNews(); A.d.news.splice(Number(el.dataset.i), 1); $('#page').innerHTML = pNews(); break; }
    case 'news-save': { const news = collectNews(); if (news.some(n => !n.title.trim())) { toast('每則公告都要有標題（不要的請刪除）', 'error'); break; } busy('儲存中…'); try { const r = await api('admin.news.save', { news }); A.d.news = r.news; busy(false); toast('公告已儲存'); renderPage(); } catch (err) { busy(false); toast(err.message, 'error'); } break; }
    case 'mail-send': {
      const target = ($('input[name=mt]:checked') || {}).value || 'main';
      const ids = target === 'ids' ? $$('#mailPick input:checked').map(x => x.value) : [];
      const subject = $('#ms').value.trim(), body = $('#mb').value;
      A.mailSubject = subject; A.mailBody = body;
      if (!subject || !body.trim()) { toast('請填寫主旨與內容', 'error'); break; }
      if (target === 'ids' && !ids.length) { toast('請勾選要寄送的隊伍', 'error'); break; }
      const n = target === 'ids' ? ids.length : A.d.teams.filter({ main: t => t.slot === 'main', approved: t => t.slot === 'main' && t.review === 'approved', fix: t => t.slot !== 'cancel' && t.review === 'fix', wait: t => t.slot === 'wait', active: t => t.slot !== 'cancel' }[target]).length;
      if (!confirm(`確定寄出「${subject}」給 ${n} 支隊伍的隊長？`)) break;
      busy('寄信中…');
      try { const r = await api('admin.mail.send', { target, ids, subject, body }); if (A.d.mail) A.d.mail.quota = r.quota; busy(false); A.mailSubject = ''; A.mailBody = ''; openModal(`<h3>寄信完成</h3><p>成功寄出 <b>${r.sent}</b> 封${r.failed ? `，失敗 ${r.failed} 封` : ''}${r.skipped ? `，因為額度不足有 ${r.skipped} 封沒寄（明天再寄）` : ''}。</p><div class="foot"><button class="btn" data-act="close-modal">好</button></div>`); renderPage(); } catch (err) { busy(false); toast(err.message, 'error'); }
      break;
    }
    case 'set-tab': A.setTab = el.dataset.t; $('#page').innerHTML = pSettings(); bindSettings(); break;
    case 'add-map': { const s = collectSettingsSafe(); if (s) A.d.settings = s; A.d.settings.maps = (A.d.settings.maps || MAPS).concat(['新地圖']); $('#page').innerHTML = pSettings(); break; }
    case 'save-settings': {
      let s; try { s = collectSettings(); } catch (err) { toast(err.message, 'error'); break; }
      busy('儲存中…');
      try { const r = await api('admin.settings.save', { settings: s }); A.d.settings = Object.assign(A.d.settings, r.settings); if (r.reg) A.d.reg = r.reg; busy(false); toast((r.promoted && r.promoted.length) ? `設定已儲存，並遞補 ${r.promoted.length} 隊` : '設定已儲存'); if (r.promoted && r.promoted.length) refresh(true); else { $('#page').innerHTML = pSettings(); bindSettings(); } } catch (err) { busy(false); toast(err.message, 'error'); }
      break;
    }
    case 'notes-default': if (confirm('要把注意事項還原成預設內容嗎？（按「儲存注意事項」後才會生效）')) { $('#nt').value = DEFAULT_NOTES; $('#ntp').innerHTML = md(DEFAULT_NOTES); } break;
    case 'save-notes': { busy('儲存中…'); try { const txt = $('#nt').value; const r = await api('admin.texts.save', { texts: { notes: txt.trim() === DEFAULT_NOTES.trim() ? '' : txt } }); A.d.texts = r.texts; busy(false); toast('注意事項已儲存'); } catch (err) { busy(false); toast(err.message, 'error'); } break; }
    case 'user-new': userDialog(null); break;
    case 'user-edit': userDialog((A.d.users || []).find(u => u.username === el.dataset.u)); break;
    case 'gen-pw': $('#up').value = genPw(); $('#up').type = 'text'; break;
    case 'user-save': {
      const isNew = el.dataset.new === '1';
      const user = { username: $('#uu').value.trim().toLowerCase(), displayName: $('#ud').value.trim(), role: $('#ur').value, status: isNew ? 'active' : ($('#us').checked ? 'active' : 'disabled') };
      if (isNew) { user.password = $('#up').value; user.mustChange = $('#umc').checked; }
      busy('儲存中…');
      try { const r = await api('admin.users.save', { create: isNew, user }); A.d.users = r.users; busy(false); closeModal(); if (isNew) openModal(`<h3>帳號已建立</h3><p>請把帳號與初始密碼轉交給 ${esc(user.displayName || user.username)}：</p><div class="pw">${esc(user.username)}<br>${esc(user.password)}</div><p class="hint">${user.mustChange ? '對方第一次登入時會被要求修改密碼。' : ''}這個視窗關閉後就看不到密碼了。</p><div class="foot"><button class="btn" data-act="close-modal">我已記下</button></div>`); else toast('已儲存'); renderPage(); } catch (err) { busy(false); toast(err.message, 'error'); }
      break;
    }
    case 'user-reset': if (confirm(`要重設 ${el.dataset.u} 的密碼嗎？對方目前的登入會失效。`)) { busy('重設中…'); try { const r = await api('admin.users.reset', { username: el.dataset.u }); A.d.users = r.users; busy(false); openModal(`<h3>暫時密碼</h3><p>請轉交給 ${esc(r.username)}，對方登入後會被要求修改密碼：</p><div class="pw">${esc(r.tempPassword)}</div><p class="hint">這個視窗關閉後就看不到密碼了。</p><div class="foot"><button class="btn" data-act="close-modal">我已記下</button></div>`); renderPage(); } catch (err) { busy(false); toast(err.message, 'error'); } } break;
    case 'user-del': if (confirm(`確定刪除管理員 ${el.dataset.u}？`)) { busy('刪除中…'); try { const r = await api('admin.users.delete', { username: el.dataset.u }); A.d.users = r.users; busy(false); toast('已刪除'); renderPage(); } catch (err) { busy(false); toast(err.message, 'error'); } } break;
  }
});
document.addEventListener('change', e => {
  if (e.target.name === 'mt') { A.mailTarget = e.target.value; A.mailSubject = ($('#ms') || {}).value || A.mailSubject; A.mailBody = ($('#mb') || {}).value || A.mailBody; $('#page').innerHTML = pMail(); }
  if (e.target.closest('#mailPick')) A.mailIds = $$('#mailPick input:checked').map(x => x.value);
});
function collectSettingsSafe() { try { return collectSettings(); } catch (e) { return null; } }
function bindSettings() { const nt = $('#nt'); if (nt) nt.addEventListener('input', () => { $('#ntp').innerHTML = md(nt.value); }); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal').innerHTML) closeModal(); else if ($('#layer').innerHTML) closeLayer(); } });
window.addEventListener('hashchange', () => {
  if (!A.d) return;
  A.page = location.hash.slice(1) || 'dash';
  closeLayer(); renderPage();
  if (A.page === 'teams') bindTeamsToolbar();
  if (A.page === 'settings') bindSettings();
  if (A.page === 'logs' && A.logs) bindLogs();
  window.scrollTo(0, 0);
});
const _renderPage = renderPage;
renderPage = function () { _renderPage(); if (A.page === 'teams') bindTeamsToolbar(); if (A.page === 'settings') bindSettings(); if (A.page === 'logs' && A.logs) bindLogs(); };
setInterval(() => { if (A.d && document.visibilityState === 'visible' && !$('#modal').innerHTML && !$('#layer').innerHTML && ['dash', 'teams'].includes(A.page)) refresh(true); }, 120000);

/* 啟動 */
if (A.token) boot(); else renderLogin();
</script>
